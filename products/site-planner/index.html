<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evercraft | Site Planner</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#11243a;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#0c2340;color:white;padding:20px 4%;display:flex;align-items:center;justify-content:space-between;gap:10px}header strong{font-size:23px;letter-spacing:-.8px}.brand small{display:block;color:#9bb7d9;font-size:11px;letter-spacing:2px}.badge{background:#173e62;color:#d9f3ff;border:1px solid #456b8e;border-radius:20px;padding:8px 12px;font-size:12px}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{background:#fff;border-right:1px solid #dfe8f0;padding:25px 16px}aside h5{color:#91a0b2;letter-spacing:1.5px;margin:12px}nav button{display:block;border:0;text-align:left;background:transparent;width:100%;padding:12px 14px;color:#43546a;border-radius:10px;margin:3px 0;font-weight:600}nav button.active,nav button:hover{background:#e9f3fd;color:#1266b2}main{padding:30px clamp(16px,4vw,55px);max-width:1530px;width:100%}.top{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:24px}h1{font-size:31px;letter-spacing:-1px;margin:5px 0}h2{margin:0 0 18px;font-size:18px}p{color:#607188}.muted{color:#6a7e93;font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:#1683be;font-weight:800;font-size:11px}.btn{border:0;border-radius:9px;background:#1266ac;color:white;padding:11px 17px;font-weight:700}.btn.secondary{background:#ecf4fa;color:#1d547c}.btn.danger{background:#fff0ee;color:#b23b34}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:#fff;border:1px solid #e0e8f0;border-radius:14px;padding:22px;box-shadow:0 4px 15px #18375608}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}.metric{font-size:30px;font-weight:800;margin:8px 0}.metric-label{color:#71859b;font-size:12px}.status{font-size:11px;font-weight:800;border-radius:16px;padding:5px 9px;display:inline-block;background:#e8f2fa;color:#27648e}.verified{background:#e5f6ed;color:#18804f}.unverified{background:#fff1d9;color:#956316}.assumption{background:#eae8ff;color:#6255a0}.blocked{background:#fdeae8;color:#a33f38}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:750;color:#39526a}.field input,.field select,.field textarea{border:1px solid #d7e2ec;border-radius:8px;padding:11px 12px;background:#fff;width:100%;color:#19334b}.field textarea{min-height:85px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f6}.row:last-child{border:0}.row strong{font-size:13px}.small{font-size:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:#7b8da0;font-size:11px;letter-spacing:.5px}.table th,.table td{padding:13px 9px;border-bottom:1px solid #edf1f5;vertical-align:top}.table tr:last-child td{border:0}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin:16px 0}.tabs button{border:1px solid #d9e5ef;border-radius:18px;background:white;color:#49647d;padding:8px 13px;white-space:nowrap;font-size:12px}.tabs button.active{background:#1266ac;color:white}.notice{padding:14px 16px;background:#e9f5ff;border:1px solid #c9e5fa;border-radius:9px;font-size:13px;color:#245a86;margin:14px 0}.warn{background:#fff7e7;border-color:#f4dfba;color:#88621b}.empty{text-align:center;padding:40px;color:#72859a}.split{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sitebtn{padding:12px;border:1px solid #e3ebf2;background:#fff;border-radius:9px;margin:7px 0;width:100%;text-align:left}.sitebtn:hover{border-color:#7ab5e6}.sitebtn strong{display:block;margin-bottom:6px}.pill{display:inline-block;border-radius:7px;background:#edf3fa;padding:6px 8px;color:#516981;font-size:11px;margin:3px}.foot{margin-top:32px;color:#8192a4;font-size:11px}.hide{display:none!important}@media(max-width:930px){.shell{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid #e2eaf2;padding:9px 12px;overflow:auto}aside h5{display:none}nav{display:flex;gap:3px;min-width:max-content}nav button{width:auto;padding:10px;font-size:12px}.span8,.span7,.span6,.span5,.span4,.span3{grid-column:span 12}main{padding:20px 13px}.fields{grid-template-columns:1fr}header{padding:14px}header strong{font-size:19px}.card{padding:17px}}@media print{aside,header,.btn,.tabs{display:none!important}.shell{display:block}main{max-width:none}.card{break-inside:avoid}}
</style></head><body><header><div class="brand"><small>EVERCRAFT / FIELD INTELLIGENCE</small><strong>Site Planner<span style="color:#62b4f5">.</span></strong></div><span class="badge">PRELIMINARY PLANNING · NOT ENGINEERED DRAWINGS</span></header><div class="shell"><aside><h5>WORKSPACE</h5><nav id="nav"></nav><div class="foot">EVERCRAFT OWNED · SOURCE-LED<br>Systemia integration pending</div></aside><main id="app"></main></div><script>
const sections=['Overview','Site intake','Evidence ledger','Site conditions','Scenarios','Qualification','Engineering queue','Returned plans','Reports','Gap register'];const conditionNames=['Aerial-visible parking','Driveways','Pavement edges','Circulation','Islands','Charger placement','ADA access','Equipment pads','Trench routes','Utilities','Topography','Drainage','Floodplain'];const state={section:'Overview',siteId:null,tab:'Aerial-visible parking'};const api=async(path,opts={})=>{const r=await fetch('/api'+path,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'Request failed');return r.json()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sites=[],detail=null;const slug=s=>s.replace(/[^a-zA-Z0-9_]/g,'');const stat=s=>`<span class="status ${esc(s)}">${esc(s)}</span>`;const controlsFor=o=>(detail?.order_controls||[]).find(c=>c.order_id===o.id);const isInternal=o=>controlsFor(o)?.lane==='internal_planning';const card=(title,body,cls='span12')=>`<section class="card ${cls}"><h2>${title}</h2>${body}</section>`;const field=(key,label,type='text',val='',options=[])=>`<div class="field"><label for="${key}">${label}</label>${type==='textarea'?`<textarea id="${key}" name="${key}">${esc(val)}</textarea>`:type==='select'?`<select id="${key}" name="${key}">${options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="${key}" name="${key}" type="${type}" value="${esc(val)}" ${key==='address'?'required':''}>`}</div>`;const btn=(txt,fn,secondary=false)=>`<button class="btn ${secondary?'secondary':''}" onclick="${fn}">${txt}</button>`;function ui(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${s===state.section?'active':''}" onclick="navigate('${s}')">${s}</button>`).join('');const s=detail?.site;const count=sites.length;let content='';if(state.section==='Overview'){content=`<div class="top"><div><div class="eyebrow">Project command</div><h1>From address to actionable plan.</h1><p>Evidence first. Clear assumptions. One connected report-to-plan workflow.</p></div>${btn('+ New site','navigate(\'Site intake\')')}</div><div class="grid">${card('Active sites',`<div class="metric">${count}</div><div class="metric-label">Persistent project records</div>`,'span4')}${card('Engineering requests',`<div class="metric">${sites.reduce((n,x)=>n+(x.orders||0),0)}</div><div class="metric-label">Requests linked to original reports</div>`,'span4')}${card('Returned plans',`<div class="metric">${sites.reduce((n,x)=>n+(x.plans||0),0)}</div><div class="metric-label">Delivered plan records</div>`,'span4')}${card('Your sites',sites.length?sites.map(x=>`<button class="sitebtn" onclick="selectSite('${x.id}')"><strong>${esc(x.name||x.address)}</strong><span class="muted">${esc(x.address)}</span> · ${stat(x.status||'draft')}</button>`).join(''):'<div class="empty">No sites yet. Enter your first address to start the report workflow.</div>','span8')}${card('How it works',`<div class="row">1. Capture address and owner</div><div class="row">2. Attach evidence and qualify what is known</div><div class="row">3. Compare scenario assumptions</div><div class="row">4. Create source report and request plan quote (held)</div><div class="row">5. Review engineer response and share controlled report</div><div class="notice warn">No aerial, utility, drainage, ADA or floodplain fact is presumed verified. A site address alone is not a feasibility conclusion.</div>`,'span4')}</div>`}
else if(state.section==='Site intake'){content=`<div class="top"><div><div class="eyebrow">01 · Intake</div><h1>${s?'Site profile':'Start a new site'}</h1></div></div><div class="grid">${card('Real-world property details',`<form onsubmit="saveSite(event)"><div class="fields">${field('name','Project / site name','text',s?.name)}${field('address','Street address','text',s?.address)}${field('city','City','text',s?.city)}${field('region','State / region','text',s?.region)}${field('postal','Postal code','text',s?.postal)}${field('country','Country','text',s?.country||'United States')}${field('owner','Owner / requesting team','text',s?.owner)}${field('site_type','Site type','select',s?.site_type||'Commercial',['Commercial','Multifamily','Hotel','Fleet','Public','Retail','Other'])}</div>${field('goal','Project objective','textarea',s?.goal)}<div class="split"><button class="btn">${s?'Save site':'Create site'}</button>${s?btn('Create another','newSite()',true):''}</div></form><div class="notice">The entered address is a user-provided location, not a validated parcel boundary. Geocoding, ownership verification and imagery review must be documented separately.</div>`,'span8')}${card('Site selection',sites.map(x=>`<button class="sitebtn" onclick="selectSite('${x.id}')"><strong>${esc(x.name||x.address)}</strong>${esc(x.address)}</button>`).join('')||'<p>New workspace</p>','span4')}</div>`}
else if(!s){content=`<h1>${state.section}</h1><div class="notice">Select or create a site first.</div>${btn('Go to site intake','navigate(\'Site intake\')')}`}
else if(state.section==='Evidence ledger'){content=heading('02 · Provenance','Evidence ledger',s)+`<div class="grid">${card('Add sourced observation',`<form onsubmit="addEvidence(event)"><div class="fields">${field('category','Topic','select',conditionNames[0],conditionNames)}${field('e_status','Evidence classification','select','unverified',['unverified','verified','assumption'])}${field('source','Source / authority / document reference')}${field('observed_on','Observation date','date')}${field('reference_url','Source URL (optional)','url')}</div>${field('finding','Finding / observation','textarea')}${field('limitation','Limits or verification needed','textarea')}<div class="field"><label>Attach source file (PDF, image, text or CAD; 15 MB max)</label><input type="file" id="e_file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.dxf,.dwg" /></div><button class="btn">Add evidence</button></form>`,'span5')}${card('Evidence and assumptions',detail.evidence.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Topic</th><th>Finding</th><th>Source</th><th>Status</th><th>Attachment</th></tr></thead><tbody>${detail.evidence.map(e=>`<tr><td>${esc(e.category)}</td><td>${esc(e.finding)}<div class="muted">${esc(e.limitation)}</div></td><td>${esc(e.source||'Not supplied')}<br><span class="muted">${esc(e.observed_on)}</span></td><td>${stat(e.status)}</td><td>${e.file_name?`<a href="/api/files/${esc(e.id)}" target="_blank">${esc(e.file_name)}</a>`:'None'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No evidence. Do not treat assumed conditions as facts.</div>','span7')}</div>`}
else if(state.section==='Site conditions'){let rows=detail.evidence.filter(x=>x.category===state.tab);content=heading('03 · Site geometry','Condition review',s)+`<div class="tabs">${conditionNames.map(x=>`<button class="${state.tab===x?'active':''}" onclick="state.tab='${x}';ui()">${esc(x)}</button>`).join('')}</div><div class="grid">${card(esc(state.tab),`<p>Log what is aerial-visible, field-observed or documented. Drawing annotations and precise measurements require evidence and engineering review.</p>${rows.length?rows.map(e=>`<div class="row"><div><strong>${esc(e.finding)}</strong><div class="muted">${esc(e.source)} · ${esc(e.limitation)}</div></div>${stat(e.status)}</div>`).join(''):'<div class="empty">No observations recorded for this condition.</div>'}<div class="notice warn">${['Utilities','Floodplain','Topography','Drainage','ADA access'].includes(state.tab)?'High-impact item: request authoritative documentation and professional review before design reliance.':'Unverified geometry must remain provisional.'}</div>${btn('Add supporting evidence','navigate(\'Evidence ledger\')')}`,'span8')}${card('Coverage snapshot',conditionNames.map(k=>`<div class="row"><span class="small">${k}</span>${detail.evidence.some(e=>e.category===k&&e.status==='verified')?stat('verified'):detail.evidence.some(e=>e.category===k)?stat('unverified'):stat('missing')}</div>`).join(''),'span4')}</div>`}
else if(state.section==='Scenarios'){content=heading('04 · Compare','Scenarios and alternatives',s)+`<div class="grid">${card('Create planning scenario',`<form onsubmit="addScenario(event)">${field('sc_name','Scenario name') }<div class="fields">${field('chargers','Charger count','number','4')}${field('power','Total estimated kW','number','150')}${field('layout','Layout concept','select','Perimeter',['Perimeter','Central island','Along building','Fleet row','Other'])}${field('cost','Budget estimate ($)','number','')}</div>${field('notes','Assumptions, tradeoffs, constraints','textarea')}<button class="btn">Save scenario</button></form><div class="notice">Scenario quantities, costs, routing and charger positions are assumptions until separately verified. No automatic engineering feasibility claim.</div>`,'span5')}${card('Comparison table',detail.scenarios.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Scenario</th><th>Chargers</th><th>Power</th><th>Layout</th><th>Budget</th><th>Evidence</th></tr></thead><tbody>${detail.scenarios.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><span class="muted">${esc(x.notes)}</span></td><td>${esc(x.chargers)}</td><td>${esc(x.power)} kW</td><td>${esc(x.layout)}</td><td>${x.cost?'$'+Number(x.cost).toLocaleString():'Unspecified'}</td><td>${stat('assumption')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Create a baseline and alternative concept to compare.</div>','span7')}</div>`}
else if(state.section==='Qualification'){const required=['Aerial-visible parking','Driveways','Circulation','ADA access','Utilities','Topography','Drainage','Floodplain'];const missing=required.filter(k=>!detail.evidence.some(e=>e.category===k&&e.status==='verified'));content=heading('05 · Decision','Site qualification',s)+`<div class="grid">${card('Evidence readiness',`<div class="metric">${required.length-missing.length}/${required.length}</div><div class="muted">Critical topics with at least one verified observation. This is completeness, not site feasibility.</div>${missing.length?`<div class="notice warn">Unverified critical topics: ${esc(missing.join(', '))}</div>`:'<div class="notice">Critical topics have entries marked verified. Professional review is still required.</div>'}${btn('Review conditions','navigate(\'Site conditions\')',true)}`,'span6')}${card('Qualification decision',`<form onsubmit="qualify(event)">${field('decision','Planning disposition','select',s.status||'draft',['draft','needs_evidence','provisionally_qualified','engineering_review','on_hold','declined'])}${field('decision_reason','Decision basis and blockers','textarea',s.decision_reason)}<button class="btn">Save decision</button></form><div class="notice warn">Provisional qualification authorizes further review, not construction, permitting, code compliance or utility service approval.</div>`,'span6')}</div>`}
else if(state.section==='Engineering queue'){content=heading('06 · Order','Preliminary plan request',s)+`<div class="grid">${card('Main report → plan workflow',`<p>A preliminary plan request must reference an originating report. The system will create a report snapshot before placing the plan request in the engineering queue.</p><form onsubmit="orderPlan(event)">${field('scenario_id','Scenario to develop','select',detail.scenarios[0]?.id||'',detail.scenarios.map(x=>x.id))}${(detail.source_reports||[]).length?`<div class="field"><label>Existing owned EV report (optional)</label><select name="source_report_id"><option value="">Internal site snapshot only</option>${detail.source_reports.map(r=>`<option value="${esc(r.id)}">${esc(r.external_report_id)} · ${esc(r.report_type)}</option>`).join('')}</select></div>`:'<div class="notice warn">No upstream report linked. This request will use an internal Site Planner snapshot only.</div>'}${field('scope','Requested plan scope','textarea','Preliminary charger layout, parking impacts, circulation, ADA concept, equipment pads and conceptual trench paths. Flag utilities, topo, drainage and floodplain unknowns.')}${field('requested_by','Requested by','text',s.owner)}<button class="btn">Request preliminary plan quote</button></form><div class="notice warn"><strong>Commercial hold:</strong> Dedicated Stripe pilot product and $499 provisional price are prepared, but its checkout is INACTIVE. This creates a quote/intake record and freezes its report, but cannot collect money, assign commercial engineering work, or register a completed plan. Payment and approval gates remain closed.</div>`,'span5')}${card('Engineering queue',detail.orders.length?detail.orders.map(o=>`<div class="row"><div><strong>${esc(o.id)}</strong><div class="muted">Report ${esc(o.report_id)} · ${esc(o.created_at)}</div><div class="small">${esc(o.scope)}</div>${controlsFor(o)?.lane==='commercial_quote'?'<div class="status blocked">STRIPE PILOT INACTIVE · HELD</div>':'<div class="muted small">Internal operator planning (not paid)</div>'}</div>${stat(o.status)}</div>`).join(''):'<div class="empty">No plan orders yet.</div>','span7')}</div>`}
else if(state.section==='Returned plans'){content=heading('07 · Deliverables','Returned plans',s)+`<div class="grid">${card('Register returned plan (engineering team)',`<form onsubmit="addPlan(event)">${field('order_id','Eligible internal plan order','select',detail.orders.filter(isInternal)[0]?.id||'',detail.orders.filter(isInternal).map(x=>x.id))}${field('plan_title','Plan title')}${field('reviewer','Reviewer / origin')}${field('plan_status','Plan state','select','preliminary',['preliminary','reviewed','revision_requested'])}${field('plan_notes','Review comments and exclusions','textarea')}<div class="field"><label>Returned plan file (max 15 MB)</label><input id="plan_file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.dxf,.dwg" required></div><button class="btn" ${detail.orders.some(isInternal)?'':'disabled'}>Register returned plan</button></form><div class="notice warn">Commercial quote orders are held and cannot receive returned plans until a verified checkout and approved fulfillment process exists.</div>`,'span5')}${card('Plan history',detail.plans.length?detail.plans.map(p=>`<div class="row"><div><strong>${esc(p.title)}</strong><div class="muted">Order ${esc(p.order_id)} → Report ${esc(p.report_id)}</div><div class="small">${esc(p.notes)}</div><a href="/api/plan-files/${esc(p.id)}" target="_blank">View attached plan</a></div>${stat(p.status)}</div>`).join(''):'<div class="empty">No engineer-returned plans recorded.</div>','span7')}</div>`}
else if(state.section==='Reports'){content=heading('08 · Share','Reports and traceability',s)+`<div class="grid">${card('Generate source-linked snapshot',`<p>Freeze a point-in-time report: location, evidence classifications, scenario comparisons, known gaps and associated plan orders.</p>${btn('Create report snapshot','createReport()')}<h3>Link existing Forge/Yard EV report</h3><p class="muted">Import a ready report from Evercraft's private gateway by its real report ID. A private gateway token is required on the server; an address match is mandatory.</p><form onsubmit="importOwnedReport(event)"><div class="field"><label>Existing report ID</label><input name="external_report_id" placeholder="rivet-yard:..." required></div><button class="btn secondary">Import owned report</button></form><div class="muted">Imported: ${(detail.source_reports||[]).length}</div>${(detail.source_reports||[]).map(r=>`<div class="row"><strong>${esc(r.external_report_id)}</strong><span class="status">Source hash ${esc(r.source_sha256.slice(0,10))}…</span></div>`).join('')}<div class="notice">Shareable report links require access control. This build is a trusted local operator workspace with downloadable JSON snapshots. Customer authentication and shareable links are not implemented.</div>`,'span5')}${card('Report registry',detail.reports.length?detail.reports.map(r=>`<div class="row"><div><strong>${esc(r.id)}</strong><div class="muted">Created ${esc(r.created_at)} · ${esc(r.evidence_count)} evidence entries · ${esc(r.scenario_count)} scenarios</div></div><a class="btn secondary" style="text-decoration:none" href="/api/reports/${esc(r.id)}/export" target="_blank">Download report</a></div>`).join(''):'<div class="empty">No report snapshots yet.</div>','span7')}</div>`}
else if(state.section==='Gap register'){content=heading('09 · Improve','Workflow and product-flow gaps',s)+`<div class="grid">${card('Record a gap',`<form onsubmit="addGap(event)">${field('gap_type','Gap class','select','workflow',['workflow','product','data','engineering','security','commercial'])}${field('severity','Priority','select','medium',['low','medium','high','critical'])}${field('gap_title','Gap title')}${field('gap_detail','What broke, what is missing, and reproduction steps','textarea')}<button class="btn">Record gap</button></form>`,'span5')}${card('Open issues',detail.gaps.length?detail.gaps.map(g=>`<div class="row"><div><strong>${esc(g.title)}</strong><div class="muted">${esc(g.type)} · ${esc(g.severity)}</div><p>${esc(g.detail)}</p></div>${stat(g.status)}</div>`).join(''):'<div class="empty">No workflow gaps logged.</div>','span7')}</div>`}
if(state.section==='Engineering queue' && detail?.orders?.length){
  content+=card('Engineering workflow status',`<p class="muted">Private operator controls. Commercial quotes can only be cancelled while checkout is unavailable. Internal planning transitions record the actor, reason, and a pending Systemia outbox event; none proves payment or licensed engineering approval.</p><form onsubmit="updateOrderStatus(event)">${field('engineering_order_id','Plan order','select',detail.orders[0].id,detail.orders.map(o=>o.id))}${field('engineering_status','Next workflow state','select','assigned',['assigned','in_review','returned','revision_requested','approved','cancelled'])}${field('engineering_actor','Operator / reviewer')}${field('engineering_reason','Reason and evidence','textarea')}<button class="btn">Record state change</button></form>`,'span12');
}
document.getElementById('app').innerHTML=content;}function heading(ey,title,s){return `<div class="top"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><div class="muted">${esc(s.name||s.address)} · ${esc(s.address)}</div></div>${btn('Change site','navigate(\'Overview\')',true)}</div>`}async function reload(){sites=await api('/sites');detail=state.siteId?await api('/sites/'+state.siteId):null;ui()}function navigate(s){state.section=s;ui();window.scrollTo(0,0)}async function selectSite(id){state.siteId=id;await reload();navigate('Site intake')}function newSite(){state.siteId=null;detail=null;ui()}function values(e){return Object.fromEntries(new FormData(e.target).entries())}async function action(fn){try{await fn();await reload()}catch(e){alert(e.message)}}async function saveSite(e){e.preventDefault();const v=values(e);await action(async()=>{const s=await api(state.siteId?'/sites/'+state.siteId:'/sites',{method:state.siteId?'PUT':'POST',body:JSON.stringify(v)});state.siteId=s.id})}async function addEvidence(e){e.preventDefault();await action(async()=>{const v=values(e);v.status=v.e_status;delete v.e_status;const file=document.getElementById('e_file').files[0];const x=await api('/sites/'+state.siteId+'/evidence',{method:'POST',body:JSON.stringify(v)});if(file){const form=new FormData();form.append('file',file);const r=await fetch('/api/evidence/'+x.id+'/file',{method:'POST',body:form});if(!r.ok)throw Error('Evidence saved but file upload failed')}});e.target.reset()}async function addScenario(e){e.preventDefault();await action(()=>api('/sites/'+state.siteId+'/scenarios',{method:'POST',body:JSON.stringify(values(e))}));e.target.reset()}async function qualify(e){e.preventDefault();await action(()=>api('/sites/'+state.siteId,{method:'PUT',body:JSON.stringify({status:values(e).decision,decision_reason:values(e).decision_reason})}))}async function orderPlan(e){e.preventDefault();if(!detail.scenarios.length)return alert('Create a scenario first');const v=values(e);v.order_kind='commercial_quote';await action(()=>api('/sites/'+state.siteId+'/orders',{method:'POST',body:JSON.stringify(v)}))}async function importOwnedReport(e){e.preventDefault();await action(()=>api('/sites/'+state.siteId+'/source-reports/import',{method:'POST',body:JSON.stringify(values(e))}))}async function createReport(){await action(()=>api('/sites/'+state.siteId+'/reports',{method:'POST',body:'{}'}))}async function addPlan(e){e.preventDefault();await action(async()=>{const v=values(e);const file=document.getElementById('plan_file').files[0];const p=await api('/sites/'+state.siteId+'/plans',{method:'POST',body:JSON.stringify(v)});const f=new FormData();f.append('file',file);const r=await fetch('/api/plans/'+p.id+'/file',{method:'POST',body:f});if(!r.ok)throw Error('Plan record created but file upload failed')})}async function updateOrderStatus(e){e.preventDefault();const v=values(e);await action(()=>api('/sites/'+state.siteId+'/orders/'+encodeURIComponent(v.engineering_order_id)+'/status',{method:'PUT',body:JSON.stringify({status:v.engineering_status,actor:v.engineering_actor,reason:v.engineering_reason})}))}
async function addGap(e){e.preventDefault();const v=values(e);await action(()=>api('/sites/'+state.siteId+'/gaps',{method:'POST',body:JSON.stringify({type:v.gap_type,severity:v.severity,title:v.gap_title,detail:v.gap_detail})}));e.target.reset()}reload().catch(e=>document.getElementById('app').innerHTML=`<div class="notice warn">Site API unavailable: ${esc(e.message)}. Start the included owned server to use this workspace.</div>`);
