<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HumanFilter</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="rules.js"></script>
  <script defer src="popup.js"></script>
</head>
<body>
  <main>
    <div class="eyebrow">EVERCRAFT / BROWSER TOOLS <span class="dot"></span> v0.1.4</div>
    <header><div><h1>Human<span>Filter</span></h1><p>Keep the feed yours.</p></div><div class="mark">H<span>F</span></div></header>
    <div class="panel primary"><div><strong>Filtering</strong><small id="status">Loading preferences</small></div><label class="switch"><input type="checkbox" id="enabled" aria-label="Enable filtering"><span></span></label></div>
    <div class="section-label">MODE</div>
    <div class="modes">
      <label><input type="radio" name="mode" value="balanced" checked><span><strong>Balanced</strong><small>Declared or labeled AI</small></span></label>
      <label><input type="radio" name="mode" value="strict"><span><strong>Strict</strong><small>Also filter AI topics</small></span></label>
    </div>
    <div class="section-label">FEEDS</div>
    <div class="panel feeds">
      <label>Facebook <input type="checkbox" id="facebook"></label>
      <label>Reddit <input type="checkbox" id="reddit"></label>
      <label>YouTube <input type="checkbox" id="youtube"></label>
    </div>
    <div class="section-label">YOUR WORDS</div>
    <label for="keywords" class="hint">Optional keywords, separated by commas (max 40).</label>
    <textarea id="keywords" rows="2" placeholder="e.g. ai slop, auto-generated"></textarea>
    <p class="foot">Runs on your device. No accounts, analytics, or uploads. Labels and wording can be wrong, so you can always reveal a post.</p>
    <footer><span id="saved" role="status">Preferences stay on this browser</span><a href="options.html" target="_blank" rel="noopener noreferrer">About &amp; privacy ↗</a></footer>
  </main>
</body>
</html>
