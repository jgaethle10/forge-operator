services:
  mossmere:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - mossmere_data:/app/data
    environment:
      PORT: "8787"
      WINDOW_DATA_DIR: "/app/data"
      NODE_ENV: "production"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
volumes:
  mossmere_data:
