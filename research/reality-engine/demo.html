<!doctype html><meta charset="utf-8"><title>REALITY-001 | Temporal renderer</title><style>body{font:16px system-ui;background:#111827;color:#e5e7eb;margin:24px}canvas{width:100%;max-width:640px;image-rendering:pixelated}main{display:flex;flex-wrap:wrap;gap:20px}section{flex:1;min-width:260px}button{padding:10px}</style><h1>REALITY-001 | Temporal renderer</h1><p>Deterministic procedural scene, not neural inference. Each tile is invalidated by intersecting geometry and lighting changes.</p><button id="toggle">Pause</button><main><section><h2>Full redraw</h2><canvas id="a" width="320" height="192"></canvas></section><section><h2>Temporal reuse</h2><canvas id="b" width="320" height="192"></canvas></section></main><pre id="stats"></pre><script>
const W=320,H=192,T=16, a=document.querySelector('#a').getContext('2d',{willReadFrequently:true}),b=document.querySelector('#b').getContext('2d',{willReadFrequently:true}),cache=new Map();
let frame=0,running=true,fail=0,fullTotal=0,reuseTotal=0,tilesTotal=0;
function scene(f){return {x:(f*2)%280,y:112+Math.round(12*Math.sin(f/20)),light:Math.floor(f/180)%2}}
function key(s,x,y){return [s.light,x<s.x+32&&x+T>s.x&&y<s.y+24&&y+T>s.y?s.x+','+s.y:'none'].join('|')}
function tile(c,s,x,y){c.save();c.beginPath();c.rect(x,y,T,T);c.clip();c.fillStyle=s.light?'#526987':'#89c7eb';c.fillRect(x,y,T,T);c.fillStyle='#52765a';c.fillRect(0,96,W,96);c.fillStyle='#424850';c.fillRect(0,110,W,62);c.fillStyle='#e0d5ab';for(let i=0;i<W;i+=32)c.fillRect(i,139,16,3);c.fillStyle='#ea5353';c.fillRect(s.x,s.y,32,24);c.fillStyle='#a7d8ed';c.fillRect(s.x+5,s.y+4,20,8);c.restore()}
function render(c,s,reuse){let n=0;for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){let id=y*W+x,k=key(s,x,y);if(!reuse||cache.get(id)!==k){tile(c,s,x,y);n++;if(reuse)cache.set(id,k)}}return n}
function step(){if(running){let s=scene(frame),t=performance.now();render(a,s,false);fullTotal+=performance.now()-t;t=performance.now();let n=render(b,s,true);reuseTotal+=performance.now()-t;tilesTotal+=n;let p=a.getImageData(0,0,W,H).data,q=b.getImageData(0,0,W,H).data;for(let i=0;i<p.length;i++){if(p[i]!==q[i]){fail++;break}}frame++;document.querySelector('#stats').textContent=JSON.stringify({frames:frame,pixelMismatchFrames:fail,fullDrawMeanMs:fullTotal/frame,reuseDrawMeanMs:reuseTotal/frame,tilesRedrawn:n,tilesPerFrame:W/T*H/T,meanTilesRedrawn:tilesTotal/frame},null,2)}requestAnimationFrame(step)}
document.querySelector('#toggle').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Resume'};step();
</script>
