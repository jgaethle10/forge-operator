<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evercraft Work Saban</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><small>EVERCRAFT / SABAN</small><h1>Work Saban<span>.</span></h1><p>You bring the work. Saban brings the team.</p></header>
<section class="input"><label for="task">What needs to get done?</label><textarea id="task" maxlength="4000" placeholder="Analyze last month's sales and prepare a presentation for my manager."></textarea><button id="compose">Assemble my team</button><p class="muted">Local formation preview. No file access, live workers, messages, purchases or system changes.</p></section>
<section id="result" hidden aria-live="polite"><div class="result-head"><h2>Your proposed team</h2><span id="state"></span></div><div id="roles" class="roles"></div><h3>Execution waves</h3><div id="waves" class="waves"></div><h3>Actions requiring your approval</h3><ul id="gates"></ul><p class="muted" id="next"></p><button id="copy">Copy mission proposal</button></section>
<p class="error" id="error" role="alert"></p>
</main><script src="/app.js" defer></script></body></html>
