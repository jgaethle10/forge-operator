name: Evercraft Edge DNS external canary

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: Public IPv4 of the candidate Edge DNS node
        required: true
        type: string
      name:
        description: Canary DNS name
        required: false
        default: edge-canary.evercraftpropertyservices.com.
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe candidate authoritative DNS over UDP and TCP
        run: |
          mkdir -p artifacts
          node infra/evercraft-edge/dns/probe.mjs             --server "${{ inputs.server_ip }}"             --name "${{ inputs.name }}"             --port 53 | tee artifacts/edge-dns-public-canary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evercraft-edge-dns-public-canary
          path: artifacts/edge-dns-public-canary.json
