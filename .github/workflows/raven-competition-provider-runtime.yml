name: Raven Competition Provider Runtime

on:
  pull_request:
    paths:
      - "systemia/competition/**"
      - "systemia/raven/provider-secret-boundary.mjs"
      - "systemia/evercraft-home/provider-credentials.mjs"
      - "systemia/evercraft-home/provider-credentials.test.mjs"
      - "systemia/organism/competition-provider-scout.workflow.json"
      - "systemia/organism/competition-submission-executor.workflow.json"
      - "systemia/organism/competition-control-plane.workflow.json"
      - "systemia/organism/competition-saban-capacity.workflow.json"
      - "systemia/saban/markets/evercraft-broker.mjs"
      - "systemia/saban/markets/evercraft-yard.mjs"
      - "systemia/yard/operator.mjs"
      - "tests/yard-private-capacity.test.mjs"
      - "systemia/core/resident-services.json"
      - "systemia/migrations/base44-exit/**"
      - ".github/workflows/raven-competition-provider-runtime.yml"
  push:
    branches: [main]
    paths:
      - "systemia/competition/**"
      - "systemia/raven/provider-secret-boundary.mjs"
      - "systemia/organism/competition-provider-scout.workflow.json"
      - "systemia/organism/competition-submission-executor.workflow.json"
      - "systemia/organism/competition-control-plane.workflow.json"
      - "systemia/organism/competition-saban-capacity.workflow.json"
      - "systemia/saban/markets/evercraft-broker.mjs"
      - "systemia/saban/markets/evercraft-yard.mjs"
      - "systemia/yard/operator.mjs"
      - "tests/yard-private-capacity.test.mjs"
      - "systemia/core/resident-services.json"
      - "systemia/migrations/base44-exit/**"
      - ".github/workflows/raven-competition-provider-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven-competition-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove Raven competition provider runtime
        run: node --test systemia/competition/authorization-ledger.test.mjs systemia/competition/browser-draft-runtime.test.mjs systemia/competition/control-plane.test.mjs systemia/competition/mission-admission.test.mjs systemia/competition/provider-runtime.test.mjs systemia/competition/provider-probe-runner.test.mjs systemia/competition/submission-runtime.test.mjs systemia/competition/resident-wiring.test.mjs systemia/competition/entries/qloo-commonground/agent.test.mjs systemia/competition/entries/nebius-runbook-zero/agent.test.mjs systemia/competition/entries/nebius-runbook-zero/server.test.mjs systemia/competition/entries/paypal-checkout-black-box/agent.test.mjs tests/competition-saban-capacity.test.mjs tests/yard-private-capacity.test.mjs systemia/raven/provider-secret-boundary.test.mjs systemia/competition/qloo-secret-boundary.test.mjs systemia/competition/nebius-secret-boundary.test.mjs systemia/competition/paypal-secret-boundary.test.mjs systemia/evercraft-home/provider-credentials.test.mjs
      - name: Prove fail-closed unconfigured resident scout
        run: |
          rm -rf artifacts/competition-provider
          node systemia/competition/provider-probe-runner.mjs
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("artifacts/competition-provider/latest.json","utf8")); if(x.summary.state!=="held"||x.base44_used!==false||x.public_fabric_used!==false||x.submission_authority_enabled!==false||x.staking_authority_enabled!==false) process.exit(1)'
