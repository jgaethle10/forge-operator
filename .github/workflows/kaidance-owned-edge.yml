name: KAIDANCE Owned Edge Static Route Proof

on:
  pull_request:
    paths:
      - 'public/kaidance/**'
      - 'infra/evercraft-edge/kaidance/**'
      - 'tests/kaidance-owned-edge.test.mjs'
      - 'tests/kaidance-cinematic-experience.test.mjs'
      - 'tests/kaidance-signal-wall.test.mjs'
      - 'scripts/qa-kaidance-browser.py'
      - 'tests/kaidance-public-fallback-readback.test.mjs'
      - 'scripts/probe-kaidance-fallback.mjs'
      - '.github/workflows/kaidance-owned-edge.yml'
  push:
    paths:
      - 'public/kaidance/**'
      - 'infra/evercraft-edge/kaidance/**'
      - 'tests/kaidance-owned-edge.test.mjs'
      - 'tests/kaidance-cinematic-experience.test.mjs'
      - 'tests/kaidance-signal-wall.test.mjs'
      - 'scripts/qa-kaidance-browser.py'
      - 'tests/kaidance-public-fallback-readback.test.mjs'
      - 'scripts/probe-kaidance-fallback.mjs'
      - '.github/workflows/kaidance-owned-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owned portable assets and privacy
        run: |
          node --test tests/kaidance-owned-edge.test.mjs
          node --test tests/kaidance-public-observatory.test.mjs
          node --test tests/kaidance-public-fallback-readback.test.mjs
          node --test tests/kaidance-cinematic-experience.test.mjs
          node --test tests/kaidance-signal-wall.test.mjs
          node --test tests/kaidance-field-chapters.test.mjs
          node --check public/kaidance/app.mjs
          node --check public/kaidance/visual.mjs
          node --check public/kaidance/collider-engine.mjs
          node --check public/kaidance/current-field.mjs
          node --check public/kaidance/field-chapters.mjs
          node --check public/kaidance/signal-river.mjs
      - name: Validate example Caddy route without networking or deployment
        run: |
          set -euo pipefail
          mkdir -p _kaidance_caddy_qa
          {
            echo 'http://localhost:8080 {'
            cat infra/evercraft-edge/kaidance/Caddyfile.route.example
            echo '}'
          } > _kaidance_caddy_qa/Caddyfile
          docker run --rm --network none -v "$PWD/_kaidance_caddy_qa:/qa:ro" \
            caddy:2.10-alpine caddy adapt --config /qa/Caddyfile --adapter caddyfile > _kaidance_caddy_qa/adapted.json
          node -e "const a=require('./_kaidance_caddy_qa/adapted.json');if(!a.apps?.http?.servers)throw Error('Caddy route missing')"

      - name: Capture and assert actual mobile, film and desktop browser experience
        run: |
          python -m pip install --quiet playwright==1.58.0
          python scripts/qa-kaidance-browser.py
      - name: Preserve actual KAIDANCE browser frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaidance-v06-browser-frames
          path: artifacts/kaidance-browser/*.png
          retention-days: 30
          if-no-files-found: warn
