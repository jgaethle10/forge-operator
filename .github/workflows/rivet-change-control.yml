name: RIVET Change Control

on:
  pull_request:
    paths:
      - 'systemia/rivet/**'
      - 'public/chum/intents/rivet-site-underwriting-v1/**'
      - 'public/chum/proof/rivet.json'
      - 'commercial/**RIVET**'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'scripts/fabric-edge-external-canary.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
      - 'tests/rivet-change-control.test.mjs'
      - 'governance/RIVET_CHANGE_CONTROL.md'
      - 'governance/rivet-agent-approved.json'
      - 'governance/rivet-proof-semantic-baseline.json'
      - 'governance/rivet-proof-approved.json'
      - 'scripts/enforce-protected-generated-artifacts.mjs'
      - 'tests/protected-generated-artifacts.test.mjs'
      - 'systemia/proof-factory/proof-factory.mjs'
      - 'tests/proof-factory.test.mjs'
      - '.github/workflows/evercraft-proof-factory.yml'
      - 'systemia/release/release-policy.mjs'
      - 'systemia/release/release-policy.test.mjs'
      - 'governance/protected-generated-artifacts.json'
      - 'systemia/chum/build-agent-commerce.mjs'
      - '.github/workflows/rivet-change-control.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/rivet/**'
      - 'public/chum/intents/rivet-site-underwriting-v1/**'
      - 'public/chum/proof/rivet.json'
      - 'commercial/**RIVET**'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'scripts/fabric-edge-external-canary.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
      - 'tests/rivet-change-control.test.mjs'
      - 'governance/RIVET_CHANGE_CONTROL.md'
      - 'governance/rivet-agent-approved.json'
      - 'governance/rivet-proof-semantic-baseline.json'
      - 'governance/rivet-proof-approved.json'
      - 'scripts/enforce-protected-generated-artifacts.mjs'
      - 'tests/protected-generated-artifacts.test.mjs'
      - 'systemia/proof-factory/proof-factory.mjs'
      - 'tests/proof-factory.test.mjs'
      - '.github/workflows/evercraft-proof-factory.yml'
      - 'systemia/release/release-policy.mjs'
      - 'systemia/release/release-policy.test.mjs'
      - 'governance/protected-generated-artifacts.json'
      - 'systemia/chum/build-agent-commerce.mjs'

permissions:
  contents: read

jobs:
  locked-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce protected RIVET baseline
        run: node --test tests/rivet-change-control.test.mjs
