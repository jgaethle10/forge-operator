# Retired historical RIVET archive safety. Keep workflow/job IDs stable for
# repository protections, but DO NOT require a nonexistent partner's approval
# for unrelated Evercraft releases. The old baseline comparison is preserved
# at tests/rivet-change-control.test.mjs for archival inspection only.
name: RIVET Change Control

on:
  pull_request:
    paths:
      - 'systemia/rivet/**'
      - 'public/chum/intents/rivet-site-underwriting-v1/**'
      - 'public/chum/proof/rivet.json'
      - 'commercial/**RIVET**'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/mcp/public-payment-offers.mjs'
      - 'tests/retired-rivet-isolation.test.mjs'
      - 'tests/rivet-change-control.test.mjs'
      - 'governance/RIVET_CHANGE_CONTROL.md'
      - 'governance/rivet-agent-approved.json'
      - 'governance/rivet-proof-semantic-baseline.json'
      - 'governance/protected-generated-artifacts.json'
      - 'systemia/chum/build-agent-commerce.mjs'
      - '.github/workflows/rivet-change-control.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/rivet/**'
      - 'public/chum/intents/rivet-site-underwriting-v1/**'
      - 'public/chum/proof/rivet.json'
      - 'commercial/**RIVET**'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/mcp/public-payment-offers.mjs'
      - 'tests/retired-rivet-isolation.test.mjs'
      - 'tests/rivet-change-control.test.mjs'
      - 'governance/RIVET_CHANGE_CONTROL.md'
      - 'governance/rivet-agent-approved.json'
      - 'governance/rivet-proof-semantic-baseline.json'
      - 'governance/protected-generated-artifacts.json'
      - 'systemia/chum/build-agent-commerce.mjs'

permissions:
  contents: read

jobs:
  # Preserve this job identifier to avoid breaking required-check configuration.
  locked-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve retired RIVET archive and forbid public checkout exposure
        run: node --test tests/retired-rivet-isolation.test.mjs
