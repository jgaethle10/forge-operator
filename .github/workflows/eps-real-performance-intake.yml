name: EPS Real Performance Source Intake
on:
  pull_request:
    paths:
      - "systemia/media-studio/eps-real-performance-intake.mjs"
      - "systemia/media-studio/eps-real-performance-intake.test.mjs"
      - "systemia/media-studio/relay-floor-gate.mjs"
      - "systemia/media-studio/relay-source-verify.mjs"
      - ".github/workflows/eps-real-performance-intake.yml"
  push:
    branches: [main]
    paths:
      - "systemia/media-studio/eps-real-performance-intake.mjs"
      - "systemia/media-studio/eps-real-performance-intake.test.mjs"
jobs:
  original-footage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media tools when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Genuine recorded-picture and embedded-dialogue technical admission
        run: node --test systemia/media-studio/eps-real-performance-intake.test.mjs
