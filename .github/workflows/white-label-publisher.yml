name: Silent Publisher Brand Isolation
on:
  pull_request:
    paths:
      - 'public/audience-sites/**'
      - 'public/affiliate-labs/**'
      - 'public/clip/audience-sites/**'
      - 'systemia/affiliate-commerce/**'
      - 'tests/white-label-publisher.test.mjs'
      - 'tests/independent-publisher-export.test.mjs'
      - 'tests/independent-seo-mesh.test.mjs'
      - 'tests/audience-sites.test.mjs'
      - 'tests/affiliate-publisher.test.mjs'
      - '.github/workflows/evercraft-journal-pages.yml'
      - '.github/workflows/white-label-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'public/audience-sites/**'
      - 'public/affiliate-labs/**'
      - 'public/clip/audience-sites/**'
      - 'systemia/affiliate-commerce/**'
      - 'tests/white-label-publisher.test.mjs'
      - 'tests/independent-publisher-export.test.mjs'
      - 'tests/independent-seo-mesh.test.mjs'
      - '.github/workflows/white-label-publisher.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/white-label-publisher.test.mjs tests/audience-sites.test.mjs tests/affiliate-publisher.test.mjs tests/independent-publisher-export.test.mjs tests/independent-seo-mesh.test.mjs
