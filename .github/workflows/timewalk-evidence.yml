name: Timewalk evidence integrity

on:
  pull_request:
    paths:
      - 'public/worlds/timewalk/**'
      - 'tests/timewalk-*.test.mjs'
      - 'docs/worlds/timewalk*.md'
      - '.github/workflows/timewalk-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'public/worlds/timewalk/**'
      - 'tests/timewalk-*.test.mjs'
      - '.github/workflows/timewalk-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source, rights, year and engine-ownership invariant tests
        run: node --test tests/timewalk-evidence.test.mjs tests/timewalk-overlay.test.mjs
