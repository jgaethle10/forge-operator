name: ON ALERT | Archival Moving-Footage Scout
on:
  push:
    branches:
      - production/on-alert-documentary-20261105
    paths:
      - .github/workflows/on-alert-motion-scout.yml
      - productions/on-alert/acquire_real_motion.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Acquire genuine historic moving pictures and test decoding
        id: scout
        continue-on-error: true
        run: |
          python3 productions/on-alert/acquire_real_motion.py
      - name: Upload source ledger, shot contact sheets and actual-motion QC samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-alert-archival-motion-scout
          path: out/on-alert-scout/
          if-no-files-found: warn
          retention-days: 14
      - name: Surface download failures honestly
        if: steps.scout.outcome != 'success'
        run: |
          echo "Archive acquisition blocked. See downloaded scout report for exact errors." >&2
          exit 1
