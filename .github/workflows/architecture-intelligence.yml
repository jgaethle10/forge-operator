name: Systemia architecture intelligence

on:
  pull_request:
    paths:
      - "tools/systemia_architecture_scan.py"
      - "tools/systemia_architecture_reconcile.py"
      - "tools/systemia_architecture_health.py"
      - "tools/systemia_architecture_query.py"
      - "tests/test_systemia_architecture_scan.py"
      - "tests/test_systemia_architecture_reconcile.py"
      - "tests/test_systemia_architecture_health.py"
      - "tests/test_systemia_architecture_query.py"
      - "docs/SYSTEMIA_ARCHITECTURE_INTELLIGENCE.md"
      - ".github/workflows/architecture-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "tools/systemia_architecture_scan.py"
      - "tools/systemia_architecture_reconcile.py"
      - "tools/systemia_architecture_health.py"
      - "tools/systemia_architecture_query.py"
      - "tests/test_systemia_architecture_scan.py"
      - "tests/test_systemia_architecture_reconcile.py"
      - "tests/test_systemia_architecture_health.py"
      - "tests/test_systemia_architecture_query.py"
      - "docs/SYSTEMIA_ARCHITECTURE_INTELLIGENCE.md"
      - ".github/workflows/architecture-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_systemia_architecture_*.py' -v

      - name: Build public architecture evidence
        run: |
          mkdir -p /tmp/systemia-architecture
          python tools/systemia_architecture_scan.py --root . --out /tmp/systemia-architecture/topology.json
          python tools/systemia_architecture_reconcile.py             --static /tmp/systemia-architecture/topology.json             --out /tmp/systemia-architecture/reconciled.json
          python tools/systemia_architecture_health.py             --topology /tmp/systemia-architecture/topology.json             --reconciled /tmp/systemia-architecture/reconciled.json             --out /tmp/systemia-architecture/health.json
          python tools/systemia_architecture_query.py             --topology /tmp/systemia-architecture/topology.json             --query systemia_architecture_scan             --out /tmp/systemia-architecture/query-smoke.json
          python - <<'PY'
          import json
          root="/tmp/systemia-architecture"
          topology=json.load(open(root+"/topology.json"))
          reconciled=json.load(open(root+"/reconciled.json"))
          health=json.load(open(root+"/health.json"))
          query=json.load(open(root+"/query-smoke.json"))
          assert topology["scan_mode"] == "static_only"
          assert topology["evidence_boundary"]["executes_scanned_code"] is False
          assert topology["evidence_boundary"]["claims_runtime_behavior"] is False
          assert topology["counts"]["files"] > 0
          assert reconciled["evidence_boundary"]["declared_is_runtime_proof"] is False
          assert reconciled["evidence_boundary"]["runtime_is_receipt_proof"] is False
          assert health["evidence_boundary"]["queries_production"] is False
          assert query["state"] in {"found","ambiguous"}
          print(json.dumps({
              "scanner_version": topology["scanner_version"],
              "source_revision": topology["source_revision"],
              "counts": topology["counts"],
              "reconciled_counts": reconciled["counts"],
              "health_counts": health["counts"],
              "query_state": query["state"],
              "partial_files": sum(1 for row in topology["coverage"] if row["state"] == "partial"),
              "failed_files": sum(1 for row in topology["coverage"] if row["state"] == "failed"),
          }, indent=2))
          PY

      - name: Upload public architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: systemia-public-architecture-evidence
          path: /tmp/systemia-architecture/
          retention-days: 14
          if-no-files-found: error
