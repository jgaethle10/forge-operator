name: Sim-to-Real Lab (modeled only)
on:
  pull_request:
    paths:
      - 'systemia/world-engine/sim-to-real/**'
      - '.github/workflows/sim-to-real-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modeled-rover-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integrity tests
        run: node --test systemia/world-engine/sim-to-real/rover-lab.test.mjs systemia/world-engine/sim-to-real/rover-challenge.test.mjs
      - name: Repeatable RC02 challenge (40 paired seeds)
        run: node systemia/world-engine/sim-to-real/rover-challenge.mjs --seeds 40 --out /tmp/evercraft-rc02-benchmark.json
      - name: Verify benchmark and episode integrity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyBenchmark} from './systemia/world-engine/sim-to-real/rover-challenge.mjs';
          const report=JSON.parse(fs.readFileSync('/tmp/evercraft-rc02-benchmark.json','utf8'));
          if(!verifyBenchmark(report)) throw Error('rc02_benchmark_integrity_failed');
          if(report.runs.length!==80) throw Error('rc02_expected_80_runs');
          console.log('Verified modeled benchmark:',report.sha256);
          NODE

      - name: Install native World Engine TypeScript loader
        run: npm install --no-audit --no-fund
      - name: Test RC03 using actual EvercraftWorldRuntime
        run: node --import tsx --test systemia/world-engine/sim-to-real/native-engine-proof.test.mjs
      - name: Generate native execution / sampled-contact evidence
        run: node --import tsx systemia/world-engine/sim-to-real/native-engine-proof.mjs --seeds 4 --out /tmp/evercraft-native-rc03.json

      - name: RC04 native motion unit and fail-closed evidence tests
        run: node --import tsx --test systemia/world-engine/sim-to-real/native-motion-rc04.test.mjs
      - name: RC04 paired native dynamics benchmark
        run: node --import tsx systemia/world-engine/sim-to-real/native-motion-rc04.mjs --seeds 4 --out /tmp/evercraft-native-rc04.json
      - name: RC04 independently verify batch integrity and no teleports
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyMotionBatch} from './systemia/world-engine/sim-to-real/native-motion-rc04.mjs';
          const report=JSON.parse(fs.readFileSync('/tmp/evercraft-native-rc04.json','utf8'));
          if(!verifyMotionBatch(report)) throw Error('rc04_invalid_integrity');
          if(!report.runs.every(r=>r.physicsDrivenMovement&&r.teleportInputs===false&&r.hardwareExecution===false)) throw Error('rc04_authority_contract_failed');
          console.log('RC04 paired scores',JSON.stringify(report.scores));
          console.log('RC04 batch SHA-256',report.sha256);
          NODE

      - name: RC05 reactive controller geometry and fail-closed tests
        run: node --test systemia/world-engine/sim-to-real/controller-rc05.test.mjs
      - name: RC05 real native-runtime integration tests (synthetic observations)
        run: node --import tsx --test systemia/world-engine/sim-to-real/native-reactive-rc05.test.mjs
      - name: RC05 held-out 8-seed paired benchmark, outside RC01-RC04 development seeds
        run: node --import tsx systemia/world-engine/sim-to-real/native-reactive-rc05.mjs --first-seed 41 --seeds 8 --out /tmp/evercraft-native-rc05.json
      - name: RC05 verify integrity and explicitly deny hardware authority
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyHeldOut} from './systemia/world-engine/sim-to-real/native-reactive-rc05.mjs';
          const report=JSON.parse(fs.readFileSync('/tmp/evercraft-native-rc05.json','utf8'));
          if(!verifyHeldOut(report)) throw Error('rc05_invalid_benchmark_digest');
          if(!report.runs.every(r=>r.hardwareExecution===false && r.realSensorData===false &&
              r.noTeleportInputs===true && r.inputs.every(i=>i.kind==='set_velocity'))) throw Error('rc05_authority_boundary');
          for(const s of [report.reactive,report.priorKnownCorridor]){
            if(s.total!==s.arrived+s.collisions+s.geofence+s.timeouts) throw Error('rc05_outcome_accounting');
          }
          console.log('RC05 RECEIPT',JSON.stringify({firstSeed:report.firstSeed,seeds:report.seeds,
            reactive:report.reactive,priorKnownCorridor:report.priorKnownCorridor,digest:report.sha256}));
          NODE
      - name: Upload RC05 modeled evidence (not hardware)
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-real-rc05-modeled
          path: /tmp/evercraft-native-rc05.json
          retention-days: 7

      - name: RC05A experimental progress-gate and hold-preservation tests
        run: node --test systemia/world-engine/sim-to-real/controller-rc05-progress.test.mjs
      - name: RC05A native A-B runner tests
        run: node --import tsx --test systemia/world-engine/sim-to-real/progress-trial-rc05.test.mjs
      - name: RC05A original development holdout seeds 41-48
        run: node --import tsx systemia/world-engine/sim-to-real/progress-trial-rc05.mjs --first-seed 41 --seeds 8 --out /tmp/evercraft-rc05a-41-48.json
      - name: RC05A new evaluation seeds 49-56
        run: node --import tsx systemia/world-engine/sim-to-real/progress-trial-rc05.mjs --first-seed 49 --seeds 8 --out /tmp/evercraft-rc05a-49-56.json
      - name: RC05A verify paired trial evidence without assuming progress
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyProgressTrial} from './systemia/world-engine/sim-to-real/progress-trial-rc05.mjs';
          for(const name of ['41-48','49-56']){
            const result=JSON.parse(fs.readFileSync('/tmp/evercraft-rc05a-'+name+'.json','utf8'));
            if(!verifyProgressTrial(result)||result.seeds!==8) throw Error('rc05a_trial_invalid:'+name);
            console.log('RC05A RESULT',JSON.stringify({cohort:name,baseline:result.baseline,progress:result.progressGated,
              paired:result.pairs.map(x=>({seed:x.seed,prior:x.baseline.status,next:x.progress.status,detours:x.progress.detourRequests})),
              digest:result.sha256}));
          }
          NODE
      - name: RC05A promotion gate unit tests
        run: node --import tsx --test systemia/world-engine/sim-to-real/promotion-gate-rc05a.test.mjs
      - name: RC05A evidence-only policy gate
        run: |
          node --import tsx systemia/world-engine/sim-to-real/promotion-gate-rc05a.mjs \
            --development /tmp/evercraft-rc05a-41-48.json \
            --evaluation /tmp/evercraft-rc05a-49-56.json \
            --out /tmp/evercraft-rc05a-review-gate.json
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyProgressGate} from './systemia/world-engine/sim-to-real/promotion-gate-rc05a.mjs';
          const gate=JSON.parse(fs.readFileSync('/tmp/evercraft-rc05a-review-gate.json','utf8'));
          if(!verifyProgressGate(gate)||gate.releaseAuthorized||gate.hardwareAuthority) throw Error('rc05a_gate_authority_or_integrity_failed');
          console.log('RC05A REVIEW GATE',JSON.stringify({candidateEligible:gate.candidateEligible,reasons:gate.reasons}));
          NODE
      - name: Upload RC05A modeled comparisons
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-real-rc05a-modeled-comparisons
          path: |
            /tmp/evercraft-rc05a-41-48.json
            /tmp/evercraft-rc05a-49-56.json
            /tmp/evercraft-rc05a-review-gate.json
          retention-days: 7

      - name: RC05B observed-geometry shield unit tests
        run: node --test systemia/world-engine/sim-to-real/controller-rc05-shield.test.mjs
      - name: RC05B native triple-policy comparison tests
        run: node --import tsx --test systemia/world-engine/sim-to-real/shield-trial-rc05b.test.mjs
      - name: RC05B regression diagnosis seeds 49-56 including prior failures 51 and 56
        run: node --import tsx systemia/world-engine/sim-to-real/shield-trial-rc05b.mjs --first-seed 49 --seeds 8 --out /tmp/evercraft-rc05b-49-56.json
      - name: RC05B new evaluation seeds 57-64
        run: node --import tsx systemia/world-engine/sim-to-real/shield-trial-rc05b.mjs --first-seed 57 --seeds 8 --out /tmp/evercraft-rc05b-57-64.json
      - name: RC05B explicit failure accounting and no-authority evidence gate
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyShieldTrial} from './systemia/world-engine/sim-to-real/shield-trial-rc05b.mjs';
          for(const group of ['49-56','57-64']){
            const r=JSON.parse(fs.readFileSync('/tmp/evercraft-rc05b-'+group+'.json','utf8'));
            if(!verifyShieldTrial(r)||r.seeds!==8||r.productionAuthorized!==false||r.review?.hardwareAuthorized!==false)
              throw Error('rc05b_evidence_failed:'+group);
            console.log('RC05B REVIEW',JSON.stringify({cohort:group,scores:r.scores,review:r.review,digest:r.sha256}));
            const meaningful=r.scores.shield.arrived-r.scores.baseline.arrived>=Math.max(1,Math.ceil(r.seeds*.25));
            const movement=r.scores.shield.shieldedMoves>0;
            if(r.review.reviewEligible&&(!movement||!meaningful))
              throw Error('rc05b_safety_by_immobility_misclassified:'+group);
            console.log('RC05B SHIELD REJECTION DIAGNOSTICS',JSON.stringify({
              cohort:group,
              blocks:r.pairs.map(p=>({seed:p.seed,reasons:p.shield.shieldDiagnostics?.rejectionCounts,
                first:p.shield.shieldDiagnostics?.firstBlocked})).filter(x=>x.first?.length).slice(0,8)
            }));
            // A failed experimental candidate means HOLD, not a passing safety claim or deployment.
            if(!r.review.reviewEligible)console.log('RC05B CANDIDATE HELD:',group,r.review.reasons);
          }
          NODE
      - name: Upload RC05B diagnostic evidence (modeled only)
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-real-rc05b-modeled-review
          path: |
            /tmp/evercraft-rc05b-49-56.json
            /tmp/evercraft-rc05b-57-64.json
          retention-days: 7

      - name: RC05C observed lateral escape unit tests
        run: node --test systemia/world-engine/sim-to-real/controller-rc05-escape.test.mjs
      - name: RC05C native four-way runner tests
        run: node --import tsx --test systemia/world-engine/sim-to-real/escape-trial-rc05c.test.mjs
      - name: RC05C known regression cohort seeds 49-56
        run: node --import tsx systemia/world-engine/sim-to-real/escape-trial-rc05c.mjs --first-seed 49 --seeds 8 --out /tmp/evercraft-rc05c-49-56.json
      - name: RC05C new evaluation cohort seeds 65-72
        run: node --import tsx systemia/world-engine/sim-to-real/escape-trial-rc05c.mjs --first-seed 65 --seeds 8 --out /tmp/evercraft-rc05c-65-72.json
      - name: RC05C verify four-way synthetic outcomes and reject false review approvals
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyEscapeTrial} from './systemia/world-engine/sim-to-real/escape-trial-rc05c.mjs';
          for(const cohort of ['49-56','65-72']){
            const report=JSON.parse(fs.readFileSync('/tmp/evercraft-rc05c-'+cohort+'.json','utf8'));
            if(!verifyEscapeTrial(report)||report.hardwareExecution!==false||report.noProductionAuthority!==true)
              throw Error('rc05c_evidence_integrity_or_authority_failed:'+cohort);
            if(report.review.reviewEligible && (report.scores.escape.shieldedMoves===0||
                report.scores.escape.arrived-report.scores.baseline.arrived<Math.ceil(report.seeds*.25)))
              throw Error('rc05c_falsely_approved_immobile_candidate:'+cohort);
            console.log('RC05C REVIEW',JSON.stringify({cohort,scores:report.scores,review:report.review,digest:report.sha256}));
          }
          NODE
      - name: Upload RC05C modeled comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-real-rc05c-modeled-review
          path: |
            /tmp/evercraft-rc05c-49-56.json
            /tmp/evercraft-rc05c-65-72.json
          retention-days: 7

      - name: RC05D anonymous synthetic motion-watch and fail-closed math tests
        run: node --test systemia/world-engine/sim-to-real/controller-rc05-motion-watch.test.mjs
      - name: RC05D native evidence integrity and default-preservation tests
        run: node --import tsx --test systemia/world-engine/sim-to-real/motion-watch-trial-rc05d.test.mjs
      - name: RC05D seed 51 known moving-collision cohort (49-56)
        run: node --import tsx systemia/world-engine/sim-to-real/motion-watch-trial-rc05d.mjs --first-seed 49 --seeds 8 --out /tmp/evercraft-rc05d-49-56.json
      - name: RC05D fresh synthetic cohort (73-80)
        run: node --import tsx systemia/world-engine/sim-to-real/motion-watch-trial-rc05d.mjs --first-seed 73 --seeds 8 --out /tmp/evercraft-rc05d-73-80.json
      - name: RC05D verify documented simulated hazard outcomes and no actuation
        run: |
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {verifyMotionWatchTrial} from './systemia/world-engine/sim-to-real/motion-watch-trial-rc05d.mjs';
          for(const cohort of ['49-56','73-80']){
            const r=JSON.parse(fs.readFileSync('/tmp/evercraft-rc05d-'+cohort+'.json','utf8'));
            if(!verifyMotionWatchTrial(r)||r.hardwareExecution!==false||r.productionAuthorized!==false)
              throw Error('rc05d_evidence_or_authority_failed:'+cohort);
            if(r.review.reviewEligible&&(r.scores.motionWatch.collisions>r.scores.baseline.collisions||
                r.scores.motionWatch.shieldedMoves===0||
                r.scores.motionWatch.arrived-r.scores.baseline.arrived<Math.ceil(r.seeds*.25)))
              throw Error('rc05d_premature_candidate_eligibility:'+cohort);
            console.log('RC05D VERIFIED',JSON.stringify({cohort,scores:r.scores,review:r.review,
              perSeed:r.pairs.map(p=>({seed:p.seed,original:p.baseline.status,
                rc05c:p.escape.status,rc05d:p.motionWatch.status,
                motionHolds:p.motionWatch.motionHolds,watchedTicks:p.motionWatch.watchedTicks,
                collisionObstacleIds:p.motionWatch.collisionObstacleIds})),digest:r.sha256}));
          }
          NODE
      - name: Upload RC05D synthetic-only collision and motion-watch evidence
        uses: actions/upload-artifact@v4
        with:
          name: sim-to-real-rc05d-synthetic-motion-watch
          path: |
            /tmp/evercraft-rc05d-49-56.json
            /tmp/evercraft-rc05d-73-80.json
          retention-days: 7
