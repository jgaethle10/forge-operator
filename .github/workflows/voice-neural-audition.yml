name: Voice Foundry Real Neural A-B (evaluation only)

on:
  pull_request:
    paths:
      - '.github/workflows/voice-neural-audition.yml'
      - 'systemia/media-studio/voice-neural-audition-ci.py'
      - 'systemia/media-studio/voice-cadence-lab-ci.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-neural-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local TTS and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'piper-tts==1.3.0'
          command -v piper
          piper --help >/dev/null
      - name: Download pinned open-data neural model
        run: |
          set -euo pipefail
          mkdir -p neural-model
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/libritts/high'
          curl --fail --location --retry 3 --max-time 240 \
            "$BASE/en_US-libritts-high.onnx" \
            --output neural-model/voice.onnx
          printf '%s  %s\n' \
            '9127a559e11603f10b366d1a20ac7426826081dbc521de4c2420c57728d73f0f' \
            neural-model/voice.onnx | sha256sum --check
          curl --fail --location --retry 3 --max-time 40 \
            "$BASE/en_US-libritts-high.onnx.json" \
            --output neural-model/voice.onnx.json
          curl --fail --location --retry 3 --max-time 40 \
            "$BASE/MODEL_CARD" --output neural-model/MODEL_CARD
          grep -qi 'CC BY 4.0' neural-model/MODEL_CARD
      - name: Render four real Piper neural voices
        run: |
          python systemia/media-studio/voice-neural-audition-ci.py \
            neural-model/voice.onnx neural-model/voice.onnx.json neural-audition
          test -s neural-audition/index.html
          test -s neural-audition/audition-report.json
          test "$(find neural-audition -name 'candidate-*.mp3' | wc -l)" -eq 4
      - name: Include attribution and model card
        run: |
          cp neural-model/MODEL_CARD neural-audition/UPSTREAM_MODEL_CARD.txt
          printf '%s\n' \
            'Private neural-voice listening test. No acting, consent or publication approval.' \
            'Voice: Piper en_US-libritts-high, trained from scratch on LibriTTS train-clean-360 (CC BY 4.0).' \
            'See UPSTREAM_MODEL_CARD.txt and https://huggingface.co/rhasspy/piper-voices/tree/v1.0.0/en/en_US/libritts/high' \
            > neural-audition/README.txt
      - name: Verify unchanged words, then render A/C cadence variants
        run: |
          python systemia/media-studio/voice-cadence-lab-ci.py --verify-only
          python systemia/media-studio/voice-cadence-lab-ci.py \
            neural-model/voice.onnx neural-model/voice.onnx.json neural-cadence
          test -s neural-cadence/index.html
          test -s neural-cadence/cadence-report.json
          test "$(find neural-cadence -name '*.mp3' | wc -l)" -eq 8
      - name: Attach neural cadence comparison
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-neural-cadence-A-C
          path: neural-cadence/
          retention-days: 7
          if-no-files-found: error
      - name: Upload playable audition, not model weights
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-real-neural-audition
          path: neural-audition/
          retention-days: 7
          if-no-files-found: error
