name: Fallen approved revision to real render
on:
  pull_request:
    paths:
      - 'systemia/media-studio/approved-revision-render.mjs'
      - 'systemia/media-studio/approved-revision-render.test.mjs'
      - 'systemia/media-studio/preview-note-saban-handoff.mjs'
      - 'systemia/media-studio/shot-tournament-runner.mjs'
      - 'systemia/media-studio/studio-delivery.ts'
      - 'systemia/media-studio/timeline-export.ts'
      - 'systemia/media-studio/master-qc.ts'
      - '.github/workflows/fallen-approved-revision-render.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/media-studio/approved-revision-render.mjs'
      - 'systemia/media-studio/approved-revision-render.test.mjs'
      - '.github/workflows/fallen-approved-revision-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-revision-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify or install owned video tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            sudo timeout 180 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 420 apt-get install -y --no-install-recommends ffmpeg -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Install existing owned Evercraft code dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript source contracts
        run: npm run lint
      - name: Run complete note to tournament to real H264/AAC render and master quality gate
        env:
          FALLEN_REVISION_PROOF_DIR: ${{ runner.temp }}/fallen-revision-production-proof
        run: |
          node --import tsx --test systemia/media-studio/approved-revision-render.test.mjs
      - name: Preserve actual, explicitly synthetic final MP4 and exact QC receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallen-revision-real-mp4-synthetic-technical-proof
          path: ${{ runner.temp }}/fallen-revision-production-proof
          if-no-files-found: warn
          retention-days: 14
