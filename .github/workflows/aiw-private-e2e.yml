name: AIW private receipt to dashboard end-to-end
on:
  pull_request:
    paths:
      - 'research/infrastructure-watch/engineering/aiw_kaidance_receipts.py'
      - 'research/infrastructure-watch/engineering/aiw_private_status_export.py'
      - 'research/infrastructure-watch/engineering/aiw_private_viewer.py'
      - 'research/infrastructure-watch/operator/private-operations.html'
      - 'research/infrastructure-watch/tests/test_aiw_private_e2e.py'
      - '.github/workflows/aiw-private-e2e.yml'
permissions:
  contents: read
jobs:
  verify-private-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real loopback end-to-end contract with synthetic local data
        run: |
          python3 -m unittest discover -s research/infrastructure-watch/tests -p test_aiw_private_e2e.py -v
