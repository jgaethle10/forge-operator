name: Evercraft Domains Private Namespace Contract
on:
  pull_request:
    paths:
      - 'systemia/evercraft-domains/**'
      - 'infra/evercraft-edge/dns/runtime.mjs'
      - 'tests/evercraft-domains-private-namespace.test.mjs'
      - 'tests/evercraft-domains-split-resolver.test.mjs'
      - '.github/workflows/evercraft-domains-private-namespace.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/evercraft-domains/**'
      - 'infra/evercraft-edge/dns/runtime.mjs'
      - 'tests/evercraft-domains-private-namespace.test.mjs'
      - 'tests/evercraft-domains-split-resolver.test.mjs'
      - '.github/workflows/evercraft-domains-private-namespace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-domains:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source contracts and negative DNS boundary tests
        run: |
          node --check systemia/evercraft-domains/cli.mjs
          node --check systemia/evercraft-domains/probe-lab.mjs
          node --check systemia/evercraft-domains/split-cli.mjs
          node --check systemia/evercraft-domains/split-resolver.mjs
          node --test tests/evercraft-domains-private-namespace.test.mjs tests/evercraft-domains-split-resolver.test.mjs
      - name: Verify held Client 001 alias plan and synthetic zone
        run: |
          node systemia/evercraft-domains/cli.mjs plan > "$RUNNER_TEMP/alias-plan.json"
          node systemia/evercraft-domains/cli.mjs lab-zone > "$RUNNER_TEMP/private-lab-zone.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/alias-plan.json','utf8'));
          const z=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/private-lab-zone.json','utf8'));
          assert.equal(p.alias,'onthegoquicklube.evercraft');
          assert.equal(p.state,'HOLD');
          assert.equal(p.public_tld_delegated,false);
          assert.equal(p.site_reachable,false);
          assert.equal(z.origin,'evercraft.');
          assert.equal(z.records[0].value,'127.0.0.1');
          NODE
      - name: Localhost-only DNS on actual UDP and TCP sockets
        run: |
          set -euo pipefail
          node systemia/evercraft-domains/cli.mjs serve-lab --port 15353 > "$RUNNER_TEMP/lab-server.log" 2>&1 &
          LAB_PID=$!
          trap 'kill "$LAB_PID" 2>/dev/null || true; wait "$LAB_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 12); do
            if node systemia/evercraft-domains/probe-lab.mjs 15353 > "$RUNNER_TEMP/wire-proof.json" 2>/dev/null; then
              echo 'PRIVATE_DNS_UDP_TCP_LOOPBACK_PASS'
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/lab-server.log" || true
          echo 'PRIVATE_DNS_LOOPBACK_WIRE_PROOF_FAILED' >&2
          exit 1
      - name: Prove explicit split-DNS command defaults to held and does not edit system settings
        run: |
          node --check systemia/evercraft-domains/split-cli.mjs
          test "$(grep -c 'host=.127.0.0.1.' systemia/evercraft-domains/split-resolver.mjs || true)" -ge 0
          echo 'SPLIT_DNS_IS_LOCAL_TEST_ONLY'
      - name: Preserve nonproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-domains-private-lab
          path: |
            ${{ runner.temp }}/alias-plan.json
            ${{ runner.temp }}/private-lab-zone.json
            ${{ runner.temp }}/wire-proof.json
            ${{ runner.temp }}/lab-server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce nonpublication boundary
        if: always()
        run: |
          echo "Loopback DNS lab only. No domain purchase, no public .evercraft delegation, no Caddy change, no customer-facing TLS or site publication."
