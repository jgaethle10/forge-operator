name: Fallen Voice Foundry Bella Interface
on:
  pull_request:
    paths:
      - 'systemia/media-studio/voice-foundry/bella_native_audition.py'
      - 'systemia/media-studio/voice-foundry/test_bella_native_audition.py'
      - '.github/workflows/fallen-voice-foundry-bella.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-contracts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only interface-test dependencies (no model weights)
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 soundfile==0.13.1
      - name: Verify af_bella interface, fail-closed behavior and receipt gates with synthetic test-only voice
        run: |
          python -m unittest discover -s systemia/media-studio/voice-foundry \
            -p test_bella_native_audition.py -v
      - name: Assert model was NOT downloaded or synthesized by CI
        run: |
          test ! -d "$HOME/.cache/huggingface/hub/models--hexgrad--Kokoro-82M" || exit 1
          echo "Native voice weights not fetched: CI tests are mock-contract proof only"
