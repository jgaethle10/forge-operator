name: Evercraft Payments Bank Credit Request Safety
on:
  pull_request:
    paths:
      - 'systemia/payments/bank-credit-request-*.mjs'
      - 'tests/bank-credit-request-runtime.test.mjs'
      - 'tests/bank-credit-reconciliation.test.mjs'
      - 'tests/bank-credit-bootstrap.test.mjs'
      - 'docs/commerce/evercraft-payments-bank-direct-v1.md'
      - '.github/workflows/evercraft-payments-bank-credit-request.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/payments/bank-credit-request-*.mjs'
      - 'tests/bank-credit-request-runtime.test.mjs'
      - 'tests/bank-credit-reconciliation.test.mjs'
      - 'tests/bank-credit-bootstrap.test.mjs'
      - '.github/workflows/evercraft-payments-bank-credit-request.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank-credit-no-charge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated no-charge runtime tests
        run: |
          node --check systemia/payments/bank-credit-request-runtime.mjs
          node --check systemia/payments/bank-credit-reconciliation.mjs
          node --check systemia/payments/bank-credit-bootstrap.mjs
          node --check systemia/payments/bank-credit-request-runner.mjs
          node --test tests/bank-credit-request-runtime.test.mjs tests/bank-credit-reconciliation.test.mjs tests/bank-credit-bootstrap.test.mjs
      - name: No production bank instructions or third-party checkout in source
        run: |
          ! grep -Eiq '(sk_live_|private_key|base44\.app|api\.stripe\.com/v1/charges)' systemia/payments/bank-credit-request-runtime.mjs
          test ! -e public/bank-credit-private-config.json
