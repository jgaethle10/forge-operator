name: Rockies Wheel Lab isolated proof

on:
  pull_request:
    paths:
      - 'prototypes/rockies-wheel-lab/**'
      - 'public/wheel-lab-preview/**'
      - '.github/workflows/rockies-wheel-lab.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/rockies-wheel-lab/**'
      - 'public/wheel-lab-preview/**'
      - '.github/workflows/rockies-wheel-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rockies-wheel-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Wheel Lab boundaries and offline contract
        run: node --test prototypes/rockies-wheel-lab/rc01/*.test.mjs

      - name: Package source-only offline review kit
        uses: actions/upload-artifact@v4
        with:
          name: wheel-lab-rc05-offline-review
          path: |
            prototypes/rockies-wheel-lab/rc01/index.html
            prototypes/rockies-wheel-lab/rc01/merchant-desk.html
            prototypes/rockies-wheel-lab/rc01/review.html
            prototypes/rockies-wheel-lab/rc01/README.md
          if-no-files-found: error
          retention-days: 7

      - name: Package staged Evercraft public-route candidate (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: wheel-lab-rc07-staged-route-review
          path: |
            public/wheel-lab-preview/index.html
            public/wheel-lab-preview/shopper.html
            public/wheel-lab-preview/merchant-desk.html
          if-no-files-found: error
          retention-days: 7

  findmypart-referral-readiness:
    name: Read-only FindMyPart referral readiness witness (nonblocking)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently inspect first-party FindMyPart origin (GET only)
        shell: bash
        run: |
          set +e
          node scripts/probe-findmypart-owned-launch.mjs > findmypart-public-proof.json 2> findmypart-probe-stderr.txt
          probe_rc=$?
          set -e
          printf 'probe_exit_code=%s\n' "$probe_rc" > findmypart-probe-status.txt
          printf 'this is an observation, not publication or referral authority\n' >> findmypart-probe-status.txt
          if ! test -s findmypart-public-proof.json; then
            printf '{"schema":"evercraft.wheel-lab.findmypart-readiness-observation.v1","public_customer_intake_verified":false,"reason":"empty_probe_output"}\n' > findmypart-public-proof.json
          fi
          echo "Read-only destination probe returned code $probe_rc. Evidence is in the artifact; no referral was activated."
      - name: Preserve FindMyPart public witness independently of code checks
        uses: actions/upload-artifact@v4
        with:
          name: wheel-lab-findmypart-referral-readiness
          path: |
            findmypart-public-proof.json
            findmypart-probe-status.txt
            findmypart-probe-stderr.txt
          if-no-files-found: error
          retention-days: 7
