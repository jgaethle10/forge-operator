name: Systemia ingress evidence canary (non-disputed)

on:
  push:
    branches:
      - feature/systemia-ingress-evidence-gate-20261014
    paths:
      - systemia/control-plane/ingress-readiness.mjs
      - systemia/control-plane/ingress-readiness.test.mjs
      - .github/workflows/systemia-ingress-evidence-canary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemia-ingress-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-ingress-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed Systemia ingress evidence logic
        run: node --test systemia/control-plane/ingress-readiness.test.mjs
