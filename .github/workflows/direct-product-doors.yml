name: Direct Product Doors

on:
  push:
    branches: [main]
    paths:
      - 'distribution/direct-plugin-specs.json'
      - 'distribution/direct-product-doors.json'
      - 'public/.well-known/evercraft-direct-doors.json'
      - 'plugins/**'
      - 'scripts/generate-direct-plugin-packages.mjs'
      - 'tests/direct-product-doors.test.mjs'
      - 'tests/chum-direct-specialist-routing.test.mjs'
      - 'systemia/chum/build-capability-mirror.mjs'
      - 'distribution/mcp-registry-candidates/**'
      - 'scripts/generate-mcp-registry-candidates.mjs'
      - 'tests/mcp-registry-candidates.test.mjs'
      - 'systemia/yard/promote-specialist-edge.mjs'
      - 'tests/promote-specialist-edge.test.mjs'
      - 'scripts/materialize-mcp-registry-candidates.mjs'
      - 'tests/materialize-mcp-registry-candidates.test.mjs'
      - 'scripts/record-mcp-registry-publication.mjs'
      - 'tests/record-mcp-registry-publication.test.mjs'
      - 'distribution/mcp-registry-publication-receipts/**'
      - '.github/workflows/direct-product-doors.yml'
      - 'tests/mcp-registry-field-gate.test.mjs'
      - 'package.json'
  pull_request:
    paths:
      - 'distribution/direct-plugin-specs.json'
      - 'distribution/direct-product-doors.json'
      - 'public/.well-known/evercraft-direct-doors.json'
      - 'plugins/**'
      - 'scripts/generate-direct-plugin-packages.mjs'
      - 'tests/direct-product-doors.test.mjs'
      - 'tests/chum-direct-specialist-routing.test.mjs'
      - 'systemia/chum/build-capability-mirror.mjs'
      - 'distribution/mcp-registry-candidates/**'
      - 'scripts/generate-mcp-registry-candidates.mjs'
      - 'tests/mcp-registry-candidates.test.mjs'
      - 'systemia/yard/promote-specialist-edge.mjs'
      - 'tests/promote-specialist-edge.test.mjs'
      - 'scripts/materialize-mcp-registry-candidates.mjs'
      - 'tests/materialize-mcp-registry-candidates.test.mjs'
      - 'scripts/record-mcp-registry-publication.mjs'
      - 'tests/record-mcp-registry-publication.test.mjs'
      - 'distribution/mcp-registry-publication-receipts/**'
      - '.github/workflows/direct-product-doors.yml'
      - 'tests/mcp-registry-field-gate.test.mjs'
      - 'package.json'

permissions:
  contents: write

jobs:
  direct-doors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate direct specialist packages
        run: npm run direct:generate

      - name: Validate direct specialist doors
        run: npm run direct:check

      - name: Publish generated direct-door state
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add distribution/direct-product-doors.json public/.well-known/evercraft-direct-doors.json plugins
          if git diff --cached --quiet; then
            echo "Direct-door generated state is current."
            exit 0
          fi
          git config user.name "Evercraft Direct Doors"
          git config user.email "direct-doors@users.noreply.github.com"
          git commit -m "Regenerate direct specialist packages [skip ci]"
          git fetch origin main --quiet
          git rebase origin/main
          git push origin HEAD:main
