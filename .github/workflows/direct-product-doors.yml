name: Direct Product Doors

on:
  push:
    branches: [main]
    paths:
      - 'distribution/direct-plugin-specs.json'
      - 'distribution/direct-product-doors.json'
      - 'public/.well-known/evercraft-direct-doors.json'
      - 'plugins/**'
      - 'scripts/generate-direct-plugin-packages.mjs'
      - 'tests/direct-product-doors.test.mjs'
      - 'tests/chum-direct-specialist-routing.test.mjs'
      - 'systemia/chum/build-capability-mirror.mjs'
      - 'distribution/mcp-registry-candidates/**'
      - 'scripts/generate-mcp-registry-candidates.mjs'
      - 'tests/mcp-registry-candidates.test.mjs'
      - 'systemia/yard/promote-specialist-edge.mjs'
      - 'tests/promote-specialist-edge.test.mjs'
      - 'scripts/materialize-mcp-registry-candidates.mjs'
      - 'tests/materialize-mcp-registry-candidates.test.mjs'
      - 'scripts/record-mcp-registry-publication.mjs'
      - 'tests/record-mcp-registry-publication.test.mjs'
      - 'distribution/mcp-registry-publication-receipts/**'
      - 'package.json'
  pull_request:
    paths:
      - 'distribution/direct-plugin-specs.json'
      - 'distribution/direct-product-doors.json'
      - 'public/.well-known/evercraft-direct-doors.json'
      - 'plugins/**'
      - 'scripts/generate-direct-plugin-packages.mjs'
      - 'tests/direct-product-doors.test.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  direct-doors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate direct specialist doors
        run: npm run direct:check
