name: Evercraft Fabric Native Door

on:
  pull_request:
    paths:
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/specialist-handoff-runtime.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/public-edge-controller.mjs'
      - 'systemia/yard/public-edge-activation-watch.mjs'
      - 'systemia/organism/public-edge-activation-watch-runner.mjs'
      - 'tests/evercraft-fabric-runtime.test.mjs'
      - 'tests/specialist-handoff-native-runtime.test.mjs'
      - 'tests/public-edge-native-specialist-invariants.test.mjs'
      - 'tests/public-edge-canary-contract.test.mjs'
      - 'package.json'
      - '.github/workflows/evercraft-fabric-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-owned-door:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Fabric MCP and challenge
        run: node --test tests/evercraft-fabric-runtime.test.mjs
      - name: Prove specialist runtime remains safe
        run: |
          npm install --no-audit --no-fund
          npm run test:specialist-handoff-mcp
      - name: Prove Yard deployment path
        run: |
          node systemia/yard/public-edge-controller.proof.mjs
          node systemia/yard/public-route-broker.proof.mjs
      - name: Prove Public Edge invariants
        run: node --test tests/public-edge-mainline-invariants.test.mjs
