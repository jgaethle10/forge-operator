name: Evercraft Fabric Native Door

on:
  push:
    branches: [main]
    paths:
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'tests/fabric-checkout-transport-truth.test.mjs'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/earthworks-simulator-page.mjs'
      - 'systemia/mcp/earthworks-simulator-app.mjs'
      - 'public/.well-known/evercraft-products.json'
      - 'public/.well-known/evercraft-machine-catalog.json'
      - 'public/chum/capabilities/lineage-founding-pilot-v1/**'
      - 'public/chum/capabilities.json'
      - 'systemia/visual-desk/**'
      - 'public/visuals/**'
      - 'public/demos/**'
      - 'tests/fabric-offer-pages.test.mjs'
      - 'tests/aliev-owned-page.test.mjs'
      - 'tests/earthworks-owned-page.test.mjs'
      - 'tests/earthworks-public-playground.test.mjs'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/fabric-edge-external-canary.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
      - 'tests/chromebook-operator-edge-canary-workflow.test.mjs'
      - 'tests/fabric-self-update-hardening.test.mjs'
      - 'tests/fabric-owned-edge-updater-contract.test.mjs'
      - 'tests/fabric-edge-external-canary-contract.test.mjs'
      - '.github/workflows/evercraft-fabric-native.yml'
  pull_request:
    paths:
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'tests/fabric-checkout-transport-truth.test.mjs'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-faie-runtime.mjs'
      - 'public/chum/capabilities.json'
      - 'public/chum/capabilities/lineage-founding-pilot-v1/**'
      - 'public/.well-known/evercraft-machine-catalog.json'
      - 'public/.well-known/evercraft-products.json'
      - 'systemia/visual-desk/**'
      - 'public/visuals/**'
      - 'public/demos/**'
      - 'systemia/faie/**'
      - 'public/faie/**'
      - 'systemia/mcp/fabric-mobile-site.mjs'
      - 'systemia/mcp/specialist-handoff-runtime.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/public-edge-controller.mjs'
      - 'systemia/yard/public-edge-activation-watch.mjs'
      - 'systemia/organism/public-edge-activation-watch-runner.mjs'
      - 'tests/evercraft-fabric-runtime.test.mjs'
      - 'tests/fabric-offer-pages.test.mjs'
      - 'tests/aliev-owned-page.test.mjs'
      - 'tests/earthworks-owned-page.test.mjs'
      - 'tests/fabric-faie-native-runtime.test.mjs'
      - 'tests/fabric-mobile-runtime.test.mjs'
      - 'tests/specialist-handoff-native-runtime.test.mjs'
      - 'tests/public-edge-native-specialist-invariants.test.mjs'
      - 'tests/public-edge-canary-contract.test.mjs'
      - 'tests/fabric-edge-doctor-contract.test.mjs'
      - 'tests/fabric-edge-external-canary-contract.test.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
      - 'tests/chromebook-operator-edge-canary-workflow.test.mjs'
      - 'tests/fabric-owned-edge-updater-contract.test.mjs'
      - 'scripts/fabric-edge-doctor.sh'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-self-update.sh'
      - 'tests/fabric-self-update-hardening.test.mjs'
      - 'package.json'
      - '.github/workflows/evercraft-fabric-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-owned-door:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Fabric MCP, human offer storefront, and mobile door
        run: node --test tests/evercraft-fabric-runtime.test.mjs tests/fabric-offer-pages.test.mjs tests/fabric-checkout-transport-truth.test.mjs tests/aliev-owned-page.test.mjs tests/earthworks-owned-page.test.mjs tests/earthworks-public-playground.test.mjs tests/fabric-mobile-runtime.test.mjs tests/fabric-faie-native-runtime.test.mjs

      - name: Verify deployed EarthWorks hot-read playground
        shell: bash
        run: |
          set -euo pipefail
          url="https://fabric.systemiacommandcenters.com/demos/earthworks-autonomy/"
          page="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$url")"
          if printf '%s' "$page" | grep -Fq 'Live Yard 001'; then
            printf '%s' "$page" | grep -Fq 'data-mode="manual"'
            printf '%s' "$page" | grep -Fq 'data-mode="shadow"'
            printf '%s' "$page" | grep -Fq 'data-mode="autonomy"'
            printf '%s' "$page" | grep -Fq 'Truck Queue'
            printf '%s' "$page" | grep -Fq 'Loader Starvation'
            printf '%s' "$page" | grep -Fq 'Blocked Route'
            printf '%s' "$page" | grep -Fq 'Production Surge'
            echo "EARTHWORKS_PLAYGROUND_GENERATION=canonical-live-yard"
          else
            printf '%s' "$page" | grep -Fq 'EarthWorks Autonomy Playground'
            printf '%s' "$page" | grep -Fq 'data-mode="manual"'
            printf '%s' "$page" | grep -Fq 'data-mode="shadow"'
            printf '%s' "$page" | grep -Fq 'data-mode="auto"'
            printf '%s' "$page" | grep -Fq 'Truck failure'
            echo "EARTHWORKS_PLAYGROUND_GENERATION=legacy-playground"
          fi
          printf '%s' "$page" | grep -Fq 'STOP ALL'
          if printf '%s' "$page" | grep -Fiq 'base44.app'; then
            echo "EarthWorks playground unexpectedly references Base44." >&2
            exit 1
          fi
          echo "EARTHWORKS_PLAYGROUND_VERIFIED=$url"

      - name: Prove specialist runtime remains safe
        run: |
          npm install --no-audit --no-fund
          npm run test:specialist-handoff-mcp
      - name: Prove Yard deployment path
        run: |
          node systemia/yard/public-edge-controller.proof.mjs
          node systemia/yard/public-route-broker.proof.mjs
      - name: Prove Public Edge invariants
        run: node --test tests/public-edge-mainline-invariants.test.mjs
      - name: Prove Fabric self-update sandbox boundary
        run: node --test tests/fabric-self-update-hardening.test.mjs

      - name: Prove Fabric edge doctor field gate
        run: |
          bash -n scripts/fabric-edge-doctor.sh
          bash -n scripts/update-fabric-owned-edge.sh
          node --test tests/fabric-edge-doctor-contract.test.mjs tests/fabric-owned-edge-updater-contract.test.mjs tests/fabric-edge-external-canary-contract.test.mjs tests/chromebook-operator-edge-canary-workflow.test.mjs

      - name: Reproduce resident Chromebook update proof sequence
        run: |
          npm run test:fabric-directory
          npm run test:fabric-local
          npm run test:remote-operator
          node --test tests/fabric-edge-attestation.test.mjs tests/fabric-owned-edge-installer.test.mjs tests/fabric-outbound-relay.test.mjs
          npm run proof:specialist-handoff-yard
