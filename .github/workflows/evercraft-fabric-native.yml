  push:
    branches: [main]
    paths:
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/payments/stripe-connection-registry.mjs'
      - 'systemia/payments/stripe-connection-registry.test.mjs'
      - 'systemia/payments/raven-stripe-price-bridge.mjs'
      - 'systemia/payments/raven-stripe-price-bridge.test.mjs'
      - 'systemia/payments/raven-stripe-checkout-adapter.mjs'
      - 'systemia/payments/raven-stripe-checkout-adapter.test.mjs'
      - 'systemia/payments/raven-stripe-vault-preflight.test.mjs'
      - 'scripts/systemia-stripe-vault-preflight.mjs'
      - 'scripts/systemia-stripe-vault-locator.mjs'
      - 'systemia/payments/raven-stripe-vault-locator.test.mjs'
