name: Fallen Narrative Shoot Readiness

on:
  pull_request:
    paths:
      - 'systemia/media-studio/narrative-shoot-readiness.ts'
      - 'systemia/media-studio/narrative-shoot-readiness.test.ts'
      - 'systemia/media-studio/narrative-shoot-readiness-cli.ts'
      - 'systemia/media-studio/model-fabric.ts'
      - 'systemia/media-studio/cinematic-sequence.ts'
      - '.github/workflows/fallen-narrative-shoot-readiness.yml'
  workflow_dispatch:

jobs:
  narrative-shoot-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test systemia/media-studio/narrative-shoot-readiness.test.ts
