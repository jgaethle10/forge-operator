name: Remote device trust loop

on:
  pull_request:
    paths:
      - 'systemia/yard/remote-device-trust-loop.proof.mjs'
      - 'systemia/yard/REMOTE_DEVICE_TRUST_LOOP.md'
      - 'systemia/yard/remote-device-review.mjs'
      - 'systemia/organism/pending-device-trust-watch.mjs'
      - 'systemia/collider/mission-fabric.mjs'
      - 'systemia/collider/runtime.mjs'
      - 'systemia/collider/pulse.mjs'
      - 'systemia/compute/remote-admission-keeper.mjs'
      - 'systemia/network/outbound-capacity-broker.mjs'
      - 'systemia/yard/operator.mjs'
      - '.github/workflows/remote-device-trust-loop.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/yard/remote-device-trust-loop.proof.mjs'
      - 'systemia/yard/REMOTE_DEVICE_TRUST_LOOP.md'
      - 'systemia/yard/remote-device-review.mjs'
      - 'systemia/organism/pending-device-trust-watch.mjs'
      - 'systemia/collider/mission-fabric.mjs'
      - 'systemia/collider/runtime.mjs'
      - 'systemia/collider/pulse.mjs'
      - 'systemia/compute/remote-admission-keeper.mjs'
      - 'systemia/network/outbound-capacity-broker.mjs'
      - 'systemia/yard/operator.mjs'
      - '.github/workflows/remote-device-trust-loop.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove pending -> hold -> explicit approval -> clear loop
        run: node systemia/yard/remote-device-trust-loop.proof.mjs
