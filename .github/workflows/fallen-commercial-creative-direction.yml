name: Fallen Commercial Creative Direction
on:
  pull_request:
    paths:
      - 'systemia/media-studio/commercial-creative-direction.mjs'
      - 'systemia/media-studio/commercial-creative-direction.test.mjs'
      - 'systemia/media-studio/fixtures/sample-commercial-direction.json'
      - '.github/workflows/fallen-commercial-creative-direction.yml'
  workflow_dispatch:
jobs:
  commercial-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test creative brief and Saban specialist handoff
        run: node --test systemia/media-studio/commercial-creative-direction.test.mjs
      - name: Install Studio TypeScript runtime
        run: npm install --no-audit --no-fund
      - name: Verify editable source-video trim semantics
        run: node --import tsx --test systemia/media-studio/studio-create.test.ts
      - name: Compile fictional customer cut sheet into existing Fallen editable timeline
        run: |
          node --import tsx --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {evaluateCommercialDirection} from './systemia/media-studio/commercial-creative-direction.mjs';
          import {compileStudioDraft} from './systemia/media-studio/studio-create.ts';
          const brief=JSON.parse(fs.readFileSync('systemia/media-studio/fixtures/sample-commercial-direction.json','utf8'));
          const evaluated=evaluateCommercialDirection(brief);
          if(evaluated.status!=='ready_for_director_review') throw new Error('direction_blocked');
          const bundle=compileStudioDraft(evaluated.studioDraftPlan);
          const picture=bundle.project.tracks.find(t=>t.kind==='video');
          if(picture?.clips.length!==4) throw new Error('four_shot_timeline_missing');
          if(picture.clips.map(x=>x.trimStartSec).join(',')!=='0,4,16,24') throw new Error('source_video_trim_points_not_preserved');
          if(bundle.script.length!==4 || bundle.captions.length!==4) throw new Error('voice_caption_timeline_missing');
          if(bundle.productionNeeds.filter(x=>x.kind==='speech').length!==4) throw new Error('voice_production_needs_missing');
          if(bundle.productionNeeds.filter(x=>x.kind==='video').length!==0) throw new Error('existing_video_not_reused');
          if(bundle.boundaries.paidGenerationAuthorityGranted!==false) throw new Error('provider_authority_broken');
          NODE
      - name: Verify no private client artifacts are generated by the demo
        run: |
          node systemia/media-studio/commercial-creative-direction.mjs systemia/media-studio/fixtures/sample-commercial-direction.json /tmp/evercraft-demo-creative-report.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/evercraft-demo-creative-report.json','utf8'));
          if(r.status!=='ready_for_director_review') throw new Error('demo_not_ready_for_director_review');
          if(r.studioDraftPlan?.scenes.length!==4) throw new Error('demo_shots_missing');
          if(r.boundaries.publicationAuthorityGranted!==false || r.boundaries.noMediaWasGenerated!==true) throw new Error('authority_boundary_broken');
          NODE
