name: DayTrade Closing Horizon Ladder Once

on:
  push:
    branches:
      - "systemia/daytrade-closing-horizon-ladder-2026-10-06"

permissions:
  contents: read

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run closing horizon ladder
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_HORIZON_LADDER_OUTPUT: artifacts/daytrade-edge/closing-horizon-ladder-2026-10-06.json
        run: node systemia/daytrade-lens/edge-closing-horizon-ladder.mjs
      - name: Upload ladder receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-closing-horizon-ladder-${{ github.run_id }}
          path: artifacts/daytrade-edge/closing-horizon-ladder-2026-10-06.json
          if-no-files-found: warn
          retention-days: 30
