name: Gemma Saban Submission Package

on:
  pull_request:
    paths:
      - "systemia/competition/entries/gemma-saban/**"
      - ".github/workflows/gemma-saban-package.yml"
  push:
    branches: [main]
    paths:
      - "systemia/competition/entries/gemma-saban/**"
      - ".github/workflows/gemma-saban-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Kaggle submission.zip
        run: bash systemia/competition/entries/gemma-saban/package-submission.sh
      - name: Verify root agent config
        run: unzip -p systemia/competition/entries/gemma-saban/dist/submission.zip agent.yaml | grep -q '^name: saban_swe_agent$'
      - name: Upload Kaggle submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-saban-submission
          path: systemia/competition/entries/gemma-saban/dist/submission.zip
          if-no-files-found: error
          retention-days: 14
