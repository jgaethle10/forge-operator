name: Evercraft Events feasibility proof

on:
  pull_request:
    paths:
      - 'systemia/opportunity-fabric/event-coordination.mjs'
      - 'systemia/opportunity-fabric/event-coordination.test.mjs'
      - 'systemia/opportunity-fabric/reignite-readiness-*.mjs'
      - 'public/reignite/readiness/**'
      - 'tests/reignite-unified.test.mjs'
      - '.github/workflows/events-feasibility-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove event safety and no unintended venue authority
        run: node --test systemia/opportunity-fabric/event-coordination.test.mjs tests/reignite-unified.test.mjs
      - name: Verify organizer readiness preview from canonical gates
        run: node systemia/opportunity-fabric/reignite-readiness-build.mjs --check
