name: EarthWorks Autonomy proof

on:
  pull_request:
    paths:
      - 'systemia/earthworks-autonomy/**'
      - 'public/apps/earthworks-autonomy/**'
      - '.github/workflows/earthworks-autonomy.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/earthworks-autonomy/**'
      - 'public/apps/earthworks-autonomy/**'
      - '.github/workflows/earthworks-autonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic fleet-control proof
        run: node --test systemia/earthworks-autonomy/fleet-controller.test.mjs
      - name: Verify public toy yard exists
        run: test -s public/apps/earthworks-autonomy/index.html
