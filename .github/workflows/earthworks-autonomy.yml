name: EarthWorks Autonomy proof

on:
  pull_request:
    paths:
      - 'systemia/earthworks-autonomy/**'
      - 'public/apps/earthworks-autonomy/**'
      - '.github/workflows/earthworks-autonomy.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/earthworks-autonomy/**'
      - 'public/apps/earthworks-autonomy/**'
      - '.github/workflows/earthworks-autonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earthworks-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run EarthWorks autonomy tests
        run: node --test systemia/earthworks-autonomy/*.test.mjs
      - name: Verify public proof surfaces
        run: |
          test -s public/apps/earthworks-autonomy/index.html
          test -s public/apps/earthworks-autonomy/applications.html
          test -s public/apps/earthworks-autonomy/capability.json
          test -s public/apps/earthworks-autonomy/site-contract.json
