name: Systemia Unified Control Plane

on:
  pull_request:
    paths:
      - "systemia/control-plane/**"
      - "systemia/organism/**"
      - "systemia/saban/**"
      - "systemia/signal-fabric/**"
      - "systemia/yard/**"
      - "systemia/compute/**"
      - "systemia/network/**"
      - "systemia/chum/**"
      - "systemia/mcp/**"
      - "systemia/payments/owned-checkout-handoff.mjs"
      - "tests/fabric-offer-pages.test.mjs"
      - "tests/fabric-local-runtime.test.mjs"
      - "tests/fabric-ibmi-74-machine-handoff.test.mjs"
      - "tests/owned-checkout-handoff.test.mjs"
      - "systemia/collider/**"
      - "systemia/beast-mode/**"
      - "systemia/media-studio/**"
      - "package.json"
      - "distribution/machine-commerce-distribution.json"
      - "systemia/missions/**"
      - "tests/chum-universal-mcp-truth.test.mjs"
      - "tests/chum-commerce-door-status.test.mjs"
      - "tests/systemia-ai-agent-distribution-mission.test.mjs"
      - "scripts/chum-owned-fabric-readonly-canary.mjs"
      - ".github/workflows/systemia-control-plane.yml"
  push:
    branches:
      - main
    paths:
      - "systemia/control-plane/**"
      - "systemia/organism/**"
      - "systemia/saban/**"
      - "systemia/signal-fabric/**"
      - "systemia/yard/**"
      - "systemia/compute/**"
      - "systemia/network/**"
      - "systemia/chum/**"
      - "systemia/mcp/**"
      - "systemia/payments/owned-checkout-handoff.mjs"
      - "tests/fabric-offer-pages.test.mjs"
      - "tests/fabric-local-runtime.test.mjs"
      - "tests/fabric-ibmi-74-machine-handoff.test.mjs"
      - "tests/owned-checkout-handoff.test.mjs"
      - "systemia/collider/**"
      - "systemia/beast-mode/**"
      - "systemia/media-studio/**"
      - "package.json"
      - "distribution/machine-commerce-distribution.json"
      - "systemia/missions/**"
      - "tests/chum-universal-mcp-truth.test.mjs"
      - "tests/chum-commerce-door-status.test.mjs"
      - "tests/systemia-ai-agent-distribution-mission.test.mjs"
      - "scripts/chum-owned-fabric-readonly-canary.mjs"

permissions:
  contents: read

jobs:
  prove-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run machine:status
      - run: npm run proof:control-plane
      - name: Verify external-agent commerce truth and Systemia authority gates
        run: node --test tests/chum-universal-mcp-truth.test.mjs tests/chum-commerce-door-status.test.mjs tests/systemia-ai-agent-distribution-mission.test.mjs

      - name: Prove owned Fabric checkout fail-closed and buyer-page truth
        run: node --test tests/fabric-offer-pages.test.mjs tests/fabric-local-runtime.test.mjs tests/fabric-ibmi-74-machine-handoff.test.mjs tests/owned-checkout-handoff.test.mjs

      - name: Externally probe owned Fabric read-only MCP without commerce or private data
        id: fabric_public_readonly_probe
        run: node scripts/chum-owned-fabric-readonly-canary.mjs

      - name: Upload independently observed read-only MCP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-fabric-readonly-mcp-receipt
          path: artifacts/chum/owned-fabric-readonly-mcp-canary.json
          if-no-files-found: warn

      - name: Inspect IBM i 7.4 exact paid tier without purchase
        env:
          EVERCRAFT_MACHINE_COMMERCE_GATEWAY_URL: ${{ vars.EVERCRAFT_MACHINE_COMMERCE_GATEWAY_URL }}
        run: |
          node systemia/chum/ibmi-74-owned-tier-canary.mjs artifacts/chum/ibmi-74-tier-readonly.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/chum/ibmi-74-tier-readonly.json'));if(r.checkout_attempted||r.checkout_verified||r.payment_attempted||r.provider_settlement_verified||r.public_release_authorized)process.exit(1);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### IBM i 7.4 commercial corridor\nStatus: '+r.status+'\nReason: '+r.reason+'\nBuyer checkout/payment: NOT VERIFIED\n');"

      - name: Upload independently checked IBM i 7.4 tier listing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibmi-74-agent-commerce-tier-readonly
          path: artifacts/chum/ibmi-74-tier-readonly.json
          if-no-files-found: warn
