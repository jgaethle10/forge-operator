name: Systemia Unified Control Plane

on:
  pull_request:
    paths:
      - "systemia/control-plane/**"
      - "systemia/organism/**"
      - "systemia/saban/**"
      - "systemia/signal-fabric/**"
      - "systemia/yard/**"
      - "systemia/compute/**"
      - "systemia/network/**"
      - "systemia/chum/**"
      - "systemia/collider/**"
      - "systemia/beast-mode/**"
      - "systemia/media-studio/**"
      - "package.json"
      - "distribution/machine-commerce-distribution.json"
      - "systemia/missions/**"
      - "tests/chum-universal-mcp-truth.test.mjs"
      - "tests/chum-commerce-door-status.test.mjs"
      - "tests/systemia-ai-agent-distribution-mission.test.mjs"
      - ".github/workflows/systemia-control-plane.yml"
  push:
    branches:
      - main
    paths:
      - "systemia/control-plane/**"
      - "systemia/organism/**"
      - "systemia/saban/**"
      - "systemia/signal-fabric/**"
      - "systemia/yard/**"
      - "systemia/compute/**"
      - "systemia/network/**"
      - "systemia/chum/**"
      - "systemia/collider/**"
      - "systemia/beast-mode/**"
      - "systemia/media-studio/**"
      - "package.json"
      - "distribution/machine-commerce-distribution.json"
      - "systemia/missions/**"
      - "tests/chum-universal-mcp-truth.test.mjs"
      - "tests/chum-commerce-door-status.test.mjs"
      - "tests/systemia-ai-agent-distribution-mission.test.mjs"

permissions:
  contents: read

jobs:
  prove-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run machine:status
      - run: npm run proof:control-plane
      - name: Verify external-agent commerce truth and Systemia authority gates
        run: node --test tests/chum-universal-mcp-truth.test.mjs tests/chum-commerce-door-status.test.mjs tests/systemia-ai-agent-distribution-mission.test.mjs
