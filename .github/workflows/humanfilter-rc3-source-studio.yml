name: HumanFilter RC3 • Private Live-Action Source Studio
on:
  push:
    branches: ["humanfilter-fallen-rc3-*"]
    paths:
      - "products/humanfilter/commercial/source-studio/**"
      - ".github/workflows/humanfilter-rc3-source-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-mobile-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline source intake dependencies
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate synthetic test-only video, not client footage
        working-directory: products/humanfilter/commercial/source-studio
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=720x1280:rate=24' -t 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p demo-only-testsrc.mp4
      - name: Verify ZIP security, consent holds and FFmpeg source evidence
        working-directory: products/humanfilter/commercial/source-studio
        run: python -m unittest test_intake.py -v
      - name: Verify mobile user journey all the way through export and ingest
        working-directory: products/humanfilter/commercial/source-studio
        run: python test_capture.py
      - name: Confirm production files are offline-only and cannot publish
        working-directory: products/humanfilter/commercial/source-studio
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('mobile-capture.html').read_text()
          py=Path('ingest_live_action.py').read_text()
          assert 'fetch(' not in html and 'XMLHttpRequest' not in html
          assert '<script src=' not in html and '<link rel=' not in html
          assert 'publication_authority' in py and "'not_verified'" in py
          assert 'consent_attested' in html and 'owner_creative_approved' in html
          print('OFFLINE_ONLY PASS; PUBLICATION BLOCKED; PRIVATE FOOTAGE NOT UPLOADED')
          PY
      - name: Retain safe synthetic UI preview for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanfilter-source-studio-mobile-ui
          path: products/humanfilter/commercial/source-studio/mobile-capture-preview.png
          if-no-files-found: warn
