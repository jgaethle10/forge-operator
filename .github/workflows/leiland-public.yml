name: Leiland Sovereign AI Public Observatory Proof

on:
  pull_request:
    paths:
      - 'public/leiland/**'
      - 'public/kaidance/pulse-source.mjs'
      - 'tests/leiland-public.test.mjs'
      - 'tests/leiland-neural-universe.test.mjs'
      - 'scripts/qa-leiland-browser.py'
      - 'tests/leiland-owned-pulse-publisher.test.mjs'
      - 'tests/leiland-owned-release-probe.test.mjs'
      - 'tests/leiland-owned-observatory-host.test.mjs'
      - 'tests/leiland-kaidance-field-integration.test.mjs'
      - 'tests/leiland-field-preflight.test.mjs'
      - 'tests/leiland-owned-field-canary.test.mjs'
      - 'scripts/leiland-owned-field-canary.mjs'
      - 'scripts/leiland-resident-readiness.mjs'
      - 'tests/leiland-resident-readiness.test.mjs'
      - 'tests/leiland-core-admission.test.mjs'
      - 'systemia/leiland/core-admission.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/compute/local-organism.mjs'
      - 'tests/leiland-systemia-resident.test.mjs'
      - 'systemia/organism/leiland-owned-observatory.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/leiland-field-preflight.mjs'
      - 'scripts/probe-leiland-owned-release.mjs'
      - 'systemia/leiland/**'
      - 'systemia/collider/public-projection.mjs'
      - '.github/workflows/leiland-public.yml'
  push:
    branches: [main]
    paths:
      - 'public/leiland/**'
      - 'public/kaidance/pulse-source.mjs'
      - 'tests/leiland-public.test.mjs'
      - 'tests/leiland-neural-universe.test.mjs'
      - 'scripts/qa-leiland-browser.py'
      - 'tests/leiland-owned-pulse-publisher.test.mjs'
      - 'tests/leiland-owned-release-probe.test.mjs'
      - 'tests/leiland-owned-observatory-host.test.mjs'
      - 'tests/leiland-kaidance-field-integration.test.mjs'
      - 'tests/leiland-field-preflight.test.mjs'
      - 'tests/leiland-owned-field-canary.test.mjs'
      - 'scripts/leiland-owned-field-canary.mjs'
      - 'scripts/leiland-resident-readiness.mjs'
      - 'tests/leiland-resident-readiness.test.mjs'
      - 'tests/leiland-core-admission.test.mjs'
      - 'systemia/leiland/core-admission.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/compute/local-organism.mjs'
      - 'tests/leiland-systemia-resident.test.mjs'
      - 'systemia/organism/leiland-owned-observatory.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/leiland-field-preflight.mjs'
      - 'scripts/probe-leiland-owned-release.mjs'
      - 'systemia/leiland/**'
      - 'systemia/collider/public-projection.mjs'
      - '.github/workflows/leiland-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leiland-public:
    name: Leiland privacy and public-pulse proof
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and public pulse syntax
        run: |
          node --check public/leiland/brain.js
          node --check public/leiland/neural-universe.mjs
          node --check public/leiland/pulse-bridge.mjs
          node --check public/kaidance/pulse-source.mjs
          node --check systemia/leiland/owned-pulse-publisher.mjs
          node --check scripts/probe-leiland-owned-release.mjs
          node --check systemia/leiland/owned-observatory-host.mjs
          node --check scripts/leiland-field-preflight.mjs
          node --check scripts/leiland-owned-field-canary.mjs
          node --check scripts/leiland-resident-readiness.mjs
          node --check systemia/leiland/core-admission.mjs
          node --check systemia/compute/runtime-node.mjs
          node --check systemia/compute/local-organism.mjs
          node --check systemia/leiland/resident-host-runner.mjs
      - name: Prove public-only activity and privacy contract
        run: node --test tests/leiland-public.test.mjs tests/leiland-owned-pulse-publisher.test.mjs tests/leiland-owned-release-probe.test.mjs tests/leiland-owned-observatory-host.test.mjs tests/leiland-kaidance-field-integration.test.mjs tests/leiland-field-preflight.test.mjs tests/leiland-systemia-resident.test.mjs tests/leiland-owned-field-canary.test.mjs tests/leiland-neural-universe.test.mjs tests/leiland-resident-readiness.test.mjs tests/leiland-core-admission.test.mjs

  leiland-browser:
    name: Leiland real Chromium iPhone / desktop / portrait proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual local Chromium pixel, interaction and portrait acceptance
        run: |
          python -m pip install --quiet playwright==1.58.0
          python scripts/qa-leiland-browser.py
      - name: Preserve human-reviewable Leiland frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leiland-neural-universe-browser-frames
          path: artifacts/leiland-browser/*.png
          retention-days: 30
          if-no-files-found: warn
