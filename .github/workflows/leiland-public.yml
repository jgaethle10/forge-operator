name: Leiland Sovereign AI Public Observatory Proof

on:
  pull_request:
    paths:
      - 'public/leiland/**'
      - 'public/kaidance/pulse-source.mjs'
      - 'tests/leiland-public.test.mjs'
      - 'tests/leiland-neural-universe.test.mjs'
      - 'tests/leiland-owned-pulse-publisher.test.mjs'
      - 'tests/leiland-owned-release-probe.test.mjs'
      - 'tests/leiland-owned-observatory-host.test.mjs'
      - 'tests/leiland-kaidance-field-integration.test.mjs'
      - 'tests/leiland-field-preflight.test.mjs'
      - 'tests/leiland-owned-field-canary.test.mjs'
      - 'scripts/leiland-owned-field-canary.mjs'
      - 'tests/leiland-systemia-resident.test.mjs'
      - 'systemia/organism/leiland-owned-observatory.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/leiland-field-preflight.mjs'
      - 'scripts/probe-leiland-owned-release.mjs'
      - 'systemia/leiland/**'
      - 'systemia/collider/public-projection.mjs'
      - '.github/workflows/leiland-public.yml'
  push:
    branches: [main]
    paths:
      - 'public/leiland/**'
      - 'public/kaidance/pulse-source.mjs'
      - 'tests/leiland-public.test.mjs'
      - 'tests/leiland-neural-universe.test.mjs'
      - 'tests/leiland-owned-pulse-publisher.test.mjs'
      - 'tests/leiland-owned-release-probe.test.mjs'
      - 'tests/leiland-owned-observatory-host.test.mjs'
      - 'tests/leiland-kaidance-field-integration.test.mjs'
      - 'tests/leiland-field-preflight.test.mjs'
      - 'tests/leiland-owned-field-canary.test.mjs'
      - 'scripts/leiland-owned-field-canary.mjs'
      - 'tests/leiland-systemia-resident.test.mjs'
      - 'systemia/organism/leiland-owned-observatory.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/leiland-field-preflight.mjs'
      - 'scripts/probe-leiland-owned-release.mjs'
      - 'systemia/leiland/**'
      - 'systemia/collider/public-projection.mjs'
      - '.github/workflows/leiland-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leiland-public:
    name: Leiland privacy and public-pulse proof
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and public pulse syntax
        run: |
          node --check public/leiland/brain.js
          node --check public/leiland/neural-universe.mjs
          node --check public/leiland/pulse-bridge.mjs
          node --check public/kaidance/pulse-source.mjs
          node --check systemia/leiland/owned-pulse-publisher.mjs
          node --check scripts/probe-leiland-owned-release.mjs
          node --check systemia/leiland/owned-observatory-host.mjs
          node --check scripts/leiland-field-preflight.mjs
          node --check scripts/leiland-owned-field-canary.mjs
          node --check systemia/leiland/resident-host-runner.mjs
      - name: Prove public-only activity and privacy contract
        run: node --test tests/leiland-public.test.mjs tests/leiland-owned-pulse-publisher.test.mjs tests/leiland-owned-release-probe.test.mjs tests/leiland-owned-observatory-host.test.mjs tests/leiland-kaidance-field-integration.test.mjs tests/leiland-field-preflight.test.mjs tests/leiland-systemia-resident.test.mjs tests/leiland-owned-field-canary.test.mjs tests/leiland-neural-universe.test.mjs
