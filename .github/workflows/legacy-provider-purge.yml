name: Legacy provider safe-cutover gate

# SAFETY: A previous version of this workflow automatically rewrote active
# buyer links to dead GitHub Pages URLs and force-pushed the result to main.
# Until a real owned replacement is independently verified, audit only.
on:
  pull_request:
    paths:
      - 'public/.well-known/evercraft-payments-buyer-doors.json'
      - 'public/.well-known/evercraft-chum.json'
      - 'scripts/validate-no-legacy-provider-urls.mjs'
      - 'scripts/probe-evercraft-llm-commercial-routing.mjs'
      - '.github/workflows/legacy-provider-purge.yml'
  push:
    branches: [main]
    paths:
      - 'public/.well-known/evercraft-payments-buyer-doors.json'
      - 'public/.well-known/evercraft-chum.json'
      - 'scripts/validate-no-legacy-provider-urls.mjs'
      - 'scripts/probe-evercraft-llm-commercial-routing.mjs'
      - '.github/workflows/legacy-provider-purge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-provider-safe-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buyer-safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no unapproved legacy-provider public URLs
        run: node scripts/validate-no-legacy-provider-urls.mjs
      - name: Enforce scoped and truthfully labeled buyer routes
        run: node --test tests/evercraft-payments-buyer-doors.test.mjs
      - name: Probe 13 selected-offer purchase forms without charging
        run: node scripts/probe-evercraft-llm-commercial-routing.mjs
      - name: Verify no route corruption in submitted diff
        run: git diff --check
