name: Base44 exit and KAIDANCE proof

on:
  pull_request:
    paths:
      - 'systemia/migrations/base44-exit/**'
      - 'systemia/collider/**'
      - 'systemia/organism/eps-social-continuity.mjs'
      - 'systemia/organism/eps-social-continuity.proof.mjs'
      - 'systemia/organism/eps-social-continuity.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/app-runtime/**'
      - 'tests/app-runtime.test.mjs'
      - 'systemia/core/core-gateway.mjs'
      - 'systemia/core/core-client.js'
      - 'systemia/aliev/**'
      - 'systemia/rivet/**'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/rivet-owned-source-runtime.proof.mjs'
      - 'tests/aliev-owned-source-runtime.test.mjs'
      - 'tests/rivet-yard-gateway.test.mjs'
      - 'tests/core-gateway.test.mjs'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/validate-base44-exit.mjs'
      - 'scripts/base44-exit-controller.mjs'
      - 'tests/base44-exit-controller.test.mjs'
      - 'scripts/validate-base44-credit-firewall.mjs'
      - 'scripts/validate-rivet-owned-source-boundary.mjs'
      - '.github/workflows/base44-exit.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/migrations/base44-exit/**'
      - 'systemia/collider/**'
      - 'systemia/organism/eps-social-continuity.mjs'
      - 'systemia/organism/eps-social-continuity.proof.mjs'
      - 'systemia/organism/eps-social-continuity.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/app-runtime/**'
      - 'tests/app-runtime.test.mjs'
      - 'systemia/core/core-gateway.mjs'
      - 'systemia/core/core-client.js'
      - 'systemia/aliev/**'
      - 'systemia/rivet/**'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/rivet-owned-source-runtime.proof.mjs'
      - 'tests/aliev-owned-source-runtime.test.mjs'
      - 'tests/rivet-yard-gateway.test.mjs'
      - 'tests/core-gateway.test.mjs'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/validate-base44-exit.mjs'
      - 'scripts/base44-exit-controller.mjs'
      - 'tests/base44-exit-controller.test.mjs'
      - 'scripts/validate-base44-credit-firewall.mjs'
      - 'scripts/validate-rivet-owned-source-boundary.mjs'
      - '.github/workflows/base44-exit.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Base44 exit policy
        run: node scripts/validate-base44-exit.mjs
      - name: Prove full observed estate coverage
        run: node --test tests/base44-exit-controller.test.mjs
      - name: Validate Base44 integration credit firewall
        run: node scripts/validate-base44-credit-firewall.mjs
      - name: Prove Evercraft Core Gateway
        run: node --test tests/core-gateway.test.mjs
      - name: Prove Evercraft App Runtime
        run: node --test tests/app-runtime.test.mjs
      - name: Validate RIVET owned source boundary
        run: node scripts/validate-rivet-owned-source-boundary.mjs
      - name: Prove owned AliEV source contract
        run: node --test tests/aliev-owned-source-runtime.test.mjs
      - name: Prove RIVET gateway has no legacy source fallback
        run: node tests/rivet-yard-gateway.test.mjs
      - name: Prove RIVET on embedded owned AliEV source
        run: node systemia/yard/rivet-owned-source-runtime.proof.mjs
      - name: Prove KAIDANCE collider
        run: node systemia/collider/proof.mjs
      - name: Prove off-Base44 EPS social continuity
        run: node systemia/organism/eps-social-continuity.proof.mjs
