name: Base44 exit and KAIDANCE proof

on:
  pull_request:
    paths:
      - 'systemia/migrations/base44-exit/**'
      - 'systemia/chum/machine-commerce-owned.mjs'
      - 'systemia/chum/machine-commerce-http.ts'
      - 'systemia/chum/machine-commerce-owned.test.mjs'
      - 'systemia/mcp/specialist-handoff.ts'
      - 'systemia/rewards/**'
      - 'systemia/clip/**'
      - 'systemia/social/**'
      - 'server.ts'
      - 'RUNTIME.md'
      - 'package.json'
      - 'scripts/validate-no-base44-runtime.mjs'
      - 'systemia/collider/**'
      - 'systemia/organism/eps-social-continuity.mjs'
      - 'systemia/organism/eps-social-continuity.proof.mjs'
      - 'systemia/organism/eps-social-continuity.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/validate-base44-exit.mjs'
      - 'scripts/validate-base44-credit-firewall.mjs'
      - '.github/workflows/base44-exit.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/migrations/base44-exit/**'
      - 'systemia/chum/machine-commerce-owned.mjs'
      - 'systemia/chum/machine-commerce-http.ts'
      - 'systemia/chum/machine-commerce-owned.test.mjs'
      - 'systemia/mcp/specialist-handoff.ts'
      - 'systemia/rewards/**'
      - 'systemia/clip/**'
      - 'systemia/social/**'
      - 'server.ts'
      - 'RUNTIME.md'
      - 'package.json'
      - 'scripts/validate-no-base44-runtime.mjs'
      - 'systemia/collider/**'
      - 'systemia/organism/eps-social-continuity.mjs'
      - 'systemia/organism/eps-social-continuity.proof.mjs'
      - 'systemia/organism/eps-social-continuity.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'scripts/validate-base44-exit.mjs'
      - 'scripts/validate-base44-credit-firewall.mjs'
      - '.github/workflows/base44-exit.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Base44 exit policy
        run: node scripts/validate-base44-exit.mjs
      - name: Validate Base44 integration credit firewall
        run: node scripts/validate-base44-credit-firewall.mjs
      - name: Prove live Base44 estate controller
        run: npm run test:base44-exit
      - name: Prove owned Rewards runtime
        run: npm run test:rewards-yard-gateway
      - name: Prove owned Clip public edge
        run: npm run test:clip-yard-gateway
      - name: Prove owned Machine Commerce edge
        run: npm run test:machine-commerce-owned
      - name: Prove owned social provider adapters
        run: npm run test:social-providers
      - name: Prove KAIDANCE collider
        run: node systemia/collider/proof.mjs
      - name: Prove off-Base44 EPS social continuity
        run: node systemia/organism/eps-social-continuity.proof.mjs
