name: Base44 exit and KAIDANCE proof

on:
  pull_request:
    paths:
      - 'tests/machine-commerce-distribution-retirement.test.mjs'
      - 'distribution/machine-commerce-distribution.json'
      - 'scripts/inventory-base44-runtime-debt.mjs'
      - 'public/.well-known/evercraft-direct-door-readiness.json'
      - 'tests/final-base44-routing-cuts.test.mjs'
      - 'tests/direct-door-readiness.test.mjs'
      - '.github/workflows/ci.yml'
      - 'systemia/yard/public-edge-activator.mjs'
      - 'tests/owned-canary-cutover.test.mjs'
      - '.github/workflows/network-mcp-canary.yml'
      - '.github/workflows/customer-gauntlet.yml'
      - 'systemia/customer-gauntlet/runner.mjs'
      - 'systemia/network/public-mcp-canary.mjs'
      - '.github/workflows/chum-llm-hunter.yml'
      - 'scripts/portfolio-sentinel-commercial-canary.mjs'
      - 'systemia/organism/portfolio-sentinel-runner.mjs'
      - '.github/workflows/systemia-portfolio-sentinel.yml'
      - 'server.ts'
      - 'systemia/migrations/base44-exit/**'
      - 'systemia/people/**'
      - 'src/PeopleLayer.tsx'
      - 'tests/people-owned-runtime.test.mjs'
      - 'systemia/collider/**'
      - 'systemia/organism/eps-social-continuity.mjs'
      - 'systemia/organism/eps-social-continuity.proof.mjs'
      - 'systemia/organism/eps-social-continuity.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'systemia/clip/**'
      - 'systemia/newsroom/**'
      - 'systemia/autonomy/github-revenue-heartbeat.mjs'
      - 'scripts/validate-base44-exit.mjs'
      - 'scripts/validate-base44-credit-firewall.mjs'
      - 'scripts/validate-no-base44-hotpath.mjs'
      - 'scripts/validate-owned-execution-ratchet.mjs'
      - 'distribution/direct-plugin-specs.json'
      - 'public/.well-known/evercraft-products.json'
      - 'registry/catalog.json'
      - 'systemia/chum/**'
      - 'systemia/compute/eps-social-yard-canary.mjs'
      - '.github/workflows/eps-social-yard-canary.yml'
      - '.github/workflows/evercraft-mcp-canary.yml'
      - '.github/workflows/clip-native-facebook-page-publisher.yml'
      - '.github/workflows/evercraft-journal-pages.yml'
      - '.github/workflows/evercraft-journal-owned.yml'
      - '.github/workflows/revenue-autonomy-heartbeat.yml'
      - '.github/workflows/base44-exit.yml'
  push:
    branches:
      - main
    paths:
      - 'tests/machine-commerce-distribution-retirement.test.mjs'
      - 'distribution/machine-commerce-distribution.json'
      - 'scripts/inventory-base44-runtime-debt.mjs'
      - 'public/.well-known/evercraft-direct-door-readiness.json'
      - 'tests/final-base44-routing-cuts.test.mjs'
      - 'tests/direct-door-readiness.test.mjs'
      - '.github/workflows/ci.yml'
      - 'systemia/yard/public-edge-activator.mjs'
      - 'tests/owned-canary-cutover.test.mjs'
      - '.github/workflows/network-mcp-canary.yml'
      - '.github/workflows/customer-gauntlet.yml'
      - 'systemia/customer-gauntlet/runner.mjs'
      - 'systemia/network/public-mcp-canary.mjs'
      - '.github/workflows/chum-llm-hunter.yml'
      - 'scripts/portfolio-sentinel-commercial-canary.mjs'
      - 'systemia/organism/portfolio-sentinel-runner.mjs'
      - '.github/workflows/systemia-portfolio-sentinel.yml'
      - 'server.ts'
      - 'systemia/migrations/base44-exit/**'
      - 'systemia/people/**'
      - 'src/PeopleLayer.tsx'
      - 'tests/people-owned-runtime.test.mjs'
      - 'systemia/collider/**'
      - 'systemia/organism/eps-social-continuity.mjs'
      - 'systemia/organism/eps-social-continuity.proof.mjs'
      - 'systemia/organism/eps-social-continuity.workflow.json'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'systemia/clip/**'
      - 'systemia/newsroom/**'
      - 'systemia/autonomy/github-revenue-heartbeat.mjs'
      - 'scripts/validate-base44-exit.mjs'
      - 'scripts/validate-base44-credit-firewall.mjs'
      - 'scripts/validate-no-base44-hotpath.mjs'
      - 'scripts/validate-owned-execution-ratchet.mjs'
      - 'systemia/chum/**'
      - 'systemia/compute/eps-social-yard-canary.mjs'
      - '.github/workflows/eps-social-yard-canary.yml'
      - '.github/workflows/evercraft-mcp-canary.yml'
      - '.github/workflows/clip-native-facebook-page-publisher.yml'
      - '.github/workflows/evercraft-journal-pages.yml'
      - '.github/workflows/evercraft-journal-owned.yml'
      - '.github/workflows/revenue-autonomy-heartbeat.yml'
      - '.github/workflows/base44-exit.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Base44 exit policy
        run: node scripts/validate-base44-exit.mjs
      - name: Validate Base44 integration credit firewall
        run: node scripts/validate-base44-credit-firewall.mjs
      - name: Validate owned execution ratchet
        run: node scripts/validate-owned-execution-ratchet.mjs
      - name: Prove Forensic Record owned migration adapter
        run: node systemia/migrations/base44-exit/forensic-record-domain-adapter.proof.mjs
      - name: Prove Forensic Record resumable migration
        run: node systemia/migrations/base44-exit/forensic-record-stream-migrator.proof.mjs
      - name: Prove Forensic Record reconciliation hardening
        run: node systemia/migrations/base44-exit/forensic-record-reconciliation-hardening.proof.mjs
      - name: Prove Forensic Record owned corpus runtime
        run: node systemia/forensic-record/owned-corpus.proof.mjs
      - name: Prove Forensic Record on Yard / Evercraft Compute
        run: node systemia/yard/forensic-record-resident-runtime.proof.mjs
      - name: Prove owned People Layer sovereignty lifecycle
        run: node --test tests/people-owned-runtime.test.mjs
      - name: Enforce zero Base44 active hot paths
        run: node scripts/validate-no-base44-hotpath.mjs
      - name: Prove owned-only CHUM IndexNow routing
        run: node --test systemia/chum/indexnow-owned-routing.test.mjs
      - name: Prove owned canary cutover boundaries
        run: node --test tests/owned-canary-cutover.test.mjs
      - name: Prove direct-door held routing ledger
        run: node tests/direct-door-readiness.test.mjs
      - name: Prove final Base44 routing cuts
        run: node --test tests/final-base44-routing-cuts.test.mjs
      - name: Prove retired Machine Commerce public distribution
        run: node --test tests/machine-commerce-distribution-retirement.test.mjs
      - name: Prove owned server routing cutover
        run: node --test tests/server-owned-routing-cutover.test.mjs
      - name: Prove KAIDANCE collider
        run: node systemia/collider/proof.mjs
      - name: Prove off-Base44 EPS social continuity
        run: node systemia/organism/eps-social-continuity.proof.mjs
