name: Raven Private Runtime Compute

on:
  pull_request:
    paths:
      - "systemia/raven/**"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/compute/raven-private-runtime.proof.mjs"
      - "evercraft.compute.json"
      - ".github/workflows/raven-private-runtime-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-raven-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Compute runtime
        run: node --check systemia/compute/runtime-node.mjs
      - name: Prove Raven core
        run: node systemia/raven/private-runtime.proof.mjs
      - name: Prove Raven on Evercraft Compute
        run: node systemia/compute/raven-private-runtime.proof.mjs
