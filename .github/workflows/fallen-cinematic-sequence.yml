name: Fallen Cinematic Sequence

on:
  pull_request:
    paths:
      - 'systemia/media-studio/cinematic-sequence.ts'
      - 'systemia/media-studio/cinematic-sequence.test.ts'
      - 'systemia/media-studio/cli.ts'
      - 'systemia/media-studio/README.md'
      - '.github/workflows/fallen-cinematic-sequence.yml'
  workflow_dispatch:

jobs:
  cinematic-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test systemia/media-studio/cinematic-sequence.test.ts
