name: RIVET Hosting Migration Planning Gate

on:
  pull_request:
    paths:
      - 'governance/rivet-hosting-migration/**'
      - 'systemia/migrations/rivet-hosting/**'
      - 'tests/rivet-hosting-migration-fidelity.test.mjs'
      - '.github/workflows/rivet-hosting-migration-planning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-only-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove approved RIVET brand baseline is untouched
        run: node tests/rivet-brand.test.mjs
      - name: Prove hosting migration audit is read-only and drift-sensitive
        run: node --test tests/rivet-hosting-migration-fidelity.test.mjs
      - name: Emit local migration baseline receipt
        run: |
          mkdir -p artifacts
          node systemia/migrations/rivet-hosting/brand-fidelity-audit.mjs > artifacts/rivet-hosting-local-baseline.json
      - name: Run Saban adversarial hosting review
        run: node systemia/saban/multiplier.mjs --software rivet-hosting-review --registry governance/rivet-hosting-migration/saban-registry.json --agents 45 --workers 5 --execute --reconcile --state artifacts/rivet-hosting-saban-state.json
      - name: Assert Saban kept the review non-authoritative
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/saban-multiplier/rivet-hosting-review-latest.json','utf8'));
          if(p.reconciliation?.production_mutation!==false) throw new Error('Saban review gained production mutation authority');
          if(p.reconciliation?.migration_authority_granted!==false) throw new Error('Saban review gained migration authority');
          if(p.reconciliation?.production_lane_selected!==false) throw new Error('Saban selected a production lane without partners');
          const options=p.reconciliation?.options||[];
          if(options.length!==5) throw new Error('Saban did not review all hosting options');
          if(options.some(o=>o.roles.length!==9)) throw new Error('Saban did not apply all nine review roles to every option');
          NODE
      - name: Upload planning receipts
        uses: actions/upload-artifact@v4
        with:
          name: rivet-hosting-migration-planning-receipts
          path: |
            artifacts/rivet-hosting-local-baseline.json
            artifacts/saban-multiplier/rivet-hosting-review-latest.json
          if-no-files-found: error
          retention-days: 90
