name: InternalOps owned snapshot ingress

on:
  pull_request:
    paths:
      - 'systemia/internalops/**'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'tests/fabric-local-runtime.test.mjs'
      - 'systemia/migrations/base44-exit/estate-snapshot.json'
      - 'systemia/migrations/base44-exit/slices/evercraft-internalops-snapshot-ingress.json'
      - '.github/workflows/internalops-owned-ingress.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/internalops/**'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'tests/fabric-local-runtime.test.mjs'
      - 'systemia/migrations/base44-exit/estate-snapshot.json'
      - 'systemia/migrations/base44-exit/slices/evercraft-internalops-snapshot-ingress.json'
      - '.github/workflows/internalops-owned-ingress.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove owned InternalOps snapshot ingress
        run: node systemia/internalops/snapshot-ingress.proof.mjs
      - name: Prove Fabric integration
        run: node --test tests/fabric-local-runtime.test.mjs
      - name: Validate Base44 exit policy
        run: node scripts/validate-base44-exit.mjs
