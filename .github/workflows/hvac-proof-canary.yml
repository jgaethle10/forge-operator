name: HVAC lead recovery proof canary

on:
  push:
    branches: [main]
    paths:
      - 'public/demos/hvac-lead-recovery/**'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - '.github/workflows/hvac-proof-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify live demo after owned-edge convergence
        shell: bash
        run: |
          set -euo pipefail
          url="https://fabric.systemiacommandcenters.com/demos/hvac-lead-recovery/"

          verify_live() {
            local file="$1"
            grep -q 'Evercraft HVAC Lead Recovery Demo' "$file" &&
            grep -q 'Turn this into a ready-to-work lead' "$file" &&
            grep -q 'Use your own numbers' "$file" &&
            grep -q 'Map this to my workflow' "$file" &&
            grep -q 'overflow-x:hidden' "$file" &&
            grep -q 'grid-template-columns:minmax(0,1fr)' "$file" &&
            grep -q 'viewport-fit=cover' "$file" &&
            node - "$file" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const html=fs.readFileSync(file,'utf8');
          const closing=(html.match(/<\/html>/gi)||[]).length;
          if(closing!==1) process.exit(2);
          const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if(!scripts.length) process.exit(3);
          for(const match of scripts) new Function(match[1]);
          NODE
          }

          ready=false
          for attempt in $(seq 1 72); do
            if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/hvac-proof.html; then
              if verify_live /tmp/hvac-proof.html; then
                ready=true
                echo "Live proof converged on attempt $attempt."
                break
              fi
            fi
            echo "Attempt $attempt: owned edge has not converged to the verified proof yet."
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            echo "Owned edge did not converge to the current verified HVAC proof within the canary window." >&2
            exit 1
          fi

          {
            echo "## HVAC lead recovery proof is live"
            echo
            echo "URL: $url"
            echo "Verified: interactive flow + editable economics + conversion CTA + mobile containment + inline-script syntax"
            echo "Owned origin: fabric.systemiacommandcenters.com"
          } >> "$GITHUB_STEP_SUMMARY"
