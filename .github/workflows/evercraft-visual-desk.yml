name: Evercraft Visual Desk

on:
  pull_request:
    paths:
      - 'systemia/visual-desk/**'
      - 'systemia/graphics-command/**'
      - 'systemia/media-studio/visual-stage.ts'
      - 'systemia/media-studio/visual-stage-html.ts'
      - 'systemia/media-studio/world-intel-stage.ts'
      - 'systemia/media-studio/world-map.ts'
      - 'systemia/media-studio/visual-theme.ts'
      - 'systemia/radar/core.mjs'
      - 'systemia/radar/collectors.mjs'
      - 'systemia/radar/resident.mjs'
      - 'systemia/radar/http.mjs'
      - 'public/visuals/**'
      - '.github/workflows/evercraft-visual-desk.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/visual-desk/**'
      - 'systemia/graphics-command/**'
      - 'systemia/media-studio/visual-stage.ts'
      - 'systemia/media-studio/visual-stage-html.ts'
      - 'systemia/media-studio/world-intel-stage.ts'
      - 'systemia/media-studio/world-map.ts'
      - 'systemia/media-studio/visual-theme.ts'
      - 'public/visuals/**'
      - '.github/workflows/evercraft-visual-desk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-desk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify governed cached USGS Washington shaded relief
        shell: bash
        run: |
          set -euo pipefail
          asset="systemia/graphics-command/assets/washington-usgs-shaded-relief.png"
          receipt="systemia/graphics-command/assets/washington-usgs-shaded-relief.receipt.json"
          test -s "$asset"
          test -s "$receipt"
          expected="$(node -p "JSON.parse(require('fs').readFileSync('$receipt','utf8')).sha256")"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$receipt','utf8')).rightsState")" = "public_domain"
          node -e "const fs=require('fs');const b=fs.readFileSync('$asset');const p=Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);if(!b.subarray(0,8).equals(p))process.exit(9)"

      - name: Prove visual story factory and Radar admission bridge
        run: node --test systemia/graphics-command/director.test.mjs systemia/graphics-command/poster-renderer.test.mjs systemia/graphics-command/shot-tournament.test.mjs systemia/graphics-command/commercial-renderer.test.mjs systemia/graphics-command/production-mesh.test.mjs systemia/graphics-command/production-capability-audit.test.mjs systemia/visual-desk/factory.test.mjs systemia/visual-desk/radar-adapter.test.mjs systemia/visual-desk/transporter.test.mjs

      - name: Prove Graphics Command handoff compiles through Fallen
        run: |
          npm install --no-audit --no-fund
          node --import tsx --test systemia/media-studio/visual-stage.test.ts systemia/media-studio/world-intel-stage.test.ts systemia/graphics-command/fallen-bridge.test.ts systemia/media-studio/toon-shot-handoff.test.ts

      - name: Prove Radar remains healthy after spatial projection
        run: npm run test:radar

      - name: Build source-backed specimen release
        run: |
          rm -rf _visual_desk_release
          mkdir -p _visual_desk_release
          cp public/visuals/index.html _visual_desk_release/index.html
          node systemia/visual-desk/build-all.mjs systemia/visual-desk/stories _visual_desk_release https://fabric.systemiacommandcenters.com/visuals
          node systemia/graphics-command/build-commercial.mjs --campaign systemia/graphics-command/campaigns/website-audit-attention.json --output _visual_desk_release --origin https://fabric.systemiacommandcenters.com/visuals
          test -f _visual_desk_release/index.html
          test -f _visual_desk_release/index.json
          test -f _visual_desk_release/washington-active-volcanoes/card-feed.svg
          test -f _visual_desk_release/washington-active-volcanoes/card-square.svg
          test -f _visual_desk_release/washington-active-volcanoes/card-story.svg
          test -f _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          test -f _visual_desk_release/washington-active-volcanoes/poster-square.svg
          test -f _visual_desk_release/washington-active-volcanoes/poster-story.svg
          test -f _visual_desk_release/washington-active-volcanoes/poster-feed.html
          test -f _visual_desk_release/washington-active-volcanoes/poster-story.html
          test -f _visual_desk_release/washington-active-volcanoes/graphics-plan.json
          test -f _visual_desk_release/washington-active-volcanoes/scroll-stop-report.json
          test -f _visual_desk_release/washington-active-volcanoes/poster-quality-report.json
          test -f _visual_desk_release/washington-active-volcanoes/shot-tournament.json
          test -f _visual_desk_release/washington-active-volcanoes/shot-terrain-hero-feed.svg
          test -f _visual_desk_release/washington-active-volcanoes/shot-terrain-hero-feed.html
          test -f _visual_desk_release/washington-active-volcanoes/shot-balanced-relief-feed.svg
          test -f _visual_desk_release/washington-active-volcanoes/shot-balanced-relief-feed.html
          test -f _visual_desk_release/washington-active-volcanoes/shot-cascade-signal-feed.svg
          test -f _visual_desk_release/washington-active-volcanoes/shot-cascade-signal-feed.html
          test -f _visual_desk_release/washington-active-volcanoes/fallen-stage-input.json
          test -f _visual_desk_release/washington-active-volcanoes/terrain-relief.png
          test -f _visual_desk_release/washington-active-volcanoes/motion.html
          test -f _visual_desk_release/website-audit-attention/poster-feed.svg
          test -f _visual_desk_release/website-audit-attention/poster-square.svg
          test -f _visual_desk_release/website-audit-attention/poster-story.svg
          test -f _visual_desk_release/website-audit-attention/poster-hero-wide.svg
          test -f _visual_desk_release/website-audit-attention/motion.html
          test -f _visual_desk_release/website-audit-attention/creative-council-reconciliation.json
          test -f _visual_desk_release/website-audit-attention/commercial-build-receipt.json
          test -f _visual_desk_release/website-audit-attention/production-jobpack.json
          test -f _visual_desk_release/website-audit-attention/production-mesh-receipt.json
          test -f _visual_desk_release/website-audit-attention/production-capability-audit.json
          grep -q '"status": "inventoried_runtime_unverified"' _visual_desk_release/website-audit-attention/production-capability-audit.json
          grep -q '"customerReady": false' _visual_desk_release/website-audit-attention/production-mesh-receipt.json
          grep -q '"status": "preproduction_verified_downstream_blocked"' _visual_desk_release/website-audit-attention/production-mesh-receipt.json
          grep -q '__evercraftRenderAt' _visual_desk_release/washington-active-volcanoes/motion.html
          grep -q '__evercraftRenderAt' _visual_desk_release/website-audit-attention/motion.html
          grep -q 'TRAFFIC UP' _visual_desk_release/website-audit-attention/poster-feed.svg
          grep -q '"status": "reconciled"' _visual_desk_release/website-audit-attention/creative-council-reconciliation.json
          grep -q '"scrollStopStatus": "pass"' _visual_desk_release/website-audit-attention/commercial-build-receipt.json
          grep -q '5 ACTIVE VOLCANOES' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'class="geo-boundary"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'data-visual-model="cinematic-terrain-geography-v3"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'class="terrain-relief"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'href="data:image/png;base64,' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'data-source-sha256="0f04cbf36461720b71e72809fa10e831bd77ca0701be09d81732fe20d7a35632"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'class="peak-marker"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          ! grep -q 'class="peak-halo"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'max-height:calc(100svh - 58px)' _visual_desk_release/washington-active-volcanoes/poster-story.html
          grep -q 'evercraft.visual-story.motion-stage.v2' _visual_desk_release/washington-active-volcanoes/motion.html
          grep -q '"boundaryLicense": "CC0-1.0"' _visual_desk_release/washington-active-volcanoes/graphics-plan.json
          grep -q '"id": "usgs-wa-shaded-relief-3dep-v1"' _visual_desk_release/washington-active-volcanoes/graphics-plan.json
          grep -q '"rightsState": "public_domain"' _visual_desk_release/washington-active-volcanoes/graphics-plan.json
          grep -q 'USGSShadedReliefOnly' _visual_desk_release/washington-active-volcanoes/graphics-plan.json
          grep -q '"status": "pass"' _visual_desk_release/washington-active-volcanoes/scroll-stop-report.json
          grep -q '"status": "pass"' _visual_desk_release/washington-active-volcanoes/poster-quality-report.json
          grep -q '"schema": "evercraft.graphics-command.shot-tournament.v1"' _visual_desk_release/washington-active-volcanoes/shot-tournament.json
          grep -q '"winnerId": "terrain-hero"' _visual_desk_release/washington-active-volcanoes/shot-tournament.json
          grep -q 'data-shot-strategy="terrain-hero"' _visual_desk_release/washington-active-volcanoes/poster-feed.svg
          grep -q 'href="./terrain-relief.png"' _visual_desk_release/washington-active-volcanoes/shot-terrain-hero-feed.svg
          grep -q 'shot-terrain-hero-feed.svg' _visual_desk_release/washington-active-volcanoes/shot-terrain-hero-feed.html
          grep -q '4:5 review surface' _visual_desk_release/washington-active-volcanoes/shot-terrain-hero-feed.html
          grep -q '"labelsNonOverlapping": true' _visual_desk_release/washington-active-volcanoes/poster-quality-report.json
          grep -q '"labelsClearOfOtherMarkers": true' _visual_desk_release/washington-active-volcanoes/poster-quality-report.json
          grep -q '"aspectRatio": "9:16"' _visual_desk_release/washington-active-volcanoes/fallen-stage-input.json
          grep -q 'usgs.gov' _visual_desk_release/washington-active-volcanoes/story.json

      - name: Preserve portable Visual Desk release
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-visual-desk-portable
          path: _visual_desk_release
          if-no-files-found: error
          retention-days: 90

      - name: Verify public landing surface
        run: |
          test -f public/visuals/index.html
          grep -q 'Evercraft Visual Desk' public/visuals/index.html
          grep -q 'physical world' public/visuals/index.html

      - name: Preserve publication boundary
        run: |
          grep -q "publicationAuthority:false" systemia/visual-desk/factory.mjs
          grep -q "visual_story_sources_missing" systemia/visual-desk/factory.mjs

