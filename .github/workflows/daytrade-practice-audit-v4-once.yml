name: DayTrade Practice Audit V4 Once

on:
  push:
    branches:
      - "systemia/daytrade-practice-audit-2026-10-06-v4"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove independent-window selector
        run: node systemia/daytrade-lens/edge-practice-independence.test.mjs
      - name: Prove ledger integrity
        run: node systemia/daytrade-lens/edge-practice-ledger-integrity.test.mjs
      - name: Run ledger integrity
        env:
          DAYTRADE_LEDGER_INTEGRITY_OUTPUT: artifacts/daytrade-edge/practice-ledger-integrity-v4.json
        run: node systemia/daytrade-lens/edge-practice-ledger-integrity.mjs
      - name: Prove practice scorecard
        run: node systemia/daytrade-lens/edge-practice-scorecard.test.mjs
      - name: Build practice scorecard
        env:
          DAYTRADE_PRACTICE_SCORECARD_OUTPUT: artifacts/daytrade-edge/practice-scorecard-v4.json
        run: node systemia/daytrade-lens/edge-practice-scorecard.mjs
      - name: Prove phase scorecard
        run: node systemia/daytrade-lens/edge-practice-phase-scorecard.test.mjs
      - name: Build phase scorecard
        env:
          DAYTRADE_PHASE_SCORECARD_OUTPUT: artifacts/daytrade-edge/practice-phase-scorecard-v4.json
        run: node systemia/daytrade-lens/edge-practice-phase-scorecard.mjs
      - name: Prove diversity gate
        run: node systemia/daytrade-lens/edge-practice-diversity-readiness.test.mjs
      - name: Build diversity readiness
        env:
          DAYTRADE_DIVERSITY_OUTPUT: artifacts/daytrade-edge/practice-diversity-v4.json
        run: node systemia/daytrade-lens/edge-practice-diversity-readiness.mjs
      - name: Prove threshold robustness
        run: node systemia/daytrade-lens/edge-spread-threshold-robustness.test.mjs
      - name: Build threshold robustness
        env:
          DAYTRADE_THRESHOLD_ROBUSTNESS_OUTPUT: artifacts/daytrade-edge/spread-threshold-robustness-v4.json
        run: node systemia/daytrade-lens/edge-spread-threshold-robustness.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-practice-audit-v4-${{ github.run_id }}
          path: artifacts/daytrade-edge/*.json
          if-no-files-found: warn
          retention-days: 30
