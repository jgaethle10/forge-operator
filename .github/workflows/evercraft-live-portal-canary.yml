name: Evercraft LIVE real-work public canary
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: evercraft-live-portal-public-canary
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify hosted real-work portal and five existing public artifacts
        shell: bash
        env:
          BASE: https://jgaethle10.github.io/forge-operator
        run: |
          set -euo pipefail
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT
          curl -L --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 20 "$BASE/live/" -o "$temp"
          grep -Fq 'Evercraft LIVE | Watch the Work' "$temp"
          grep -Fq 'ACTUAL PUBLIC BUILDS · NOT LIVE TELEMETRY' "$temp"
          grep -Fq 'sandbox="allow-scripts"' "$temp"
          grep -Fq 'id="filmExit"' "$temp"
          grep -Fq 'id="portrait"' "$temp"
          grep -Fq 'data-exhibit="earth"' "$temp"
          grep -Fq 'data-exhibit="volcano"' "$temp"
          grep -Fq 'data-exhibit="estimate"' "$temp"
          grep -Fq 'data-exhibit="hvac"' "$temp"
          grep -Fq 'data-exhibit="yard2"' "$temp"
          if grep -Eq 'drive\.google\.com|docs\.google\.com|base44\.app' "$temp"; then
            echo "Unexpected private or legacy URL on public page"; exit 1
          fi
          # Source-backed motion page is generated by the existing Visual Desk publisher.
          check_artifact() {
            local path="$1" marker="$2"
            curl -L --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 20 "$BASE/$path" -o "$temp"
            grep -Fq "$marker" "$temp"
            echo "PASS $path"
          }
          check_artifact 'demos/earthworks-autonomy/?studio=1' 'studioCamera'
          check_artifact 'visuals/washington-active-volcanoes/motion.html' 'WASHINGTON'
          check_artifact 'apps/eps-estimator/' 'EPS Precise Estimator'
          check_artifact 'demos/hvac-lead-recovery/' 'Evercraft HVAC Lead Recovery Demo'
          check_artifact 'apps/earthworks-autonomy/' 'Evercraft EarthWorks Autonomy'
          {
            echo '## Evercraft public real-work portal'
            echo "Verified: $BASE/live/"
            echo 'Five first-party public artifacts independently fetched.'
            echo 'Recording availability, not streaming uptime or active production telemetry.'
            echo "Observed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
