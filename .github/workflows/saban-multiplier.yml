name: Saban multiplier proof

on:
  pull_request:
    paths:
      - "systemia/saban/**"
      - "systemia/chum/saban-adapter.mjs"
      - "systemia/forensiscope/**"
      - "systemia/compute/**"
      - "systemia/network/saban-**"
      - "package.json"
      - ".github/workflows/saban-multiplier.yml"
  push:
    branches:
      - "main"
      - "systemia/saban-software-multiplier-v1"
    paths:
      - "systemia/saban/**"
      - "systemia/chum/saban-adapter.mjs"
      - "systemia/forensiscope/**"
      - "systemia/compute/**"
      - "systemia/network/saban-**"
      - "package.json"
      - ".github/workflows/saban-multiplier.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure ForensiScope media runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate multiplication contracts
        run: npm run check:saban-contracts

      - name: Prove kernel recovery and sharding
        run: npm run proof:saban-kernel

      - name: Execute bounded CHUM swarm
        run: npm run proof:saban-chum

      - name: Execute synthetic media fanout
        run: npm run proof:saban-media

      - name: Execute mixed software formation
        run: npm run proof:saban-formation

      - name: Prove concurrent formation waves
        run: npm run proof:saban-formation-waves

      - name: Execute registered Saban assignment on NodeSeed
        run: npm run proof:saban-nodeseed-multiplier

      - name: Prove active NodeSeed pool failover
        run: npm run proof:saban-nodeseed-pool

      - name: Prove privacy-safe portfolio archaeology
        run: npm run proof:saban-portfolio-archaeology

      - name: Prove distributed ForensiScope media execution
        run: npm run proof:forensiscope-distributed

      - name: Plan full CHUM formation
        run: npm run saban:chum:10000

      - name: Upload Saban proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saban-multiplier-proof
          path: artifacts/saban-multiplier/**
          if-no-files-found: warn
