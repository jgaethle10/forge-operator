name: AIW state-first national experience
on:
  pull_request:
    paths:
      - 'research/infrastructure-watch/engineering/aiw_state_geometry.py'
      - 'research/infrastructure-watch/engineering/aiw_state_first_gateway.py'
      - 'research/infrastructure-watch/operator/aiw-state-first-private.html'
      - 'research/infrastructure-watch/operator/aiw-state-first-nextgen.sh'
      - 'research/infrastructure-watch/tests/test_aiw_state_first.py'
      - '.github/workflows/aiw-state-first.yml'
permissions:
  contents: read
jobs:
  state-first-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate operator staging shell
        run: bash -n research/infrastructure-watch/operator/aiw-state-first-nextgen.sh
      - name: Validate exact browser JavaScript inside private HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('research/infrastructure-watch/operator/aiw-state-first-private.html').read_text()
          snippets=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(snippets)==1, 'Expected exactly one own inline UI controller'
          Path('/tmp/aiw-state-first-ui.js').write_text(snippets[0])
          PY
          node --check /tmp/aiw-state-first-ui.js
      - name: Validate cartographic boundaries and dated data contracts
        run: |
          python3 -m unittest discover -s research/infrastructure-watch/tests -p test_aiw_state_first.py -v
