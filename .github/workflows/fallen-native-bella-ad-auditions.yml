name: Fallen Native Bella Ad Audition (Private)
on:
  push:
    branches:
      - production/fallen-exotic-bella-audition-20261123
    paths:
      - 'systemia/media-studio/voice-foundry/exotic_chiles_bella_auditions.py'
      - '.github/workflows/fallen-native-bella-ad-auditions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bella-audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate only public advertising text
        run: python systemia/media-studio/voice-foundry/exotic_chiles_bella_auditions.py --verify-only
      - name: Install original Kokoro Voice 5 environment (as previously proven on Relay)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Generate native af_bella auditions, no client media
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python systemia/media-studio/voice-foundry/exotic_chiles_bella_auditions.py private-bella-auditions
      - name: Verify real waveform hashes and native identity receipt
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,soundfile as sf
          root=pathlib.Path('private-bella-auditions')
          report=json.loads((root/'evidence.json').read_text())
          assert report['voiceId']=='af_bella'
          assert len(report['auditions'])==6
          assert report['humanListeningApproved'] is False
          for x in report['auditions']:
              p=root/x['filename']
              assert p.read_bytes()[:4]==b'RIFF'
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
              assert sf.info(p).samplerate==24000
          print('6 native Bella audition WAVs hash verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exotic-chiles-native-bella-auditions-review-only
          path: private-bella-auditions/
          retention-days: 3
          if-no-files-found: error
