name: Snake River research evidence checks
on:
  pull_request:
    paths:
      - 'research/lower-snake-river-dams/**'
      - '.github/workflows/snake-river-evidence-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research dataset and standalone explorer
        run: node --test research/lower-snake-river-dams/scenario-proof.test.mjs
