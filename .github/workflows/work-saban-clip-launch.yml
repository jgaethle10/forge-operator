name: Work Saban Clip launch and mobile first fold
on:
  pull_request:
    paths:
      - 'distribution/marketing/work-saban-20261030.review.json'
      - 'distribution/marketing/work-saban-clip-launch-20261030.md'
      - 'public/work-saban/index.html'
      - 'tests/work-saban-clip-launch.test.mjs'
      - '.github/workflows/work-saban-clip-launch.yml'
  push:
    branches: [main]
    paths:
      - 'distribution/marketing/work-saban-20261030.review.json'
      - 'distribution/marketing/work-saban-clip-launch-20261030.md'
      - 'public/work-saban/index.html'
      - 'tests/work-saban-clip-launch.test.mjs'
      - '.github/workflows/work-saban-clip-launch.yml'
permissions:
  contents: read
jobs:
  clip-source-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert Clip source, publishing boundaries and mobile customer action
        run: node --test tests/work-saban-clip-launch.test.mjs tests/work-saban-flow-brand.test.mjs tests/work-saban-launch-system.test.mjs
      - name: Publication status truth
        run: |
          echo 'Evercraft Clip launch entries are source-prepared but no social platform posts are proven.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Account-specific issuer authorization, first-party publisher adapter and provider post/comment receipts remain required.' >> "$GITHUB_STEP_SUMMARY"
