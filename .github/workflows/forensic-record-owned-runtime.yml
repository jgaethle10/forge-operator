name: Files Companion owned runtime

on:
  pull_request:
    paths:
      - 'systemia/forensic-record/**'
      - 'systemia/migrations/base44-exit/forensic-record-**'
      - 'systemia/migrations/base44-exit/slices/forensic-record-runtime.json'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/yard/forensic-record-resident-runtime.proof.mjs'
      - 'systemia/yard/forensic-record-seeded-runtime.proof.mjs'
      - 'systemia/yard/forensic-record-public-runtime.proof.mjs'
      - 'systemia/yard/forensic-record-public-edge-controller.mjs'
      - 'systemia/forensic-record/public-runtime.mjs'
      - 'systemia/forensic-record/public-runtime.proof.mjs'
      - 'systemia/organism/forensic-record-**'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'systemia/core/forensic-record-resident-wiring.proof.mjs'
      - 'evercraft.compute.json'
      - '.github/workflows/forensic-record-owned-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/forensic-record/**'
      - 'systemia/migrations/base44-exit/forensic-record-**'
      - 'systemia/migrations/base44-exit/slices/forensic-record-runtime.json'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/yard/forensic-record-resident-runtime.proof.mjs'
      - 'systemia/yard/forensic-record-seeded-runtime.proof.mjs'
      - 'systemia/yard/forensic-record-public-runtime.proof.mjs'
      - 'systemia/yard/forensic-record-public-edge-controller.mjs'
      - 'systemia/forensic-record/public-runtime.mjs'
      - 'systemia/forensic-record/public-runtime.proof.mjs'
      - 'systemia/organism/forensic-record-**'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'systemia/core/forensic-record-resident-wiring.proof.mjs'
      - 'evercraft.compute.json'
      - '.github/workflows/forensic-record-owned-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove legacy-domain adapter
        run: node systemia/migrations/base44-exit/forensic-record-domain-adapter.proof.mjs
      - name: Prove resumable hashed migration
        run: node systemia/migrations/base44-exit/forensic-record-stream-migrator.proof.mjs
      - name: Prove reconciliation hardening
        run: node systemia/migrations/base44-exit/forensic-record-reconciliation-hardening.proof.mjs
      - name: Prove owned content-addressed corpus
        run: node systemia/forensic-record/owned-corpus.proof.mjs
      - name: Prove public read-only projection
        run: node systemia/forensic-record/public-runtime.proof.mjs
      - name: Prove Yard / Evercraft Compute resident runtime
        run: node systemia/yard/forensic-record-resident-runtime.proof.mjs
      - name: Prove seeded resident runtime does not keep legacy source hot
        run: node systemia/yard/forensic-record-seeded-runtime.proof.mjs
      - name: Prove public read-only workload through Yard
        run: node systemia/yard/forensic-record-public-runtime.proof.mjs
      - name: Prove public staging Systemia wiring
        run: node systemia/core/forensic-record-public-staging-wiring.proof.mjs
      - name: Prove Systemia resident supervision
        run: node systemia/core/forensic-record-resident-wiring.proof.mjs
