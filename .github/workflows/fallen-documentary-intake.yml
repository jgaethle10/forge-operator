name: Fallen Documentary Intake Proof
on:
  pull_request:
    paths:
      - 'systemia/media-studio/documentary-intake.mjs'
      - 'systemia/media-studio/documentary-intake.test.mjs'
      - 'systemia/media-studio/DOCUMENTARY-PILOT.md'
      - 'systemia/forensiscope/authorized-source.mjs'
      - '.github/workflows/fallen-documentary-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-first-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision and check FFmpeg + FFprobe on ephemeral runner
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Check encoded synthetic fixture and fail-closed documentary intake rules
        run: node --test systemia/media-studio/documentary-intake.test.mjs
