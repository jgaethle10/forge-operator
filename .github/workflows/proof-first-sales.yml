name: Systemia proof-first sales

on:
  push:
    branches: [main]
    paths:
      - 'systemia/proof-first-sales/**'
      - 'systemia/operator-gates/**'
      - '.github/workflows/proof-first-sales.yml'
  pull_request:
    paths:
      - 'systemia/proof-first-sales/**'
      - 'systemia/operator-gates/**'
      - '.github/workflows/proof-first-sales.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove pain-to-proof-to-contact gates
        run: |
          node --test systemia/operator-gates/*.test.mjs
          node --test systemia/proof-first-sales/*.test.mjs
