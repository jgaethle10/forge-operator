name: DayTrade 2026-10-07 Closing A

on:
  push:
    branches:
      - "systemia/daytrade-practice-2026-10-07-closing-a"

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for closing phase and run frozen rule
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
        run: node systemia/daytrade-lens/run-closing-a-2026-10-07.mjs
      - name: Upload closing practice receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-2026-10-07-closing-a-${{ github.run_id }}
          path: artifacts/daytrade-edge/prospective-spread-rule-practice-2026-10-07-closing-a.json
          if-no-files-found: error
          retention-days: 30
