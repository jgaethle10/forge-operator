name: CHUM watershed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "systemia/chum/**"
      - "chum-probes/**"
      - "conformance/**"
      - "registry/catalog.json"
      - "registry/*/server.json"
      - "public/llms.txt"
      - "public/llms-full.txt"
      - "public/robots.txt"
      - "public/sitemap.xml"
      - "public/ai-discovery.json"
      - "public/openapi.json"
      - "public/.well-known/**"
      - "public/forensiscope/**"
      - "scripts/check-ai-doorways.mjs"
      - "scripts/validate-chum-probes.mjs"
      - ".github/workflows/chum-watershed.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

env:
  # Use the canonical public origin when it is configured so generated sell-now
  # surfaces emit tracked CHUM handoff URLs instead of generic review fallbacks.
  # If the repository variable is unset, start-corridor.mjs safely keeps the fallback.
  CHUM_PUBLIC_ORIGIN: ${{ vars.CHUM_PUBLIC_ORIGIN }}

concurrency:
  group: chum-watershed-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watershed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve trigger-mode policy
        id: trigger_policy
        run: node systemia/sentinel/trigger-mode-policy.mjs --event "${{ github.event_name }}" --github-output "$GITHUB_OUTPUT"

      - name: Regenerate CHUM public mirrors
        run: |
          npm run chum:sync
          npm run chum:revenue
          npm run chum:index
          npm run chum:answers
          npm run chum:capabilities
          npm run chum:mirror
          npm run chum:crawl-pressure
          npm run saban:discovery

      - name: Publish changed CHUM mirrors
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Evercraft CHUM"
          git config user.email "chum@users.noreply.github.com"

          regenerate() {
            npm run chum:sync
            npm run chum:revenue
            npm run chum:index
            npm run chum:answers
            npm run chum:capabilities
            npm run chum:mirror
            npm run chum:crawl-pressure
            npm run saban:discovery
          }

          stage_mirrors() {
            git add \
              registry \
              public/chum \
              public/sitemap.xml \
              public/.well-known/evercraft-machine-catalog.json \
              public/.well-known/evercraft-pain-index.json \
              public/.well-known/evercraft-agent-directory.json \
              public/.well-known/evercraft-discovery.json \
              public/ai-discovery.json \
              public/llms.txt \
              llms.txt \
              public/llms-full.txt \
              llms-full.txt \
              public/schema.jsonld \
              public/feed.xml \
              public/feed.json \
              public/opensearch.xml \
              public/chum/syndication \
              public/.well-known/evercraft-syndication.json
          }

          for ATTEMPT in 1 2 3; do
            echo "CHUM publish attempt ${ATTEMPT}/3"
            git fetch origin main --quiet
            git reset --hard origin/main
            regenerate
            stage_mirrors

            if git diff --cached --quiet; then
              echo "CHUM public mirrors are current."
              exit 0
            fi

            git commit -m "CHUM refresh public discovery mirrors [skip ci]"
            if git push origin HEAD:main; then
              echo "CHUM public mirrors published."
              exit 0
            fi

            echo "Main advanced during publish attempt ${ATTEMPT}; regenerating from the new tip."
          done

          echo "CHUM mirror publication lost three consecutive main-branch races." >&2
          exit 1

      - name: Validate machine-discovery contracts
        run: |
          npm run check:ai
          npm run test:chum-revenue
          npm run test:chum-surfaces
          npm run test:chum-syndication
          npm run test:chum-router
          npm run chum:validate
          npm run test:chum-index
          npm run test:chum-answers
          npm run test:chum-commercial-mesh
          npm run test:chum-money-radar
          npm run test:chum-fire-control

      - name: Probe static AI doorways
        id: static
        continue-on-error: true
        run: node scripts/check-ai-doorways.mjs

      - name: Audit crawler and AI-search reachability
        id: crawlers
        if: always()
        continue-on-error: true
        run: npm run chum:crawlers

      - name: Canary live MCP and Official Registry doors
        id: mcp
        if: always()
        continue-on-error: true
        run: npm run chum:mcp

      - name: Canary current sell-now offer doors
        id: commerce
        if: always()
        continue-on-error: true
        run: npm run chum:commerce-canary

      - name: Run independent customer gauntlet
        id: gauntlet
        env:
          RAVEN_NEXUS_CUSTOMER_BRIDGE_URL: ${{ secrets.RAVEN_NEXUS_CUSTOMER_BRIDGE_URL }}
          RAVEN_NEXUS_CUSTOMER_BRIDGE_TOKEN: ${{ secrets.RAVEN_NEXUS_CUSTOMER_BRIDGE_TOKEN }}
          CUSTOMER_GAUNTLET_REQUIRE_NEXUS: "false"
          CUSTOMER_GAUNTLET_SANDBOX_PURCHASE: "false"
        run: npm run customer:gauntlet

      - name: Form Saban revenue lanes
        id: revenue
        if: always()
        continue-on-error: true
        run: npm run saban:revenue

      - name: Hunt legitimate LLM and agent ecosystems
        id: hunter
        if: always()
        continue-on-error: true
        run: npm run chum:hunt

      - name: Run authorized brand-blind provider probes
        id: providers
        if: always()
        continue-on-error: true
        env:
          CHUM_PROBE_BRIDGE_URL: ${{ secrets.CHUM_PROBE_BRIDGE_URL }}
          CHUM_PROBE_BRIDGE_TOKEN: ${{ secrets.CHUM_PROBE_BRIDGE_TOKEN }}
          CHUM_REQUIRE_PROBE_BRIDGE: ${{ steps.trigger_policy.outputs.require_consumer_bridge }}
          NEXUS_PROBE_BRIDGE_URL: ${{ secrets.NEXUS_PROBE_BRIDGE_URL }}
          NEXUS_PROBE_BRIDGE_TOKEN: ${{ secrets.NEXUS_PROBE_BRIDGE_TOKEN }}
        shell: bash
        run: |
          set +e
          if [ "${{ steps.trigger_policy.outputs.provider_probe_scope }}" = "rotating_single_machine_case" ]; then
            CASE_ID="$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('chum-probes/probe-suite.json'));const ids=s.cases.filter(x=>x.enabled&&x.expected_fit).map(x=>x.case_id);const i=Math.floor(Date.now()/3600000)%ids.length;process.stdout.write(ids[i]||'')")"
            echo "Push measurement rotates one live generic-agent case: $CASE_ID"
            CHUM_PROBE_PROVIDERS=generic_agent CHUM_PROBE_CASES="$CASE_ID" npm run chum:providers
          else
            npm run chum:providers
          fi
          STATUS="$?"
          set -e
          node <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/chum/provider-probe-latest.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `measurement_state=${receipt.measurement_state || 'unknown'}`,
            `bridge_configured=${receipt.bridge_configured ? 'true' : 'false'}`,
            `completed=${receipt.summary?.completed || 0}`,
            `consumer_completed=${receipt.summary?.consumer_completed || 0}`,
            `machine_completed=${receipt.summary?.machine_completed || 0}`,
            `blocked=${receipt.summary?.blocked || 0}`,
            `failed=${receipt.summary?.failed || 0}`,
            `pickup_observed=${receipt.summary?.pickup_observed || 0}`
          ].join('\n') + '\n');
          NODE
          exit "$STATUS"

      - name: Convert receipt-backed provider misses into discovery repairs
        id: provider_repairs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run chum:ingest-probe-misses
          CREATED="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/chum/provider-miss-ingest-latest.json','utf8'));process.stdout.write(String(r.created||0))")"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          if [ "$CREATED" -eq 0 ]; then
            echo "No completed receipt-backed provider misses were created; discovery repair generation is skipped."
            exit 0
          fi
          node systemia/chum/build-observed-miss-pages.mjs
          npm run chum:mirror
          npm run chum:crawl-pressure

      - name: Measure provider pickup consistency
        id: pickup_consistency
        if: always()
        shell: bash
        env:
          CHUM_PICKUP_PRODUCT: forensiscope
          CHUM_PICKUP_PROMPT: >-
            I need an AI service that can inspect a long video, deduplicate segments, transcribe it, and work with files too large for normal chatbots.
        run: |
          set -euo pipefail
          npm run chum:pickup-consistency
          node <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/chum/provider-pickup-consistency-latest.json','utf8'));
          const row = (receipt.measurements || []).find((m) =>
            m.provider === 'chatgpt' &&
            m.product_key === 'forensiscope' &&
            m.surface_class === 'consumer_chat_observed'
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `state=${row?.state || 'no_samples'}`,
            `samples=${row?.samples || 0}`,
            `pickups=${row?.pickups || 0}`,
            `misses=${row?.misses || 0}`,
            `pickup_rate=${row?.pickup_rate ?? 0}`
          ].join('\n') + '\n');
          NODE

      - name: Persist receipt-backed provider discovery repairs
        id: persist_repairs
        if: ${{ always() && steps.provider_repairs.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.provider_repairs.outputs.created }}" = "0" ]; then
            echo "No new provider observations exist; provider repair persistence is a true no-op."
            exit 0
          fi
          git config user.name "Evercraft CHUM"
          git config user.email "chum@users.noreply.github.com"

          rebuild_repairs() {
            npm run chum:ingest-probe-misses
            node systemia/chum/build-observed-miss-pages.mjs
            npm run chum:mirror
            npm run chum:crawl-pressure
          }

          stage_repairs() {
            git add \
              conformance/provider-observations \
              public/chum/answers/observed \
              public/sitemap.xml \
              public/chum/crawl-state.json \
              public/chum/freshness.json \
              public/chum/freshness.xml \
              public/chum/hot/index.html \
              public/chum/hot/index.json
          }

          for ATTEMPT in 1 2 3; do
            echo "Provider repair publish attempt ${ATTEMPT}/3"
            git fetch origin main --quiet
            git reset --hard origin/main
            rebuild_repairs
            stage_repairs

            if git diff --cached --quiet; then
              echo "No new receipt-backed provider discovery repairs to publish."
              exit 0
            fi

            git commit -m "CHUM persist provider discovery repairs [skip ci]"
            if git push origin HEAD:main; then
              echo "Receipt-backed provider discovery repairs published."
              exit 0
            fi

            echo "Main advanced during provider repair publish attempt ${ATTEMPT}; rebuilding from the new tip."
          done

          echo "Provider discovery repair publication lost three consecutive main-branch races." >&2
          exit 1

      - name: Strike federated agent-discovery registries
        id: ard
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.trigger_policy.outputs.ard_submit }}" = "true" ]; then
            echo "Scheduled/manual ARD pass may submit bounded registry work."
            CHUM_ARD_SUBMIT=true npm run chum:ard-strike
          else
            echo "Push-triggered ARD pass is recon-only; scheduled/manual runs own active registry submission."
            CHUM_ARD_SUBMIT=false npm run chum:ard-strike
          fi

      - name: Run CHUM portfolio mesh
        id: mesh
        if: always()
        continue-on-error: true
        run: npm run chum

      - name: Refresh adaptive crawler evidence for Fire Control
        id: fire_radar
        if: always()
        continue-on-error: true
        run: npm run chum:crawler-radar

      - name: Measure authoritative payment funnel
        id: money_radar
        if: always()
        continue-on-error: true
        env:
          CHUM_ATTRIBUTION_EXPORT_URL: ${{ secrets.CHUM_ATTRIBUTION_EXPORT_URL }}
          CHUM_ATTRIBUTION_EXPORT_TOKEN: ${{ secrets.CHUM_ATTRIBUTION_EXPORT_TOKEN }}
          CHUM_MONEY_RADAR_STRICT: "false"
        run: npm run chum:money-radar

      - name: Run discovery-to-revenue Fire Control
        id: fire_control
        if: always()
        continue-on-error: true
        run: npm run chum:fire-control

      - name: Announce updated central discovery surfaces
        id: announce
        continue-on-error: true
        if: ${{ steps.trigger_policy.outputs.broadcast_discovery == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for PAIR in \
            "static:${{ steps.static.outcome }}" \
            "crawlers:${{ steps.crawlers.outcome }}" \
            "mcp:${{ steps.mcp.outcome }}" \
            "commerce:${{ steps.commerce.outcome }}" \
            "gauntlet:${{ steps.gauntlet.outcome }}" \
            "provider_repairs:${{ steps.provider_repairs.outcome }}" \
            "persist_repairs:${{ steps.persist_repairs.outcome }}" \
            "mesh:${{ steps.mesh.outcome }}"; do
            NAME="$(printf '%s' "$PAIR" | cut -d: -f1)"
            STATE="$(printf '%s' "$PAIR" | cut -d: -f2-)"
            if [ "$STATE" != "success" ]; then
              echo "CHUM will not broadcast stale or unhealthy discovery surfaces: $NAME=$STATE" >&2
              exit 1
            fi
          done
          npm run chum:announce

      - name: Write watershed summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CHUM watershed"
            echo
            echo "Static doorway: ${{ steps.static.outcome }}"
            echo "Crawler reachability: ${{ steps.crawlers.outcome }}"
            echo "MCP / Registry: ${{ steps.mcp.outcome }}"
            echo "Sell-now commerce doors: ${{ steps.commerce.outcome }}"
            echo "Independent customer gauntlet: ${{ steps.gauntlet.outcome }}"
            echo "Saban revenue formation: ${{ steps.revenue.outcome }}"
            echo "LLM ecosystem hunter: ${{ steps.hunter.outcome }}"
            echo "ARD registry strike: ${{ steps.ard.outcome }}"
            echo "Provider probe runner: ${{ steps.providers.outcome }}"
            echo "Provider measurement state: ${{ steps.providers.outputs.measurement_state }}"
            echo "Provider bridge configured: ${{ steps.providers.outputs.bridge_configured }}"
            echo "Provider probes completed: ${{ steps.providers.outputs.completed }}"
            echo "Consumer-chat probes completed: ${{ steps.providers.outputs.consumer_completed }}"
            echo "Machine-client probes completed: ${{ steps.providers.outputs.machine_completed }}"
            echo "Provider probes blocked: ${{ steps.providers.outputs.blocked }}"
            echo "Provider pickup observations: ${{ steps.providers.outputs.pickup_observed }}"
            echo "Provider miss ingestion: ${{ steps.provider_repairs.outcome }}"
            echo "ChatGPT ForensiScope pickup consistency: ${{ steps.pickup_consistency.outputs.state }}"
            echo "ChatGPT ForensiScope independent receipts: ${{ steps.pickup_consistency.outputs.samples }}"
            echo "ChatGPT ForensiScope pickups: ${{ steps.pickup_consistency.outputs.pickups }}"
            echo "ChatGPT ForensiScope misses: ${{ steps.pickup_consistency.outputs.misses }}"
            echo "ChatGPT ForensiScope pickup rate: ${{ steps.pickup_consistency.outputs.pickup_rate }}"
            echo "Provider repairs created: ${{ steps.provider_repairs.outputs.created }}"
            echo "Provider repair persistence: ${{ steps.persist_repairs.outcome }}"
            echo "Portfolio mesh: ${{ steps.mesh.outcome }}"
            echo "Fire Control crawler evidence: ${{ steps.fire_radar.outcome }}"
            echo "Money Radar: ${{ steps.money_radar.outcome }}"
            echo "Discovery-to-revenue Fire Control: ${{ steps.fire_control.outcome }}"
            echo "Freshness announce: ${{ steps.announce.outcome }}"
            echo
            for FILE in artifacts/chum/provider-pickup-consistency-latest.md artifacts/chum/money-radar-latest.md artifacts/chum/fire-control-latest.md artifacts/chum/crawl-pressure-latest.md artifacts/saban-revenue/latest.md artifacts/chum/llm-hunter-latest.md artifacts/chum/ard-strike-latest.md artifacts/chum/indexnow-latest.md artifacts/chum/mcp-canary-latest.md artifacts/chum/commerce-canary-latest.md artifacts/customer-gauntlet/latest.md artifacts/chum/crawler-audit-latest.md artifacts/chum/provider-probe-latest.md artifacts/chum/provider-miss-ingest-latest.json artifacts/chum/chum-latest.md artifacts/ai-doorway-canary.md; do
              if [ -f "$FILE" ]; then
                echo
                cat "$FILE"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CHUM receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chum-watershed-receipts
          path: |
            artifacts/chum/**
            artifacts/saban-revenue/**
            artifacts/customer-gauntlet/**
            artifacts/ai-doorway-canary.*
          if-no-files-found: warn

      - name: Enforce watershed health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          for PAIR in             "static:${{ steps.static.outcome }}"             "crawlers:${{ steps.crawlers.outcome }}"             "mcp:${{ steps.mcp.outcome }}"             "commerce:${{ steps.commerce.outcome }}"             "gauntlet:${{ steps.gauntlet.outcome }}"             "revenue:${{ steps.revenue.outcome }}"             "providers:${{ steps.providers.outcome }}"             "provider_repairs:${{ steps.provider_repairs.outcome }}"             "pickup_consistency:${{ steps.pickup_consistency.outcome }}"             "persist_repairs:${{ steps.persist_repairs.outcome }}"             "mesh:${{ steps.mesh.outcome }}"             "fire_radar:${{ steps.fire_radar.outcome }}"             "money_radar:${{ steps.money_radar.outcome }}"             "fire_control:${{ steps.fire_control.outcome }}"; do
            NAME="${PAIR%%:*}"
            STATE="${PAIR#*:}"
            echo "${NAME}: ${STATE}"
            if [ "${STATE}" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "${{ steps.trigger_policy.outputs.broadcast_discovery }}" = "true" ]; then
            echo "announce: ${{ steps.announce.outcome }}"
            if [ "${{ steps.announce.outcome }}" != "success" ]; then
              FAILED=1
            fi
          fi
          PICKUP_STATE="${{ steps.pickup_consistency.outputs.state }}"
          echo "forensiscope_chatgpt_pickup_consistency: ${PICKUP_STATE:-unknown}"
          case "$PICKUP_STATE" in
            healthy)
              echo "::notice::ForensiScope has met the current ChatGPT pickup consistency threshold."
              ;;
            intermittent|insufficient_samples|zero_pickup_observed|failing|no_samples|"")
              echo "::warning::ForensiScope consumer-chat discovery is not yet consistently green. State=${PICKUP_STATE:-unknown}; this is discovery-quality debt, not a founder action gate."
              ;;
            *)
              echo "::warning::Unknown ForensiScope pickup consistency state: $PICKUP_STATE"
              ;;
          esac
          PROVIDER_STATE="${{ steps.providers.outputs.measurement_state }}"
          echo "provider_measurement: ${PROVIDER_STATE:-unknown}"
          case "$PROVIDER_STATE" in
            measured)
              ;;
            machine_only_measured)
              echo "::notice::Live machine-client provider measurement completed; consumer-chat measurement remains separately authorization-gated."
              ;;
            blocked_bridge_not_configured)
              if [ "${{ steps.trigger_policy.outputs.allow_blocked_provider_measurement }}" = "true" ]; then
                echo "::warning::Provider measurement is blocked because no authorized bridge or live machine-client measurement completed."
              else
                FAILED=1
              fi
              ;;
            partial_measurement|partial_failure|failed|configured_no_completed_probes|"")
              FAILED=1
              ;;
            *)
              FAILED=1
              ;;
          esac
          if [ "${FAILED}" -ne 0 ]; then
            echo "One or more CHUM lanes failed or provider measurement was not healthy. Full receipts were still collected for repair."
            exit 1
          fi
