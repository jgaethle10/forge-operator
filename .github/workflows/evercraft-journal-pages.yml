name: Evercraft public web fallback

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'systemia/newsroom/**'
      - 'systemia/chum/public-origin-runtime.mjs'
      - 'systemia/network/public-edge-runtime.mjs'
      - 'systemia/domain-authority/**'
      - 'tests/chum-public-origin-runtime.test.mjs'
      - 'tests/product-url-fabric.test.mjs'
      - '.github/workflows/evercraft-journal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evercraft-public-web-fallback
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove public URL fabric
        run: |
          npm run test:chum-public-origin
          npm run test:product-url-fabric

      - name: Prove owned Journal contracts
        run: npm run journal:test

      - name: Build canonical portable Journal artifact
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://journal.evercraft.global
        run: |
          rm -rf _journal_release
          node systemia/newsroom/journal-publisher.mjs systemia/newsroom/stories _journal_release

      - name: Verify canonical portable artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _journal_release/index.html
          test -f _journal_release/index.json
          test -f _journal_release/feed.xml
          test -f _journal_release/llms.txt
          grep -q 'Evercraft Journal' _journal_release/index.html
          grep -q 'https://journal.evercraft.global/' _journal_release/index.json
          if grep -RniE 'Black Friday|shopping assistant|optimize your cart' _journal_release; then
            echo "Legacy shopping identity detected in canonical Journal artifact."
            exit 1
          fi

      - name: Preserve portable Journal release
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-journal-portable
          path: _journal_release
          if-no-files-found: error
          retention-days: 90

      - name: Check or enable GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages fallback for the entire public directory
        if: steps.pages.outcome == 'success'
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://jgaethle10.github.io/forge-operator/journal
        run: |
          set -euo pipefail
          rm -rf _public_pages
          mkdir -p _public_pages
          cp -R public/. _public_pages/
          node systemia/newsroom/journal-publisher.mjs systemia/newsroom/stories _public_pages/journal
          touch _public_pages/.nojekyll
          cat > _public_pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Evercraft Public Directory</title>
            <meta http-equiv="refresh" content="0; url=/forge-operator/chum/">
            <link rel="canonical" href="/forge-operator/chum/">
          </head>
          <body>
            <p><a href="/forge-operator/chum/">Open Evercraft public directory</a></p>
          </body>
          </html>
          HTML
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='_public_pages';
          const prefix='/forge-operator/';
          const walk=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(entry.isFile()&&entry.name.endsWith('.html')){
                let body=fs.readFileSync(full,'utf8');
                body=body
                  .replace(/(href|src|action)="\/(?!\/)/g, `$1="${prefix}`)
                  .replace(/(href|src|action)='\/(?!\/)/g, `$1='${prefix}`);
                fs.writeFileSync(full,body);
              }
            }
          };
          walk(root);
          NODE
          test -f _public_pages/chum/index.html
          test -f _public_pages/chum/products/infinite-classroom/index.html
          grep -q 'Infinite Classroom' _public_pages/chum/products/infinite-classroom/index.html
          test -f _public_pages/journal/index.html

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_pages

      - name: Record Pages gate without failing canonical release
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "## Evercraft public web fallback"
            echo
            echo "Canonical Journal artifact and product URL fabric proofs passed."
            echo "GitHub Pages publication is held by repository/account enablement."
            echo "Permanent Evercraft domains remain authoritative only after external DNS/TLS canaries pass."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy Evercraft public directory
        id: deployment
        uses: actions/deploy-pages@v4
