name: Evercraft public web fallback

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'systemia/newsroom/**'
      - 'systemia/graphics-command/ranking-poster-renderer.mjs'
      - 'systemia/visual-desk/**'
      - 'systemia/chum/public-origin-runtime.mjs'
      - 'systemia/network/public-edge-runtime.mjs'
      - 'systemia/domain-authority/**'
      - 'tests/chum-public-origin-runtime.test.mjs'
      - 'tests/product-url-fabric.test.mjs'
      - '.github/workflows/evercraft-journal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evercraft-public-web-fallback
  cancel-in-progress: true

jobs:
  build:
    outputs:
      pages_enabled: ${{ steps.page_state.outputs.enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove public URL fabric
        run: |
          npm run test:chum-public-origin
          npm run test:product-url-fabric

      - name: Prove owned Journal contracts
        run: npm run journal:test

      - name: Build canonical portable Journal artifact
        id: journal_portable
        continue-on-error: true
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
        run: |
          rm -rf _journal_release
          node systemia/newsroom/journal-publisher.mjs systemia/newsroom/stories _journal_release

      - name: Verify canonical portable artifact
        if: steps.journal_portable.outcome == 'success'
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
        run: node systemia/newsroom/journal-build-verifier.mjs _journal_release "$EVERCRAFT_JOURNAL_ORIGIN"

      - name: Preserve portable Journal release
        if: steps.journal_portable.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-journal-portable
          path: _journal_release
          if-no-files-found: error
          retention-days: 90

      - name: Check or enable GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Record Pages fallback availability
        id: page_state
        shell: bash
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## GitHub Pages fallback unavailable"
              echo
              echo "The portable Evercraft Journal artifact verified successfully, but this GitHub integration cannot create or enable the Pages site."
              echo "The owned Journal remains authoritative; Pages is an optional fallback."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Pages fallback for the entire public directory
        if: steps.page_state.outputs.enabled == 'true'
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
        run: |
          set -euo pipefail
          rm -rf _public_pages
          mkdir -p _public_pages
          cp -R public/. _public_pages/
          # Native image assets matter: Facebook/LinkedIn preview cards generally
          # require PNG/JPEG rather than SVG-only Open Graph references.
          python -m pip install --quiet --disable-pip-version-check cairosvg==2.8.2
          python systemia/clip/build-audience-social-previews.py \
            --source public/clip/audience-sites \
            --destination _public_pages/clip/audience-sites
          test -s _public_pages/clip/audience-sites/partscout/feed.png
          test -s _public_pages/clip/audience-sites/relay-notes/story.png
          # White-label revenue properties must never expose the corporate Clip
          # handoff queue, channel approvals, or private publisher metadata.
          for slug in partscout valuescout playbook-lab site-rescue creative-studio publisher-lab relay-notes; do
            cp "_public_pages/clip/audience-sites/$slug/feed.png" "_public_pages/audience-sites/$slug/share.png"
            test -s "_public_pages/audience-sites/$slug/share.png"
          done
          rm -rf _public_pages/clip/audience-sites
          rm -f _public_pages/audience-sites/properties.json
          rm -f _public_pages/affiliate-labs/sitemap.xml
          rm -f _public_pages/audience-sites/sitemap.xml
          # The old public creative dashboard must not connect quiet publisher
          # properties to Evercraft, even via historical URLs.
          rm -rf _public_pages/journal
          if node systemia/newsroom/journal-publisher.mjs systemia/newsroom/stories _public_pages/journal; then
            echo "Journal included in Pages fallback."
          else
            rm -rf _public_pages/journal
            {
              echo "## Journal isolated from public fallback"
              echo
              echo "Journal failed its own publication gate and was omitted."
              echo "Product and customer fallback surfaces will still deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          EVERCRAFT_VISUAL_ORIGIN=https://jgaethle10.github.io/forge-operator/visuals node systemia/visual-desk/build-all.mjs systemia/visual-desk/stories _public_pages/visuals
          test -f _public_pages/visuals/index.html
          test -f _public_pages/visuals/index.json
          test -f _public_pages/visuals/washington-active-volcanoes/index.html
          test -f _public_pages/visuals/washington-active-volcanoes/card-story.svg
          test -f _public_pages/visuals/washington-active-volcanoes/motion.html
          touch _public_pages/.nojekyll
          cat > _public_pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Evercraft Public Directory</title>
            <meta http-equiv="refresh" content="0; url=/forge-operator/chum/">
            <link rel="canonical" href="/forge-operator/chum/">
          </head>
          <body>
            <p><a href="/forge-operator/chum/">Open Evercraft public directory</a></p>
            <p><a href="/forge-operator/site-status/roman/">Independent Roman website recovery directory</a></p>
          </body>
          </html>
          HTML
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='_public_pages';
          const prefix='/forge-operator/';
          const walk=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(entry.isFile()&&entry.name.endsWith('.html')){
                let body=fs.readFileSync(full,'utf8');
                body=body
                  .replace(/(href|src|action)="\/(?!\/|forge-operator\/)/g, `$1="${prefix}`)
                  .replace(/(href|src|action)='\/(?!\/|forge-operator\/)/g, `$1='${prefix}`);
                fs.writeFileSync(full,body);
              }
            }
          };
          walk(root);
          NODE
          test -f _public_pages/chum/index.html
          test -f _public_pages/chum/products/infinite-classroom/index.html
          grep -q 'Infinite Classroom' _public_pages/chum/products/infinite-classroom/index.html
          test -f _public_pages/apps/eps-estimator/index.html
          grep -q 'EPS Precise Estimator' _public_pages/apps/eps-estimator/index.html
          test -f _public_pages/eps/index.html
          test -f _public_pages/havenly/index.html
          # Protect the studio's buyer-facing offer and inquiry choice in release artifacts.
          test -s _public_pages/commercial-studio/index.html
          grep -Fq 'id="intro-offer"' _public_pages/commercial-studio/index.html
          grep -Fq '$50 introductory 30-second social commercial' _public_pages/commercial-studio/index.html
          grep -Fq '<option>$50 launch-week 30-second social commercial pilot</option>' _public_pages/commercial-studio/index.html
          grep -Fq 'id="studio-request"' _public_pages/commercial-studio/index.html
          grep -q 'eps-continuity-20261017' _public_pages/eps/index.html
          grep -q 'havenly-continuity-20261017' _public_pages/havenly/index.html
          test -f _public_pages/sunshine-spotless/index.html
          grep -q 'sunshine-spotless-continuity-20261018' _public_pages/sunshine-spotless/index.html
          test -f _public_pages/site-status/roman/index.html
          grep -q 'meta name="robots" content="index,follow"' _public_pages/site-status/roman/index.html
          grep -q 'independently maintained technical recovery directory' _public_pages/site-status/roman/index.html
          grep -q 'https://fabric.systemiacommandcenters.com/campaigns/roman/' _public_pages/site-status/roman/index.html
          grep -q 'https://jgaethle10.github.io/forge-operator/campaigns/roman/' _public_pages/site-status/roman/index.html
          grep -q 'https://headless-jhpvqnpgxlh-sociallyguud-140c.wix-site-host.com/' _public_pages/site-status/roman/index.html
          grep -q 'meta name="robots" content="noindex,nofollow"' _public_pages/campaigns/roman/index.html
                    test -f _public_pages/campaigns/roman/index.html
          grep -q 'Roman Kilinkaridis' _public_pages/campaigns/roman/index.html
          grep -q 'https://donate.voteroman.com/' _public_pages/campaigns/roman/index.html

      - name: Upload Pages artifact
        if: steps.page_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_pages

  deploy-pages:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy Evercraft public directory
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify customer fallback doors
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          classroom="${base%/}/chum/products/infinite-classroom/"
          classroom_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$classroom")"
          printf '%s' "$classroom_body" | grep -q 'Infinite Classroom'
          estimator="${base%/}/apps/eps-estimator/"
          estimator_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$estimator")"
          printf '%s' "$estimator_body" | grep -q 'EPS Precise Estimator'
          eps="${base%/}/eps/"
          eps_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$eps")"
          printf '%s' "$eps_body" | grep -q 'eps-continuity-20261017'
          havenly="${base%/}/havenly/"
          havenly_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$havenly")"
          printf '%s' "$havenly_body" | grep -q 'havenly-continuity-20261017'
          # Live customer-path proof after GitHub Pages reports deployment.
          studio="${base%/}/commercial-studio/"
          studio_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$studio")"
          [[ "$studio_body" == *'id="intro-offer"'* ]]
          [[ "$studio_body" == *'$50 introductory 30-second social commercial'* ]]
          [[ "$studio_body" == *'<option>$50 launch-week 30-second social commercial pilot</option>'* ]]
          [[ "$studio_body" == *'id="studio-request"'* ]]
          echo 'EVERCRAFT_STUDIO_LIVE_PILOT_HTTP_VERIFIED'
          sunshine="${base%/}/sunshine-spotless/"
          sunshine_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$sunshine")"
          printf '%s' "$sunshine_body" | grep -q 'sunshine-spotless-continuity-20261018'
          earthworks="${base%/}/apps/earthworks-autonomy/"
          earthworks_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$earthworks")"
          printf '%s' "$earthworks_body" | grep -q 'Evercraft EarthWorks Autonomy'
          earthworks_partner="${base%/}/apps/earthworks-autonomy/design-partner.html"
          partner_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$earthworks_partner")"
          printf '%s' "$partner_body" | grep -q 'EarthWorks Design Partner'
          earthworks_sample="${base%/}/apps/earthworks-autonomy/sample-study.html"
          sample_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$earthworks_sample")"
          printf '%s' "$sample_body" | grep -q 'Synthetic sample deliverable'
          visual="${base%/}/visuals/washington-active-volcanoes/"
          visual_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$visual")"
          printf '%s' "$visual_body" | grep -q 'Washington'
          motion="${base%/}/visuals/washington-active-volcanoes/motion.html"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$motion" | grep -q "__evercraftRenderAt"
          # Confirm real browser-supported social previews exist after deployment.
          preview="${base%/}/audience-sites/partscout/share.png"
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 2 "$preview" -o /tmp/evercraft-clip-preview.png
          python - <<'PY'
          from pathlib import Path
          import struct
          payload=Path('/tmp/evercraft-clip-preview.png').read_bytes()
          assert payload[:8]==bytes.fromhex('89504e470d0a1a0a'), 'not a real PNG'
          assert struct.unpack('>II',payload[16:24])==(1080,1350),'wrong size'
          print('CLIP_SOCIAL_PREVIEW_HTTP_VERIFIED')
          PY
          # No exposed white-label-to-corporate publishing control plane.
          for path in clip/audience-sites/ clip/audience-sites/queue.json audience-sites/properties.json; do
            code=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "${base%/}/$path")
            test "$code" = "404"
          done
          rescue="${base%/}/site-status/roman/"
          rescue_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$rescue")"
          printf '%s' "$rescue_body" | grep -q 'Copy working link'
          printf '%s' "$rescue_body" | grep -q 'Open the available information page'
          printf '%s' "$rescue_body" | grep -q 'https://fabric.systemiacommandcenters.com/go/roman'
          printf '%s' "$rescue_body" | grep -q 'Typing voteroman.com still follows the original domain'
          roman="${base%/}/campaigns/roman/"
          roman_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$roman")"
          printf '%s' "$roman_body" | grep -q 'Roman Kilinkaridis'
          printf '%s' "$roman_body" | grep -q 'https://donate.voteroman.com/'
          # Independent, indexable technical recovery directory, not campaign SEO cutover.
          recovery_dir="${base%/}/site-status/roman/"
          recovery_body="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$recovery_dir")"
          printf '%s' "$recovery_body" | grep -q 'Roman Kilinkaridis website access'
          printf '%s' "$recovery_body" | grep -q 'not the voteroman.com website'
          printf '%s' "$recovery_body" | grep -q 'https://jgaethle10.github.io/forge-operator/campaigns/roman/'

          {
            echo "## Evercraft public fallback live"
            echo
            echo "Infinite Classroom: $classroom"
            echo "EPS estimator: $estimator"
          echo "EPS continuity: $eps"
          echo "HAVENLY continuity: $havenly"
          echo "Sunshine & Spotless continuity: $sunshine"
            echo "EarthWorks: $earthworks"
            echo "EarthWorks design partner: $earthworks_partner"
            echo "EarthWorks sample study: $earthworks_sample"
            echo "Visual Desk specimen: $visual"
            echo "Roman campaign emergency mirror: $roman"
          } >> "$GITHUB_STEP_SUMMARY"
