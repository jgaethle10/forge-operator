name: Outsider Fabric proof (synthetic + public read-only)
on:
  pull_request:
    paths:
      - 'examples/operator-fabric/**'
      - '.github/workflows/operator-fabric-outsider-example.yml'
permissions:
  contents: read
concurrency:
  group: operator-fabric-outsider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-client-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify examples syntax
        run: |
          node --check examples/operator-fabric/public-discovery.mjs
          node --check examples/operator-fabric/local-test-tool.mjs
          node --check examples/operator-fabric/independent-tool-client.mjs
          node --check examples/operator-fabric/review-gate.mjs
          node --check examples/operator-fabric/reviewed-http-bridge.mjs
          node --check examples/operator-fabric/pilot-check.mjs
      - name: Run signed review + remote loopback + independent tool tests without external services
        run: node --test examples/operator-fabric/test/*.test.mjs
      - name: Produce self-service offline pilot receipt
        run: |
          mkdir -p artifacts/operator-fabric
          node examples/operator-fabric/pilot-check.mjs --offline | tee artifacts/operator-fabric/offline-pilot-receipt.json
      - name: Preserve offline test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-fabric-offline-${{ github.run_id }}
          path: artifacts/operator-fabric/offline-pilot-receipt.json
          retention-days: 14
      - name: Prove real local MCP tool handshake and invocation without secrets
        run: node examples/operator-fabric/independent-tool-client.mjs

  saban-public-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse Saban existing public remote MCP cold-client, no purchases
        env:
          EVERCRAFT_PROBE_ORIGIN: https://fabric.systemiacommandcenters.com
          EVERCRAFT_PROBE_OUT: artifacts/operator-fabric/saban
        run: node systemia/saban/discovery-path-probe.mjs
      - name: Independently run documented outsider remote client on owned public endpoint
        run: |
          mkdir -p artifacts/operator-fabric
          node examples/operator-fabric/pilot-check.mjs --live | tee artifacts/operator-fabric/outsider-readback.json
      - name: Preserve exact external observations even if the remote probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-fabric-saban-external-${{ github.run_id }}
          path: artifacts/operator-fabric/
          retention-days: 14
          if-no-files-found: warn
