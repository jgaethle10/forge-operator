name: Outsider Fabric developer example (synthetic, safe)
on:
  pull_request:
    paths:
      - 'examples/operator-fabric/**'
      - '.github/workflows/operator-fabric-outsider-example.yml'
permissions:
  contents: read
concurrency:
  group: operator-fabric-outsider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-client-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check examples/operator-fabric/public-discovery.mjs
      - name: Test standalone JSON and SSE MCP proof without touching production
        run: node --test examples/operator-fabric/test/public-discovery.test.mjs
