name: Files Companion public migration snapshot

on:
  pull_request:
    paths:
      - 'systemia/migrations/base44-exit/forensic-record-public-extractor.mjs'
      - 'systemia/migrations/base44-exit/forensic-record-public-extractor.proof.mjs'
      - '.github/workflows/forensic-record-public-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/migrations/base44-exit/forensic-record-public-extractor.mjs'
      - 'systemia/migrations/base44-exit/forensic-record-public-extractor.proof.mjs'
      - '.github/workflows/forensic-record-public-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove public snapshot extraction contract
        run: node systemia/migrations/base44-exit/forensic-record-public-extractor.proof.mjs

  snapshot:
    if: github.event_name != 'pull_request'
    needs: prove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract terminal public migration snapshot
        run: |
          rm -rf artifacts/forensic-record-public-snapshot
          node systemia/migrations/base44-exit/forensic-record-public-extractor.mjs \
            --site https://filescompanion.com/ \
            --out artifacts/forensic-record-public-snapshot
      - name: Verify no legacy app identifier was persisted
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='artifacts/forensic-record-public-snapshot';
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));
          const receipt=JSON.parse(fs.readFileSync(path.join(root,'extraction-receipt.json'),'utf8'));
          if(manifest.source.legacy_app_id_persisted!==false) throw new Error('legacy_app_id_persistence_flag_invalid');
          if(receipt.legacy_app_id_persisted!==false) throw new Error('legacy_app_id_receipt_flag_invalid');
          if(receipt.all_terminal_exhaustion_verified!==true) throw new Error('terminal_exhaustion_not_verified');
          if(receipt.exact_source_count_reconciliation!==true) throw new Error('source_count_reconciliation_not_verified');
          if(receipt.public_cutover_authorized!==false) throw new Error('snapshot_must_not_authorize_public_cutover');
          console.log(JSON.stringify({
            ok:true,
            finding_rows:receipt.finding_rows,
            total_rows:receipt.total_rows,
            manifest_sha256:receipt.manifest_sha256
          },null,2));
          NODE
      - name: Preserve migration snapshot
        uses: actions/upload-artifact@v4
        with:
          name: forensic-record-public-snapshot-${{ github.sha }}
          path: artifacts/forensic-record-public-snapshot/
          retention-days: 90
          if-no-files-found: error
