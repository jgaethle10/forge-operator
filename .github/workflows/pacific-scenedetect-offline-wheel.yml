name: Pacific SceneDetect Pinned Offline Wheel
on:
  push:
    branches: [studio/pacific-real-music-audition-20261115]
    paths: [.github/workflows/pacific-scenedetect-offline-wheel.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          mkdir -p pacific-offline-scenecut
          python -m pip download --only-binary=:all: --no-deps -d pacific-offline-scenecut 'scenedetect==0.7.3'
          sha256sum pacific-offline-scenecut/* > pacific-offline-scenecut/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-scenedetect-073-pinned
          path: pacific-offline-scenecut/
          retention-days: 2
          if-no-files-found: error
