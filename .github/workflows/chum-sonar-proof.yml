name: CHUM Sonar proof

on:
  pull_request:
    paths:
      - "systemia/chum/crawl-observatory.mjs"
      - "systemia/chum/crawl-sonar-pull.mjs"
      - "systemia/chum/crawl-accelerator.mjs"
      - "tests/chum-crawl-observatory.test.mjs"
      - "server.ts"
      - "Dockerfile"
      - ".github/workflows/chum-crawl-pressure.yml"
      - ".github/workflows/chum-sonar-proof.yml"
  push:
    branches:
      - main
    paths:
      - "systemia/chum/crawl-observatory.mjs"
      - "systemia/chum/crawl-sonar-pull.mjs"
      - "systemia/chum/crawl-accelerator.mjs"
      - "tests/chum-crawl-observatory.test.mjs"
      - "server.ts"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove observation and offense scoring
        run: node tests/chum-crawl-observatory.test.mjs
      - name: Prove existing crawl accelerator contract
        run: node tests/chum-crawl-accelerator.test.mjs
