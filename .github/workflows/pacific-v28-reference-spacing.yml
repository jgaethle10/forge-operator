name: Pacific V28 Founder Cadence Bella Private
on:
  push:
    branches: [studio/pacific-v28-reference-spacing-20261122]
    paths:
      - systemia/media-studio/pacific-v28-reference-spacing.py
      - .github/workflows/pacific-v28-reference-spacing.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install native Bella runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Render matched founder cadence, no private reference uploaded
        env: {HF_HUB_DISABLE_TELEMETRY: "1"}
        run: python systemia/media-studio/pacific-v28-reference-spacing.py
      - name: Verify native speech assets, pauses and exact script
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,wave,hashlib
          r=Path('pacific-v28-private'); d=json.loads((r/'receipt.json').read_text())
          assert len(d['takes'])==2 and "might have other plans" in d['remaining_script']
          for t in d['takes']:
              f=r/t['file']
              with wave.open(str(f),'rb') as w:
                  assert w.getframerate()==24000 and w.getnchannels()==1
                  assert abs(w.getnframes()/24000-t['full_voice_duration_seconds'])<0.01
              assert t['pause_seconds']==1.3 and hashlib.sha256(f.read_bytes()).hexdigest()==t['sha256']
          print('Founder-directed sentence and pause verified. Listening approval pending.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-v28-founder-cadence-private
          path: pacific-v28-private/
          retention-days: 7
          if-no-files-found: error
