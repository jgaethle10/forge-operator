name: Forge checks

on:
  pull_request:
  push:
    branches:
      - main
      - "systemia/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run check

      - name: Build production container
        run: docker build -t forge-operator:${{ github.sha }} .

      - name: Start production container
        run: |
          docker run -d \
            --name forge-smoke \
            -e GEMINI_API_KEY=smoke-not-a-real-key \
            -p 3000:3000 \
            forge-operator:${{ github.sha }}

      - name: Verify health and discovery surfaces
        run: |
          set -euo pipefail

          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Forge container did not become healthy."
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3000/api/health | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/api/capabilities | tee /tmp/capabilities.json
          curl --fail --silent http://127.0.0.1:3000/llms.txt > /tmp/llms.txt
          curl --fail --silent http://127.0.0.1:3000/llms-full.txt > /tmp/llms-full.txt
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-capabilities.json > /tmp/manifest.json
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-agent-discovery.json > /tmp/agent-discovery.json
          curl --fail --silent 'http://127.0.0.1:3000/api/discover?q=my%20video%20is%20too%20large%20for%20this%20AI' > /tmp/discover.json
          curl --fail --silent http://127.0.0.1:3000/ai > /tmp/ai.html
          curl --fail --silent http://127.0.0.1:3000/ai/products/forensiscope > /tmp/forensiscope.html
          curl --fail --silent http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const capabilities = JSON.parse(fs.readFileSync('/tmp/capabilities.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const agentDiscovery = JSON.parse(fs.readFileSync('/tmp/agent-discovery.json','utf8'));
          const discovery = JSON.parse(fs.readFileSync('/tmp/discover.json','utf8'));
          const robots = fs.readFileSync('/tmp/robots.txt','utf8');
          const sitemap = fs.readFileSync('/tmp/sitemap.xml','utf8');
          const hub = fs.readFileSync('/tmp/ai.html','utf8');
          const forensiscope = fs.readFileSync('/tmp/forensiscope.html','utf8');

          if (health.ok !== true) throw new Error('health.ok must be true');
          if (health.service !== 'forge-operator') throw new Error('unexpected health service');
          if (capabilities.schema !== 'evercraft.capability.v1') throw new Error('unexpected capability schema');
          if (capabilities.invoke?.path !== '/api/forge') throw new Error('missing Forge invocation contract');
          if (capabilities.discovery?.intentResolver?.path !== '/api/discover?q={natural_language_problem}') throw new Error('CHUM resolver missing from capability contract');
          if (!manifest || typeof manifest !== 'object') throw new Error('machine manifest missing');
          if (agentDiscovery.schema !== 'evercraft.agent-discovery.v2') throw new Error('agent discovery schema missing');
          if (agentDiscovery.rules?.private_topology_exposed !== false) throw new Error('private topology boundary missing');
          if (discovery.results?.[0]?.product_key !== 'forensiscope') throw new Error('media overflow did not route to ForensiScope');
          if (discovery.payment_obligation_created !== false) throw new Error('discovery must not create payment obligation');
          if (!robots.includes('User-agent: OAI-SearchBot')) throw new Error('OAI-SearchBot policy missing');
          if (!robots.includes('User-agent: Claude-SearchBot')) throw new Error('Claude-SearchBot policy missing');
          if (!robots.includes('User-agent: PerplexityBot')) throw new Error('PerplexityBot policy missing');
          if (!sitemap.includes('<loc>http://127.0.0.1:3000/ai</loc>')) throw new Error('runtime sitemap must use absolute URLs');
          if (!hub.includes('Evercraft AI Capability Directory')) throw new Error('AI hub missing');
          if (!forensiscope.includes('ForensiScope')) throw new Error('ForensiScope AI page missing');
          NODE

      - name: Show container logs on failure
        if: failure()
        run: docker logs forge-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f forge-smoke || true
