name: Forge checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run check

      - name: Verify CHUM crawler radar
        run: node tests/chum-crawler-radar.test.mjs

      - name: Verify CHUM discovery doors
        run: |
          set -euo pipefail
          npm run chum:revenue
          npm run test:chum-router
          npm run chum:index
          npm run chum:answers
          npm run chum:mirror
          npm run test:chum-surfaces
          test -f public/chum/intents/forensiscope-evidence-review-v1/offer.json
          test -f public/.well-known/evercraft-pain-index.json
          test -f public/chum/answers/index.json
          node - <<'NODE'
          const fs = require('fs');
          const revenue = JSON.parse(fs.readFileSync('public/chum/revenue.json','utf8'));
          const offer = JSON.parse(fs.readFileSync('public/chum/intents/forensiscope-evidence-review-v1/offer.json','utf8'));
          if (!revenue.discovery_offers.some((x) => x.public_id === 'forensiscope-evidence-review-v1')) {
            throw new Error('ForensiScope missing from CHUM discovery doors');
          }
          if (revenue.offers.some((x) => x.public_id === 'forensiscope-evidence-review-v1') && offer.commercial_state !== 'sell_now') {
            throw new Error('Verification-gated ForensiScope leaked into sell-now offers');
          }
          if (offer.commercial_state !== 'sell_now' && offer.machine_offer_url !== null) {
            throw new Error('Verification-gated ForensiScope must not expose machine checkout');
          }
          NODE

      - name: Build production container
        run: docker build -t forge-operator:${{ github.sha }} .

      - name: Start production container
        run: |
          docker run -d \
            --name forge-smoke \
            -e GEMINI_API_KEY=smoke-not-a-real-key \
            -p 3000:3000 \
            forge-operator:${{ github.sha }}

      - name: Verify health and discovery surfaces
        run: |
          set -euo pipefail

          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Forge container did not become healthy."
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3000/api/health | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/api/capabilities | tee /tmp/capabilities.json
          curl --fail --silent http://127.0.0.1:3000/fallen > /tmp/fallen.html
          curl --fail --silent -X POST http://127.0.0.1:3000/api/fallen/family/episode \
            -H 'Content-Type: application/json' \
            --data '{"seriesTitle":"Smoke Family","episodeTitle":"Episode One","premise":"The family builds a blanket fort and the dog steals the pillows.","style":"Warm 2D storybook cartoon","characters":[{"id":"parent","name":"Parent","role":"Parent","description":"Warm and funny"},{"id":"kid","name":"Kid","role":"Kid","description":"Curious and energetic"}]}' \
            > /tmp/fallen-episode.json
          curl --fail --silent -X POST http://127.0.0.1:3000/api/chum/hunt \
            -H 'Content-Type: application/json' \
            --data '{"intent":"My AI cannot analyze this three hour video and I need the whole recording reviewed","provider":"smoke-llm","surface":"ci"}' \
            > /tmp/live-hunt-route.json
          curl --fail --silent -X POST http://127.0.0.1:3000/api/chum/hunt \
            -H 'Content-Type: application/json' \
            --data '{"intent":"I own a hotel and need to know whether this property is a good EV charging site and what the opportunity looks like","provider":"smoke-llm","surface":"ci"}' \
            > /tmp/aliev-live-hunt.json
          curl --fail --silent http://127.0.0.1:3000/llms.txt > /tmp/llms.txt
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-capabilities.json > /tmp/manifest.json
          curl --fail --silent -X POST http://127.0.0.1:3000/api/route-capability \
            -H 'Content-Type: application/json' \
            --data '{"intent":"use a headless browser to render this public webpage"}' \
            > /tmp/first-party-browser-route.json
          curl --fail --silent -X POST http://127.0.0.1:3000/api/route-capability \
            -H 'Content-Type: application/json' \
            --data '{"intent":"fetch url"}' \
            > /tmp/first-party-fetch-route.json
          curl --fail --silent --get \
            --data-urlencode "q=what is still running after I turned the automation off" \
            http://127.0.0.1:3000/api/discover > /tmp/containment-route.json
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-pain-index.json > /tmp/pain-index.json
          curl --fail --silent http://127.0.0.1:3000/chum/answers/index.json > /tmp/answer-graph.json
          curl --fail --silent http://127.0.0.1:3000/chum/ > /tmp/chum.html
          curl --fail --silent -H 'Host: discovery.example.test' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          curl --fail --silent -H 'Host: discovery.example.test' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml
          curl --fail --silent -H 'Host: discovery.example.test' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/chum/sitemaps/index.xml > /tmp/segmented-sitemap.xml
          curl --fail --silent http://127.0.0.1:3000/chum/commercial/index.json > /tmp/commercial-intent-mesh.json
          curl --fail --silent --get \
            --data-urlencode "q=I cannot find a discontinued machine part and I only have markings measurements and a photo" \
            http://127.0.0.1:3000/api/discover > /tmp/portfolio-route.json
          curl --fail --silent http://127.0.0.1:3000/forensiscope/llms.txt > /tmp/forensiscope-llms.txt
          curl --fail --silent http://127.0.0.1:3000/forensiscope/discovery.json > /tmp/forensiscope-discovery.json
          curl --fail --silent http://127.0.0.1:3000/chum/intents/forensiscope-evidence-review-v1/offer.json > /tmp/forensiscope-offer.json
          curl --fail --silent --get \
            --data-urlencode "q=I need an AI service that can inspect a long video, deduplicate segments, transcribe it, and work with files too large for normal chatbots" \
            http://127.0.0.1:3000/api/discover > /tmp/forensiscope-route.json
          curl --fail --silent -H 'Content-Type: application/json' \
            --data '{"problem":"we need an ERP but cannot survive a huge implementation and want to modernize without replacing everything","limit":3}' \
            http://127.0.0.1:3000/api/discover > /tmp/buildflow-route.json
          curl --fail --silent -D /tmp/chum-headers.txt -o /dev/null http://127.0.0.1:3000/chum/
          curl --fail --silent -A 'OAI-SearchBot/1.0' http://127.0.0.1:3000/forensiscope/ > /dev/null
          curl --fail --silent http://127.0.0.1:3000/api/chum/crawler-radar > /tmp/crawler-radar-runtime.json

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const capabilities = JSON.parse(fs.readFileSync('/tmp/capabilities.json','utf8'));
          const fallenHtml = fs.readFileSync('/tmp/fallen.html','utf8');
          const fallenEpisode = JSON.parse(fs.readFileSync('/tmp/fallen-episode.json','utf8'));
          const liveHunt = JSON.parse(fs.readFileSync('/tmp/live-hunt-route.json','utf8'));
          const alievLiveHunt = JSON.parse(fs.readFileSync('/tmp/aliev-live-hunt.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const browserRoute = JSON.parse(fs.readFileSync('/tmp/first-party-browser-route.json','utf8'));
          const fetchRoute = JSON.parse(fs.readFileSync('/tmp/first-party-fetch-route.json','utf8'));
          const containmentRoute = JSON.parse(fs.readFileSync('/tmp/containment-route.json','utf8'));
          const painIndex = JSON.parse(fs.readFileSync('/tmp/pain-index.json','utf8'));
          const answerGraph = JSON.parse(fs.readFileSync('/tmp/answer-graph.json','utf8'));
          const portfolioRoute = JSON.parse(fs.readFileSync('/tmp/portfolio-route.json','utf8'));
          const chumHtml = fs.readFileSync('/tmp/chum.html','utf8');
          const robots = fs.readFileSync('/tmp/robots.txt','utf8');
          const sitemap = fs.readFileSync('/tmp/sitemap.xml','utf8');
          const segmentedSitemap = fs.readFileSync('/tmp/segmented-sitemap.xml','utf8');
          const commercialIntentMesh = JSON.parse(fs.readFileSync('/tmp/commercial-intent-mesh.json','utf8'));
          const forensiscopeDiscovery = JSON.parse(fs.readFileSync('/tmp/forensiscope-discovery.json','utf8'));
          const forensiscopeOffer = JSON.parse(fs.readFileSync('/tmp/forensiscope-offer.json','utf8'));
          const forensiscopeRoute = JSON.parse(fs.readFileSync('/tmp/forensiscope-route.json','utf8'));
          const forensiscopeLlms = fs.readFileSync('/tmp/forensiscope-llms.txt','utf8');
          const buildflowRoute = JSON.parse(fs.readFileSync('/tmp/buildflow-route.json','utf8'));
          const chumHeaders = fs.readFileSync('/tmp/chum-headers.txt','utf8');
          const crawlerRadar = JSON.parse(fs.readFileSync('/tmp/crawler-radar-runtime.json','utf8'));

          if (health.ok !== true) throw new Error('health.ok must be true');
          if (health.service !== 'forge-operator') throw new Error('unexpected health service');
          if (capabilities.schema !== 'evercraft.capability.v1') throw new Error('unexpected capability schema');
          if (!fallenHtml.includes('<div id="root"></div>')) throw new Error('Fallen SPA route did not return the production app shell');
          if (fallenEpisode.success !== true) throw new Error('Fallen family episode smoke failed');
          if (fallenEpisode.data?.story?.scenes?.length !== 6) throw new Error('Fallen family episode must contain six scenes');
          if (fallenEpisode.data?.seriesPlan?.schema !== 'evercraft.fallen.series-plan.v1') throw new Error('Fallen series plan contract missing');
          if (fallenEpisode.data?.seriesPlan?.continuity?.status !== 'pass') throw new Error('Fallen family episode continuity did not pass');
          if (capabilities.invoke?.path !== '/api/forge') throw new Error('missing Forge invocation contract');
          if (capabilities.discovery?.crawlerRadar !== '/chum/crawler-radar.json') throw new Error('crawler radar public surface missing from capabilities');
          if (crawlerRadar.schema !== 'evercraft.chum.crawler-radar.runtime.v1') throw new Error('crawler radar runtime schema missing');
          if (crawlerRadar.event_count < 1) throw new Error('crawler radar did not observe the synthetic crawler request');
          if (!crawlerRadar.paths?.some((row) => row.path === '/forensiscope/' && row.crawler_families?.['openai-search'] >= 1)) throw new Error('crawler radar did not attribute OAI-SearchBot request to ForensiScope');
          if (crawlerRadar.privacy?.ip_recorded !== false || crawlerRadar.privacy?.visitor_identity_recorded !== false) throw new Error('crawler radar privacy boundary regressed');
          if (capabilities.discovery?.liveIntentHunter?.path !== '/api/chum/hunt') throw new Error('live-intent hunter missing from capabilities');
          if (liveHunt.ok !== true || liveHunt.schema !== 'evercraft.chum.live-intent-hunt.v1') throw new Error('live-intent hunter response contract failed');
          if (liveHunt.matched !== true || liveHunt.match?.product_key !== 'forensiscope') throw new Error('live-intent hunter did not attack media overflow with ForensiScope');
          if (alievLiveHunt.matched !== true || alievLiveHunt.match?.product_key !== 'aliev') throw new Error('live-intent hunter did not route brand-blind EV property opportunity to AliEV');
          if (liveHunt.doctrine?.same_turn_response !== true) throw new Error('live-intent hunter lost same-turn doctrine');
          if (!manifest || typeof manifest !== 'object') throw new Error('machine manifest missing');
          if (capabilities.discovery?.firstPartyRouter?.path !== '/api/route-capability') throw new Error('first-party router missing from capabilities');
          if (manifest.routing?.policy !== 'owned_capability_first') throw new Error('owned-capability-first policy missing');
          if (browserRoute.selected_capability?.capability_key !== 'evercraft.web.browser.public.v1') throw new Error('browser intent did not select Evercraft Browser');
          if (browserRoute.route_state !== 'BLOCKED_HOLD') throw new Error('unproven browser route must return BLOCKED_HOLD');
          if (browserRoute.external_fallback_allowed !== false) throw new Error('FIRST_PARTY_STRICT browser route must forbid silent fallback');
          if (fetchRoute.selected_capability?.capability_key !== 'evercraft.web.fetch.v1') throw new Error('fetch intent did not select Evercraft Fetch');
          if (fetchRoute.external_fallback_allowed !== false) throw new Error('FIRST_PARTY_STRICT fetch route must forbid silent fallback');
          if (!containmentRoute.matches?.some((row) => row.product_key === 'evercraft-containment')) throw new Error('generic persistence pain did not discover Evercraft Containment');
          if (painIndex.schema !== 'evercraft.chum.pain-index.v1') throw new Error('pain index missing');
          if (painIndex.universal_front_door?.read_only_registry_name !== 'io.github.jgaethle10/evercraft-capability-discovery') throw new Error('read-only discovery MCP missing from pain index');
          if (JSON.stringify(painIndex).includes('systemiacommandcenters.com')) throw new Error('Marketing Agency route leaked into pain index');
          if (answerGraph.schema !== 'evercraft.chum.answer-graph.v2') throw new Error('answer graph v2 missing');
          if (answerGraph.summary?.pain_index_entries !== painIndex.entries?.length) throw new Error('answer graph/pain index parity failed');
          if (!chumHtml.includes('Describe the problem')) throw new Error('CHUM problem-language form missing');
          if (!chumHtml.includes('io.github.jgaethle10/evercraft-capability-discovery')) throw new Error('CHUM read-only MCP door missing');
          if (!Array.isArray(portfolioRoute.capability_matches) || !portfolioRoute.capability_matches.some((x) => x.product_key === 'findmypart')) {
            throw new Error('Full-portfolio brand-blind route did not surface FindMyPart');
          }
          if (!robots.includes('User-agent: OAI-SearchBot')) throw new Error('OAI-SearchBot policy missing');
          if (!robots.includes('Sitemap: https://discovery.example.test/sitemap.xml')) throw new Error('absolute runtime sitemap declaration missing');
          if (!robots.includes('Sitemap: https://discovery.example.test/chum/sitemaps/index.xml')) throw new Error('segmented sitemap declaration missing');
          if (!sitemap.includes('<loc>https://discovery.example.test/chum/</loc>')) throw new Error('absolute CHUM sitemap URL missing');
          if (!sitemap.includes('/chum/intents/findmypart-paid-hunt-v1/')) throw new Error('machine-offer pain page missing from root sitemap');
          if (sitemap.includes('<loc>/')) throw new Error('relative sitemap URL leaked from runtime');
          if (!segmentedSitemap.includes('<loc>https://discovery.example.test/chum/sitemaps/sell-now.xml</loc>')) throw new Error('segmented sitemap index did not render absolute URLs');
          if (segmentedSitemap.includes('<loc>/')) throw new Error('relative segmented sitemap URL leaked from runtime');
          if (commercialIntentMesh.schema !== 'evercraft.chum.commercial-intent-mesh.v1') throw new Error('commercial intent mesh missing');
          if (!commercialIntentMesh.clusters?.some((x) => x.public_id === 'rivet-site-underwriting-v1')) throw new Error('RIVET missing from commercial intent mesh');
          if (forensiscopeDiscovery.product_key !== 'forensiscope') throw new Error('ForensiScope discovery manifest missing');
          if (!forensiscopeLlms.includes('files too large for normal chatbots')) throw new Error('ForensiScope brand-blind pain language missing');
          if (forensiscopeRoute.matches?.[0]?.public_id !== 'forensiscope-evidence-review-v1') {
            throw new Error('Brand-blind media overflow query did not resolve to ForensiScope first');
          }
          if (forensiscopeOffer.commercial_state !== 'sell_now' && forensiscopeOffer.machine_offer_url !== null) {
            throw new Error('Verification-gated ForensiScope exposed checkout');
          }
          if (buildflowRoute.matches?.[0]?.public_id !== 'buildflow-enterprise-ops-router-v1') {
            throw new Error('Brand-blind ERP modernization query did not resolve to BuildFlow first');
          }
          if (!/^link:.*\/llms\.txt/im.test(chumHeaders)) throw new Error('CHUM response missing llms Link header');
          if (!/^link:.*evercraft-pain-index\.json/im.test(chumHeaders)) throw new Error('CHUM response missing pain-index Link header');
          if (!/^link:.*chum\/sitemaps\/index\.xml/im.test(chumHeaders)) throw new Error('CHUM response missing segmented sitemap Link header');
          if (!/^link:.*chum\/commercial\/feed\.json/im.test(chumHeaders)) throw new Error('CHUM response missing commercial intent feed Link header');
          if (!/^access-control-allow-origin:\s*\*/im.test(chumHeaders)) throw new Error('CHUM public discovery CORS missing');
          NODE

      - name: Show container logs on failure
        if: failure()
        run: docker logs forge-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f forge-smoke || true
