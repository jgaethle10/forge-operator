name: Forge checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run check

      - name: Build production container
        run: docker build -t forge-operator:${{ github.sha }} .

      - name: Start production container
        run: |
          docker run -d \
            --name forge-smoke \
            -e GEMINI_API_KEY=smoke-not-a-real-key \
            -p 3000:3000 \
            forge-operator:${{ github.sha }}

      - name: Verify health and discovery surfaces
        run: |
          set -euo pipefail

          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Forge container did not become healthy."
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3000/api/health | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/api/capabilities | tee /tmp/capabilities.json
          curl --fail --silent http://127.0.0.1:3000/llms.txt > /tmp/llms.txt
          curl --fail --silent http://127.0.0.1:3000/llms-full.txt > /tmp/llms-full.txt
          curl --fail --silent http://127.0.0.1:3000/openapi.json > /tmp/openapi.json
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-discovery.json > /tmp/watershed.json
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-chum.json > /tmp/chum.json
          curl --fail --silent http://127.0.0.1:3000/api/discovery > /tmp/discovery.json
          curl --fail --silent http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-capabilities.json > /tmp/manifest.json

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const capabilities = JSON.parse(fs.readFileSync('/tmp/capabilities.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const openapi = JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          const watershed = JSON.parse(fs.readFileSync('/tmp/watershed.json','utf8'));
          const chum = JSON.parse(fs.readFileSync('/tmp/chum.json','utf8'));
          const discovery = JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'));
          const robots = fs.readFileSync('/tmp/robots.txt','utf8');

          if (health.ok !== true) throw new Error('health.ok must be true');
          if (health.service !== 'forge-operator') throw new Error('unexpected health service');
          if (capabilities.schema !== 'evercraft.capability.v1') throw new Error('unexpected capability schema');
          if (capabilities.invoke?.path !== '/api/forge') throw new Error('missing Forge invocation contract');
          if (!manifest || typeof manifest !== 'object') throw new Error('machine manifest missing');
          if (openapi.openapi !== '3.1.0') throw new Error('OpenAPI contract missing');
          if (watershed.schema !== 'evercraft.discovery-watershed.v1') throw new Error('discovery watershed missing');
          if (chum.schema !== 'evercraft.chum.v3') throw new Error('CHUM v3 manifest missing');
          if (discovery.schema !== 'evercraft.discovery.v1') throw new Error('runtime discovery missing');
          for (const token of ['OAI-SearchBot','ChatGPT-User','Claude-SearchBot','PerplexityBot','Perplexity-User','Googlebot','bingbot']) {
            if (!robots.includes(token)) throw new Error(`crawler door missing: ${token}`);
          }
          NODE

      - name: Show container logs on failure
        if: failure()
        run: docker logs forge-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f forge-smoke || true
