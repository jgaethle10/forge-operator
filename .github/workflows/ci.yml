name: Forge checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify CHUM watershed compiler
        run: |
          npm run chum:mirror
          node - <<'NODE'
          const fs = require('fs');
          const products = JSON.parse(fs.readFileSync('public/.well-known/evercraft-products.json','utf8'));
          const machine = JSON.parse(fs.readFileSync('public/.well-known/evercraft-machine-catalog.json','utf8'));
          const index = JSON.parse(fs.readFileSync('public/chum/index.json','utf8'));
          const offers = JSON.parse(fs.readFileSync('public/chum/offers/index.json','utf8'));
          const intents = JSON.parse(fs.readFileSync('public/chum/intents.json','utf8'));
          const expectedIntents = (machine.offers || []).reduce((n,o)=>n + (Array.isArray(o.intent_terms) ? o.intent_terms.length : 0), 0);
          if ((index.products || []).length !== (products.products || []).length) throw new Error('CHUM product count drift');
          if ((index.offers || []).length !== (machine.offers || []).length) throw new Error('CHUM offer count drift');
          if (offers.offer_count !== (machine.offers || []).length) throw new Error('CHUM offer index drift');
          if (intents.intent_count !== expectedIntents) throw new Error('CHUM intent count drift');
          if (!fs.existsSync('AI-CAPABILITY-CATALOG.md')) throw new Error('CHUM GitHub capability catalog missing');
          console.log(JSON.stringify({products:index.products.length,offers:index.offers.length,intents:intents.intent_count}));
          NODE

      - name: Typecheck and build
        run: npm run check

      - name: Build production container
        run: docker build -t forge-operator:${{ github.sha }} .

      - name: Start production container
        run: |
          docker run -d \
            --name forge-smoke \
            -e GEMINI_API_KEY=smoke-not-a-real-key \
            -p 3000:3000 \
            forge-operator:${{ github.sha }}

      - name: Verify health and discovery surfaces
        run: |
          set -euo pipefail

          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Forge container did not become healthy."
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3000/api/health | tee /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/api/capabilities | tee /tmp/capabilities.json
          curl --fail --silent http://127.0.0.1:3000/llms.txt > /tmp/llms.txt
          curl --fail --silent http://127.0.0.1:3000/.well-known/evercraft-capabilities.json > /tmp/manifest.json

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const capabilities = JSON.parse(fs.readFileSync('/tmp/capabilities.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));

          if (health.ok !== true) throw new Error('health.ok must be true');
          if (health.service !== 'forge-operator') throw new Error('unexpected health service');
          if (capabilities.schema !== 'evercraft.capability.v1') throw new Error('unexpected capability schema');
          if (capabilities.invoke?.path !== '/api/forge') throw new Error('missing Forge invocation contract');
          if (!manifest || typeof manifest !== 'object') throw new Error('machine manifest missing');
          NODE

      - name: Show container logs on failure
        if: failure()
        run: docker logs forge-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f forge-smoke || true
