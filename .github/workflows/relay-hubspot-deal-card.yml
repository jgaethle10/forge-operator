name: Relay HubSpot Deal Card contract
on:
  pull_request:
    paths:
      - 'integrations/hubspot-relay/**'
      - '.github/workflows/relay-hubspot-deal-card.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/hubspot-relay/tests/*.test.mjs
