name: Client 001 Owned Static Edge Proof
on:
  pull_request:
    paths:
      - 'infra/evercraft-edge/client001-on-the-go/**'
      - 'scripts/stage-client001-owned-edge.sh'
      - 'scripts/client001-domain-rdap.mjs'
      - 'tests/client001-owned-edge.test.mjs'
      - 'tests/client001-field-preflight.test.mjs'
      - 'tests/client001-caddy-coexistence.test.mjs'
      - 'scripts/client001-caddy-coexistence.mjs'
      - 'scripts/client001-field-preflight.mjs'
      - '.github/workflows/client001-owned-static-edge.yml'
      - 'public/clients/on-the-go/review/index.html'
  push:
    branches: [main]
    paths:
      - 'infra/evercraft-edge/client001-on-the-go/**'
      - 'scripts/stage-client001-owned-edge.sh'
      - 'tests/client001-owned-edge.test.mjs'
      - 'tests/client001-field-preflight.test.mjs'
      - 'tests/client001-caddy-coexistence.test.mjs'
      - 'scripts/client001-caddy-coexistence.mjs'
      - 'scripts/client001-field-preflight.mjs'
      - '.github/workflows/client001-owned-static-edge.yml'
      - 'public/clients/on-the-go/review/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-owned-static-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce client-owned hostname and no deployment side effects
        run: |
          node --check scripts/client001-field-preflight.mjs
          node --check scripts/client001-caddy-coexistence.mjs
          node --test tests/client001-owned-edge.test.mjs tests/client001-field-preflight.test.mjs tests/client001-caddy-coexistence.test.mjs
      - name: Parse candidate Caddy host with real Caddy, no DNS or public connection
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env CLIENT001_DOMAIN=onthegoquicklube.invalid \
            -v "$PWD/infra/evercraft-edge/client001-on-the-go/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty \
            > "$RUNNER_TEMP/client001-caddy-adapted.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const v=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/client001-caddy-adapted.json','utf8'));
          const compact=JSON.stringify(v);
          assert.ok(v.apps?.http?.servers && Object.keys(v.apps.http.servers).length>0);
          assert.match(compact,/onthegoquicklube\.invalid/);
          assert.match(compact,/file_server/);
          const strings=[];
          const scan=(v)=>{
            if(typeof v==='string'){strings.push(v);return;}
            if(Array.isArray(v)){for(const t of v)scan(t);return;}
            if(v&&typeof v==='object')for(const t of Object.values(v))scan(t);
          };
          scan(v);
          assert.ok(strings.some(s=>/User-agent:\s*\*\n\s*Disallow:\s*\//.test(s)),'robots response must contain a real newline');
          assert.doesNotMatch(compact,/reverse_proxy|github\.io|onrender\.com/);
          console.log('CADDY_ADAPT_PASS: invalid test hostname only, no public TLS or DNS');
          NODE
      - name: Rehearse coexistence with exact Fabric installer Caddyfile in offline container
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {composeCandidate} from './scripts/client001-caddy-coexistence.mjs';
          const installer=fs.readFileSync('scripts/install-fabric-owned-edge.sh','utf8');
          const found=installer.match(/sudo tee \/etc\/evercraft\/Caddyfile >\/dev\/null <<'EOF'\n([\s\S]*?)\nEOF/);
          if(!found)throw Error('cannot_find_canonical_installer_caddyfile');
          const base=found[1]+'\n';
          const fragment=fs.readFileSync('infra/evercraft-edge/client001-on-the-go/Caddyfile.example','utf8');
          const combined=composeCandidate(base,fragment);
          const dir=process.env.RUNNER_TEMP;
          fs.writeFileSync(path.join(dir,'fabric-existing.Caddyfile'),base,{mode:0o600});
          fs.writeFileSync(path.join(dir,'client001-composed.Caddyfile'),combined,{mode:0o600});
          if(!combined.startsWith(base))throw Error('existing_caddyfile_modified');
          console.log('BASE_CONFIG_PREFIX_UNCHANGED; synthesized additional hostname only');
          NODE
          for name in fabric-existing client001-composed; do
            docker run --rm --network none \
              --env EVERCRAFT_PUBLIC_HOST=fabric.systemiacommandcenters.invalid \
              --env EVERCRAFT_ACME_EMAIL=ops@example.invalid \
              --env CLIENT001_DOMAIN=onthegoquicklube.invalid \
              -v "$RUNNER_TEMP/$name.Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
              > "$RUNNER_TEMP/$name.adapted.json"
          done
          # Exercise the exact stdin-only Caddy adapter mode used by the
          # physical-node read-only rehearsal, still in an isolated CI container.
          cat "$RUNNER_TEMP/client001-composed.Caddyfile" |
            docker run --rm --network none -i \
              --env EVERCRAFT_PUBLIC_HOST=fabric.systemiacommandcenters.invalid \
              --env EVERCRAFT_ACME_EMAIL=ops@example.invalid \
              --env CLIENT001_DOMAIN=onthegoquicklube.invalid \
              caddy:2 caddy adapt --config /dev/stdin --adapter caddyfile \
              > "$RUNNER_TEMP/client001-composed-stdin.adapted.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const base=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/client001-composed.adapted.json','utf8'));
          const stdin=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/client001-composed-stdin.adapted.json','utf8'));
          // Caddy includes the input filename in adapted source metadata.
          // That path changes with stdin, but must not change route behavior.
          const canonical=x=>JSON.parse(JSON.stringify(x)
            .replaceAll('/dev/stdin','<input>')
            .replaceAll('/etc/caddy/Caddyfile','<input>'));
          assert.deepEqual(canonical(stdin),canonical(base));
          console.log('CADDY_READ_ONLY_STDIN_ADAPTER_PASS');
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {assertCoexistence} from './scripts/client001-caddy-coexistence.mjs';
          const dir=process.env.RUNNER_TEMP;
          const read=name=>JSON.parse(fs.readFileSync(path.join(dir,name+'.adapted.json'),'utf8'));
          const verdict=assertCoexistence(read('fabric-existing'),read('client001-composed'),
            {fabricHost:'fabric.systemiacommandcenters.invalid'});
          assert.equal(verdict.original_host_routes_preserved,true);
          assert.deepEqual(verdict.added_hosts,['onthegoquicklube.invalid','www.onthegoquicklube.invalid']);
          console.log(JSON.stringify({schema:'evercraft.client001.caddy-coexistence-ci.v1',
            state:'PASS_SOURCE_ONLY',host_preservation:verdict.original_host_routes_preserved,
            original_host_route_count:verdict.original_host_route_count,
            added_synthetic_hosts:verdict.added_hosts,real_public_domain_tested:false,
            physical_caddyfile_modified:false,service_reloaded:false,
            public_deploy_performed:false}));
          NODE
      - name: Test immutable release staging on disposable CI host
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/evercraft/client001/releases
          sudo chown "$(id -u):$(id -g)" /srv/evercraft/client001/releases
          test ! -e /srv/evercraft/client001/current
          bash scripts/stage-client001-owned-edge.sh
          SOURCE_SHA="$(sha256sum public/clients/on-the-go/review/index.html | cut -d ' ' -f1)"
          cmp public/clients/on-the-go/review/index.html \
            "/srv/evercraft/client001/releases/$SOURCE_SHA/index.html"
          bash scripts/stage-client001-owned-edge.sh
          test ! -e /srv/evercraft/client001/current
          # A descendant path under a symlinked ancestor must never be accepted.
          ln -s "$RUNNER_TEMP" /srv/evercraft/client001/releases/reject-ancestor
          if EVERCRAFT_CLIENT001_RELEASE_ROOT=/srv/evercraft/client001/releases/reject-ancestor/child \
            bash scripts/stage-client001-owned-edge.sh; then
            echo 'FAIL: symlinked ancestor accepted' >&2
            exit 1
          fi
          rm /srv/evercraft/client001/releases/reject-ancestor
          # Tampered existing release directory must fail, not get overwritten.
          printf 'do not accept tampering' > "/srv/evercraft/client001/releases/$SOURCE_SHA/unexpected.txt"
          if bash scripts/stage-client001-owned-edge.sh; then
            echo 'FAIL: unexpected digest directory content accepted' >&2
            exit 1
          fi
          rm "/srv/evercraft/client001/releases/$SOURCE_SHA/unexpected.txt"
          bash scripts/stage-client001-owned-edge.sh
          node scripts/client001-field-preflight.mjs > "$RUNNER_TEMP/client001-field-preflight.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/client001-field-preflight.json','utf8'));
          assert.equal(data.status,'HOLD_PUBLIC_PROMOTION');
          assert.equal(data.release_staged,true);
          assert.equal(data.staged_digest_verified,true);
          assert.equal(data.public_deploy_performed,false);
          assert.equal(data.public_dns_changed,false);
          assert.equal(data.customer_release_authorized,false);
          console.log('CLIENT001_FIELD_PREFLIGHT_PASS_STAGED_ONLY');
          NODE
          if EVERCRAFT_CLIENT001_RELEASE_ROOT="$RUNNER_TEMP/forbidden" bash scripts/stage-client001-owned-edge.sh; then
            echo 'FAIL: staging outside owned release root accepted' >&2
            exit 1
          fi
          echo 'STAGE_PASS: digest preserved; repeat safe; no active symlink, DNS edit or public deploy'
      - name: Observe Verisign domain records without spending or editing DNS
        continue-on-error: true
        run: node scripts/client001-domain-rdap.mjs --out "$RUNNER_TEMP/client001-domain-rdap.json"
      - name: Preserve bounded nonproduction Caddy parse artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client001-owned-edge-source-proof
          path: |
            ${{ runner.temp }}/client001-caddy-adapted.json
            ${{ runner.temp }}/client001-domain-rdap.json
            ${{ runner.temp }}/client001-field-preflight.json
            ${{ runner.temp }}/fabric-existing.adapted.json
            ${{ runner.temp }}/client001-composed.adapted.json
            ${{ runner.temp }}/client001-composed-stdin.adapted.json
          if-no-files-found: warn
          retention-days: 7
