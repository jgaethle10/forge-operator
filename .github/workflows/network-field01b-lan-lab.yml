name: Evercraft Network Field01B authenticated LAN lab

on:
  pull_request:
    paths:
      - 'systemia/network/field01b-lan-lab.mjs'
      - 'systemia/network/FIELD01B-LAN-LAB.md'
      - 'systemia/network/field01b-lan-cli.mjs'
      - 'tests/network-field01b-lan-lab.test.mjs'
      - '.github/workflows/network-field01b-lan-lab.yml'
  push:
    branches:
      - 'feature/network-field01b-*'
    paths:
      - 'systemia/network/field01b-lan-lab.mjs'
      - 'systemia/network/FIELD01B-LAN-LAB.md'
      - 'systemia/network/field01b-lan-cli.mjs'
      - 'tests/network-field01b-lan-lab.test.mjs'
      - '.github/workflows/network-field01b-lan-lab.yml'

permissions:
  contents: read

jobs:
  synthetic-authenticated-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real loopback HTTP transport with authenticated synthetic envelopes and durable-replay tests
        run: node --test tests/network-field01b-lan-lab.test.mjs
