name: FAIE El Salvador source contract
on:
  pull_request:
    paths:
      - 'systemia/faie/international/**'
      - 'tests/faie-el-salvador-pilot-registry.test.mjs'
      - '.github/workflows/faie-el-salvador-source-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate country source registry without fetching or ingesting
        run: node --test tests/faie-el-salvador-pilot-registry.test.mjs
