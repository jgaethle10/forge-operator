name: Commercial Studio first-screen conversion gate
on:
  pull_request:
    paths:
      - 'public/commercial-studio/index.html'
      - 'tests/commercial-studio-pain-first-hero.test.mjs'
      - '.github/workflows/commercial-studio-first-screen.yml'
  push:
    branches: [main]
    paths:
      - 'public/commercial-studio/index.html'
      - 'tests/commercial-studio-pain-first-hero.test.mjs'
      - '.github/workflows/commercial-studio-first-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offer-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/commercial-studio-pain-first-hero.test.mjs
