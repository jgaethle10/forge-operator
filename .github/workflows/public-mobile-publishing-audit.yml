name: Public mobile publishing audit

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/audit-public-mobile-stability.mjs'
      - '.github/workflows/public-mobile-publishing-audit.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/audit-public-mobile-stability.mjs'
      - '.github/workflows/public-mobile-publishing-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit public mobile stability
        run: |
          mkdir -p artifacts
          node scripts/audit-public-mobile-stability.mjs --strict-demos --json=artifacts/public-mobile-stability.json | tee artifacts/public-mobile-stability.txt
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -s artifacts/public-mobile-stability.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('artifacts/public-mobile-stability.json','utf8'));
          console.log('## Evercraft public mobile publishing audit');
          console.log('');
          console.log('- HTML surfaces scanned: **'+x.files_scanned+'**');
          console.log('- Pass: **'+x.pass+'**');
          console.log('- Review: **'+x.review+'**');
          console.log('- High risk: **'+x.high_risk+'**');
          console.log('- Strict demo failures: **'+x.strict_demo_failures+'**');
          NODE
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-mobile-stability-audit
          path: artifacts/public-mobile-stability.*
          if-no-files-found: warn
          retention-days: 30
