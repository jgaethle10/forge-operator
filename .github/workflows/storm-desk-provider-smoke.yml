name: National Storm Desk real NOAA source smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'systemia/radar/nws-*.mjs'
      - 'systemia/radar/collectors.mjs'
      - '.github/workflows/storm-desk-provider-smoke.yml'

permissions:
  contents: read

jobs:
  provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real NWS active alerts and preliminary LSR smoke
        run: node systemia/radar/nws-provider-smoke.mjs
