name: Economic Pressure Atlas bridge tests
on:
  pull_request:
    paths:
      - 'systemia/household-fabric/economic-pressure-bridge.mjs'
      - 'systemia/household-fabric/economic-pressure-bridge.test.mjs'
      - 'systemia/household-fabric/ECONOMIC_PRESSURE_ATLAS.md'
      - '.github/workflows/economic-pressure-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/household-fabric/economic-pressure-bridge.mjs'
      - 'systemia/household-fabric/economic-pressure-bridge.test.mjs'
permissions:
  contents: read
jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test economic provenance and existing household ranking
        run: |
          node --test systemia/household-fabric/economic-pressure-bridge.test.mjs systemia/household-fabric/engine.test.mjs systemia/household-fabric/surface.test.mjs
