name: Photon Forge V3 Source and Smoke Tests
on:
  pull_request:
    paths:
      - 'scripts/photon-forge-v3/**'
      - '.github/workflows/photon-forge-v3.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software-renderer test dependencies
        run: python -m pip install -r scripts/photon-forge-v3/requirements.txt
      - name: Test deterministic sample frames, visual changes and brand lockup
        run: python -m unittest discover -v -s scripts/photon-forge-v3 -p 'test_*.py'
