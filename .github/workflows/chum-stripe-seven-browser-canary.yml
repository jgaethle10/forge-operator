name: CHUM Systemia Stripe seven browser canary
on:
  pull_request:
    paths:
      - 'systemia/evercraft-web/browser-worker/verify-systemia-stripe-seven.mjs'
      - 'systemia/evercraft-web/browser-worker/verify-systemia-stripe-seven.test.mjs'
      - 'public/mesh/checkout-ready/verified-links.json'
      - '.github/workflows/chum-stripe-seven-browser-canary.yml'
      - 'systemia/payments/exact-sku-checkout.mjs'
      - 'tests/exact-sku-checkout.test.mjs'
      - 'public/mesh/checkout-ready/products.json'
      - 'public/.well-known/evercraft-payments-additional-exact-skus.json'
      - 'registry/public-products.json'
  workflow_dispatch:
  schedule:
    # Every six hours: read-only verification, no checkout POST or card entry.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: chum-systemia-seven-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buyer-checkout-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove universal Evercraft Payments exact-SKU routing
        run: node --test tests/exact-sku-checkout.test.mjs
      - name: Validate exact-SKU detection contract
        working-directory: systemia/evercraft-web/browser-worker
        run: |
          npm install --no-audit --no-fund
          node --check verify-systemia-stripe-seven.mjs
          node --test verify-systemia-stripe-seven.test.mjs
      - name: Install owned Browser Worker Chromium
        working-directory: systemia/evercraft-web/browser-worker
        run: npx playwright install --with-deps chromium
      - name: Inspect seven exact-SKU hosted payment pages without interacting
        id: browser
        continue-on-error: true
        env:
          EVERCRAFT_STRIPE_BROWSER_RECEIPT: ${{ runner.temp }}/systemia-stripe-seven-browser.json
        run: node systemia/evercraft-web/browser-worker/verify-systemia-stripe-seven.mjs --gate
      - name: Save trustworthy buyer-view receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemia-stripe-seven-buyer-view
          path: ${{ runner.temp }}/systemia-stripe-seven-browser.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on incomplete rendered checkout proof
        if: steps.browser.outcome == 'failure'
        run: |
          echo 'One or more provider pages failed exact-SKU rendered-checkout proof. No payment, sale or automatic fulfillment has been inferred.'
          exit 1
