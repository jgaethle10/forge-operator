name: Industrial Base Supplier Readiness

on:
  pull_request:
    paths:
      - 'systemia/industrial-base/**'
      - 'package.json'
      - '.github/workflows/industrial-base-supplier-readiness.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/industrial-base/**'
      - 'package.json'
      - '.github/workflows/industrial-base-supplier-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove public supplier readiness boundaries
        run: npm run test:industrial-base
