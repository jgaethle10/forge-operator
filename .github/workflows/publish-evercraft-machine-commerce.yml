name: Publish Evercraft MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - "registry/**/server.json"
      - ".github/workflows/publish-evercraft-machine-commerce.yml"
      - "systemia/release/**"
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main-branch commit SHA to publish
        required: true
        type: string
      approval:
        description: Type RELEASE for a human-approved trust/destructive publication
        required: true
        type: string
      approval_ref:
        description: Human approval reference or reason
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      base: ${{ steps.gate.outputs.base }}
      release_allowed: ${{ steps.gate.outputs.release_allowed }}
      risk_class: ${{ steps.gate.outputs.risk_class }}
    steps:
      - name: Resolve revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and authorize
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.revision.outputs.sha }}"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SHA" origin/main || { echo "Requested SHA is not on main."; exit 1; }
          BASE="$(git rev-parse "$SHA^")"

          npm install --no-audit --no-fund
          npm run check

          node systemia/release/release-policy.mjs --base "$BASE" --head "$SHA" > release-classification.json
          RISK="$(node -p "require('./release-classification.json').riskClass")"
          AUTO="$(node -p "require('./release-classification.json').autoReleaseAllowed")"

          ALLOWED="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.approval }}" = "RELEASE" ] && [ -n "${{ inputs.approval_ref }}" ] && ALLOWED="true"
          elif [ "$RISK" = "routine_public" ] && [ "$AUTO" = "true" ]; then
            ALLOWED="true"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "release_allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "risk_class=$RISK" >> "$GITHUB_OUTPUT"

          {
            echo "## Systemia ReleaseAuthorization"
            echo "- Revision: \`$SHA\`"
            echo "- Risk class: **$RISK**"
            echo "- Release allowed: **$ALLOWED**"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: authorize
    if: needs.authorize.outputs.release_allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0

      - name: Determine changed registry manifests
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ needs.authorize.outputs.base }}" "${{ needs.authorize.outputs.sha }}" -- 'registry/**/server.json' > /tmp/manifests.txt
          if [ ! -s /tmp/manifests.txt ]; then
            echo "No registry manifests changed."
            exit 0
          fi
          cat /tmp/manifests.txt

      - name: Install MCP Publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate changed Evercraft registry manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            echo "Validating $FILE"
            ./mcp-publisher validate "$FILE"
          done < /tmp/manifests.txt

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish authorized manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            echo "Publishing $FILE"
            set +e
            OUTPUT="$(./mcp-publisher publish "$FILE" 2>&1)"
            CODE=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$CODE" -eq 0 ]; then
              continue
            fi
            if printf '%s' "$OUTPUT" | grep -qi "cannot publish duplicate version"; then
              echo "Already published; continuing."
              continue
            fi
            exit "$CODE"
          done < /tmp/manifests.txt

      - name: Record ReleaseExecutionReceipt
        run: |
          {
            echo "## ReleaseExecutionReceipt"
            echo "- Revision: \`${{ needs.authorize.outputs.sha }}\`"
            echo "- Risk class: **${{ needs.authorize.outputs.risk_class }}**"
            echo "- Target: Official MCP Registry"
            echo "- credential_material_stored: false"
          } >> "$GITHUB_STEP_SUMMARY"

  held:
    needs: authorize
    if: needs.authorize.outputs.release_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Systemia held this publication for explicit approval." >> "$GITHUB_STEP_SUMMARY"
