name: Publish Evercraft Machine Commerce to MCP Registry

on:
  workflow_dispatch:
  push:
    paths:
      - "registry/evercraft-machine-commerce/server.json"
      - ".github/workflows/publish-evercraft-machine-commerce.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate registry manifest
        run: ./mcp-publisher validate registry/evercraft-machine-commerce/server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Evercraft Machine Commerce
        run: ./mcp-publisher publish registry/evercraft-machine-commerce/server.json
