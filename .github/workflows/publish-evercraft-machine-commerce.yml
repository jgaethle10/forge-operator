name: Publish Evercraft MCP Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "registry/**/server.json"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate all Evercraft registry manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            echo "Validating $FILE"
            ./mcp-publisher validate "$FILE"
          done < <(find registry -name server.json -print0 | sort -z)

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish all Evercraft registry manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            echo "Publishing $FILE"
            set +e
            OUTPUT="$(./mcp-publisher publish "$FILE" 2>&1)"
            CODE=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$CODE" -eq 0 ]; then
              continue
            fi
            if printf '%s' "$OUTPUT" | grep -qi "cannot publish duplicate version"; then
              echo "Already published; continuing."
              continue
            fi
            exit "$CODE"
          done < <(find registry -name server.json -print0 | sort -z)
