name: Publish Evercraft Machine Commerce to MCP Registry

on:
  workflow_dispatch:
  push:
    paths:
      - "registry/evercraft-machine-commerce/server.json"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate registry manifest
        run: ./mcp-publisher validate registry/evercraft-machine-commerce/server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Evercraft Machine Commerce
        shell: bash
        run: |
          set +e
          OUTPUT="$(./mcp-publisher publish registry/evercraft-machine-commerce/server.json 2>&1)"
          CODE=$?
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -qi "cannot publish duplicate version"; then
            echo "Registry already contains this version; treating publish as idempotent success."
            exit 0
          fi
          exit "$CODE"
