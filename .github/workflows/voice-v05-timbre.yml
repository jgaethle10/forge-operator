name: Voice Foundry V05 Identity Audition (private only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v05-identity-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Voice Foundry draft branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source audit before installing models
        run: |
          python systemia/media-studio/voice-v05-timbre-lab.py --verify-only
          node --test tests/media-voice-v05-timbre.test.mjs
      - name: Install Kokoro CPU audio prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Render twelve real neural recordings without phoneme overrides
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python systemia/media-studio/voice-v05-timbre-lab.py private-v05-timbre-audition
          test -s private-v05-timbre-audition/evidence.json
          test -s private-v05-timbre-audition/index.html
          test "$(find private-v05-timbre-audition -maxdepth 1 -name '*.wav' | wc -l)" -eq 12
          test "$(find private-v05-timbre-audition -maxdepth 1 -name '*.mp3' | wc -l)" -eq 12
      - name: Upload offline listening pack and evidence
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-v05-identity-audition
          path: private-v05-timbre-audition/
          if-no-files-found: error
          retention-days: 7
