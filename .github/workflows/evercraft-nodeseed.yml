name: Evercraft NodeSeed

on:
  pull_request:
    paths:
      - 'systemia/compute/**'
      - 'systemia/yard/**'
      - '.github/workflows/evercraft-nodeseed.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/compute/**'
      - 'systemia/yard/**'
      - '.github/workflows/evercraft-nodeseed.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Evercraft NodeSeed discovery and authenticated allocation
        run: node systemia/compute/node-seed-proof.mjs
