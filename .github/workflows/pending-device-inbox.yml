name: Pending remote device inbox

on:
  pull_request:
    paths:
      - 'systemia/network/outbound-capacity-broker.mjs'
      - 'systemia/network/outbound-node-agent.mjs'
      - 'systemia/compute/remote-admission-keeper.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/yard/pending-device-inbox.proof.mjs'
      - 'systemia/network/PENDING-DEVICE-INBOX.md'
      - '.github/workflows/pending-device-inbox.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/network/outbound-capacity-broker.mjs'
      - 'systemia/network/outbound-node-agent.mjs'
      - 'systemia/compute/remote-admission-keeper.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/yard/pending-device-inbox.proof.mjs'
      - 'systemia/network/PENDING-DEVICE-INBOX.md'
      - '.github/workflows/pending-device-inbox.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove zero-authority pending enrollment inbox
        run: node systemia/yard/pending-device-inbox.proof.mjs
