name: Demand Command owned canary
on:
  pull_request:
    paths:
      - "sites/demand-command/**"
      - ".github/workflows/demand-command-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-local-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-only deployment scripts (no external runtime)
        run: |
          bash -n sites/demand-command/deploy/install-nextgen-resident.sh
          bash -n sites/demand-command/deploy/install-nextgen-demand-tunnel.sh
          bash -n sites/demand-command/deploy/inspect-penguin-public-route.sh
          bash -n sites/demand-command/deploy/inspect-penguin-ssh-readiness.sh
          bash -n sites/demand-command/deploy/install-penguin-demand-relay.sh
          node --test sites/demand-command/deploy/test-release-contract.mjs
          python3 -m unittest discover -s sites/demand-command/deploy -p 'test_validate_ssh_keyscan.py' -v
      - name: Verify private API and source adapters on synthetic data
        working-directory: sites/demand-command/backend
        run: |
          python3 -m unittest discover -v
          node --test test_console_source_pulse.mjs
