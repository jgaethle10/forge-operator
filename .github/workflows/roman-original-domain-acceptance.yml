name: Roman ORIGINAL domain visitor acceptance

on:
  pull_request:
    paths:
      - 'systemia/domain-shield/roman-primary-acceptance*.mjs'
      - '.github/workflows/roman-original-domain-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/domain-shield/roman-primary-acceptance*.mjs'
      - '.github/workflows/roman-original-domain-acceptance.yml'
  workflow_dispatch:
  schedule:
    # Root-domain mission acceptance daily during remaining election window.
    # Do not confuse 200 on independent mirrors with the original-domain fix.
    - cron: '17 16 * 10 *'
    - cron: '17 16 1-3 11 *'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit acceptance behavior
        run: node --test systemia/domain-shield/roman-primary-acceptance.test.mjs

  real-visitor-url:
    needs: proof
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact original domain can reach the website
        shell: bash
        run: |
          set -euo pipefail
          local_day="$(TZ=America/Los_Angeles date +%Y-%m-%d)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [[ "$local_day" > "2026-11-03" ]]; then
            echo "Election-window primary-domain acceptance ended." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node systemia/domain-shield/roman-primary-acceptance-cli.mjs --receipt artifacts/roman-original-domain.json
      - name: Preserve original-domain failure/success receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-original-domain-acceptance
          path: artifacts/roman-original-domain.json
          if-no-files-found: ignore
          retention-days: 10
