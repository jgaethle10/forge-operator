name: Pacific DNN Super-Resolution Offline Runtime
on:
  push:
    branches: [studio/pacific-real-music-audition-20261115]
    paths: [.github/workflows/pacific-opencv-superres-wheel.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch pinned OpenCV-contrib DNN superresolution wheels (public-only)
        run: |
          mkdir -p pacific-wheels
          python -m pip download --only-binary=:all: --no-deps --python-version 311 --implementation cp --abi cp311 --platform manylinux_2_17_x86_64 -d pacific-wheels 'opencv-contrib-python-headless==4.10.0.84'
          sha256sum pacific-wheels/* > pacific-wheels/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-opencv-contrib-410-offline
          path: pacific-wheels/
          retention-days: 2
          if-no-files-found: error
