name: KAIDANCE node rebind

on:
  pull_request:
    paths:
      - 'systemia/collider/**'
      - 'systemia/compute/**'
      - 'systemia/yard/**'
      - '.github/workflows/kaidance-rebind.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/collider/**'
      - 'systemia/compute/**'
      - 'systemia/yard/**'
      - '.github/workflows/kaidance-rebind.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove KAIDANCE cross-node checkpoint and rebind
        run: node systemia/yard/kaidance-rebind-proof.mjs
