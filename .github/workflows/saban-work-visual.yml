name: Saban Graphics private state proof

on:
  pull_request:
    paths:
      - 'systemia/graphics-command/saban-work-visual*'
      - 'systemia/graphics-command/saban-work-operator*'
      - 'systemia/graphics-command/saban-work-observe*'
      - '.github/workflows/saban-work-visual.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/graphics-command/saban-work-visual*'
      - 'systemia/graphics-command/saban-work-operator*'
      - 'systemia/graphics-command/saban-work-observe*'
      - '.github/workflows/saban-work-visual.yml'

permissions:
  contents: read

jobs:
  source-bound-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and Saban work-state privacy contract
        run: |
          node --check systemia/graphics-command/saban-work-visual.mjs
          node --check systemia/graphics-command/saban-work-operator.mjs
          node --check systemia/graphics-command/saban-work-observe.mjs
          node --check systemia/graphics-command/saban-work-observe.specimen.mjs
          node --check systemia/graphics-command/saban-work-visual.specimen.mjs
          node --check systemia/graphics-command/saban-work-visual-browser.cjs
          node --test systemia/graphics-command/saban-work-visual.test.mjs
          node --test systemia/graphics-command/saban-work-operator.test.mjs
          node --test systemia/graphics-command/saban-work-observe.test.mjs
      - name: Render synthetic Saban source-backed specimen
        run: node systemia/graphics-command/saban-work-visual.specimen.mjs artifacts/saban-work-visual-specimen
      - name: Generate sampled synthetic Saban history
        run: node systemia/graphics-command/saban-work-observe.specimen.mjs artifacts/saban-work-visual-specimen
      - name: Install isolated Chromium visual reviewer
        run: |
          npm install --prefix /tmp/saban-proof-review --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          /tmp/saban-proof-review/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect actual desktop and phone pixels
        env:
          NODE_PATH: /tmp/saban-proof-review/node_modules
        run: node systemia/graphics-command/saban-work-visual-browser.cjs artifacts/saban-work-visual-specimen
      - name: Preserve safe synthetic specimen and frame hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saban-graphics-synthetic-proof
          path: artifacts/saban-work-visual-specimen/
          if-no-files-found: warn
          retention-days: 14
