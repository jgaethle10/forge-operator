name: Voice Foundry | Bella Native Duration Predictor (private)
on:
  push:
    branches: [feature/bella-actor-lab-20261026]
    paths:
      - 'systemia/media-studio/voice-bella-native-duration-study.py'
      - 'systemia/media-studio/test_voice_bella_native_duration_study.py'
      - '.github/workflows/voice-bella-native-duration-study.yml'
  pull_request:
    paths:
      - 'systemia/media-studio/voice-bella-native-duration-study.py'
      - 'systemia/media-studio/test_voice_bella_native_duration_study.py'
      - '.github/workflows/voice-bella-native-duration-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-duration-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no-model timing assertions and exact words
        run: |
          python systemia/media-studio/voice-bella-native-duration-study.py --verify-only
          python -m unittest discover -s systemia/media-studio -p test_voice_bella_native_duration_study.py -v
      - name: Install original Kokoro V05 runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Render genuine native Bella and inspect model predicted token durations
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python systemia/media-studio/voice-bella-native-duration-study.py \
            --output bella-native-duration-private
      - name: Verify actual dry WAVs, model frame counts and private review holds
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,wave
          root=pathlib.Path('bella-native-duration-private')
          r=json.loads((root/'evidence.json').read_text())
          assert r['schema']=='evercraft.bella.native-duration-study.v1'
          assert r['voiceId']=='af_bella' and r['libraryVersion']=='0.9.4'
          assert r['identicalSpokenWords'] and r['controlVsPunctuationOnly']
          for flag in ('phonemeOverrideApplied','waveformRetimingApplied',
                       'voiceCloningPerformed','independentASRAlignmentPerformed',
                       'humanAudioImprovementConfirmed','commercialRightsIndependentlyVerified',
                       'modelCheckpointPinned','productionApproved'):
              assert r[flag] is False,flag
          assert set(r['observations'])=={'original','connected'}
          for key,item in r['observations'].items():
              wav=root/item['dryNativeWavFile']
              assert wav.is_file()
              assert hashlib.sha256(wav.read_bytes()).hexdigest()==item['dryNativeWavSha256']
              with wave.open(str(wav),'rb') as f:
                  assert (f.getnchannels(),f.getsampwidth(),f.getframerate())==(1,2,24000)
                  assert 6<f.getnframes()/24000<45
              assert item['expectedWordCount']>=40 and item['modelWordCount']==item['expectedWordCount']
              assert item['wordCoverageMatchesScript'] is True
              assert len(item['predictedTokenDurationsFrames'])>40
              assert item['tokenTimesAreModelDerivedNotIndependentAlignments']
              assert item['nativeTokenTimesUsable'], 'Native word timestamps unusable; investigate without guessing'
          assert r['comparison']['comparisonAvailable'] is True
          print('PASS: model-predicted timing surfaced for same-word Bella comparisons, release blocked')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bella-native-model-word-durations-private-review
          path: bella-native-duration-private/
          retention-days: 7
          if-no-files-found: error
