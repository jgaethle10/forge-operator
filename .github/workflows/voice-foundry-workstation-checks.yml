name: Voice Foundry | Offline Workstation Safeguards
on:
  push:
    branches: [feature/bella-actor-lab-20261026]
    paths:
      - 'systemia/media-studio/voice-foundry-workstation.py'
      - 'systemia/media-studio/test_voice_foundry_workstation.py'
      - '.github/workflows/voice-foundry-workstation-checks.yml'
  pull_request:
    paths:
      - 'systemia/media-studio/voice-foundry-workstation.py'
      - 'systemia/media-studio/test_voice_foundry_workstation.py'
      - '.github/workflows/voice-foundry-workstation-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-and-safe-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify twelve voices and text controls without loading a model
        run: |
          python -m unittest discover -s systemia/media-studio -p test_voice_foundry_workstation.py -v
          python -m compileall -q systemia/media-studio/voice-foundry-workstation.py
          python systemia/media-studio/voice-foundry-workstation.py --list-voices > /tmp/voices.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/voices.json'))
          assert len(c)==12 and 'af_bella' not in c
          assert len({x['language'] for x in c.values()})==4
          assert set(x['kind'] for x in c.values())=={'publishedStockPack','derivedTwoPackBlend'}
          assert all(x['releasedForEvercraft'] is False for x in c.values())
          print('PASS: twelve voice configurations from original model packs, no unpublished release')
          PY
