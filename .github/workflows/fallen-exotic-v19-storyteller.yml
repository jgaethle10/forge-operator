name: Fallen Exotic Chiles V19 Original Storyteller Performance
on:
  push:
    branches: [production/fallen-original-mature-narrator-audition-20261124]
    paths:
      - 'systemia/media-studio/voice-foundry/exotic-v19-storyteller.py'
      - '.github/workflows/fallen-exotic-v19-storyteller.yml'
permissions: {contents: read, actions: read}
jobs:
  perform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install original voice synthesis runtime
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub soundfile numpy
          curl -fLsS --retry 3 'https://github.com/CrispStrobe/CrispASR/releases/latest/download/crispasr-linux-x86_64.tar.gz' -o /tmp/crispasr.tar.gz
          mkdir -p /tmp/crispasr-dist /tmp/voice-model
          tar -xzf /tmp/crispasr.tar.gz -C /tmp/crispasr-dist
          BIN="$(find /tmp/crispasr-dist -type f -name crispasr | head -n 1)"
          test -n "$BIN"
          install -m 755 "$BIN" /tmp/crispasr_voice
          LIB_DIRS="$(find /tmp/crispasr-dist -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd ':' -)"
          printf 'LD_LIBRARY_PATH=%s\n' "$LIB_DIRS" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$LIB_DIRS" ldd /tmp/crispasr_voice | tee /tmp/crispasr-deps.txt
          ! grep -q 'not found' /tmp/crispasr-deps.txt
          hf download cstr/qwen3-tts-1.7b-base-GGUF qwen3-tts-12hz-1.7b-base-q8_0.gguf --local-dir /tmp/voice-model
          hf download cstr/qwen3-tts-tokenizer-12hz-GGUF qwen3-tts-tokenizer-12hz.gguf --local-dir /tmp/voice-model
      - name: Recover provenance-pinned original synthetic C voice
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          mkdir -p /tmp/synthetic-C
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14963005488/zip" -o /tmp/synthetic-C-reference.zip
          unzip -q /tmp/synthetic-C-reference.zip '03_english_cloned_from_spanish_anchor.wav' -d /tmp/synthetic-C
          echo 'SYNTHETIC_REFERENCE=/tmp/synthetic-C/03_english_cloned_from_spanish_anchor.wav' >> "$GITHUB_ENV"
      - name: Create ten original short-form natural storyteller phrases
        env: {OMP_NUM_THREADS: '4'}
        run: python systemia/media-studio/voice-foundry/exotic-v19-storyteller.py
      - name: Verify WAV integrity and no actor imitation/no client send
        run: |
          python - <<'PY'
          import json,hashlib,wave
          from pathlib import Path
          root=Path('v19-original-storyteller-original-C')
          receipt=json.loads((root/'receipt.json').read_text())
          assert len(receipt['cues'])==10 and not receipt['clientSendApproved']
          assert not receipt['foreignMediaUsedAsSynthesisReference']
          for c in receipt['cues']:
              p=root/c['file']
              with wave.open(str(p),'rb') as w: assert w.getnframes()>0
              assert hashlib.sha256(p.read_bytes()).hexdigest()==c['sha256']
          print('PASS ten original narration WAV cues')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fallen-exotic-v19-original-storyteller-private
          path: v19-original-storyteller-original-C/
          retention-days: 3
          if-no-files-found: error
