name: FAIE AgNormal Launch Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/faie/**'
      - 'systemia/mcp/fabric-faie-runtime.mjs'
      - 'systemia/faie/**'
      - 'scripts/faie-agnormal-external-canary.mjs'
      - 'scripts/faie-browser-partner-acceptance.mjs'
      - 'scripts/faie-partner-end-to-end.mjs'
      - 'scripts/faie-soil-live-acceptance.mjs'
      - 'scripts/faie-site-scan-live-acceptance.mjs'
      - '.github/workflows/faie-agnormal-launch-gate.yml'
      - 'tests/faie-agnormal-external-canary-contract.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'

concurrency:
  group: faie-agnormal-launch-gate
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVERCRAFT_OPERATOR_EDGE_ORIGIN: https://fabric.systemiacommandcenters.com
    steps:
      - name: Checkout exact verifier revision
        uses: actions/checkout@v4

      - name: Verify FAIE AgNormal design-partner path
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          max_attempts=16
          attempt=1
          status=1

          while [ "$attempt" -le "$max_attempts" ]; do
            rm -f artifacts/faie-agnormal-launch.stdout.json artifacts/faie-agnormal-launch.stderr.json
            set +e
            node scripts/faie-agnormal-external-canary.mjs               --origin "$EVERCRAFT_OPERATOR_EDGE_ORIGIN"               > artifacts/faie-agnormal-launch.stdout.json               2> artifacts/faie-agnormal-launch.stderr.json
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            candidate="artifacts/faie-agnormal-launch.stdout.json"
            if [ -s artifacts/faie-agnormal-launch.stderr.json ]; then
              candidate="artifacts/faie-agnormal-launch.stderr.json"
            fi
            stage="$(jq -r '.stage // ""' "$candidate" 2>/dev/null || true)"
            error="$(jq -r '.error // ""' "$candidate" 2>/dev/null || true)"

            retry=false
            if [ "$stage" = "partner_surface" ]; then
              if [ "$error" = "http_404:/faie/agnormal/" ] || \
                 [ "$error" = "faie_agnormal_partner_identity_missing" ] || \
                 [ "$error" = "faie_agnormal_partner_promise_missing" ] || \
                 [ "$error" = "faie_agnormal_activity_hud_missing" ] || \
                 [ "$error" = "faie_agnormal_cancel_control_missing" ] || \
                 [ "$error" = "faie_agnormal_truthful_download_receipt_missing" ] || \
                 [ "$error" = "faie_agnormal_timeout_guard_missing" ]; then
                retry=true
              fi
            fi

            if [ "$stage" = "health" ]; then
              if [ "$error" = "faie_health_design_partner_path_mismatch" ] || \
                 [ "$error" = "json_http_404:/api/faie/health" ]; then
                retry=true
              fi
            fi

            if [ "$stage" = "investigation" ]; then
              if [ "$error" = "json_post_http_404:/api/faie/investigate" ] || \
                 [ "$error" = "faie_agnormal_water_evidence_missing" ] || \
                 [ "$error" = "faie_agnormal_water_dimension_missing" ]; then
                retry=true
              fi
            fi

            if [ "$retry" = "true" ] && [ "$attempt" -lt "$max_attempts" ]; then
              echo "FAIE owned edge has not converged yet ($stage: $error); retrying ($attempt/$max_attempts)."
              sleep 20
              attempt=$((attempt + 1))
              continue
            fi
            break
          done

          if [ "$status" -eq 0 ]; then
            mv artifacts/faie-agnormal-launch.stdout.json artifacts/faie-agnormal-launch-gate.json
            rm -f artifacts/faie-agnormal-launch.stderr.json
            echo "FAIE AgNormal launch gate passed after $attempt attempt(s)."
            cat artifacts/faie-agnormal-launch-gate.json
          else
            if [ -s artifacts/faie-agnormal-launch.stderr.json ]; then
              mv artifacts/faie-agnormal-launch.stderr.json artifacts/faie-agnormal-launch-gate.json
            else
              mv artifacts/faie-agnormal-launch.stdout.json artifacts/faie-agnormal-launch-gate.json
            fi
            echo "FAIE AgNormal launch gate failed after $attempt attempt(s)." >&2
            cat artifacts/faie-agnormal-launch-gate.json >&2 || true
            exit "$status"
          fi

      - name: Verify partner product end to end on owned HTTPS
        id: partner
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            set +e
            node scripts/faie-partner-end-to-end.mjs --require-ui-parity > artifacts/faie-partner-end-to-end.json
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              cat artifacts/faie-partner-end-to-end.json
              break
            fi
            stage="$(jq -r '.stage_failed // ""' artifacts/faie-partner-end-to-end.json)"
            error="$(jq -r '.error // ""' artifacts/faie-partner-end-to-end.json)"
            if [ "$attempt" -lt 15 ] && { \
              { [ "$stage" = "public_pages" ] && [[ "$error" == source_live_parity_* ]]; } || \
              { [[ "$stage" == "public_pages" || "$stage" == "live_health" ]] && \
                [[ "$error" == "fetch failed" || "$error" == *"TimeoutError"* || "$error" == *"_http_502" || "$error" == *"_http_503" ]]; } || \
              { [ "$stage" = "real_water_investigation" ] && [ "$error" = "usdm_drought_not_misclassified_as_soil_or_crop_evidence" ]; }; \
            }; then
              echo "FAIE partner gate retry for deployment convergence/transient edge ($stage: $error; $attempt/15)."
              sleep 15
              continue
            fi
            echo "FAIE partner acceptance failed at $stage: $error" >&2
            cat artifacts/faie-partner-end-to-end.json >&2
            exit "$code"
          done
          test "$(jq -r '.state' artifacts/faie-partner-end-to-end.json)" = 'PARTNER_TECHNICAL_GATE_PASSED'

      - name: Test partner journey in a real browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          node scripts/faie-browser-partner-acceptance.mjs | tee artifacts/faie-browser-partner-acceptance.json
          test "$(jq -r '.state' artifacts/faie-browser-partner-acceptance.json)" = 'BROWSER_UX_ACCEPTED'

      - name: Verify official USDA site-soil preview from public edge
        id: soil
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            set +e
            node scripts/faie-soil-live-acceptance.mjs > artifacts/faie-soil-live-acceptance.json
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              cat artifacts/faie-soil-live-acceptance.json
              break
            fi
            error="$(jq -r '.error // ""' artifacts/faie-soil-live-acceptance.json)"
            stage="$(jq -r '.stage_failed // ""' artifacts/faie-soil-live-acceptance.json)"
            if [ "$attempt" -lt 12 ] && [ "$stage" = "usda_soil_read" ] && \
              { [[ "$error" == *"_http_404"* || "$error" == *"_http_502"* || "$error" == *"_http_503"* || "$error" == *"fetch failed"* ]]; }; then
              echo "Public soil service not converged/temporarily unavailable: $error ($attempt/12)"
              sleep 15
              continue
            fi
            cat artifacts/faie-soil-live-acceptance.json >&2
            exit "$status"
          done
          test "$(jq -r '.state' artifacts/faie-soil-live-acceptance.json)" = 'SOIL_LIVE_SOURCE_VERIFIED'

      - name: Verify actual USDA + NWS point intelligence in live FAIE
        id: site_scan
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 4); do
            set +e
            node scripts/faie-site-scan-live-acceptance.mjs > artifacts/faie-site-scan-live-acceptance.json
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              cat artifacts/faie-site-scan-live-acceptance.json
              break
            fi
            error="$(jq -r '.error // ""' artifacts/faie-site-scan-live-acceptance.json)"
            stage="$(jq -r '.stage_failed // ""' artifacts/faie-site-scan-live-acceptance.json)"
            if [ "$attempt" -lt 4 ] && [ "$stage" = "site_point_scan" ] && \
              { [[ "$error" == *"_http_404"* || "$error" == *"_http_429"* || "$error" == *"_http_502"* || "$error" == *"_http_503"* || "$error" == *"fetch failed"* ]]; }; then
              echo "Source intake or edge unavailable; no success asserted ($error; $attempt/4)."
              sleep 35
              continue
            fi
            cat artifacts/faie-site-scan-live-acceptance.json >&2
            exit "$status"
          done
          test "$(jq -r '.state' artifacts/faie-site-scan-live-acceptance.json)" = 'OFFICIAL_TWO_SOURCE_SITE_SCAN_VERIFIED'

      - name: Publish FAIE launch status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PARTNER_OUTCOME: ${{ steps.partner.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SOIL_OUTCOME: ${{ steps.soil.outcome }}
          SITE_SCAN_OUTCOME: ${{ steps.site_scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$PARTNER_OUTCOME" = "success" ] && [ "$BROWSER_OUTCOME" = "success" ] && [ "$SOIL_OUTCOME" = "success" ] && [ "$SITE_SCAN_OUTCOME" = "success" ]; then
            state="success"
            description="FAIE source-linked regional + real NWS/USDA site scan verified"
          else
            state="failure"
            stage="verify=$VERIFY_OUTCOME partner=$PARTNER_OUTCOME browser=$BROWSER_OUTCOME soil=$SOIL_OUTCOME site=$SITE_SCAN_OUTCOME"
            error="$(jq -r '.error // "verification_failed"' artifacts/faie-partner-end-to-end.json 2>/dev/null || echo verification_failed)"
            description="FAIE launch failure: ${stage} (${error})"
            description="${description:0:140}"
          fi
          payload="$(jq -cn             --arg state "$state"             --arg context "evercraft/faie-agnormal-launch"             --arg description "$description"             '{state:$state,context:$context,description:$description}')"
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Upload FAIE launch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faie-agnormal-launch-gate
          path: |
            artifacts/faie-agnormal-launch-gate.json
            artifacts/faie-partner-end-to-end.json
            artifacts/faie-browser-partner-acceptance.json
            artifacts/faie-soil-live-acceptance.json
            artifacts/faie-site-scan-live-acceptance.json
          if-no-files-found: error
          retention-days: 90
