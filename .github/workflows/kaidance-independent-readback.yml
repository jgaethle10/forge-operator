name: KAIDANCE Independent Public HTTPS Readback

# Never expect unpublished branch contents from a public deployment. Observe
# the completed shared Pages workflow regardless of unrelated product QA
# outcome, and separately verify the *actual* KAIDANCE public site.
on:
  workflow_run:
    workflows:
      - Evercraft public web fallback
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kaidance-independent-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaidance-external-public-https-check
  cancel-in-progress: false

jobs:
  external-viewer-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public readback parser contracts
        run: node --test tests/kaidance-public-fallback-readback.test.mjs
      - name: Independently read back deployed Kaidance over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          # Pages/CDN propagation is asynchronous; accept only a real HTTPS
          # readback of the *current* expected files and strict pulse 404.
          for attempt in $(seq 1 12); do
            if node scripts/probe-kaidance-fallback.mjs \
                --root https://jgaethle10.github.io/forge-operator/; then
              echo "KAIDANCE_DEPLOYED_HTTPS_ACCEPTANCE_PASSED"
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "::error::KAIDANCE HTTPS V05 readback failed after bounded retries"
              exit 1
            fi
            echo "KAIDANCE_PUBLIC_PROPAGATION_PENDING attempt=$attempt"
            sleep 10
          done
      - name: Retain sanitized Kaidance public source and asset readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaidance-v05-independent-public-https-receipt
          path: artifacts/kaidance-fallback-readback.json
          if-no-files-found: warn
          retention-days: 30
