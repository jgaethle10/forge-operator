name: Voice Foundry RC27 Founder Line Polish (private)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  female-commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research only
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and release guard tests before inference
        run: |
          python systemia/media-studio/voice-rc27-line-surgery.py --verify-only
          node --test tests/media-voice-rc27-line-surgery.test.mjs
      - name: Install licensed-for-evaluation Kokoro runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Real neural female-scene-first audition
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python systemia/media-studio/voice-rc27-line-surgery.py private-rc27-openings
          test -s private-rc27-openings/evidence.json
          test -s private-rc27-openings/LISTEN.html
          test "$(find private-rc27-openings -maxdepth 1 -name '*.wav' | wc -l)" -eq 4
          test "$(find private-rc27-openings -maxdepth 1 -name '*.mp3' | wc -l)" -eq 4
      - name: Archive original dry voice recordings
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-rc27-female-openings
          path: private-rc27-openings/
          retention-days: 7
          if-no-files-found: error
