name: Evercraft Worlds browser projection
on:
  pull_request:
    paths: ['tests/worlds-hidden-world-atlas.test.mjs','public/worlds/**','systemia/worlds/**','systemia/world-engine/worlds-integration.test.ts','tests/world-core.test.mjs','tests/worlds-quality.test.mjs','tests/worlds-portal.test.mjs','tests/worlds-share.test.mjs','tests/worlds-cloud-client.test.mjs','tests/worlds-vault-runtime.test.mjs','tests/worlds-vault-lifecycle.test.mjs','tests/worlds-edge-route.test.mjs','tests/worlds-edge-client-admission.test.mjs','tests/worlds-admission.test.mjs','tests/worlds-edge-keeper.test.mjs','tests/worlds-vault-backup.test.mjs','tests/worlds-public-release-gate.test.mjs','tests/worlds-external-write-proof.test.mjs','tests/world-bridge.test.mjs','tests/worlds-benchmark.mjs','scripts/probe-evercraft-worlds-browser.mjs','scripts/probe-worlds-heritage-browser.mjs','tests/worlds-heritage.test.mjs','tests/worlds-heritage-tour.test.mjs','scripts/install-evercraft-worlds-vault-user.mjs','scripts/route-worlds-owned-edge.mjs','scripts/install-worlds-edge-keeper.mjs','scripts/probe-worlds-public.mjs','scripts/probe-worlds-write.mjs','scripts/probe-worlds-heritage-public.mjs','scripts/probe-hidden-world-public.mjs','scripts/probe-hidden-world-browser.mjs','tests/worlds-heritage-public.test.mjs','docs/worlds/**','.github/workflows/evercraft-worlds.yml']
  push:
    branches: [main]
    paths: ['public/worlds/**','tests/world-core.test.mjs','tests/world-bridge.test.mjs','tests/worlds-benchmark.mjs','scripts/probe-evercraft-worlds-browser.mjs','scripts/probe-worlds-heritage-browser.mjs','tests/worlds-heritage.test.mjs','tests/worlds-heritage-tour.test.mjs','tests/worlds-heritage-public.test.mjs','scripts/probe-worlds-heritage-public.mjs','systemia/worlds/worlds-vault-runtime.mjs','tests/worlds-vault-runtime.test.mjs','.github/workflows/evercraft-worlds.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser module
        run: node --check public/worlds/app.mjs && node --check public/worlds/heritage/app.mjs && node --check public/worlds/heritage/scene.mjs && node --check public/worlds/heritage/tour.mjs && node --check scripts/probe-worlds-heritage-browser.mjs && node --check public/worlds/world-core.mjs && node --check public/worlds/world-bridge.mjs && node --check public/worlds/quality.mjs && node --check public/worlds/portal-visual.mjs && node --check public/worlds/share-scene.mjs && node --check public/worlds/cloud-client.mjs && node --check systemia/worlds/worlds-vault-runtime.mjs && node --check systemia/worlds/worlds-edge-route.mjs && node --check systemia/worlds/worlds-admission.mjs && node --check scripts/route-worlds-owned-edge.mjs && node --check scripts/install-worlds-edge-keeper.mjs && node --check systemia/worlds/worlds-vault-backup.mjs && node --check scripts/install-evercraft-worlds-vault-user.mjs && node --check scripts/probe-worlds-public.mjs && node --check scripts/probe-worlds-write.mjs && node --check scripts/probe-worlds-heritage-public.mjs && node --check scripts/probe-hidden-world-public.mjs && node --check scripts/probe-hidden-world-browser.mjs && node --check scripts/probe-evercraft-worlds-browser.mjs
      - name: World builder, persistence and engine-schema tests
        run: node --test tests/world-core.test.mjs tests/worlds-quality.test.mjs tests/worlds-portal.test.mjs tests/worlds-share.test.mjs tests/worlds-cloud-client.test.mjs tests/worlds-vault-runtime.test.mjs tests/worlds-vault-lifecycle.test.mjs tests/worlds-edge-route.test.mjs tests/worlds-edge-client-admission.test.mjs tests/worlds-admission.test.mjs tests/worlds-edge-keeper.test.mjs tests/worlds-vault-backup.test.mjs tests/worlds-public-release-gate.test.mjs tests/worlds-external-write-proof.test.mjs tests/worlds-heritage-public.test.mjs tests/worlds-hidden-world-atlas.test.mjs tests/worlds-heritage.test.mjs tests/worlds-heritage-tour.test.mjs tests/world-bridge.test.mjs
      - name: CPU microbenchmark (NOT a browser performance claim)
        run: node tests/worlds-benchmark.mjs
  engine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Worlds through authoritative Systemia World Engine
        run: node --import tsx --test systemia/world-engine/worlds-integration.test.ts
  browser-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Browser scene, movement, editing, reload, mobile layout
        run: node scripts/probe-evercraft-worlds-browser.mjs && node scripts/probe-worlds-heritage-browser.mjs && node scripts/probe-hidden-world-browser.mjs
      - name: Preserve screenshots and measurement receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evercraft-worlds-browser-evidence
          path: |
            artifacts/evercraft-worlds-browser/
            artifacts/worlds-heritage-browser/
            artifacts/hidden-world-browser/
          if-no-files-found: warn
