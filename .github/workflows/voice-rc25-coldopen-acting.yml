name: Voice Foundry RC25 Cold Open Acting (private only)
on:
  pull_request:
    paths:
      - '.github/workflows/voice-rc25-coldopen-acting.yml'
      - 'systemia/media-studio/voice-rc25-coldopen-acting.py'
      - 'tests/media-voice-rc25-coldopen-acting.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private audition
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight and regression tests
        run: |
          python systemia/media-studio/voice-rc25-coldopen-acting.py --verify-only
          node --test tests/media-voice-rc25-coldopen-acting.test.mjs
      - name: Install Kokoro CPU TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Generate seven real Heart/blend/dialogue acting candidates
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python systemia/media-studio/voice-rc25-coldopen-acting.py rc25-kokoro --engine kokoro
          test "$(find rc25-kokoro -maxdepth 1 -name '*.wav' | wc -l)" -eq 7
          test "$(find rc25-kokoro -maxdepth 1 -name '*.mp3' | wc -l)" -eq 7
          test -s rc25-kokoro/evidence.json
      - name: Upload full original neural Kokoro audio
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-rc25-coldopen-kokoro
          path: rc25-kokoro/
          retention-days: 7
          if-no-files-found: error
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private audition
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-model preflight
        run: |
          python systemia/media-studio/voice-rc25-coldopen-acting.py --verify-only
          node --test tests/media-voice-rc25-coldopen-acting.test.mjs
      - name: Install separate Chatterbox CPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --disable-pip-version-check 'chatterbox-tts' 'soundfile>=0.12,<1.0'
      - name: Render default-voice neutral vs expressive performances
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python systemia/media-studio/voice-rc25-coldopen-acting.py rc25-chatterbox --engine chatterbox
          test "$(find rc25-chatterbox -maxdepth 1 -name '*.wav' | wc -l)" -eq 6
          test "$(find rc25-chatterbox -maxdepth 1 -name '*.mp3' | wc -l)" -eq 6
          test -s rc25-chatterbox/evidence.json
      - name: Upload actual Chatterbox audio separately
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-rc25-coldopen-chatterbox
          path: rc25-chatterbox/
          retention-days: 7
          if-no-files-found: error
