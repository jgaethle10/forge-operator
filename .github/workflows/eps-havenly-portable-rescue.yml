name: EPS and Havenly portable owned site rescue

on:
  pull_request:
    paths:
      - 'public/havenly/**'
      - 'public/eps/**'
      - 'public/apps/eps-estimator/**'
      - 'scripts/package-owned-business-rescue*'
      - '.github/workflows/eps-havenly-portable-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable site routing, tampering and truth-gate tests
        run: node --test scripts/package-owned-business-rescue.test.mjs
      - name: Build Base44-free portable sites
        run: node scripts/package-owned-business-rescue.mjs
      - name: Observe independently hosted GitHub Pages availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "## Existing Pages publishing state" >> "$GITHUB_STEP_SUMMARY"
          api_status="$(curl --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/evercraft-pages-meta.json \
            -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"
          echo "GitHub Pages API HTTP status: ${api_status}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$api_status" = "200" ]; then
            node -e "const f=require('fs');let d=JSON.parse(f.readFileSync('/tmp/evercraft-pages-meta.json','utf8'));console.log('Pages status: '+(d.status||'unknown')+', URL: '+(d.html_url||'unknown')+', source: '+JSON.stringify(d.source||{}))" >> "$GITHUB_STEP_SUMMARY"
          fi
          for route in eps/ campaigns/roman/ apps/eps-estimator/; do
            status="$(curl --silent --show-error --max-time 20 -o /dev/null \
              -w "%{http_code}" "https://jgaethle10.github.io/forge-operator/${route}")"
            echo "Public fallback /${route}: HTTP ${status}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "This observation is diagnostic only. It does not activate Pages or declare the domain migrated." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Archive static websites and SHA-256 inventory
        uses: actions/upload-artifact@v4
        with:
          name: eps-havenly-portable-sites
          path: artifacts/owned-business-rescue/
          retention-days: 7
          if-no-files-found: error
