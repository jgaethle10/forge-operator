name: Evercraft Journal External Canary

on:
  push:
    branches: [main]
    paths:
      - 'public/journal/**'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/newsroom/journal-build-verifier.mjs'
      - '.github/workflows/evercraft-journal-public-canary.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify persisted Journal artifact before external probe
        run: node systemia/newsroom/journal-build-verifier.mjs public/journal "$JOURNAL_ORIGIN"

      - name: Resolve current live Journal receipt
        id: edition
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync('public/journal/index.json','utf8'));
          if(index.schema!=='evercraft.journal.index.v1'||index.live_edition!==true||!index.stories?.length){
            throw new Error('journal_live_edition_missing');
          }
          const story=index.stories[0];
          const receipt=JSON.parse(fs.readFileSync('public/journal/receipts/'+story.slug+'.json','utf8'));
          if(receipt.story_id!==story.story_id||receipt.canonical_url!==story.canonical_url){
            throw new Error('journal_index_receipt_identity_mismatch');
          }
          const rows={
            slug:story.slug,
            story_id:story.story_id,
            canonical_url:receipt.canonical_url,
            title:receipt.title,
            article_sha256:receipt.article_sha256,
            evidence_ref:receipt.machine_evidence_ref||'',
            evidence_sha256:receipt.machine_evidence_sha256||'',
            feed_url:receipt.ranking_visuals?.feed?.url||'',
            feed_sha256:receipt.ranking_visuals?.feed?.sha256||'',
          };
          for(const [key,value] of Object.entries(rows)){
            process.stdout.write(key+'<<EOF\n'+String(value)+'\nEOF\n');
          }
          NODE

      - name: Diagnose owned edge Journal state
        shell: bash
        env:
          SLUG: ${{ steps.edition.outputs.slug }}
          STORY_ID: ${{ steps.edition.outputs.story_id }}
          CANONICAL_URL: ${{ steps.edition.outputs.canonical_url }}
          ARTICLE_SHA256: ${{ steps.edition.outputs.article_sha256 }}
        run: |
          set -u
          mkdir -p artifacts/journal-edge-diagnostic

          echo "## Fabric health"
          health_code="$(curl --silent --show-error --location --max-time 20 \
            -o artifacts/journal-edge-diagnostic/health.json \
            -w '%{http_code}' \
            "https://fabric.systemiacommandcenters.com/health" || true)"
          echo "status=$health_code"
          if [ -s artifacts/journal-edge-diagnostic/health.json ]; then
            jq '{ok,service,version,instance_id,deployment_receipt_ref,journal_mirror_ready,journal_mirror_path,catalog_reload_mode}' \
              artifacts/journal-edge-diagnostic/health.json 2>/dev/null || head -c 800 artifacts/journal-edge-diagnostic/health.json
          fi

          echo
          echo "## Public Journal index"
          index_code="$(curl --silent --show-error --location --max-time 20 \
            -o artifacts/journal-edge-diagnostic/index.json \
            -w '%{http_code}' \
            "${JOURNAL_ORIGIN%/}/index.json" || true)"
          echo "status=$index_code"
          if [ -s artifacts/journal-edge-diagnostic/index.json ]; then
            jq '{schema,generated_at,live_edition,stories:[.stories[]? | {story_id,slug,title,published_at,canonical_url}]}' \
              artifacts/journal-edge-diagnostic/index.json 2>/dev/null || head -c 1200 artifacts/journal-edge-diagnostic/index.json
          fi

          echo
          echo "## Canonical public-origin candidate"
          candidate_url="https://journal.evercraft.global/${SLUG}/"
          candidate_code="$(curl --silent --show-error --location --max-time 20 \
            -o artifacts/journal-edge-diagnostic/canonical-candidate.html \
            -w '%{http_code}' \
            "$candidate_url" || true)"
          echo "candidate_url=$candidate_url"
          echo "status=$candidate_code"
          if [ -s artifacts/journal-edge-diagnostic/canonical-candidate.html ]; then
            echo "candidate_sha=$(sha256sum artifacts/journal-edge-diagnostic/canonical-candidate.html | awk '{print $1}')"
            grep -Eio '<title[^>]*>[^<]*</title>|<link[^>]+rel=["'"'"']canonical["'"'"'][^>]*>|<meta[^>]+(property=["'"'"']og:url["'"'"']|name=["'"'"']evercraft:story_id["'"'"'])[^>]*>' \
              artifacts/journal-edge-diagnostic/canonical-candidate.html | head -n 12 || true
          fi

          echo
          echo "## Canonical article"
          curl --silent --show-error --location --max-time 20 \
            -D artifacts/journal-edge-diagnostic/article.headers \
            -o artifacts/journal-edge-diagnostic/article.html \
            -w 'status=%{http_code}\nfinal_url=%{url_effective}\ncontent_type=%{content_type}\nremote_ip=%{remote_ip}\n' \
            "$CANONICAL_URL" || true
          if [ -s artifacts/journal-edge-diagnostic/article.headers ]; then
            sed -n '1,24p' artifacts/journal-edge-diagnostic/article.headers
          fi
          if [ -s artifacts/journal-edge-diagnostic/article.html ]; then
            remote_sha="$(sha256sum artifacts/journal-edge-diagnostic/article.html | awk '{print $1}')"
            echo "expected_sha=$ARTICLE_SHA256"
            echo "remote_sha=$remote_sha"
            echo "expected_story_id=$STORY_ID"
            grep -Eio '<title[^>]*>[^<]*</title>|<link[^>]+rel=["'"'"']canonical["'"'"'][^>]*>|<meta[^>]+(property=["'"'"']og:url["'"'"']|name=["'"'"']evercraft:story_id["'"'"'])[^>]*>' \
              artifacts/journal-edge-diagnostic/article.html | head -n 12 || true
          fi

      - name: Verify current edition from outside the owned edge
        shell: bash
        env:
          SLUG: ${{ steps.edition.outputs.slug }}
          STORY_ID: ${{ steps.edition.outputs.story_id }}
          CANONICAL_URL: ${{ steps.edition.outputs.canonical_url }}
          TITLE: ${{ steps.edition.outputs.title }}
          ARTICLE_SHA256: ${{ steps.edition.outputs.article_sha256 }}
          EVIDENCE_REF: ${{ steps.edition.outputs.evidence_ref }}
          EVIDENCE_SHA256: ${{ steps.edition.outputs.evidence_sha256 }}
          FEED_URL: ${{ steps.edition.outputs.feed_url }}
          FEED_SHA256: ${{ steps.edition.outputs.feed_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts /tmp/journal-canary
          success=0

          for attempt in $(seq 1 3); do
            rm -f /tmp/journal-canary/article.html /tmp/journal-canary/evidence.json /tmp/journal-canary/feed.svg
            if curl --fail --silent --show-error --location --max-time 20 \
                "$CANONICAL_URL" -o /tmp/journal-canary/article.html; then
              remote_article_sha="$(sha256sum /tmp/journal-canary/article.html | awk '{print $1}')"
              if [ "$remote_article_sha" = "$ARTICLE_SHA256" ] &&
                 grep -Fq "<link rel=\"canonical\" href=\"$CANONICAL_URL\">" /tmp/journal-canary/article.html &&
                 grep -Fq "<meta property=\"og:url\" content=\"$CANONICAL_URL\">" /tmp/journal-canary/article.html &&
                 grep -Fq "<meta name=\"evercraft:story_id\" content=\"$STORY_ID\">" /tmp/journal-canary/article.html; then

                evidence_ok=true
                if [ -n "$EVIDENCE_REF" ]; then
                  evidence_url="${JOURNAL_ORIGIN%/}/$EVIDENCE_REF"
                  if ! curl --fail --silent --show-error --location --max-time 20 "$evidence_url" -o /tmp/journal-canary/evidence.json; then
                    evidence_ok=false
                  elif [ "$(sha256sum /tmp/journal-canary/evidence.json | awk '{print $1}')" != "$EVIDENCE_SHA256" ]; then
                    evidence_ok=false
                  fi
                fi

                visual_ok=true
                if [ -n "$FEED_URL" ]; then
                  if ! curl --fail --silent --show-error --location --max-time 20 "$FEED_URL" -o /tmp/journal-canary/feed.svg; then
                    visual_ok=false
                  elif [ "$(sha256sum /tmp/journal-canary/feed.svg | awk '{print $1}')" != "$FEED_SHA256" ]; then
                    visual_ok=false
                  fi
                fi

                if [ "$evidence_ok" = true ] && [ "$visual_ok" = true ]; then
                  success=1
                  break
                fi
              fi
            fi
            echo "Journal edge not current yet (attempt $attempt/3)."
            sleep 5
          done

          if [ "$success" -ne 1 ]; then
            echo "External Journal canary could not verify the current persisted edition." >&2
            exit 1
          fi

          node <<'NODE' > artifacts/evercraft-journal-public-canary.json
          const receipt={
            schema:'evercraft.journal.external-canary.v1',
            verified:true,
            state:'canonical_public_edition_verified',
            origin:process.env.JOURNAL_ORIGIN,
            story_id:process.env.STORY_ID,
            slug:process.env.SLUG,
            canonical_url:process.env.CANONICAL_URL,
            title:process.env.TITLE,
            article_sha256:process.env.ARTICLE_SHA256,
            machine_evidence_sha256:process.env.EVIDENCE_SHA256||null,
            ranking_feed_sha256:process.env.FEED_SHA256||null,
            canonical_identity_verified:true,
            open_graph_identity_verified:true,
            story_identity_verified:true,
            external_https_verified:true,
            observed_at:new Date().toISOString(),
          };
          process.stdout.write(JSON.stringify(receipt,null,2)+'\n');
          NODE

          cat artifacts/evercraft-journal-public-canary.json

      - name: Preserve Journal edge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-journal-edge-diagnostic
          path: artifacts/journal-edge-diagnostic
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve external Journal canary receipt
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-journal-public-canary
          path: artifacts/evercraft-journal-public-canary.json
          if-no-files-found: error
          retention-days: 90
