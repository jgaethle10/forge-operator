name: Relay Floor Creative Gate
on:
  pull_request:
    paths:
      - "systemia/media-studio/relay-floor-gate.mjs"
      - "systemia/media-studio/relay-floor-gate.test.mjs"
      - "systemia/media-studio/commercial-shotlist.mjs"
      - ".github/workflows/relay-floor-gate.yml"
  push:
    branches: [main]
    paths:
      - "systemia/media-studio/relay-floor-gate.mjs"
      - "systemia/media-studio/relay-floor-gate.test.mjs"
      - "systemia/media-studio/commercial-shotlist.mjs"
jobs:
  creative-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Human motion and speech regression
        run: node --test systemia/media-studio/relay-floor-gate.test.mjs
