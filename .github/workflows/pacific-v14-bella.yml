name: Pacific V14 Original Bella Dialogue
on:
  push:
    branches: [studio/pacific-real-music-audition-20261115]
    paths: [systemia/media-studio/pacific-v14-bella.py,.github/workflows/pacific-v14-bella.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - run: python systemia/media-studio/pacific-v14-bella.py
        env: {HF_HUB_DISABLE_TELEMETRY: '1'}
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-v14-native-bella-private
          path: pacific-v14-bella-private/
          retention-days: 7
          if-no-files-found: error
