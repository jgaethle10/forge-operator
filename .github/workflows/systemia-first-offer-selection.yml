name: Systemia First Offer Evidence Decision
on:
  pull_request:
    paths:
      - 'systemia/offer-selection/**'
      - '.github/workflows/systemia-first-offer-selection.yml'
      - 'public/.well-known/evercraft-machine-catalog.json'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'tests/ibmi-74-offer-launch.test.mjs'
      - 'systemia/chum/ibmi-74-offer-contract.mjs'
      - 'systemia/chum/ibmi-74-offer-contract.test.mjs'
      - 'systemia/chum/ibmi-rescue-canary.mjs'
      - 'docs/ibmi-74-deadline-xray-illustrative-sample.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test offer-selection evidence contract
        run: node --test systemia/offer-selection/rank-offers.test.mjs
      - name: Verify public IBM i buyer research retains uncertainty and no outbound authority
        run: node --test systemia/offer-selection/ibmi-first-buyer-research.test.mjs
      - name: Prove general Fabric offer-page and payment handoff only
        run: node --test tests/fabric-offer-pages.test.mjs
      - name: Prove evidence and optional 7.4 route integration without asserting deployment
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('systemia/offer-selection/README.md','utf8'); if(!/NOT collected revenue/i.test(s))process.exit(1)"
          if test -e tests/ibmi-74-offer-launch.test.mjs; then
            node --test tests/ibmi-74-offer-launch.test.mjs
            node -e "const fs=require('fs'); const runtime=fs.readFileSync('systemia/mcp/fabric-local-runtime.mjs','utf8'); const site=fs.readFileSync('systemia/mcp/fabric-public-site.mjs','utf8'); if(!runtime.includes('exact_ibmi_74_checkout_not_verified')||!site.includes('ibmi_74_deadline_xray_250')) process.exit(1)"
          else
            echo "Offer 1 route not implemented in this source; selection evidence only"
          fi

      - name: Confirm distinct IBM i 7.4 tier readiness does not infer payment
        run: node --test systemia/chum/ibmi-74-offer-contract.test.mjs
      - name: Produce first offer selection packet
        run: |
          node systemia/offer-selection/rank-offers.mjs > first-offer-selection.json
          node -e "const d=require('./first-offer-selection.json'); if(d.first_offer.public_id!=='ibmi-rescue-v1'||d.first_offer.is_sales_proven||!d.no_outreach_authority) process.exit(1)"
      - name: Preserve Systemia selection packet
        uses: actions/upload-artifact@v4
        with:
          name: systemia-first-offer-selection
          path: first-offer-selection.json
          retention-days: 30
