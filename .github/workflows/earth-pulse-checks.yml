name: Earth Pulse research kernel checks
on:
  pull_request:
    paths:
      - 'systemia/earth-pulse/**'
      - 'tests/earth-pulse-*.test.mjs'
      - '.github/workflows/earth-pulse-checks.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/earth-pulse/**'
      - 'tests/earth-pulse-*.test.mjs'
      - '.github/workflows/earth-pulse-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/earth-pulse-*.test.mjs
