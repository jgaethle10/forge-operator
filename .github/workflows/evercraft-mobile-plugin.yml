name: Evercraft Cross-Surface Plugin Contract

on:
  pull_request:
    paths:
      - 'plugins/evercraft-mobile-template/**'
      - 'plugins/evercraft-sites-bridge/**'
      - 'scripts/build-evercraft-mobile-plugin.mjs'
      - 'tests/evercraft-mobile-plugin-contract.test.mjs'
      - '.github/workflows/evercraft-mobile-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-mobile-package:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove mobile package contract
        run: node --test tests/evercraft-mobile-plugin-contract.test.mjs
      - name: Build synthetic web app-reference package
        run: |
          node scripts/build-evercraft-mobile-plugin.mjs \
            --allow-web-only-app-reference \
            --app-id plugin_asdk_app_test123 \
            --version 0.1.0 \
            --out artifacts/evercraft-mobile-test
          test -f artifacts/evercraft-mobile-test/.app.json
          test ! -f artifacts/evercraft-mobile-test/mcp.json
          test ! -f artifacts/evercraft-mobile-test/.mcp.json
