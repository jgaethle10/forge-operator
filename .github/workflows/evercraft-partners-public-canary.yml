name: Evercraft Partners external HTTPS canary
on:
  workflow_run:
    workflows: ["Evercraft public web fallback"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-visitor-path:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the public partner entry and its actual assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://jgaethle10.github.io/forge-operator/partners"
          fetch () {
            curl --fail --location --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 "$base/$1" -o "$tmp/$2"
            test -s "$tmp/$2"
          }
          fetch "" index.html
          fetch "mark.svg" mark.svg
          fetch "terms.html" terms.html
          fetch "social-card.svg" social-card.svg
          fetch "social-card.png" social-card.png
          fetch "llms.txt" llms.txt
          fetch "app.mjs" app.mjs
          grep -Fq 'og:image" content="https://jgaethle10.github.io/forge-operator/partners/social-card.png"' "$tmp/index.html"
          file --mime-type "$tmp/social-card.png" | grep -Fq "image/png"
          python -c 'import struct,sys; p=open(sys.argv[1],"rb").read(24); assert p[:8]==bytes([137,80,78,71,13,10,26,10]); assert struct.unpack(">II",p[16:24])==(1200,630)' "$tmp/social-card.png"
          grep -Fq "Good work travels" "$tmp/index.html"
          grep -Fq "Founding partner applications now open" "$tmp/index.html"
          grep -Fq 'id="partner-application"' "$tmp/index.html"
          grep -Fq 'mailto:jessegaethle10@gmail.com' "$tmp/index.html"
          grep -Fq 'src="./app.mjs"' "$tmp/index.html"
          grep -Fq "Checking secure application availability" "$tmp/index.html"
          grep -Fq "form.reportValidity()" "$tmp/app.mjs"
          grep -Fq "/api/partners" "$tmp/app.mjs"
          grep -Fq "received!==true" "$tmp/app.mjs"
          grep -Fq "Press Send there to complete the application" "$tmp/app.mjs"
          grep -Fq "The form checks whether Evercraft" "$tmp/terms.html"
          grep -Fq "No commission amount" "$tmp/terms.html"
          grep -Fq "Recruitment alone never earns compensation" "$tmp/terms.html"
          grep -Fq "<svg" "$tmp/mark.svg"
          grep -Fq "<svg" "$tmp/social-card.svg"
          grep -Fq "Founding partner expressions of interest only" "$tmp/llms.txt"
          if grep -Eiq 'base44[.]app|claim guaranteed returns|guaranteed commission' "$tmp/index.html"; then
            echo "Found blocked legacy or payout claim in visitor page" >&2
            exit 1
          fi
          echo "Verified exact live Partners HTML, application boundary, original SVG, 1200x630 PNG preview, terms and LLM disclosure on public HTTPS."
