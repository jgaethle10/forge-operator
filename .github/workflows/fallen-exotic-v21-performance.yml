name: Fallen Exotic Chiles V21 Two Performance Takes
on:
  push:
    branches: [production/fallen-original-mature-narrator-audition-20261124]
    paths:
      - 'systemia/media-studio/voice-foundry/exotic-v21-original-c-performance.py'
      - '.github/workflows/fallen-exotic-v21-performance.yml'
permissions: {contents: read, actions: read}
jobs:
  perform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [restrained, warm]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qwen original voice-base runtime
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub numpy soundfile
          curl -fLsS --retry 3 'https://github.com/CrispStrobe/CrispASR/releases/latest/download/crispasr-linux-x86_64.tar.gz' -o /tmp/crispasr.tar.gz
          mkdir -p /tmp/crispasr-dist /tmp/voice-model
          tar -xzf /tmp/crispasr.tar.gz -C /tmp/crispasr-dist
          BIN="$(find /tmp/crispasr-dist -type f -name crispasr | head -n 1)"
          test -n "$BIN"
          install -m 755 "$BIN" /tmp/crispasr_voice
          LIB_DIRS="$(find /tmp/crispasr-dist -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd ':' -)"
          printf 'LD_LIBRARY_PATH=%s\n' "$LIB_DIRS" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$LIB_DIRS" ldd /tmp/crispasr_voice | tee /tmp/crispasr-deps.txt
          ! grep -q 'not found' /tmp/crispasr-deps.txt
          hf download cstr/qwen3-tts-1.7b-base-GGUF qwen3-tts-12hz-1.7b-base-q8_0.gguf --local-dir /tmp/voice-model
          hf download cstr/qwen3-tts-tokenizer-12hz-GGUF qwen3-tts-tokenizer-12hz.gguf --local-dir /tmp/voice-model
      - name: Recover exact original synthetic C reference from private audition archive
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          mkdir -p /tmp/synthetic-C
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14963005488/zip" \
            -o /tmp/source.zip
          unzip -q /tmp/source.zip '03_english_cloned_from_spanish_anchor.wav' -d /tmp/synthetic-C
          echo 'SYNTHETIC_C_REFERENCE=/tmp/synthetic-C/03_english_cloned_from_spanish_anchor.wav' >> "$GITHUB_ENV"
      - name: Generate seven same-voice short performances
        env:
          OMP_NUM_THREADS: '4'
          STORYTELLER_LANE: '${{ matrix.lane }}'
        run: python systemia/media-studio/voice-foundry/exotic-v21-original-c-performance.py
      - name: Confirm original voice WAVs and no customer release
        env: {STORYTELLER_LANE: '${{ matrix.lane }}'}
        run: |
          python - <<'PY'
          import os,hashlib,json,wave,pathlib
          root=pathlib.Path('v21-original-c-'+os.environ['STORYTELLER_LANE'])
          r=json.loads((root/'receipt.json').read_text())
          assert len(r['cues'])==7 and r['onlyOriginalSyntheticVoice']
          assert not r['commercialReleaseAuthorized'] and not r['actorOrCelebrityClone']
          for cue in r['cues']:
            p=root/cue['file']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==cue['sha256']
            with wave.open(str(p),'rb') as f:assert f.getnframes()>0
          print("PASS: 7 V21 voice samples verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fallen-exotic-v21-original-c-${{ matrix.lane }}
          path: v21-original-c-${{ matrix.lane }}/
          retention-days: 3
          if-no-files-found: error
