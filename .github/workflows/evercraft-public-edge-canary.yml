name: Evercraft Public Edge External Canary

on:
  push:
    branches: [main]
    paths:
      - 'systemia/network/public-edge-runtime.mjs'
      - 'systemia/network/public-edge-tls.mjs'
      - 'systemia/mcp/specialist-handoff-runtime.mjs'
      - 'systemia/yard/public-edge-controller.mjs'
      - '.github/workflows/evercraft-public-edge-canary.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIALIST_ORIGIN: ${{ vars.EVERCRAFT_SPECIALIST_MCP_ORIGIN }}
    steps:
      - name: Checkout exact canary revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${SPECIALIST_ORIGIN:-}" ]; then
            cat > artifacts/evercraft-public-edge-canary.json <<'JSON'
          {
            "schema": "evercraft.public-edge.external-canary.v1",
            "verified": false,
            "state": "held_no_public_origin_configured",
            "public_https_verified": false,
            "founder_login_required": false
          }
          JSON
            cat artifacts/evercraft-public-edge-canary.json
            exit 0
          fi

          node - <<'NODE'
          const raw=process.env.SPECIALIST_ORIGIN||'';
          const url=new URL(raw);
          if(url.protocol!=='https:') throw new Error('SPECIALIST_ORIGIN must use HTTPS');
          if(url.username||url.password||url.search||url.hash) throw new Error('SPECIALIST_ORIGIN must be a clean HTTPS origin');
          if(/(^|\.)base44\.app$/i.test(url.hostname)) throw new Error('specialist public edge must not resolve to Base44');
          if(url.pathname!=='/'&&url.pathname!=='') throw new Error('SPECIALIST_ORIGIN must not include a path');
          NODE

      - name: Verify external health and MCP handshakes
        if: env.SPECIALIST_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail

          health="$(curl --fail --silent --show-error --max-time 20 "${SPECIALIST_ORIGIN%/}/health")"
          printf '%s' "$health" | jq -e '
            .ok == true and
            .service == "specialist-handoff-mcp" and
            .runtime == "Evercraft Compute" and
            .deployment_receipt_bound == true and
            (.deployment_receipt_ref | type == "string") and
            (.instance_id | type == "string") and
            .checkout_enabled == false and
            .payment_enabled == false
          ' >/dev/null

          check_mcp() {
            local path="$1"
            local server="$2"
            local tool_a="$3"
            local tool_b="$4"

            init="$(curl --fail --silent --show-error --max-time 20               -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"evercraft-external-canary","version":"1"}}}'               "${SPECIALIST_ORIGIN%/}$path")"
            printf '%s' "$init" | jq -e --arg server "$server" '
              .result.serverInfo.name == $server and
              .result.protocolVersion == "2025-03-26"
            ' >/dev/null

            tools="$(curl --fail --silent --show-error --max-time 20               -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'               "${SPECIALIST_ORIGIN%/}$path")"
            printf '%s' "$tools" | jq -e --arg a "$tool_a" --arg b "$tool_b" '
              [.result.tools[].name] as $names |
              ($names | index($a)) != null and
              ($names | index($b)) != null and
              ([.result.tools[] | select(.annotations.readOnlyHint != true or .annotations.destructiveHint != false)] | length) == 0
            ' >/dev/null
          }

          check_mcp "/mcp/ibmi-rescue" "evercraft-ibmi-rescue"             "get_ibmi_rescue_offer" "prepare_ibmi_rescue_handoff"
          check_mcp "/mcp/foundry-app-escape" "evercraft-foundry-app-escape"             "get_foundry_app_escape_offer" "prepare_foundry_app_escape_handoff"
          check_mcp "/mcp/site-survive" "evercraft-site-survive"             "get_site_survive_offer" "prepare_site_survive_handoff"

          instance_id="$(printf '%s' "$health" | jq -r '.instance_id')"
          deployment_receipt="$(printf '%s' "$health" | jq -r '.deployment_receipt_ref')"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n             --arg origin "$SPECIALIST_ORIGIN"             --arg instance "$instance_id"             --arg deployment "$deployment_receipt"             --arg observed "$observed_at"             '{
              schema:"evercraft.public-edge.external-canary.v1",
              verified:true,
              state:"public_https_verified",
              origin:$origin,
              runtime:"Evercraft Compute",
              service:"specialist-handoff-mcp",
              instance_id:$instance,
              deployment_receipt_ref:$deployment,
              public_https_verified:true,
              certificate_validation:"system_default_trust_store",
              mcp_initialize_verified:true,
              mcp_tools_list_verified:true,
              read_only_authority_verified:true,
              founder_login_required:false,
              external_saas_route_provider_required:false,
              observed_at:$observed
            }' > artifacts/evercraft-public-edge-canary.json

          cat artifacts/evercraft-public-edge-canary.json

      - name: Confirm promotion revision is still current main
        if: env.SPECIALIST_ORIGIN != ''
        id: promotion_gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Canary is valid, but main advanced during verification. Holding metadata promotion for the next run."
          fi

      - name: Promote externally verified specialist doors
        if: env.SPECIALIST_ORIGIN != '' && steps.promotion_gate.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node systemia/yard/promote-specialist-edge.mjs             --receipt artifacts/evercraft-public-edge-canary.json             --out artifacts/direct-door-promotion-receipt.json
          node scripts/generate-direct-plugin-packages.mjs
          node scripts/generate-mcp-registry-candidates.mjs
          node systemia/chum/build-capability-mirror.mjs
          npm run direct:check

      - name: Commit verified discovery promotion
        if: env.SPECIALIST_ORIGIN != '' && steps.promotion_gate.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add             distribution/direct-plugin-specs.json             distribution/direct-product-doors.json             public/.well-known/evercraft-direct-doors.json             plugins/ibmi-rescue             plugins/foundry-app-escape             plugins/site-survive             distribution/mcp-registry-candidates             public/chum
          if git diff --cached --quiet; then
            echo "Discovery already reflects this verified public edge."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote canary-verified specialist MCP doors"
          git push origin HEAD:main

      - name: Upload external canary receipts
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-public-edge-canary
          path: |
            artifacts/evercraft-public-edge-canary.json
            artifacts/direct-door-promotion-receipt.json
          if-no-files-found: warn
          retention-days: 90
