name: EarthWorks Public Fabric Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/.well-known/evercraft-products.json'
      - 'public/.well-known/evercraft-machine-catalog.json'
      - 'public/chum/capabilities.json'
      - 'public/chum/products/earthworks-autonomy/**'
      - 'systemia/earthworks-autonomy/**'
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/mcp/earthworks-simulator-page.mjs'
      - 'tests/evercraft-fabric-runtime.test.mjs'
      - 'tests/earthworks-owned-page.test.mjs'
      - 'tests/fabric-offer-pages.test.mjs'
      - '.github/workflows/earthworks-fabric-canary.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: earthworks-public-fabric-canary
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FABRIC_ORIGIN: https://fabric.systemiacommandcenters.com
    steps:
      - uses: actions/checkout@v4

      - name: Verify owned Fabric health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$FABRIC_ORIGIN/health")"
          printf 'PUBLIC_FABRIC_HEALTH=%s\n' "$health"
          printf '%s' "$health" | jq -e '
            .ok == true and
            .service == "evercraft-fabric-local" and
            .server == "evercraft-fabric" and
            .runtime == "Evercraft Fabric local" and
            .read_only == true and
            .transactional == false and
            .external_action_authority == false and
            .payment_authority == "Evercraft Payments" and
            .payment_router == "Raven Nexus" and
            .capability_count >= 51
          ' >/dev/null
          printf '%s\n' "$health" > /tmp/earthworks-fabric-health.json

      - name: Verify EarthWorks is discoverable through public Fabric MCP
        shell: bash
        run: |
          set -euo pipefail
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"earthworks-public-canary","version":"1"}}}'
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 \
            -H 'content-type: application/json' --data "$init" "$FABRIC_ORIGIN/mcp" \
            | jq -e '.result.serverInfo.name == "evercraft-fabric"' >/dev/null

          match='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"match_evercraft_capability","arguments":{"intent":"Our quarry haul trucks keep stacking up at the loader and the loader sometimes sits waiting. We want to simulate the load haul dump loop and shadow dispatch before buying autonomous equipment.","limit":5}}}'
          result="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 25 \
            -H 'content-type: application/json' --data "$match" "$FABRIC_ORIGIN/mcp")"
          printf '%s' "$result" | jq -e '
            .result.isError == false and
            .result.structuredContent.transactional == false and
            .result.structuredContent.external_action_taken == false and
            ([.result.structuredContent.matches[].public_id] | index("earthworks-site-autonomy-study-v1")) != null
          ' >/dev/null
          printf '%s\n' "$result" > /tmp/earthworks-fabric-match.json

          options='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_evercraft_connection_options","arguments":{"public_id":"earthworks-site-autonomy-study-v1"}}}'
          connection="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 25 \
            -H 'content-type: application/json' --data "$options" "$FABRIC_ORIGIN/mcp")"
          printf '%s' "$connection" | jq -e '
            .result.isError == false and
            .result.structuredContent.public_id == "earthworks-site-autonomy-study-v1" and
            .result.structuredContent.external_action_taken == false
          ' >/dev/null
          printf '%s\n' "$connection" > /tmp/earthworks-fabric-connections.json

          page=""
          cta_ready=false
          for attempt in $(seq 1 16); do
            page="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 25 "$FABRIC_ORIGIN/capabilities/earthworks-site-autonomy-study-v1")"
            printf '%s' "$page" | grep -Fq 'EarthWorks Site Autonomy Study'
            printf '%s' "$page" | grep -Fq '$5,000'
            if printf '%s' "$page" | grep -Fq 'Continue to checkout'; then
              echo "EarthWorks page exposed checkout before site/scope qualification." >&2
              exit 1
            fi
            if printf '%s' "$page" | grep -Fq 'Discuss one material loop'; then
              cta_ready=true
              echo "EarthWorks scoped inquiry CTA verified on attempt $attempt."
              break
            fi
            if [ "$attempt" -lt 16 ]; then
              echo "EarthWorks catalog is live but scoped inquiry CTA has not reached the resident edge yet ($attempt/16)."
              sleep 20
            fi
          done
          if [ "$cta_ready" != "true" ]; then
            echo "EarthWorks scoped inquiry CTA did not reach the public Fabric across the resident updater window." >&2
            exit 1
          fi
          printf '%s\n' "$page" > /tmp/earthworks-public-page.html

          live_yard=""
          yard_ready=false
          for attempt in $(seq 1 16); do
            live_yard="$(curl --fail --silent --show-error --max-time 25 "$FABRIC_ORIGIN/earthworks" 2>/dev/null || true)"
            if printf '%s' "$live_yard" | grep -Fq 'Live Yard 001' \
              && printf '%s' "$live_yard" | grep -Fq 'Dispatch truck' \
              && printf '%s' "$live_yard" | grep -Fq 'Shadow' \
              && printf '%s' "$live_yard" | grep -Fq 'Autonomy' \
              && printf '%s' "$live_yard" | grep -Fq 'Truck Queue' \
              && printf '%s' "$live_yard" | grep -Fq 'Loader Starvation' \
              && printf '%s' "$live_yard" | grep -Fq 'Blocked Route' \
              && printf '%s' "$live_yard" | grep -Fq 'Production Surge' \
              && printf '%s' "$live_yard" | grep -Fq 'STOP ALL'; then
              yard_ready=true
              echo "EarthWorks Live Yard verified on attempt $attempt."
              break
            fi
            if [ "$attempt" -lt 16 ]; then
              echo "EarthWorks Live Yard has not reached the resident edge yet ($attempt/16)."
              sleep 20
            fi
          done
          if [ "$yard_ready" != "true" ]; then
            echo "EarthWorks Live Yard did not reach the public Fabric across the resident updater window." >&2
            exit 1
          fi
          printf '%s\n' "$live_yard" > /tmp/earthworks-live-yard.html

      - name: Write external receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/earthworks-fabric-health.json','utf8'));
          const match=JSON.parse(fs.readFileSync('/tmp/earthworks-fabric-match.json','utf8'));
          const connections=JSON.parse(fs.readFileSync('/tmp/earthworks-fabric-connections.json','utf8'));
          const row=(match.result?.structuredContent?.matches||[]).find(x=>x.public_id==='earthworks-site-autonomy-study-v1');
          const receipt={
            schema:'evercraft.earthworks.public-fabric-canary.v1',
            verified:true,
            origin:process.env.FABRIC_ORIGIN,
            public_id:'earthworks-site-autonomy-study-v1',
            health_service:health.service,
            runtime:health.runtime,
            capability_count:health.capability_count ?? null,
            match_verified:Boolean(row),
            match_score:row?.match_score ?? null,
            commercial_state:row?.commercial_state ?? null,
            machine_state:row?.state ?? null,
            connection_options_verified:connections.result?.structuredContent?.public_id==='earthworks-site-autonomy-study-v1',
            public_page_verified:fs.existsSync('/tmp/earthworks-public-page.html'),
            public_page_url:process.env.FABRIC_ORIGIN+'/capabilities/earthworks-site-autonomy-study-v1',
            live_yard_verified:fs.existsSync('/tmp/earthworks-live-yard.html'),
            live_yard_game_controls_verified:fs.existsSync('/tmp/earthworks-live-yard.html'),
            live_yard_url:process.env.FABRIC_ORIGIN+'/earthworks',
            transactional:false,
            payment_created:false,
            equipment_control_authorized:false,
            observed_at:new Date().toISOString()
          };
          fs.writeFileSync('artifacts/earthworks-public-fabric-canary.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthworks-public-fabric-canary
          path: artifacts/earthworks-public-fabric-canary.json
          if-no-files-found: warn
          retention-days: 90
