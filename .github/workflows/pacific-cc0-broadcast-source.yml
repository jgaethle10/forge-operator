name: Pacific CC0 Recorded Music TV Private Audition
on:
  push:
    branches: [studio/pacific-real-music-audition-20261115]
    paths:
      - systemia/media-studio/pacific-cc0-broadcast-source.py
      - .github/workflows/pacific-cc0-broadcast-source.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cc0-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python systemia/media-studio/pacific-cc0-broadcast-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-cc0-broadcast-music-private
          path: pacific-cc0-broadcast-review/
          retention-days: 7
          if-no-files-found: error
