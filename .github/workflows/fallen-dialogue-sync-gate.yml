name: Fallen Dialogue Sync Gate

on:
  pull_request:
    paths:
      - 'systemia/media-studio/dialogue-sync-gate.ts'
      - 'systemia/media-studio/dialogue-sync-gate.test.ts'
      - 'systemia/media-studio/model-fabric.ts'
      - '.github/workflows/fallen-dialogue-sync-gate.yml'
  workflow_dispatch:

jobs:
  dialogue-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: node --import tsx --test systemia/media-studio/dialogue-sync-gate.test.ts systemia/media-studio/model-fabric.test.ts
      - run: npm run lint
