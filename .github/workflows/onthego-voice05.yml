name: On The Go Bella Voice 5 Native Audition
on:
  push:
    branches: [feature/onthego-bella-native-voice-20261026]
    paths:
      - 'systemia/media-studio/on-the-go-voice05.py'
      - '.github/workflows/onthego-voice05.yml'
  pull_request:
    paths:
      - 'systemia/media-studio/on-the-go-voice05.py'
      - '.github/workflows/onthego-voice05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-bella:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native Voice 5 identity and timing contract
        run: python systemia/media-studio/on-the-go-voice05.py --verify-only
      - name: Install the Relay narrator runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Generate eight original native Bella takes
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python systemia/media-studio/on-the-go-voice05.py onthego-voice05-audition
      - name: Verify every WAV digest and complete 30-second master
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,wave
          p=pathlib.Path("onthego-voice05-audition")
          r=json.loads((p/"evidence.json").read_text())
          assert r["voiceId"]=="af_bella" and r["originalNativeVoice"]
          assert r["phonemeOverrides"] is False and r["timbreBlends"] is False
          assert r["humanListeningApproved"] is False and r["clientApproved"] is False
          assert len(r["scriptLines"])==8
          for rec in r["scriptLines"]:
              data=(p/rec["filename"]).read_bytes()
              assert data[:4]==b"RIFF"
              assert hashlib.sha256(data).hexdigest()==rec["sha256"]
          with wave.open(str(p/r["masterFile"]),"rb") as w:
              assert w.getframerate()==24000 and w.getnframes()==720000
          print("PASS: Eight verified native Bella clips and voice-only master")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onthego-native-bella-voice05-private
          path: onthego-voice05-audition/
          retention-days: 7
          if-no-files-found: error
