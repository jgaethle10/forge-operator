name: CHUM discovery heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Validate public discovery watershed
        run: npm run chum:check

      - name: Validate CHUM provider probe suite
        run: npm run chum:validate

      - name: Probe declared public web surfaces
        run: npm run chum

      - name: Canary live MCP endpoints and registry state
        run: npm run chum:mcp

      - name: Run authorized brand-blind provider probes
        env:
          CHUM_PROBE_BRIDGE_URL: ${{ secrets.CHUM_PROBE_BRIDGE_URL }}
          CHUM_PROBE_BRIDGE_TOKEN: ${{ secrets.CHUM_PROBE_BRIDGE_TOKEN }}
        run: npm run chum:providers

      - name: Upload CHUM receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chum-receipts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/chum/**
