name: Systemia Clip Social Continuity

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: systemia-clip-social-continuity
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wake Clip and verify publishing continuity
        env:
          CLIP_CONTINUITY_RECEIPT_PATH: ${{ runner.temp }}/clip-social-continuity-receipt.json
        run: node systemia/compute/clip-social-continuity-canary.mjs
      - name: Preserve continuity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-social-continuity-receipt
          path: ${{ runner.temp }}/clip-social-continuity-receipt.json
          if-no-files-found: warn
          retention-days: 30
