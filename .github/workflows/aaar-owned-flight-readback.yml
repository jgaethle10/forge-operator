name: AAAR owned flight readback (non-deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/worlds/flight/index.html"
      - "scripts/probe-aaar-public-readback.mjs"
      - "tests/aaar-public-readback.test.mjs"
      - ".github/workflows/aaar-owned-flight-readback.yml"
  push:
    branches: [main]
    paths:
      - "public/worlds/flight/index.html"
      - "scripts/probe-aaar-public-readback.mjs"
      - "tests/aaar-public-readback.test.mjs"
      - ".github/workflows/aaar-owned-flight-readback.yml"
permissions:
  contents: read
jobs:
  independent-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure Node release probe contract tests
        run: node --test tests/aaar-public-readback.test.mjs
      - name: Read-only external verification from GitHub network
        id: probe
        shell: bash
        run: |
          mkdir -p artifacts/aaar-public-readback
          set +e
          node scripts/probe-aaar-public-readback.mjs > artifacts/aaar-public-readback/receipt.json
          rc=$?
          cat artifacts/aaar-public-readback/receipt.json
          if test "$rc" -ne 0; then
            echo "::warning::AAAR owned HTTPS route not independently verified; source commit is NOT evidence of iPhone availability."
          fi
          echo "probe_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve inspection receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaar-owned-external-readback
          path: artifacts/aaar-public-readback/receipt.json
          if-no-files-found: warn
  hosted-mobile-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Install supported Chromium browser
        run: npx playwright install chromium
      - name: Execute actual owned HTTPS AAAR buttons in phone emulation
        id: live
        shell: bash
        run: |
          mkdir -p artifacts/aaar-public-readback
          set +e
          node scripts/probe-aaar-mobile-browser.mjs https://worlds.systemiacommandcenters.com/worlds/flight/ > artifacts/aaar-public-readback/mobile-controls.json
          rc=$?
          cat artifacts/aaar-public-readback/mobile-controls.json
          if test "$rc" -ne 0; then
            echo "::error::AAAR live flight controls failed. This remains below real iPhone Safari acceptance."
          fi
          exit "$rc"
      - name: Preserve live control test receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaar-live-mobile-controls
          path: artifacts/aaar-public-readback/mobile-controls.json
          if-no-files-found: warn
  hosted-webkit-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      # WebKit needs GTK/Graphene/codec libraries absent on the standard Ubuntu 24.04 runner.
      # Bound the install so an unavailable mirror cannot hold up the AAAR release.
      - name: Install WebKit and required test-only Linux libraries
        run: timeout 180s npx playwright install --with-deps webkit
      - name: Execute owned HTTPS AAAR buttons in mobile WebKit
        shell: bash
        run: |
          mkdir -p artifacts/aaar-public-readback
          set +e
          AAAR_BROWSER=webkit node scripts/probe-aaar-mobile-browser.mjs https://worlds.systemiacommandcenters.com/worlds/flight/ > artifacts/aaar-public-readback/webkit-controls.json
          rc=$?
          cat artifacts/aaar-public-readback/webkit-controls.json
          if test "$rc" -ne 0; then
            echo "::error::AAAR WebKit mobile controls failed. Diagnose before physical Safari acceptance."
          fi
          exit "$rc"
      - name: Preserve WebKit receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaar-live-webkit-controls
          path: artifacts/aaar-public-readback/webkit-controls.json
          if-no-files-found: warn
