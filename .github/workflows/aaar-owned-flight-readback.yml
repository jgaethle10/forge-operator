name: AAAR owned flight readback (non-deployment)
on:
  workflow_dispatch:
  # Read-only half-hourly check. This is CI monitoring, not server deployment.
  schedule:
    - cron: '17,47 * * * *'
  pull_request:
    paths:
      - "public/worlds/flight/index.html"
      - "scripts/probe-aaar-public-readback.mjs"
      - "tests/aaar-public-readback.test.mjs"
      - "scripts/probe-aaar-mobile-cockpit-source.mjs"
      - "tests/aaar-flight-static.test.mjs"
      - "tests/aaar-seattle-ground-ops.test.mjs"
      - "tests/aaar-seattle-airport-vista.test.mjs"
      - ".github/workflows/aaar-owned-flight-readback.yml"
  push:
    branches: [main]
    paths:
      - "public/worlds/flight/index.html"
      - "scripts/probe-aaar-public-readback.mjs"
      - "tests/aaar-public-readback.test.mjs"
      - ".github/workflows/aaar-owned-flight-readback.yml"
permissions:
  contents: read
jobs:
  independent-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure Node release probe contract tests
        run: node --test tests/aaar-public-readback.test.mjs tests/aaar-flight-static.test.mjs tests/aaar-seattle-ground-ops.test.mjs tests/aaar-seattle-airport-vista.test.mjs
      - name: Read-only external verification from GitHub network
        id: probe
        shell: bash
        run: |
          mkdir -p artifacts/aaar-public-readback
          set +e
          node scripts/probe-aaar-public-readback.mjs > artifacts/aaar-public-readback/receipt.json
          rc=$?
          cat artifacts/aaar-public-readback/receipt.json
          if test "$rc" -ne 0; then
            echo "::warning::AAAR owned HTTPS flight route is stale or unavailable; code merge is not proof of public release."
          fi
          echo "probe_exit_code=$rc" >> "$GITHUB_OUTPUT"
          # Source PRs and immediate main pushes may precede the authorized updater.
          # Scheduled/manual audits must fail visibly on a stale or unreachable website.
          if test "$GITHUB_EVENT_NAME" = "schedule" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            exit "$rc"
          fi
          exit 0
      - name: Preserve inspection receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaar-owned-external-readback
          path: artifacts/aaar-public-readback/receipt.json
          if-no-files-found: warn
  hosted-mobile-controls:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Install supported Chromium browser
        run: npx playwright install chromium
      - name: Validate v0.8 source cockpit stick and throttle in portrait and landscape
        run: node scripts/probe-aaar-mobile-cockpit-source.mjs
      - name: Preserve source-rendered Chromium Vista scenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaar-vista-chromium-screens
          path: artifacts/aaar-vista/chromium/*.png
          if-no-files-found: warn
      - name: Execute actual owned HTTPS AAAR buttons in phone emulation
        id: live
        shell: bash
        run: |
          mkdir -p artifacts/aaar-public-readback
          set +e
          node scripts/probe-aaar-mobile-browser.mjs https://worlds.systemiacommandcenters.com/worlds/flight/ > artifacts/aaar-public-readback/mobile-controls.json
          rc=$?
          cat artifacts/aaar-public-readback/mobile-controls.json
          if test "$rc" -ne 0; then
            echo "::error::AAAR live flight controls failed. This remains below real iPhone Safari acceptance."
          fi
          exit "$rc"
      - name: Preserve live control test receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaar-live-mobile-controls
          path: artifacts/aaar-public-readback/mobile-controls.json
          if-no-files-found: warn
  hosted-webkit-controls:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # Pinned test-only browser image. No Evercraft application runs here in production.
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      # WebKit and libraries are preinstalled in the pinned Playwright testing image.
      - name: Validate v0.8 source cockpit in mobile WebKit
        env:
          AAAR_BROWSER: webkit
        run: node scripts/probe-aaar-mobile-cockpit-source.mjs
      - name: Preserve source-rendered WebKit Vista scenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaar-vista-webkit-screens
          path: artifacts/aaar-vista/webkit/*.png
          if-no-files-found: warn
      - name: Execute owned HTTPS AAAR buttons in mobile WebKit
        shell: bash
        run: |
          mkdir -p artifacts/aaar-public-readback
          set +e
          AAAR_BROWSER=webkit node scripts/probe-aaar-mobile-browser.mjs https://worlds.systemiacommandcenters.com/worlds/flight/ > artifacts/aaar-public-readback/webkit-controls.json
          rc=$?
          cat artifacts/aaar-public-readback/webkit-controls.json
          if test "$rc" -ne 0; then
            echo "::error::AAAR WebKit mobile controls failed. Diagnose before physical Safari acceptance."
          fi
          exit "$rc"
      - name: Preserve WebKit receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaar-live-webkit-controls
          path: artifacts/aaar-public-readback/webkit-controls.json
          if-no-files-found: warn
