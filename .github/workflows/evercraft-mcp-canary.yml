name: Evercraft MCP External Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/evercraft-mcp-canary.yml"
      - "mcp-registry/*.json"
      - "registry/**/server.json"

permissions:
  contents: read

concurrency:
  group: evercraft-mcp-external-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify every checked-in MCP manifest
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"evercraft-registry-canary","version":"1.0"}}}'

          check() {
            NAME="$1"
            URL="$2"
            echo "::group::$NAME"
            BODY="$(curl -fsS --max-time 20 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "$PAYLOAD")"
            printf '%s\n' "$BODY" | head -c 2500
            echo
            printf '%s' "$BODY" | grep -q '"serverInfo"' || {
              echo "MCP initialize did not return serverInfo for $NAME" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          shopt -s nullglob
          MANIFESTS=(mcp-registry/*.json)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No MCP manifests found." >&2
            exit 1
          fi

          for manifest in "${MANIFESTS[@]}"; do
            NAME="$(jq -r '.name // empty' "$manifest")"
            URL="$(jq -r '.remotes[0].url // empty' "$manifest")"
            if [ -z "$NAME" ] || [ -z "$URL" ]; then
              echo "Invalid MCP manifest identity or remote: $manifest" >&2
              exit 1
            fi
            check "$NAME" "$URL"
          done

          echo "Verified ${#MANIFESTS[@]} checked-in MCP manifests."

      - name: Verify critical tool and commerce contracts
        shell: bash
        run: |
          set -euo pipefail

          check_tool() {
            NAME="$1"
            URL="$2"
            TOOL="$3"
            echo "::group::$NAME tool contract"
            BODY="$(curl -fsS --max-time 20 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
            printf '%s\n' "$BODY" | head -c 4000
            echo
            printf '%s' "$BODY" | grep -q "$TOOL" || {
              echo "MCP tools/list did not expose $TOOL for $NAME" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          check_offer() {
            NAME="$1"
            URL="$2"
            PUBLIC_ID="$3"
            echo "::group::$NAME offer contract"
            BODY="$(curl -fsS --max-time 20 "$URL?action=offer&public_id=$PUBLIC_ID" -H 'Accept: application/json')"
            printf '%s\n' "$BODY" | head -c 4000
            echo
            printf '%s' "$BODY" | grep -q "\"public_id\":\"$PUBLIC_ID\"" || {
              echo "Machine Commerce did not expose $PUBLIC_ID for $NAME" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          FABRIC_MCP="https://fabric.systemiacommandcenters.com/mcp"

          check_tool_contract() {
            NAME="$1"
            URL="$2"
            TOOL="$3"
            TITLE_NEEDLE="$4"
            echo "::group::$NAME conversion-first tool contract"
            BODY="$(curl -fsS --max-time 20 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{}}')"
            TOOL_JSON="$(printf '%s\n' "$BODY" | sed -n 's/^data: //p' | jq -c --arg tool "$TOOL" '.result.tools[] | select(.name==$tool)' | head -1)"
            [ -n "$TOOL_JSON" ] || {
              echo "MCP tools/list did not expose $TOOL for $NAME" >&2
              exit 1
            }
            printf '%s\n' "$TOOL_JSON"
            if ! printf '%s' "$TOOL_JSON" | jq -e --arg needle "$TITLE_NEEDLE" '.title | contains($needle)' >/dev/null; then
              echo "::warning::$NAME $TOOL title does not contain preferred discovery cue: $TITLE_NEEDLE"
              echo "DISCOVERY_COPY_DRIFT name=$NAME tool=$TOOL expected_title_cue=$TITLE_NEEDLE"
            fi
            printf '%s' "$TOOL_JSON" | jq -e '.description | length > 40' >/dev/null || {
              echo "$NAME $TOOL description is unexpectedly thin" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          call_readonly_tool() {
            NAME="$1"
            URL="$2"
            TOOL="$3"
            ARGS="$4"
            echo "::group::$NAME read-only invocation"
            BODY="$(curl -fsS --max-time 30 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "$(jq -cn --arg tool "$TOOL" --argjson args "$ARGS" '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:$tool,arguments:$args}}')")"
            printf '%s\n' "$BODY" | head -c 5000
            echo
            printf '%s' "$BODY" | grep -Eq '"result"|"structuredContent"' || {
              echo "Read-only MCP invocation did not return a result for $NAME / $TOOL" >&2
              exit 1
            }
            printf '%s' "$BODY" | grep -q '"isError":true' && {
              echo "Read-only MCP invocation returned isError=true for $NAME / $TOOL" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          check_tool "Evercraft Fabric" "$FABRIC_MCP" "list_evercraft_capabilities"
          check_tool "Evercraft Fabric" "$FABRIC_MCP" "match_evercraft_capability"
          check_tool "Evercraft Fabric" "$FABRIC_MCP" "get_evercraft_connection_options"

          check_tool_contract "Evercraft Fabric" "$FABRIC_MCP" "match_evercraft_capability" "capability"

          call_readonly_tool "Evercraft Fabric" "$FABRIC_MCP" "match_evercraft_capability" '{"intent":"I need to understand a long video that ordinary chat tools cannot fully process","limit":1}'
