name: Evercraft MCP External Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/evercraft-mcp-canary.yml"
      - "mcp-registry/*.json"
      - "registry/**/server.json"

permissions:
  contents: read

concurrency:
  group: evercraft-mcp-external-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify every checked-in MCP manifest
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"evercraft-registry-canary","version":"1.0"}}}'

          check() {
            NAME="$1"
            URL="$2"
            echo "::group::$NAME"
            BODY="$(curl -fsS --max-time 20 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "$PAYLOAD")"
            printf '%s\n' "$BODY" | head -c 2500 || true
            echo
            printf '%s' "$BODY" | grep -q '"serverInfo"' || {
              echo "MCP initialize did not return serverInfo for $NAME" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          shopt -s nullglob
          MANIFESTS=(mcp-registry/*.json)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No MCP manifests found." >&2
            exit 1
          fi

          for manifest in "${MANIFESTS[@]}"; do
            NAME="$(jq -r '.name // empty' "$manifest")"
            URL="$(jq -r '.remotes[0].url // empty' "$manifest")"
            if [ -z "$NAME" ] || [ -z "$URL" ]; then
              echo "Invalid MCP manifest identity or remote: $manifest" >&2
              exit 1
            fi
            check "$NAME" "$URL"
          done

          echo "Verified ${#MANIFESTS[@]} checked-in MCP manifests."

      - name: Verify critical tool and commerce contracts
        shell: bash
        run: |
          set -euo pipefail

          check_tool() {
            NAME="$1"
            URL="$2"
            TOOL="$3"
            echo "::group::$NAME tool contract"
            BODY="$(curl -fsS --max-time 20 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
            printf '%s\n' "$BODY" | head -c 4000 || true
            echo
            printf '%s' "$BODY" | grep -q "$TOOL" || {
              echo "MCP tools/list did not expose $TOOL for $NAME" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          check_offer() {
            NAME="$1"
            URL="$2"
            PUBLIC_ID="$3"
            echo "::group::$NAME offer contract"
            BODY="$(curl -fsS --max-time 20 "$URL?action=offer&public_id=$PUBLIC_ID" -H 'Accept: application/json')"
            printf '%s\n' "$BODY" | head -c 4000
            echo
            printf '%s' "$BODY" | grep -q "\"public_id\":\"$PUBLIC_ID\"" || {
              echo "Machine Commerce did not expose $PUBLIC_ID for $NAME" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          COMMERCE_MCP="https://evercraft-ai-suite-08c4d2b8.base44.app/api/apps/692b4178919afe7d08c4d2b8/functions/machineCommerceMcp"
          COMMERCE_GATEWAY="https://evercraft-ai-suite-08c4d2b8.base44.app/api/apps/692b4178919afe7d08c4d2b8/functions/machineCommerceGateway"

          check_tool_contract() {
            NAME="$1"
            URL="$2"
            TOOL="$3"
            TITLE_NEEDLE="$4"
            echo "::group::$NAME conversion-first tool contract"
            BODY="$(curl -fsS --max-time 20 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{}}')"
            TOOL_JSON="$(printf '%s\n' "$BODY" | sed -n 's/^data: //p' | jq -c --arg tool "$TOOL" '.result.tools[] | select(.name==$tool)' | head -1)"
            [ -n "$TOOL_JSON" ] || {
              echo "MCP tools/list did not expose $TOOL for $NAME" >&2
              exit 1
            }
            printf '%s\n' "$TOOL_JSON"
            if ! printf '%s' "$TOOL_JSON" | jq -e --arg needle "$TITLE_NEEDLE" '.title | contains($needle)' >/dev/null; then
              echo "::warning::$NAME $TOOL title does not contain preferred discovery cue: $TITLE_NEEDLE"
              echo "DISCOVERY_COPY_DRIFT name=$NAME tool=$TOOL expected_title_cue=$TITLE_NEEDLE"
            fi
            printf '%s' "$TOOL_JSON" | jq -e '.description | length > 40' >/dev/null || {
              echo "$NAME $TOOL description is unexpectedly thin" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          call_readonly_tool() {
            NAME="$1"
            URL="$2"
            TOOL="$3"
            ARGS="$4"
            echo "::group::$NAME read-only invocation"
            BODY="$(curl -fsS --max-time 30 -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "$(jq -cn --arg tool "$TOOL" --argjson args "$ARGS" '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:$tool,arguments:$args}}')")"
            printf '%s\n' "$BODY" | head -c 5000 || true
            echo
            printf '%s' "$BODY" | grep -Eq '"result"|"structuredContent"' || {
              echo "Read-only MCP invocation did not return a result for $NAME / $TOOL" >&2
              exit 1
            }
            printf '%s' "$BODY" | grep -q '"isError":true' && {
              echo "Read-only MCP invocation returned isError=true for $NAME / $TOOL" >&2
              exit 1
            }
            echo "::endgroup::"
          }

          ALIEV_MCP="https://aliev.base44.app/functions/alievMcp"
          FORENSISCOPE_MCP="https://evercraft-forensiscope.base44.app/functions/forensiScopeMcp"
          CLIP_MCP="https://base44.app/api/apps/6a83af980c9f995f588c7df3/functions/clipMcp"

          check_tool "Evercraft Rewards" "$COMMERCE_MCP" "prepare_rewards_partner_enrollment"
          check_tool "IBM i Rescue via Machine Commerce" "$COMMERCE_MCP" "prepare_quote_ready_service_handoff"
          check_tool "GlobalStat via Machine Commerce" "$COMMERCE_MCP" "query_globalstat_country_intelligence"
          check_tool "EverMaps via Machine Commerce" "$COMMERCE_MCP" "query_evermaps_public_projection"
          check_tool "Little Red Studio via Machine Commerce" "$COMMERCE_MCP" "check_book_export_preflight"
          check_tool "TOWI via Machine Commerce" "$COMMERCE_MCP" "audit_towi_evidence_packet"

          check_tool_contract "Evercraft Machine Commerce" "$COMMERCE_MCP" "match_offer" "Start here"
          check_tool_contract "AliEV" "$ALIEV_MCP" "analyze_ev_site" "Start here"
          check_tool_contract "ForensiScope" "$FORENSISCOPE_MCP" "classify_media_route" "Start here"
          check_tool_contract "Evercraft Clip" "$CLIP_MCP" "plan_clip_job" "Start here"

          call_readonly_tool "Evercraft Machine Commerce" "$COMMERCE_MCP" "match_offer" '{"intent":"I need to understand a long video that ordinary chat tools cannot fully process","limit":1}'
          call_readonly_tool "GlobalStat via Machine Commerce" "$COMMERCE_MCP" "query_globalstat_country_intelligence" '{"countries":["USA","CAN"],"metric_slugs":["gii_2025_rank"],"limit":10}'
          call_readonly_tool "EverMaps via Machine Commerce" "$COMMERCE_MCP" "query_evermaps_public_projection" '{"layer":"navigation_lights","limit":2}'
          call_readonly_tool "Little Red Studio via Machine Commerce" "$COMMERCE_MCP" "check_book_export_preflight" '{"page_count":120,"trim_width_in":6,"trim_height_in":9,"interior_type":"black_white","paper_type":"white","spine_text_present":true,"cover_pixel_width":4000,"cover_pixel_height":6000}'
          call_readonly_tool "TOWI via Machine Commerce" "$COMMERCE_MCP" "audit_towi_evidence_packet" '{"research_question":"What evidence supports this infrastructure claim?","geography":"Washington","evidence_standard":"decision_grade","evidence":[{"evidence_id":"sample_1","source_title":"Official sample source","source_url":"https://example.gov/source","source_type":"primary_official","publisher":"Example Agency","publication_date":"2026-09-30","claim":"Sample claim for bounded canary verification.","evidence_state":"verified_primary","confidence_score":95},{"evidence_id":"sample_2","source_title":"Independent technical report","source_url":"https://example.org/report","source_type":"technical_report","publisher":"Example Institute","publication_date":"2026-09-29","claim":"Second sample claim for bounded canary verification.","evidence_state":"verified_secondary","confidence_score":85},{"evidence_id":"sample_3","source_title":"Supporting dataset","source_url":"https://example.org/data","source_type":"dataset","publisher":"Example Data Lab","publication_date":"2026-09-28","claim":"Third sample claim for bounded canary verification.","evidence_state":"reported","confidence_score":75}]}'
          call_readonly_tool "ForensiScope" "$FORENSISCOPE_MCP" "classify_media_route" '{"size_bytes":52428800,"duration_seconds":5400}'
          call_readonly_tool "Evercraft Clip" "$CLIP_MCP" "plan_clip_job" '{"source_file_size_bytes":10485760,"source_duration_seconds":90,"target_platforms":["YouTube"],"goal":"Create a concise educational social video"}'

          check_offer "IBM i Rescue" "$COMMERCE_GATEWAY" "ibmi-rescue-v1"
          check_offer "Foundry App Escape" "$COMMERCE_GATEWAY" "foundry-app-escape-audit-v1"
          check_offer "Site-Survive" "$COMMERCE_GATEWAY" "site-survive-rapid-audit-v1"
