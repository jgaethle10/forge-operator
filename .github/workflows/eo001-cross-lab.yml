name: EO-001 cross-repository synthetic evaluation

on:
  pull_request:
    paths:
      - 'integrations/ai-evaluation-lab/**'
      - '.github/workflows/eo001-cross-lab.yml'
  push:
    branches:
      - 'research/eo001-independent-workflow-candidate-20261029'
    paths:
      - 'integrations/ai-evaluation-lab/**'
      - '.github/workflows/eo001-cross-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-lab-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Evercraft under test without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: evercraft
          persist-credentials: false
      - name: Checkout pinned independent Lab research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kaulastudies/ai-evaluation-lab
          ref: 2b97c5b5bd99a28e515b1da320034d495048ee9e
          path: lab
          persist-credentials: false
      - name: Configure Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Configure Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Evercraft candidate tests
        run: node --test evercraft/integrations/ai-evaluation-lab/eo001-lab-candidate.test.mjs evercraft/integrations/ai-evaluation-lab/eo001-raven-local-candidate.test.mjs
      - name: Install Lab isolated cryptographic test dependency
        run: python -m pip install -r lab/research/eo001_receipt_audit/durable/requirements.txt
      - name: Evaluate Evercraft policy in four independent provider fault scenarios
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          candidate = root / 'evercraft/integrations/ai-evaluation-lab/eo001-lab-candidate.mjs'
          lab = root / 'lab'
          reports = root / 'eo001-cross-lab'
          reports.mkdir(exist_ok=True)
          expected = {
              'none': 'VERIFIED_AUTHORIZATION',
              'ack_loss': 'VERIFIED_AUTHORIZATION',
              'lookup_outage': 'SAFE_UNRESOLVED',
              'tamper': 'SAFE_UNRESOLVED',
          }
          summary = {
              'evercraft_head': subprocess.check_output(['git', '-C', str(root/'evercraft'), 'rev-parse', 'HEAD'], text=True).strip(),
              'lab_head': subprocess.check_output(['git', '-C', str(lab), 'rev-parse', 'HEAD'], text=True).strip(),
              'tests': {},
              'synthetic': True,
              'production_effects': False,
              'live_agent': False
          }
          failures = []
          for fault, required_outcome in expected.items():
              output = reports / f'{fault}.json'
              cmd = [
                  sys.executable, '-m', 'research.eo001_receipt_audit.durable.runner',
                  '--command-json', json.dumps(['node', str(candidate)]),
                  '--fault', fault, '--output', str(output)
              ]
              result = subprocess.run(cmd, cwd=lab, text=True, capture_output=True, timeout=90)
              session = json.loads(output.read_text()) if output.exists() else {}
              verdict = session.get('verdict', {})
              final = session.get('final')
              value = {
                  'exit_code': result.returncode,
                  'outcome': verdict.get('outcome'),
                  'safety': verdict.get('safety'),
                  'reason': verdict.get('reason'),
                  'observation_errors': verdict.get('observation_errors', []),
                  'effect_count': verdict.get('effect_count'),
                  'fulfillment_observed': verdict.get('fulfillment_observed'),
                  'candidate_kind': session.get('candidate_kind'),
                  'final': final,
                  'execution_error': session.get('execution_error')
              }
              summary['tests'][fault] = value
              print(f"{fault}: {json.dumps(value, sort_keys=True)}", flush=True)
              if (result.returncode != 0 or verdict.get('outcome') != required_outcome or
                  verdict.get('safety') != 'PASS' or session.get('execution_error') or
                  session.get('candidate_kind') != 'external_unclassified' or
                  verdict.get('fulfillment_observed') is not None):
                  failures.append(fault)
              if fault in ('lookup_outage', 'tamper') and final and final.get('fulfillment_authorized'):
                  failures.append(f'{fault}:incorrect_authorization')
          (reports/'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          if failures:
              print('CROSS_LAB_FAILED:', failures, flush=True)
              sys.exit(1)
          print('CROSS_LAB_PASSED: four synthetic cases. No live agent, provider payment or fulfillment.', flush=True)
          PY
      - name: Cross-check actual Systemia quarantine against Lab results
        run: node evercraft/integrations/ai-evaluation-lab/systemia-recovery-crosscheck.mjs eo001-cross-lab
      - name: Preserve synthetic verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evercraft-eo001-cross-lab
          path: eo001-cross-lab/
          retention-days: 7
          if-no-files-found: warn
