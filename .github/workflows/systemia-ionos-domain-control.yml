name: Systemia IONOS Domain Control

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/ionos-dns-upsert.mjs"
      - "scripts/ionos-domain-control-challenge.mjs"
      - "scripts/promote-ionos-domain-control.mjs"
      - "tests/ionos-dns-upsert.test.mjs"
      - "tests/ionos-domain-control.test.mjs"
      - ".github/workflows/systemia-ionos-domain-control.yml"

permissions:
  contents: write

concurrency:
  group: systemia-ionos-domain-control
  cancel-in-progress: false

jobs:
  prove-control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove local control contracts
        run: node --test tests/ionos-dns-upsert.test.mjs tests/ionos-domain-control.test.mjs

      - name: Record credential availability without exposing it
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/domain-control
          if [ -z "${IONOS_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            cat > artifacts/domain-control/systemiacommandcenters.com-latest.json <<'JSON'
          {
            "schema": "evercraft.ionos-domain-control-challenge.v1",
            "domain": "systemiacommandcenters.com",
            "state": "blocked_missing_ionos_api_key",
            "verified": false,
            "edge_eligible": false,
            "secret_material_exposed": false
          }
          JSON
            {
              echo "## Systemia domain-control gate"
              echo
              echo "- Domain: systemiacommandcenters.com"
              echo "- State: **blocked_missing_ionos_api_key**"
              echo "- Owned Fabric edge remains independently live; this gate controls autonomous DNS mutation only."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue and externally verify fresh IONOS control challenge
        if: steps.credential.outputs.available == 'true'
        run: |
          node scripts/ionos-domain-control-challenge.mjs             --domain systemiacommandcenters.com             --out artifacts/domain-control/systemiacommandcenters.com-latest.json

      - name: Promote verified root control and Fabric front door
        if: steps.credential.outputs.available == 'true'
        run: |
          node scripts/promote-ionos-domain-control.mjs             --receipt artifacts/domain-control/systemiacommandcenters.com-latest.json             --edge-receipt conformance/runtime-observations/2026-10-06-evercraft-fabric-operator-edge.json             --out artifacts/domain-control/promotion-receipt.json

      - name: Commit verified control state
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add infra/evercraft-edge/registry/domain-control.json infra/evercraft-edge/registry/front-doors.json
          if git diff --cached --quiet; then
            echo "Canonical domain-control state already current."
            exit 0
          fi
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main advanced during verification; refusing to publish stale promotion." >&2
            exit 1
          fi
          git config user.name "Systemia Domain Authority"
          git config user.email "systemia-domain-authority@users.noreply.github.com"
          git commit -m "Verify IONOS domain control [skip ci]"
          git push origin HEAD:main

      - name: Upload domain-control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemia-ionos-domain-control
          path: artifacts/domain-control
          if-no-files-found: error
          retention-days: 90
