name: EPS Havenly independent domain-frontdoor shell

on:
  pull_request:
    paths:
      - 'infra/evercraft-edge/service-frontdoor/**'
      - 'public/eps/index.html'
      - 'public/havenly/index.html'
      - 'public/apps/eps-estimator/index.html'
      - '.github/workflows/eps-havenly-domain-shell.yml'
  push:
    branches: [main]
    paths:
      - 'infra/evercraft-edge/service-frontdoor/**'
      - 'public/eps/index.html'
      - 'public/havenly/index.html'
      - 'public/apps/eps-estimator/index.html'
      - '.github/workflows/eps-havenly-domain-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove embedded sites are the current canonical published HTML
        run: node infra/evercraft-edge/service-frontdoor/generate-embedded.mjs
      - name: Prove separate hostnames, contact paths, fallback, security boundaries
        run: node --test infra/evercraft-edge/service-frontdoor/worker.test.mjs
      - name: Validate portable loopback HTTP origin with independent hostname requests
        shell: bash
        run: |
          set -euo pipefail
          node infra/evercraft-edge/service-frontdoor/server.mjs &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS --max-time 2 -o /dev/null -H 'Host: evercraftpropertyservices.com' http://127.0.0.1:3080/ && break || sleep 1; done
          for domain in evercraftpropertyservices.com havenlycleaning.com; do
            curl -fsS --max-time 5 -H "Host: $domain" http://127.0.0.1:3080/ > /tmp/"$domain".html
          done
          grep -q 'tel:+15097590440' /tmp/evercraftpropertyservices.com.html
          grep -q 'mailto:jessegaethle10@gmail.com' /tmp/evercraftpropertyservices.com.html
          grep -q 'mailto:evercraftpropertyservices@gmail.com' /tmp/evercraftpropertyservices.com.html
          grep -q 'sms:+15095605190' /tmp/havenlycleaning.com.html
          grep -q 'mailto:havenlycleaning@gmail.com' /tmp/havenlycleaning.com.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: evercraftpropertyservices.com' http://127.0.0.1:3080/apps/eps-estimator/)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:3080/)" = "421"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: havenlycleaning.com' http://127.0.0.1:3080/api/private)" = "404"
          echo "LOCAL ORIGIN PASS; PRODUCTION DOMAIN CUTOVER NOT CLAIMED." >> "$GITHUB_STEP_SUMMARY"
      - name: Review IONOS cutover instructions and never auto-mutate DNS
        run: |
          test -f infra/evercraft-edge/service-frontdoor/Caddyfile
          test -f infra/evercraft-edge/service-frontdoor/README.md
          grep -q 'MX' infra/evercraft-edge/service-frontdoor/README.md
          grep -q 'domain_not_cut_over' infra/evercraft-edge/service-frontdoor/README.md
