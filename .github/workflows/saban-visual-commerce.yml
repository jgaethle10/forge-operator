name: Saban Visual Checkout Canary

on:
  pull_request:
    paths:
      - "systemia/evercraft-web/browser-worker/saban-visual-commerce-canary.mjs"
      - ".github/workflows/saban-visual-commerce.yml"
  push:
    branches: [main]
    paths:
      - "systemia/evercraft-web/browser-worker/saban-visual-commerce-canary.mjs"
      - ".github/workflows/saban-visual-commerce.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saban-visual-commerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install owned browser worker dependencies
        working-directory: systemia/evercraft-web/browser-worker
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium for read-only browser capture
        working-directory: systemia/evercraft-web/browser-worker
        run: npx playwright install --with-deps chromium
      - name: Run Saban anonymous visual commerce canary
        run: node systemia/evercraft-web/browser-worker/saban-visual-commerce-canary.mjs
      - name: Upload screenshots, recordings and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saban-visual-commerce-${{ github.run_id }}
          path: artifacts/saban/commerce-visual/**
          if-no-files-found: warn
          retention-days: 7
