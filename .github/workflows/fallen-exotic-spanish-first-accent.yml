name: Fallen Exotic Chiles Spanish-First Voice Accent Auditions
on:
  push:
    branches: [production/fallen-original-mature-narrator-audition-20261124]
    paths:
      - 'systemia/media-studio/voice-foundry/exotic-spanish-first-accent-test.py'
      - '.github/workflows/fallen-exotic-spanish-first-accent.yml'
permissions: {contents: read}
jobs:
  accent:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install published native voice runtime and original model weights
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub numpy soundfile
          curl -fLsS --retry 3 'https://github.com/CrispStrobe/CrispASR/releases/latest/download/crispasr-linux-x86_64.tar.gz' -o /tmp/crispasr.tar.gz
          mkdir -p /tmp/crispasr-dist /tmp/voice-model
          tar -xzf /tmp/crispasr.tar.gz -C /tmp/crispasr-dist
          BIN="$(find /tmp/crispasr-dist -type f -name crispasr | head -n 1)"
          test -n "$BIN"
          install -m 755 "$BIN" /tmp/crispasr_voice
          LIB_DIRS="$(find /tmp/crispasr-dist -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd ':' -)"
          printf 'LD_LIBRARY_PATH=%s\n' "$LIB_DIRS" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$LIB_DIRS" ldd /tmp/crispasr_voice > /tmp/voice-deps.txt
          ! grep -q 'not found' /tmp/voice-deps.txt
          hf download cstr/qwen3-tts-1.7b-voicedesign-GGUF qwen3-tts-12hz-1.7b-voicedesign-q8_0.gguf --local-dir /tmp/voice-model
          hf download cstr/qwen3-tts-1.7b-base-GGUF qwen3-tts-12hz-1.7b-base-q8_0.gguf --local-dir /tmp/voice-model
          hf download cstr/qwen3-tts-tokenizer-12hz-GGUF qwen3-tts-tokenizer-12hz.gguf --local-dir /tmp/voice-model
      - name: Generate native-Mexican-Spanish reference, English, bilingual and cross-language samples
        env:
          OMP_NUM_THREADS: "4"
        run: python systemia/media-studio/voice-foundry/exotic-spanish-first-accent-test.py
      - name: Verify actual audio and no-client-send receipt
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,wave
          root=pathlib.Path('spanish-first-mexican-accent-auditions')
          r=json.loads((root/'receipt.json').read_text())
          assert len(r['samples'])==4
          assert r['originalSyntheticReferenceOnly'] and not r['commercialReleaseAllowed']
          for x in r['samples']:
            p=root/x['file']
            with wave.open(str(p),'rb') as w: assert w.getnframes()>0 and w.getframerate()>=16000
            assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          print('PASS: four original WAV files and exact-source receipt')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fallen-exotic-spanish-first-auditions-private
          path: spanish-first-mexican-accent-auditions/
          retention-days: 3
          if-no-files-found: error
