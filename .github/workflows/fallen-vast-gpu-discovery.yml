name: Fallen Vast GPU offer discovery (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, creative/fallen-flagship-20261027]
    paths:
      - '.github/workflows/fallen-vast-gpu-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query on-demand RTX 4090 offers (no rental)
        env:
          VAST_API_KEY: ${{ secrets.Cloud_Vast_AI_Key }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          key=os.getenv("VAST_API_KEY","")
          if not key: sys.exit("FAIL: Cloud_Vast_AI_Key secret missing; no rental.")
          query={"verified":{"eq":True},"rentable":{"eq":True},"num_gpus":{"eq":1},"gpu_name":{"in":["RTX 4090"]},"gpu_ram":{"gte":23000},"reliability":{"gte":0.95},"cpu_ram":{"gte":32000},"order":[["dph_total","asc"]],"type":"ondemand","limit":25}
          req=urllib.request.Request("https://console.vast.ai/api/v0/bundles/",data=json.dumps(query).encode(),headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=20) as res: data=json.load(res)
          except urllib.error.HTTPError as e: sys.exit("FAIL: Vast offer query HTTP "+str(e.code)+"; no rental.")
          except Exception: sys.exit("FAIL: Vast offer query unavailable; no rental.")
          if not isinstance(data,dict): sys.exit("FAIL: Unexpected response shape; no rental.")
          offers=data.get("offers",data.get("instances"))
          if not isinstance(offers,list): sys.exit("FAIL: No recognized offer list; no rental.")
          def number(v):
              try: return round(float(v),3)
              except (TypeError,ValueError): return None
          MAX_COMPUTE_USD_PER_HOUR=0.75
          MAX_PLANNED_HOURS=2
          valid=[]
          rejected=0
          rejection_reasons={}
          verification_shapes={}
          for o in offers:
              if not isinstance(o,dict): continue
              price=number(o.get("dph_total"))
              reliability=number(o.get("reliability2"))
              vram=number(o.get("gpu_ram"))
              ram=number(o.get("cpu_ram"))
              verified_value=o.get("verified","__missing__")
              verified_shape=("missing" if verified_value=="__missing__" else
                "bool_true" if verified_value is True else
                "bool_false" if verified_value is False else
                "int_one" if isinstance(verified_value,int) and verified_value==1 else
                "int_zero" if isinstance(verified_value,int) and verified_value==0 else
                "str_true" if isinstance(verified_value,str) and verified_value.lower()=="true" else
                type(verified_value).__name__+"_other")
              verification_shapes[verified_shape]=verification_shapes.get(verified_shape,0)+1
              checks={
                  "gpu_name":o.get("gpu_name")=="RTX 4090",
                  "gpu_count":o.get("num_gpus")==1,
                  "verified":o.get("verified") is True or ("verified" not in o and query.get("verified")=={"eq":True}),
                  "rentable":o.get("rentable") is True,
                  "price_ceiling":price is not None and 0<price<=MAX_COMPUTE_USD_PER_HOUR,
                  "reliability":reliability is not None and reliability>=0.95,
                  "vram":vram is not None and vram>=23000,
                  "cpu_ram":ram is not None and ram>=32000,
              }
              failed=[k for k,v in checks.items() if not v]
              if failed:
                  rejected+=1
                  for reason in failed:
                      rejection_reasons[reason]=rejection_reasons.get(reason,0)+1
                  continue
              valid.append({"offer_id":o.get("id"),"usd_per_hour":price,"gpu":"RTX 4090","verification_evidence":"vast_filter_only" if "verified" not in o else "explicit_offer_field","rental_approved":False,"reliability":number(o.get("reliability2")),"vram_mb":o.get("gpu_ram"),"ram_mb":o.get("cpu_ram")})
          valid.sort(key=lambda x:x["usd_per_hour"])
          report={"mode":"READ_ONLY","rental_started":False,"max_compute_usd_per_hour":MAX_COMPUTE_USD_PER_HOUR,"planned_hours":MAX_PLANNED_HOURS,"max_estimated_compute_usd":round(MAX_COMPUTE_USD_PER_HOUR*MAX_PLANNED_HOURS,2),"storage_network_taxes_extra":True,"matching_offers":len(valid),"rejected_offers":rejected,"rejection_reasons":rejection_reasons,"verification_shapes":verification_shapes,"cheapest":valid[:5]}
          print(json.dumps(report,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("## Fallen Studios GPU discovery\\n\\n")
              summary.write("Read-only search. **No GPU rented.**\\n\\n")
              summary.write(f"Compute-only planning ceiling: **\u0024{MAX_COMPUTE_USD_PER_HOUR}/hour** for **{MAX_PLANNED_HOURS} hours** (maximum **\u0024{MAX_COMPUTE_USD_PER_HOUR*MAX_PLANNED_HOURS:.2f}** compute). Storage, network and taxes may add charges; this is not a billing cap.\\n\\n")
              summary.write(f"Matching offers: **{len(valid)}**; rejected after validation: **{rejected}**\\n\\n")
              summary.write("| Offer ID | USD/hour | Reliability | VRAM MB | RAM MB |\\n|---|---:|---:|---:|---:|\\n")
              for o in valid[:5]:
                  summary.write(f"| {o['offer_id']} | {o['usd_per_hour']} | {o['reliability']} | {o['vram_mb']} | {o['ram_mb']} |\\n")
          PY
