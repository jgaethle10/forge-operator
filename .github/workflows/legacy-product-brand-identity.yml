name: Legacy Product Brand Identity Gate
on:
  pull_request:
    paths:
      - 'docs/branding/legacy-product-faces-20261117.json'
      - 'public/brand-lab/**'
      - 'tests/legacy-product-faces.test.mjs'
      - '.github/workflows/legacy-product-brand-identity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/branding/legacy-product-faces-20261117.json'
      - 'public/brand-lab/**'
      - 'tests/legacy-product-faces.test.mjs'
      - '.github/workflows/legacy-product-brand-identity.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate unique product faces and truthful preview boundaries
        run: node --test tests/legacy-product-faces.test.mjs
