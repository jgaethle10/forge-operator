name: Fallen Identity Fingerprint

on:
  pull_request:
    paths:
      - 'systemia/media-studio/identity-fingerprint.ts'
      - 'systemia/media-studio/identity-fingerprint.test.ts'
      - 'systemia/media-studio/production-runtime.ts'
      - '.github/workflows/fallen-identity-fingerprint.yml'
  workflow_dispatch:

jobs:
  identity-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: node --import tsx --test systemia/media-studio/identity-fingerprint.test.ts systemia/media-studio/production-runtime.test.ts
      - run: npm run lint
