name: ForensiScope commercial release canary

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail run if a public release surface is invalid"
        type: boolean
        default: true
  pull_request:
    paths:
      - 'systemia/distribution/forensiscope-commerce-canary*.mjs'
      - '.github/workflows/forensiscope-commerce-canary.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/distribution/forensiscope-commerce-canary*.mjs'
      - '.github/workflows/forensiscope-commerce-canary.yml'

permissions:
  contents: read

concurrency:
  group: forensiscope-commerce-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local invariant tests (no network)
        run: node --test systemia/distribution/forensiscope-commerce-canary.test.mjs
      - name: Read-only public surface and payment quote probes
        env:
          EVERCRAFT_CANARY_OUT: artifacts/distribution/forensiscope-commerce-canary.json
          STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict && 'true' || 'false' }}
        run: |
          if [ "$STRICT" = 'true' ]; then
            node systemia/distribution/forensiscope-commerce-canary.mjs --strict
          else
            node systemia/distribution/forensiscope-commerce-canary.mjs
          fi
      - name: Save evidence including blocked runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensiscope-commerce-observation
          path: artifacts/distribution/forensiscope-commerce-canary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Release truth
        if: always()
        run: |
          echo "## ForensiScope read-only commercial release probe" >> "$GITHUB_STEP_SUMMARY"
          echo "A 200 app shell is not Parcel Desk. A quote is not payment. A matching bundle is not real recipient delivery." >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/distribution/forensiscope-commerce-canary.json ]; then
            node -e "const r=require('./artifacts/distribution/forensiscope-commerce-canary.json'); console.log('Status: '+r.status); console.log('Failures: '+r.failures.join(', '))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Receipt not generated; probe itself failed." >> "$GITHUB_STEP_SUMMARY"
          fi
