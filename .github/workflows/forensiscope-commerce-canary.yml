name: ForensiScope commercial release canary

on:
  schedule:
    - cron: '17 */6 * * *' # Owned-only hold receipt, zero external provider requests
  workflow_dispatch:
    inputs:
      strict:
        description: "Produce a held receipt, never contact a legacy endpoint"
        type: boolean
        default: true
  pull_request:
    paths:
      - 'systemia/distribution/forensiscope-commerce-canary*.mjs'
      - '.github/workflows/forensiscope-commerce-canary.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/distribution/forensiscope-commerce-canary*.mjs'
      - '.github/workflows/forensiscope-commerce-canary.yml'

permissions:
  contents: read

concurrency:
  group: forensiscope-commerce-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local invariant tests (no network)
        run: node --test systemia/distribution/forensiscope-commerce-canary.test.mjs
      - name: Record held owned-only commercial status without any outbound provider request
        env:
          EVERCRAFT_CANARY_OUT: artifacts/distribution/forensiscope-commerce-canary.json
        run: |
          node systemia/distribution/forensiscope-commerce-canary.mjs
          node -e "const r=require('./artifacts/distribution/forensiscope-commerce-canary.json'); if(r.network_requests!==0||r.customer_ready!==false||r.status!=='HELD_LEGACY_PROVIDER_EGRESS_FROZEN')process.exit(1);"
      - name: Save evidence including blocked runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensiscope-commerce-observation
          path: artifacts/distribution/forensiscope-commerce-canary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Release truth
        if: always()
        run: |
          echo "## ForensiScope owned-only commercial hold receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy provider calls frozen; no buyer readiness or paid delivery claims." >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/distribution/forensiscope-commerce-canary.json ]; then
            node -e "const r=require('./artifacts/distribution/forensiscope-commerce-canary.json'); console.log('Status: '+r.status); console.log('Failures: '+r.failures.join(', '))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Receipt not generated; probe itself failed." >> "$GITHUB_STEP_SUMMARY"
          fi
