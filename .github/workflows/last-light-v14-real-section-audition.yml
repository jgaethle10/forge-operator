name: Last Light V14 Authentic Recorded Orchestra Sections
on:
  pull_request:
    paths:
      - 'systemia/media-studio/last-light-v14-verified-section-source-pins.json'
      - 'systemia/media-studio/last-light-v14-real-section-audition.py'
      - 'systemia/media-studio/test_last_light_v14_real_section_audition.py'
      - 'systemia/media-studio/last-light-v9-conductor-score.json'
      - 'systemia/media-studio/last-light-v12-native-audition.py'
      - '.github/workflows/last-light-v14-real-section-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v14-verified-8-section-recorded-source-workprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PCM sample toolchain (no synth software)
        run: python -m pip install --disable-pip-version-check numpy soundfile
      - name: Fifteen independently reported routing/provenance regression tests
        run: |
          python -m unittest discover -v -s systemia/media-studio \
            -p 'test_last_light_v14_real_section_audition.py'
      - name: Fetch exact immutable VSCO acoustic files and verify pinned original Git blobs
        run: |
          python - <<'PY'
          import hashlib,io,json,pathlib,urllib.parse,urllib.request,zipfile,time
          manifest=json.loads(pathlib.Path('systemia/media-studio/last-light-v14-verified-section-source-pins.json').read_text())
          assert manifest['source_commit_sha']=='440300901dfe9275fd84e0b7763af1f8443ae62e'
          assert len(manifest['sample_files'])==12
          def gitblob(b):
           return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          archive=pathlib.Path('/tmp/v14-original-acoustic-recordings.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_STORED) as z:
           for item in manifest['sample_files']:
            relative=urllib.parse.quote(item['path'],safe='/')
            url='https://raw.githubusercontent.com/sgossner/VSCO-2-CE/'+manifest['source_commit_sha']+'/'+relative
            data=None
            for attempt in range(3):
             try:
              req=urllib.request.Request(url,headers={'User-Agent':'Evercraft-Fallen-V14-Source-QA'})
              with urllib.request.urlopen(req,timeout=40) as response:
               if response.status!=200:raise ValueError('upstream_missing')
               data=response.read(item['size_bytes']+1)
              break
             except Exception:
              if attempt==2:raise
              time.sleep(2)
            if len(data)!=item['size_bytes']:raise ValueError('upstream_size_drift:'+item['path'])
            if gitblob(data)!=item['git_blob_sha1']:raise ValueError('upstream_git_blob_drift:'+item['path'])
            z.writestr(pathlib.Path(item['path']).name,data)
            print('SOURCE VERIFIED',item['instrument'],item['pitch'],hashlib.sha256(data).hexdigest(),flush=True)
          print('12 pinned original acoustic files verified and archived for V14 only')
          PY
      - name: Render authentic eight-section source-only stems and ensemble workprints
        run: |
          python systemia/media-studio/last-light-v14-real-section-audition.py \
            --score systemia/media-studio/last-light-v9-conductor-score.json \
            --pins systemia/media-studio/last-light-v14-verified-section-source-pins.json \
            --sources /tmp/v14-original-acoustic-recordings.zip \
            --out /tmp/v14-orchestra-auditions
          python - <<'PY'
          import hashlib,json,pathlib
          folder=pathlib.Path('/tmp/v14-orchestra-auditions')
          r=json.loads((folder/'V14_ACOUSTIC_SOURCE_RECEIPT.json').read_text())
          assert r['recorded_note_events']==17 and r['held_note_events']==30
          assert r['recorded_sections_with_at_least_one_root']==8
          assert len(r['source_custody'])==12
          assert len(r['output_sha256'])==11
          for name,digest in r['output_sha256'].items():
           assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==digest
          assert not r['original_piano_included'] and not r['synthesis_or_pitch_shifting_used']
          assert not r['recorded_continuous_legato'] and not r['founder_listening_approved']
          assert not r['commercial_release_approved']
          print('V14 SOURCE-RECEIPTED EIGHT-SECTION ACOUSTIC WORKPRINT: QA PASS, ARTISTIC APPROVAL HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: internal-v14-authentic-eight-section-acoustic-workprint-unapproved
          path: /tmp/v14-orchestra-auditions/
          retention-days: 14
