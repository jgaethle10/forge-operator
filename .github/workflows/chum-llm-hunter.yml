name: CHUM LLM hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"
  push:
    branches:
      - main
    paths:
      - "systemia/chum/llm-hunter.mjs"
      - "systemia/chum/fire-control.mjs"
      - "systemia/chum/money-radar.mjs"
      - "tests/chum-fire-control.test.mjs"
      - "tests/chum-money-radar.test.mjs"
      - "systemia/saban/revenue-swarm.mjs"
      - "tests/saban-revenue-swarm.test.mjs"
      - "public/chum/revenue.json"
      - "public/.well-known/evercraft-pain-index.json"
      - "systemia/chum/live-intent-hunter.mjs"
      - "tests/chum-live-intent-hunter.test.mjs"
      - "server.ts"
      - "public/openapi.json"
      - "public/.well-known/evercraft-agent.json"
      - "public/.well-known/evercraft-capabilities.json"
      - "public/.well-known/evercraft-chum.json"
      - "tests/chum-llm-hunter.test.mjs"
      - "systemia/chum/ard-strike.mjs"
      - "tests/chum-ard-strike.test.mjs"
      - "mcp-registry/*.json"
      - "chum-probes/**"
      - "public/.well-known/evercraft-machine-catalog.json"
      - ".github/workflows/chum-llm-hunter.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: chum-llm-hunter
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove hunter safety and contracts
        run: |
          npm run test:chum-hunter
          npm run test:chum-live-intent
          npm run test:saban-revenue

      - name: Prove federated ARD strike contracts
        run: npm run test:chum-ard-strike

      - name: Prove Fire Control contract
        run: |
          npm run test:chum-money-radar
          npm run test:chum-fire-control

      - name: Build adaptive crawler radar
        continue-on-error: true
        env:
          CHUM_PUBLIC_ORIGIN: ${{ vars.CHUM_PUBLIC_ORIGIN }}
        run: npm run chum:crawler-radar

      - name: Verify sell-now commerce doors
        continue-on-error: true
        run: npm run chum:commerce-canary

      - name: Build Saban revenue formation
        run: npm run saban:revenue

      - name: Hunt public LLM and agent ecosystems
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run chum:hunt

      - name: Rotate one brand-blind pain attack across authorized providers
        id: provider_probe
        continue-on-error: true
        env:
          CHUM_PROBE_BRIDGE_URL: ${{ secrets.CHUM_PROBE_BRIDGE_URL }}
          CHUM_PROBE_BRIDGE_TOKEN: ${{ secrets.CHUM_PROBE_BRIDGE_TOKEN }}
          NEXUS_PROBE_BRIDGE_URL: ${{ secrets.NEXUS_PROBE_BRIDGE_URL }}
          NEXUS_PROBE_BRIDGE_TOKEN: ${{ secrets.NEXUS_PROBE_BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CASE_ID="$(node -e "const fs=require('fs');let ids=[];try{const f=JSON.parse(fs.readFileSync('artifacts/saban-revenue/latest.json'));ids=[...new Set((f.focus_rotation||[]).flatMap(x=>x.probe_case_ids||[]))]}catch{};if(!ids.length){const s=JSON.parse(fs.readFileSync('chum-probes/probe-suite.json'));ids=s.cases.filter(x=>x.enabled&&x.expected_fit).map(x=>x.case_id)};const i=Math.floor(Date.now()/3600000)%ids.length;process.stdout.write(ids[i]||'')")"
          if [ -z "$CASE_ID" ]; then
            echo "No eligible brand-blind probe case is available."
            exit 0
          fi
          echo "Running receipt-backed brand-blind provider probe case: $CASE_ID"
          if { [ -n "${CHUM_PROBE_BRIDGE_URL:-}" ] && [ -n "${CHUM_PROBE_BRIDGE_TOKEN:-}" ]; } || { [ -n "${NEXUS_PROBE_BRIDGE_URL:-}" ] && [ -n "${NEXUS_PROBE_BRIDGE_TOKEN:-}" ]; }; then
            CHUM_PROBE_CASES="$CASE_ID" CHUM_REQUIRE_PROBE_BRIDGE=false npm run chum:providers
          else
            echo "Consumer bridge is not configured; running the approved generic-agent machine-client measurement instead."
            CHUM_PROBE_PROVIDERS=generic_agent CHUM_PROBE_CASES="$CASE_ID" CHUM_REQUIRE_PROBE_BRIDGE=false npm run chum:providers
          fi
          node <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/chum/provider-probe-latest.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `measurement_state=${receipt.measurement_state || 'unknown'}`,
            `bridge_configured=${receipt.bridge_configured ? 'true' : 'false'}`,
            `completed=${receipt.summary?.completed || 0}`,
            `blocked=${receipt.summary?.blocked || 0}`
          ].join('\n') + '\n');
          NODE

      - name: Strike federated ARD discovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HOUR="$(date -u +%H)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual ARD pass may submit bounded registry work."
            CHUM_ARD_SUBMIT=true npm run chum:ard-strike
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$((10#$HOUR % 6))" -eq 0 ]; then
            echo "Six-hour scheduled ARD submission window."
            CHUM_ARD_SUBMIT=true npm run chum:ard-strike
          else
            echo "Recon-only ARD pass; routine pushes do not re-submit registry endpoints."
            CHUM_ARD_SUBMIT=false npm run chum:ard-strike
          fi

      - name: Push current Evercraft doors into search discovery
        continue-on-error: true
        run: npm run chum:announce

      - name: Verify Official MCP Registry and remote MCP doors
        continue-on-error: true
        run: npm run chum:mcp

      - name: Measure authoritative payment funnel
        id: money_radar
        if: always()
        continue-on-error: true
        env:
          CUSTOM_CHUM_ATTRIBUTION_EXPORT_URL: ${{ secrets.CHUM_ATTRIBUTION_EXPORT_URL }}
          CUSTOM_CHUM_ATTRIBUTION_EXPORT_TOKEN: ${{ secrets.CHUM_ATTRIBUTION_EXPORT_TOKEN }}
          CHUM_MONEY_RADAR_STRICT: "false"
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_PAYMENT_EXPORT="https://evercraft-ai-suite-08c4d2b8.base44.app/api/apps/692b4178919afe7d08c4d2b8/functions/machineCommercePaymentExport"
          if [ -n "${CUSTOM_CHUM_ATTRIBUTION_EXPORT_URL:-}" ]; then
            export CHUM_ATTRIBUTION_EXPORT_URL="$CUSTOM_CHUM_ATTRIBUTION_EXPORT_URL"
            export CHUM_ATTRIBUTION_EXPORT_TOKEN="${CUSTOM_CHUM_ATTRIBUTION_EXPORT_TOKEN:-}"
          else
            export CHUM_ATTRIBUTION_EXPORT_URL="$DEFAULT_PAYMENT_EXPORT"
            if [ "${GITHUB_REF:-}" = "refs/heads/main" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              OIDC_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=evercraft-chum-payment-export")"
              export OIDC_RESPONSE
              export CHUM_ATTRIBUTION_EXPORT_TOKEN="$(node -e "const j=JSON.parse(process.env.OIDC_RESPONSE||'{}'); if(!j.value) process.exit(2); process.stdout.write(j.value)")"
            else
              export CHUM_ATTRIBUTION_EXPORT_TOKEN=""
            fi
          fi
          npm run chum:money-radar

      - name: Run discovery-to-revenue Fire Control
        id: fire_control
        if: always()
        run: npm run chum:fire-control

      - name: Write Fire Control summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/chum/money-radar-latest.md ]; then
            cat artifacts/chum/money-radar-latest.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/chum/fire-control-latest.md ]; then
            cat artifacts/chum/fire-control-latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload hunter receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chum-llm-hunter-receipts
          path: |
            artifacts/chum/llm-hunter-latest.*
            artifacts/chum/indexnow-latest.*
            artifacts/chum/mcp-canary-latest.*
            artifacts/chum/commerce-canary-latest.*
            artifacts/chum/provider-probe-latest.*
            artifacts/chum/ard-strike-latest.*
            artifacts/chum/crawler-radar-latest.json
            artifacts/chum/money-radar-latest.*
            artifacts/chum/revenue-events.ndjson
            artifacts/chum/fire-control-latest.*
            artifacts/saban-revenue/latest.*
          if-no-files-found: warn
