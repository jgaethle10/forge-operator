name: AIW Washington 2026 pinned importer
on:
  pull_request:
    paths:
      - 'research/infrastructure-watch/engineering/aiw_wa26_import.py'
      - 'research/infrastructure-watch/tests/test_aiw_wa26_import.py'
      - '.github/workflows/aiw-wa26-import.yml'
permissions:
  contents: read
jobs:
  verify-wa26-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-pinned offline importer tests
        run: |
          python3 -m py_compile research/infrastructure-watch/engineering/aiw_wa26_import.py
          python3 -m unittest discover -s research/infrastructure-watch/tests -p test_aiw_wa26_import.py -v
