name: DayTrade Delayed SIP Decision Audit 2026-10-07

on:
  push:
    branches:
      - "systemia/daytrade-sip-decision-audit-2026-10-07"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit frozen IEX decisions against delayed SIP
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_SIP_DECISION_AUDIT_OUTPUT: artifacts/daytrade-edge/delayed-sip-decision-audit-2026-10-07.json
        run: node systemia/daytrade-lens/edge-delayed-sip-decision-audit.mjs
      - name: Upload SIP decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-sip-decision-audit-${{ github.run_id }}
          path: artifacts/daytrade-edge/delayed-sip-decision-audit-2026-10-07.json
          if-no-files-found: error
          retention-days: 30
