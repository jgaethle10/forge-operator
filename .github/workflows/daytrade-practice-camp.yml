name: DayTrade Lens Practice Camp

on:
  pull_request:
    paths:
      - "systemia/daytrade-lens/**"
      - ".github/workflows/daytrade-practice-camp.yml"
  push:
    branches: [main]
    paths:
      - "systemia/daytrade-lens/**"
      - ".github/workflows/daytrade-practice-camp.yml"
  schedule:
    # UTC schedule: repeated historical-only practice, not a live market stream.
    - cron: "15 13-23 * * 1-5"
    # Weekend replay and adversarial review.
    - cron: "15 0,3,6,9,12,15,18,21 * * 0,6"
  workflow_dispatch:

concurrency:
  group: daytrade-practice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
      ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
      PRACTICE_REPORT_PATH: artifacts/daytrade-practice/latest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove simulator and fail-closed gates
        run: |
          node systemia/daytrade-lens/practice-camp.test.mjs
          node systemia/daytrade-lens/live-market-observer.test.mjs
          node systemia/daytrade-lens/shadow-scout-team.test.mjs
          node systemia/daytrade-lens/market-camp-audit.test.mjs
          node systemia/daytrade-lens/practice-visual-report.test.mjs
          node systemia/daytrade-lens/rockies-edge-fabric.test.mjs
          node systemia/daytrade-lens/rockies-edge-consumer.test.mjs
          node systemia/daytrade-lens/edge-research-factory.test.mjs

      - name: Run historical market-data replay only
        if: github.event_name != 'pull_request'
        run: node systemia/daytrade-lens/practice-camp.mjs

      - name: Verify replay receipt exists and is valid JSON
        if: github.event_name != 'pull_request'
        run: |
          node -e 'const fs=require("node:fs"); const p=process.env.PRACTICE_REPORT_PATH; const d=JSON.parse(fs.readFileSync(p,"utf8")); if(d?.schema!=="evercraft.daytrade-practice-camp.v1" || d?.mode!=="SIMULATION_ONLY" || d?.live_order_capability_used!==false) throw Error("Invalid practice identity or execution mode"); if(!Array.isArray(d.source_stats)||d.source_stats.length===0||d.source_stats.some(x=>!Number.isFinite(x.bars)||x.bars<=0)) throw Error("Historical market data absent or incomplete"); if(!Array.isArray(d.adversarial_drills)||d.adversarial_drills.length===0||d.adversarial_drills.some(x=>x.passed!==true)) throw Error("Adversarial safety drills failed"); if(!Array.isArray(d.sessions)||d.sessions.length===0||!Number.isFinite(d.summary?.sessions)||d.summary.sessions!==d.sessions.length) throw Error("No verified replay sessions"); if(!Number.isFinite(d.summary?.hard_violations)||d.summary.hard_violations!==0) throw Error("Risk rule violations"); console.log(JSON.stringify({historical_practice_verified:true,session_count:d.summary.sessions,simulated_trades:d.summary.trades,source_symbols:d.source_stats.length,mode:d.mode}));'

      - name: Render shareable historical simulation report
        if: github.event_name != 'pull_request'
        run: node systemia/daytrade-lens/practice-visual-report.mjs artifacts/daytrade-practice/latest.json artifacts/daytrade-practice/visual-report.html

      - name: Upload simulation receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-practice-camp
          path: artifacts/daytrade-practice/

          if-no-files-found: error
          retention-days: 30
