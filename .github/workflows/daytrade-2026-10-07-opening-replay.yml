name: DayTrade 2026-10-07 Opening Replay

on:
  push:
    branches:
      - "systemia/daytrade-practice-2026-10-07-opening-replay"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay frozen rule on 09:35 ET opening quotes
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_OPENING_REPLAY_OUTPUT: artifacts/daytrade-edge/opening-replay-2026-10-07.json
        run: node systemia/daytrade-lens/edge-opening-replay-2026-10-07.mjs
      - name: Upload replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-opening-replay-2026-10-07-${{ github.run_id }}
          path: artifacts/daytrade-edge/opening-replay-2026-10-07.json
          if-no-files-found: error
          retention-days: 30
