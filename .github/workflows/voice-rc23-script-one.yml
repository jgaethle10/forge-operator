name: Voice Foundry RC23 Script One Refinement (private)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Voice Foundry candidate
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate script structure before model install
        run: |
          python systemia/media-studio/voice-rc23-script-one-refine.py --verify-only
          node --test tests/media-voice-rc23-script-one-refine.test.mjs
      - name: Install CPU Kokoro neural inference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Render nine true neural script-comparison takes
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python systemia/media-studio/voice-rc23-script-one-refine.py private-rc23-script-one
          test -s private-rc23-script-one/evidence.json
          test -s private-rc23-script-one/LISTEN.html
          test "$(find private-rc23-script-one -maxdepth 1 -name '*.wav' | wc -l)" -eq 9
          test "$(find private-rc23-script-one -maxdepth 1 -name '*.mp3' | wc -l)" -eq 9
      - name: Upload real neural takes
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-rc23-script-one-refinement
          path: private-rc23-script-one/
          retention-days: 7
          if-no-files-found: error
