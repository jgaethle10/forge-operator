name: Systemia Revenue Gmail Reconciliation
on:
  pull_request:
    paths:
      - 'systemia/revenue-desk/**'
      - '.github/workflows/systemia-revenue-gmail-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/revenue-desk/**'
      - '.github/workflows/systemia-revenue-gmail-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check systemia/revenue-desk/gmail-reconciliation.mjs
          node --check systemia/revenue-desk/gmail-reconciliation.test.mjs
          node --check systemia/revenue-desk/atomic-send-reservations.mjs
          node --check systemia/revenue-desk/atomic-send-reservations.test.mjs
          node --check systemia/revenue-desk/owned-gmail-import.mjs
          node --check systemia/revenue-desk/owned-gmail-import.test.mjs
      - name: Receipt and quota safety proof
        run: node --test systemia/revenue-desk/gmail-reconciliation.test.mjs systemia/revenue-desk/atomic-send-reservations.test.mjs systemia/revenue-desk/owned-gmail-import.test.mjs

      - name: FindMyPart owned desk and paired heartbeat shadow proof
        run: |
          python3 systemia/revenue-desk/findmypart-desk-shadow-review.py --self-test
          python3 systemia/revenue-desk/findmypart-queue-review-handoff.py --self-test
          node --test systemia/revenue-desk/node002-desk-shadow-worker.test.mjs
          node --test systemia/revenue-desk/node002-desk-compute.test.mjs
          node --test systemia/network/outbound-node-restricted-convergence.test.mjs

      - name: Owner Gmail readonly OAuth and custody proof
        run: node --test systemia/revenue-desk/owned-gmail-binding.test.mjs

      - name: Existing company heartbeat Gmail observation proof
        run: |
          node --test systemia/revenue-desk/kaidance-gmail-observation.test.mjs
          node --test --test-name-pattern='company heartbeat exposes only a redacted Gmail' tests/kaidance-company-heartbeat.test.mjs

      - name: Owned Gmail history cursor discovery proof
        run: node --test systemia/revenue-desk/owned-gmail-history-delta.test.mjs

      - name: Atomic owned Gmail rolling-window sync proof
        run: node --test systemia/revenue-desk/owned-gmail-atomic-window.test.mjs

      - name: Bounded existing-resident Gmail refresh adapter proof
        run: node --test systemia/revenue-desk/kaidance-gmail-bounded-refresh.test.mjs

      - name: Existing resident Gmail tick admission proof
        run: node --test systemia/revenue-desk/kaidance-gmail-resident-tick.test.mjs

      - name: FindMyPart targeted Gmail historical contact proof
        run: node --test systemia/revenue-desk/findmypart-gmail-targeted-history.test.mjs
