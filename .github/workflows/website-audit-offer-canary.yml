name: Website audit offer canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-audit-offer-canary.yml'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/mcp/website-audit-inquiry.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual live Website Audit layout and payment boundary
        shell: bash
        run: |
          set -euo pipefail
          url="https://fabric.systemiacommandcenters.com/offers/website-audit"
          page="$(mktemp)"
          readiness="$(mktemp)"
          trap 'rm -f "$page" "$readiness"' EXIT
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$url" -o "$page"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "https://fabric.systemiacommandcenters.com/api/website-audit/readiness" -o "$readiness"
          python3 - "$page" "$readiness" <<'PY'
          import sys, json
          from pathlib import Path
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          readiness=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          checks={
            'headline': 'Your website is getting attention' in html,
            'price': '$49' in html,
            'offer': 'Quick Win Audit' in html,
            'payments_authority': 'Evercraft Payments' in html,
            'new_native_preview': 'class="audit-preview"' in html,
            'honest_preview_disclaimer': 'Illustrative process preview.' in html,
            'old_feed_poster_absent': 'poster-feed.svg' not in html,
            'old_wide_poster_absent': 'poster-hero-wide.svg' not in html,
          }
          price=html.find('class="offer-price"')
          preview=html.find('class="audit-preview"')
          checks['price_before_preview']=price>=0 and preview>price
          form=html.find('name="customer_ref"')
          inquiry=html.find('class="audit-intake-form"')
          if form>=0:
            mode='native_checkout'
            checks['buyer_action_before_preview']=form<preview
            checks['correct_checkout_route']='/api/offers/website-audit/checkout' in html
          else:
            mode='held_buyer_inquiry'
            checks['buyer_action_before_preview']=inquiry>=0 and inquiry<preview
            checks['correct_checkout_route']='/api/website-audit/inquiry' in html
            checks['no_charge_claim']=('No charge, payment order, or automatic audit starts here.' in html)
            checks['private_intake_ready']=readiness.get('intake_available') is True
            checks['payment_still_held']=readiness.get('payment_ready') is False
          for name,passed in checks.items():
            print(f'{name}: {"PASS" if passed else "FAIL"}')
          print('buyer_action_mode:',mode)
          if not all(checks.values()):
            raise SystemExit('LIVE_WEBSITE_AUDIT_CUSTOMER_PATH_NOT_VERIFIED')
          PY
          {
            echo "## Website Audit live layout verified"
            echo
            echo "URL: $url"
            echo "Verified: old poster removed, compact honest preview, controlled buyer action, secure audit inquiry readiness when native checkout held, and unchanged Evercraft Payments boundary."
          } >> "$GITHUB_STEP_SUMMARY"
