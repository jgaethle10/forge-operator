name: Website Audit Buyer Path Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13,23 * * *"
  pull_request:
    paths:
      - "systemia/distribution/website-audit-buyer-probe.mjs"
      - "systemia/distribution/website-audit-buyer-probe.test.mjs"
      - "systemia/distribution/website-audit-payment-evidence.mjs"
      - "systemia/distribution/website-audit-payment-evidence.test.mjs"
      - ".github/workflows/website-audit-offer-canary.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-audit-offer-canary.yml"
      - "systemia/distribution/website-audit-buyer-probe.mjs"
      - "systemia/distribution/website-audit-buyer-probe.test.mjs"
      - "systemia/distribution/website-audit-payment-evidence.mjs"
      - "systemia/distribution/website-audit-payment-evidence.test.mjs"
      - "systemia/mcp/fabric-public-site.mjs"
      - "systemia/mcp/fabric-local-runtime.mjs"

permissions:
  contents: read

concurrency:
  group: website-audit-buyer-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buyer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate buyer-path audit evidence contract
        run: node --test systemia/distribution/website-audit-buyer-probe.test.mjs systemia/distribution/website-audit-payment-evidence.test.mjs
      - name: Independently inspect exact $49 buyer page with GET only
        run: |
          mkdir -p artifacts/commercial
          node systemia/distribution/website-audit-buyer-probe.mjs artifacts/commercial/website-audit-external-buyer-probe.json
      - name: Retain truthful public-page receipt even when page is held
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-buyer-path-evidence
          path: artifacts/commercial/website-audit-external-buyer-probe.json
          if-no-files-found: warn
          retention-days: 14
