name: Evercraft observed SuperCon scientific audit
on:
  pull_request:
    paths:
      - 'science/supercon_observational_audit/**'
      - '.github/workflows/supercon-observational-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-supercon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2.0,<3'
      - name: Execute real-data audit and independent check
        run: python science/supercon_observational_audit/run.py
      - name: Audit row-split composition leakage
        run: python science/supercon_observational_audit/split_integrity.py
      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supercon-observed-receipts
          path: |
            supercon_audit_receipt.json
            supercon_split_receipt.json
          if-no-files-found: warn
