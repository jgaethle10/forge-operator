name: Evercraft Lineage

on:
  pull_request:
    paths:
      - 'systemia/lineage/**'
      - '.github/workflows/evercraft-lineage.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/lineage/**'
      - '.github/workflows/evercraft-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove Lineage kernel and semantic history
        run: node --test systemia/lineage/*.test.mjs
