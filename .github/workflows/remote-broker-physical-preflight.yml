name: Physical Remote Broker Supervision Safety

on:
  pull_request:
    paths:
      - 'scripts/remote-broker-physical-preflight.mjs'
      - 'tests/remote-broker-physical-preflight.test.mjs'
      - 'systemia/yard/remote-broker-resident.mjs'
      - 'tests/remote-broker-resident.test.mjs'
      - 'scripts/install-remote-broker-resident.sh'
      - 'scripts/stage-remote-broker-caddy.mjs'
      - 'scripts/activate-remote-broker-caddy.sh'
      - 'scripts/node002-submit-enrollment-request.mjs'
      - 'scripts/node002-live-bridge-canary.mjs'
      - 'scripts/node001-verify-node002-relay.mjs'
      - 'scripts/node001-node002-productive-canary.mjs'
      - 'tests/node001-node002-productive-canary.test.mjs'
      - 'tests/node002-live-bridge-canary.test.mjs'
      - 'tests/node001-verify-node002-relay.test.mjs'
      - 'tests/node002-submit-enrollment-request.test.mjs'
      - 'tests/stage-remote-broker-caddy.test.mjs'
      - 'docs/operations/node001-node002-remote-broker-physical-staging.md'
      - '.github/workflows/remote-broker-physical-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-broker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and installer checks
        run: |
          node --check scripts/remote-broker-physical-preflight.mjs
          node --check systemia/yard/remote-broker-resident.mjs
          node --check scripts/stage-remote-broker-caddy.mjs
          node --check scripts/node002-submit-enrollment-request.mjs
          node --check scripts/node002-live-bridge-canary.mjs
          node --check scripts/node001-verify-node002-relay.mjs
          node --check scripts/node001-node002-productive-canary.mjs
          bash -n scripts/install-remote-broker-resident.sh
          bash -n scripts/activate-remote-broker-caddy.sh
      - name: Exercise real ephemeral Yard broker and strict route/identity boundaries
        run: node --test tests/remote-broker-physical-preflight.test.mjs tests/remote-broker-resident.test.mjs tests/stage-remote-broker-caddy.test.mjs tests/node002-submit-enrollment-request.test.mjs tests/node002-live-bridge-canary.test.mjs tests/node001-verify-node002-relay.test.mjs tests/node001-node002-productive-canary.test.mjs
      - name: Non-production runner cannot claim physical broker readiness
        run: |
          node scripts/remote-broker-physical-preflight.mjs > /tmp/broker-preflight.json || true
          node -e "const r=require('/tmp/broker-preflight.json'); if(r.local_broker_staging_eligible || r.verified_public_broker_https || r.cross_machine_dispatch_verified || r.mutations_performed)process.exit(1)"
