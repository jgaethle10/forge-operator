name: Yard Operator proof

on:
  pull_request:
    paths:
      - 'systemia/yard/**'
      - 'systemia/saban/nodeseed-intent-executor.mjs'
      - 'systemia/saban/nodeseed-execution-intent.mjs'
      - 'systemia/saban/nodeseed-inventory-ingest.mjs'
      - 'scripts/install-yard-saban-intent-drainer.sh'
      - 'tests/saban-yard-intent-drainer.test.mjs'
      - 'tests/saban-nodeseed-automatic-failover.test.mjs'
      - 'tests/saban-nodeseed-receipt-gate.test.mjs'
      - 'tests/saban-yard-unified-dispatch.test.mjs'
      - 'tests/saban-yard-split-identity-mailbox.test.mjs'
      - 'tests/yard-split-identity-consumer.test.mjs'
      - 'tests/saban-yard-split-resident-cycle.test.mjs'
      - 'scripts/preflight-saban-yard-split-runtime.mjs'
      - 'tests/saban-yard-split-physical-preflight.test.mjs'
      - 'scripts/inspect-penguin-broker-restart-safety.mjs'
      - 'tests/penguin-broker-restart-safety.test.mjs'
      - 'systemia/saban/split-identity-capacity.mjs'
      - 'systemia/saban/split-identity-cycle-runner.mjs'
      - 'systemia/yard/split-identity-request-consumer.mjs'
      - 'systemia/saban/split-identity-handoff.mjs'
      - 'scripts/prepare-saban-yard-split-mailbox.sh'
      - 'systemia/yard/saban-intent-drain-runner.mjs'
      - 'systemia/saban/nodeseed-worker-completion-verifier.mjs'
      - 'systemia/saban/ambient-job-dispatcher.mjs'
      - 'systemia/compute/**'
      - 'systemia/network/**'
      - 'systemia/mcp/**'
      - 'public/chum/capabilities.json'
      - 'tests/evercraft-fabric-runtime.test.mjs'
      - 'tests/public-edge-ingress-watch.test.mjs'
      - 'tests/network-observer-ingress-diagnosis.test.mjs'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-self-update.sh'
      - 'systemia/core/bootstrap/**'
      - '.github/workflows/yard-operator.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/yard/**'
      - 'systemia/saban/nodeseed-intent-executor.mjs'
      - 'systemia/saban/nodeseed-execution-intent.mjs'
      - 'systemia/saban/nodeseed-inventory-ingest.mjs'
      - 'scripts/install-yard-saban-intent-drainer.sh'
      - 'tests/saban-yard-intent-drainer.test.mjs'
      - 'tests/saban-nodeseed-automatic-failover.test.mjs'
      - 'tests/saban-nodeseed-receipt-gate.test.mjs'
      - 'tests/saban-yard-unified-dispatch.test.mjs'
      - 'tests/saban-yard-split-identity-mailbox.test.mjs'
      - 'tests/yard-split-identity-consumer.test.mjs'
      - 'tests/saban-yard-split-resident-cycle.test.mjs'
      - 'scripts/preflight-saban-yard-split-runtime.mjs'
      - 'tests/saban-yard-split-physical-preflight.test.mjs'
      - 'scripts/inspect-penguin-broker-restart-safety.mjs'
      - 'tests/penguin-broker-restart-safety.test.mjs'
      - 'systemia/saban/split-identity-capacity.mjs'
      - 'systemia/saban/split-identity-cycle-runner.mjs'
      - 'systemia/yard/split-identity-request-consumer.mjs'
      - 'systemia/saban/split-identity-handoff.mjs'
      - 'scripts/prepare-saban-yard-split-mailbox.sh'
      - 'systemia/yard/saban-intent-drain-runner.mjs'
      - 'systemia/saban/nodeseed-worker-completion-verifier.mjs'
      - 'systemia/saban/ambient-job-dispatcher.mjs'
      - 'systemia/compute/**'
      - 'systemia/network/**'
      - 'systemia/mcp/**'
      - 'public/chum/capabilities.json'
      - 'tests/evercraft-fabric-runtime.test.mjs'
      - 'tests/public-edge-ingress-watch.test.mjs'
      - 'tests/network-observer-ingress-diagnosis.test.mjs'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-self-update.sh'
      - 'systemia/core/bootstrap/**'
      - '.github/workflows/yard-operator.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Yard Operator over Evercraft Compute
        run: node systemia/yard/proof.mjs
      - name: Prove Yard route persistence across stale lease renewal
        run: node systemia/yard/route-persistence.proof.mjs
      - name: Prove Evercraft Fabric directory routing
        run: npm run test:fabric-directory
      - name: Prove owned Fabric edge updater safety
        run: npm run test:fabric-owned-edge
      - name: Prove specialist MCP resident runtime
        run: node systemia/yard/specialist-handoff.proof.mjs
      - name: Prove Systemia Remote Ops specialist runtime
        run: node systemia/yard/remote-ops-specialist.proof.mjs
      - name: Prove provider-neutral public route broker
        run: node systemia/yard/public-route-broker.proof.mjs
      - name: Prove specialist MCP through Evercraft public edge
        run: node systemia/yard/public-edge-specialist.proof.mjs
      - name: Prove wildcard TLS routing on Evercraft public edge
        run: node systemia/yard/public-edge-tls.proof.mjs
      - name: Prove direct-ingress diagnosis and relay preference
        run: npm run test:public-edge-ingress
      - name: Prove node-side ChromeOS/router boundary diagnosis
        run: npm run test:network-observer-ingress
      - name: Prove persistent public edge controller lifecycle
        run: node systemia/yard/public-edge-controller.proof.mjs
      - name: Prove automatic public edge activation
        run: node systemia/yard/public-edge-activator.proof.mjs
      - name: Prove persistent public edge activation watch
        run: node systemia/yard/public-edge-activation-watch.proof.mjs
      - name: Prove private Yard authority edge bootstrap
        run: node systemia/yard/public-edge-private-yard-authority.proof.mjs
      - name: Prove authenticated field enrollment packet
        run: node systemia/yard/field-enrollment-packet.proof.mjs
      - name: Prove Saban remote worker receipt integrity and verification hold
        run: node --test tests/saban-nodeseed-receipt-gate.test.mjs
      - name: Prove bounded unified Saban to Yard dispatch and loopback fail-close
        run: node --test tests/saban-yard-unified-dispatch.test.mjs
      - name: Prove split-account mailbox is immutable, receipt-bound and secret-free
        run: node --test tests/saban-yard-split-identity-mailbox.test.mjs
      - name: Prove Yard split-account broker execution and crash recovery holds
        run: node --test tests/yard-split-identity-consumer.test.mjs
      - name: Prove cross-account inventory freshness and full Saban Yard dispatch round-trip
        run: node --test tests/saban-yard-split-resident-cycle.test.mjs
      - name: Prove physical split-account preflight is non-mutating and fail-closed
        run: node --test tests/saban-yard-split-physical-preflight.test.mjs
      - name: Prove missing resident broker entrypoint never authorizes restart
        run: node --test tests/penguin-broker-restart-safety.test.mjs
      - name: Check role-specific resident cycle syntax
        run: node --check systemia/saban/split-identity-cycle-runner.mjs && node --check systemia/saban/split-identity-capacity.mjs
      - name: Check split-account mailbox provisioning syntax
        run: bash -n scripts/prepare-saban-yard-split-mailbox.sh && node --check systemia/saban/split-identity-handoff.mjs
      - name: Check unified Saban drainer shell safety and runner syntax
        run: bash -n scripts/install-yard-saban-intent-drainer.sh && node --check systemia/yard/saban-intent-drain-runner.mjs
      - name: Prove Yard Saban resident execution bridge
        run: node --test tests/saban-yard-intent-drainer.test.mjs tests/saban-nodeseed-automatic-failover.test.mjs
