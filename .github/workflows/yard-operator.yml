name: Yard Operator proof

on:
  pull_request:
    paths:
      - 'systemia/yard/**'
      - 'systemia/compute/**'
      - 'systemia/core/bootstrap/**'
      - '.github/workflows/yard-operator.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/yard/**'
      - 'systemia/compute/**'
      - 'systemia/core/bootstrap/**'
      - '.github/workflows/yard-operator.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Yard Operator over Evercraft Compute
        run: node systemia/yard/proof.mjs
      - name: Prove specialist MCP resident runtime
        run: node systemia/yard/specialist-handoff.proof.mjs
      - name: Prove provider-neutral public route broker
        run: node systemia/yard/public-route-broker.proof.mjs
      - name: Prove specialist MCP through Evercraft public edge
        run: node systemia/yard/public-edge-specialist.proof.mjs
