name: RIVET focused report canary
on:
  pull_request:
    paths:
      - "systemia/rivet/**"
      - "systemia/compute/**"
      - "systemia/yard/**"
      - "systemia/organism/rivet-report-edge-runner.mjs"
      - "systemia/organism/rivet-report-edge.workflow.json"
      - "systemia/core/resident-services.json"
      - "systemia/core/rivet-report-resident-wiring.proof.mjs"
      - "systemia/migrations/base44-exit/slices/rivet-reporting-runtime.json"
      - "package.json"
      - "tests/rivet-yard-gateway.test.mjs"
      - ".github/workflows/rivet-report-canary.yml"
  push:
    branches: [main]
    paths:
      - "systemia/rivet/**"
      - "systemia/compute/**"
      - "systemia/yard/**"
      - "systemia/organism/rivet-report-edge-runner.mjs"
      - "systemia/organism/rivet-report-edge.workflow.json"
      - "systemia/core/resident-services.json"
      - "systemia/core/rivet-report-resident-wiring.proof.mjs"
      - "systemia/migrations/base44-exit/slices/rivet-reporting-runtime.json"
      - "package.json"
      - "tests/rivet-yard-gateway.test.mjs"
      - ".github/workflows/rivet-report-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node systemia/rivet/http-gateway-readiness.proof.mjs
      - run: npm run proof:rivet-yard
      - run: node systemia/rivet/report-domain-projection.proof.mjs
      - run: node systemia/yard/rivet-resident-runtime.proof.mjs
      - run: node systemia/yard/rivet-report-edge-controller.proof.mjs
      - run: node systemia/core/rivet-report-resident-wiring.proof.mjs
      - run: npm run proof:beast-football
