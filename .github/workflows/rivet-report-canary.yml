name: RIVET focused report canary
on:
  pull_request:
    paths:
      - "systemia/rivet/**"
      - "systemia/compute/**"
      - "systemia/yard/**"
      - "package.json"
      - ".github/workflows/rivet-report-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run proof:rivet-yard
      - run: node systemia/yard/rivet-resident-runtime.proof.mjs
      - run: npm run proof:beast-football
