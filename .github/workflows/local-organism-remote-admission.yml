name: Local organism remote admission

on:
  pull_request:
    paths:
      - 'systemia/compute/local-organism.mjs'
      - 'systemia/compute/remote-admission-keeper.mjs'
      - 'systemia/compute/install-local-organism-user.sh'
      - 'systemia/compute/LOCAL_ORGANISM.md'
      - 'systemia/compute/local-organism-remote-admission.proof.mjs'
      - '.github/workflows/local-organism-remote-admission.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/compute/local-organism.mjs'
      - 'systemia/compute/remote-admission-keeper.mjs'
      - 'systemia/compute/install-local-organism-user.sh'
      - 'systemia/compute/LOCAL_ORGANISM.md'
      - 'systemia/compute/local-organism-remote-admission.proof.mjs'
      - '.github/workflows/local-organism-remote-admission.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check installer
        run: bash -n systemia/compute/install-local-organism-user.sh
      - name: Prove resilient outbound admission
        run: node systemia/compute/local-organism-remote-admission.proof.mjs
