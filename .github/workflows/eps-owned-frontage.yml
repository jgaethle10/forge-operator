name: EPS Owned Frontage

on:
  pull_request:
    paths:
      - 'public/eps/**'
      - 'public/apps/eps-estimator/**'
      - 'systemia/eps/**'
      - '.github/workflows/eps-owned-frontage.yml'
  push:
    branches: [main]
    paths:
      - 'public/eps/**'
      - 'public/apps/eps-estimator/**'
      - 'systemia/eps/**'
      - '.github/workflows/eps-owned-frontage.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove owned EPS quote intake boundary
        run: node --test systemia/eps/public-quote-intake.test.mjs
      - name: Reject legacy provider dependencies in customer frontage
        shell: bash
        run: |
          set -euo pipefail
          test -f public/eps/index.html
          test -f public/apps/eps-estimator/index.html
          grep -q 'Evercraft Property Services' public/eps/index.html
          grep -q 'EPS Precise Estimator' public/apps/eps-estimator/index.html
          if grep -RniE 'base44\.app|base44-prod|@base44|base44Client' public/eps public/apps/eps-estimator; then
            echo 'Legacy provider dependency detected in EPS customer frontage.'
            exit 1
          fi
      - name: Verify customer-safe estimator routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'href="/apps/eps-estimator/"' public/eps/index.html
          if grep -Eqi '509[[:space:]-]*910[[:space:]-]*3256|15099103256|sms:|tel:' public/eps/index.html; then
            echo 'Unverified EPS phone or SMS handoff detected.'
            exit 1
          fi
          grep -q 'mailto:jesse@evercraftpropertyservices.com' public/eps/index.html
