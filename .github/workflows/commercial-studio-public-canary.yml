name: Commercial Studio public inquiry route canary
on:
  pull_request:
    paths:
      - 'scripts/studio-public-intake-canary.mjs'
      - 'scripts/studio-owner-intake-status.mjs'
      - 'tests/studio-owner-intake-status.test.mjs'
      - 'scripts/studio-discovery-live-canary.mjs'
      - 'tests/studio-discovery-live-canary.test.mjs'
      - 'systemia/mcp/fabric-catalog-supplements.json'
      - 'public/commercial-studio/index.html'
      - 'systemia/mcp/studio-offer-contract.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'public/.well-known/evercraft-chum-attribution.json'
      - '.github/workflows/commercial-studio-public-canary.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/studio-public-intake-canary.mjs'
      - 'scripts/studio-owner-intake-status.mjs'
      - 'tests/studio-owner-intake-status.test.mjs'
      - 'scripts/studio-discovery-live-canary.mjs'
      - 'tests/studio-discovery-live-canary.test.mjs'
      - 'systemia/mcp/fabric-catalog-supplements.json'
      - 'public/commercial-studio/index.html'
      - 'systemia/mcp/studio-offer-contract.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - '.github/workflows/commercial-studio-public-canary.yml'
      - 'systemia/mcp/commercial-studio-inquiry.mjs'
  schedule:
    - cron: '38 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-pii-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/studio-public-intake-canary.mjs
      - run: node --check scripts/studio-discovery-live-canary.mjs
      - name: Test live discovery gate against synthetic protocol responses
        run: node --test tests/studio-discovery-live-canary.test.mjs
      - name: Test private operator status never exposes a buyer or mutates records
        run: node --test tests/studio-owner-intake-status.test.mjs
      - name: Inspect public form and live preflight without sending a lead
        id: external
        continue-on-error: true
        env:
          STUDIO_PUBLIC_RECEIPT: ${{ runner.temp }}/studio-public-intake.json
        run: node scripts/studio-public-intake-canary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-public-intake-evidence
          path: ${{ runner.temp }}/studio-public-intake.json
          if-no-files-found: warn
      - name: Check deployed MCP matches a real $50 commercial buyer (read-only)
        id: live_discovery
        continue-on-error: true
        env:
          STUDIO_DISCOVERY_RECEIPT: ${{ runner.temp }}/studio-live-discovery.json
        run: node scripts/studio-discovery-live-canary.mjs --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-live-discovery-evidence
          path: ${{ runner.temp }}/studio-live-discovery.json
          if-no-files-found: warn
      - name: Require deployed $50 commercial discovery after merge
        if: github.event_name != 'pull_request' && steps.live_discovery.outcome == 'failure'
        run: |
          echo 'Live Evercraft MCP still has not proved Fallen Studios is the first $50 commercial buyer match.'
          echo 'Review the redacted evidence artifact; reconcile the owned Fabric runtime before declaring a launch.'
          exit 1
      - name: Require public form and route after merge
        if: github.event_name != 'pull_request' && steps.external.outcome == 'failure'
        run: |
          echo 'Public site/route not yet verified. Do not claim live inquiry delivery.'
          exit 1
