name: DayTrade SIP Shadow 2026-10-07

on:
  push:
    branches:
      - "systemia/daytrade-sip-shadow-2026-10-07"

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run IEX vs SIP shadow
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_SIP_SHADOW_OUTPUT: artifacts/daytrade-edge/sip-shadow-practice-2026-10-07.json
        run: node systemia/daytrade-lens/edge-sip-shadow-practice.mjs
      - name: Upload SIP shadow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-sip-shadow-${{ github.run_id }}
          path: artifacts/daytrade-edge/sip-shadow-practice-2026-10-07.json
          if-no-files-found: error
          retention-days: 30
