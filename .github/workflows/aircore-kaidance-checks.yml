name: Breath of Fresh Air Kaidance integration checks
on:
  pull_request:
    paths:
      - 'systemia/breath-of-fresh-air/**'
      - 'systemia/organism/kaidance-aircore-development.mjs'
      - 'systemia/organism/kaidance-company-heartbeat-runner.mjs'
      - 'systemia/organism/kaidance-next-action.mjs'
      - 'registry/kaidance-aircore-development.v1.json'
      - 'registry/kaidance-company-lanes.v1.json'
      - 'tests/kaidance-aircore-development.test.mjs'
      - '.github/workflows/aircore-kaidance-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-aircore-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AirCore source sizing, held gates and heartbeat integration
        run: node --test systemia/breath-of-fresh-air/aircore-sizing.test.mjs tests/kaidance-aircore-development.test.mjs
      - name: Existing company heartbeat guardrail regression
        run: node --test tests/kaidance-company-heartbeat.test.mjs tests/kaidance-next-action.test.mjs
