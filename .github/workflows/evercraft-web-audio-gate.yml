name: Evercraft Web soundtrack release gate
on:
  pull_request:
    paths:
      - 'systemia/clip/evercraft-web-audio-gate.mjs'
      - 'systemia/clip/evercraft-web-audio-review.json'
      - 'tests/evercraft-web-audio-gate.test.mjs'
      - '.github/workflows/evercraft-web-audio-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-release-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audio release guard
        run: node --test tests/evercraft-web-audio-gate.test.mjs
      - name: Confirm music is held pending a real audition
        run: |
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('systemia/clip/evercraft-web-audio-review.json','utf8'));if(r.status!=='HOLD'||r.production_release_authority!==false)process.exit(1);"
