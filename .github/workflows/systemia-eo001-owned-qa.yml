name: Systemia EO-001 owned QA mission proof
on:
  push:
    branches:
      - engineering/systemia-eo001-owned-qa-mission-20261109
    paths:
      - 'systemia/organism/eo001-owned-qa-mission.mjs'
      - 'tests/eo001-systemia-owned-qa-mission.test.mjs'
      - 'systemia/organism/eo001-resident-timer.mjs'
      - 'tests/eo001-resident-timer.test.mjs'
      - 'scripts/nextgen/eo001-resident-field-admission.mjs'
      - 'tests/eo001-resident-field-admission.test.mjs'
      - '.github/workflows/systemia-eo001-owned-qa.yml'
  pull_request:
    branches:
      - research/eo001-sovereign-gateway-adapter-20261109
    paths:
      - 'systemia/organism/eo001-owned-qa-mission.mjs'
      - 'tests/eo001-systemia-owned-qa-mission.test.mjs'
      - 'systemia/organism/eo001-resident-timer.mjs'
      - 'tests/eo001-resident-timer.test.mjs'
      - 'scripts/nextgen/eo001-resident-field-admission.mjs'
      - 'tests/eo001-resident-field-admission.test.mjs'
      - '.github/workflows/systemia-eo001-owned-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-mission-offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and import checks
        run: node --check systemia/organism/eo001-owned-qa-mission.mjs
      - name: Physical-free integration tests with actual Forge QA code and private synthetic fixtures
        run: node --test tests/eo001-systemia-owned-qa-mission.test.mjs
      - name: Prove resident QA timer preparation has no service activation or outside authority
        run: node --test tests/eo001-resident-timer.test.mjs
      - name: Prove source-pin checks, owner consent, and controlled field activation rollback
        run: node --test tests/eo001-resident-field-admission.test.mjs
      - name: Independent Forge QA negative controls
        run: python3 integrations/ai-evaluation-lab/test_eo001_forge_evidence_qa.py
