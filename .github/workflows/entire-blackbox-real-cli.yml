name: Entire Black Box actual CLI dispatcher smoke

on:
  pull_request:
    paths:
      - "integrations/entire-blackbox/**"
      - ".github/workflows/entire-blackbox-real-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-entire-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/entire-blackbox/go.mod

      # Pin the Entire binary release + artifact SHA rather than executing a curl | sh installer.
      - name: Fetch and verify official Entire CLI v0.11.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/entire-release" "$RUNNER_TEMP/entire-bin"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/entireio/cli/releases/download/v0.11.5/entire_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/entire_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            'c20476c4ba9689b1800fe8d590601792e2b6f3c89d03a95280d88484029d7eba' \
            "$RUNNER_TEMP/entire_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/entire_linux_amd64.tar.gz" -C "$RUNNER_TEMP/entire-release"
          cli="$(find "$RUNNER_TEMP/entire-release" -type f -name entire -print -quit)"
          test -n "$cli"
          install -m 0755 "$cli" "$RUNNER_TEMP/entire-bin/entire"
          echo "$RUNNER_TEMP/entire-bin" >> "$GITHUB_PATH"

      - name: Entire local install, dispatch, failure, uninstall
        working-directory: integrations/entire-blackbox
        shell: bash
        env:
          ENTIRE_PLUGIN_DIR: ${{ runner.temp }}/evercraft-blackbox-isolated-plugins
        run: |
          set -euo pipefail
          entire --help > /dev/null
          go build -o ./entire-blackbox .
          # This is Entire's actual managed local plugin install, NOT merely PATH dispatch.
          entire plugin install ./entire-blackbox
          entire plugin list
          entire blackbox inspect examples/unknown.json > "$RUNNER_TEMP/entire-blackbox-result.json"
          python3 - "$RUNNER_TEMP/entire-blackbox-result.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              r = json.load(f)
          assert r["assessment"] == "UNKNOWN", r
          assert r["externally_verified"] is False, r
          assert r["operation_id"] == "synthetic-ticket-001", r
          assert r["evidence_count"] == 0, r
          print("REAL_ENTIRE_DISPATCH_PASS: UNKNOWN outcome, not provider verified")
          PY
          # A bad source path must not be reported as success by the CLI.
          if entire blackbox inspect ./examples/nonexistent.json >/dev/null 2>"$RUNNER_TEMP/expected-stderr"; then
            echo "Unexpected success for a missing incident record" >&2
            exit 1
          fi
          grep -q 'input error' "$RUNNER_TEMP/expected-stderr"
          entire plugin remove blackbox
          if entire blackbox --help >/dev/null 2>&1; then
            echo "Plugin still discoverable after uninstall" >&2
            exit 1
          fi
          echo "REAL_ENTIRE_UNINSTALL_PASS"

      - name: Outcome and scope
        run: |
          echo "Entire CLI: pinned official v0.11.5; plugin source: current PR." >> "$GITHUB_STEP_SUMMARY"
          echo "Verified: local binary installed through Entire, invoked, rejected a missing file, and uninstalled." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT verified: remote release install, catalog listing, actual provider readback, Entire endorsement, production deployment, or revenue." >> "$GITHUB_STEP_SUMMARY"
