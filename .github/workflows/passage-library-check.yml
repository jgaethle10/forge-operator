name: Passage offline library checks
on:
  pull_request:
    paths:
      - 'public/passage/**'
      - 'tests/passage-library.test.mjs'
      - 'tests/passage-browser.test.mjs'
      - 'tests/passage-package.test.mjs'
      - 'scripts/passage-signed-package.mjs'
      - 'scripts/export-passage-demo.mjs'
      - 'scripts/build-passage-device-kit.mjs'
      - 'tests/passage-device-kit.test.mjs'
      - 'tests/passage-device-qa.test.mjs'
      - 'tests/passage-webkit.test.mjs'
      - 'docs/launch/passage/**'
      - 'systemia/passage/**'
      - 'systemia/saban/multiplication-registry.json'
      - 'tests/passage-saban-qa.test.mjs'
      - '.github/workflows/passage-library-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check library logic and browser scripts
        run: |
          node --test tests/passage-library.test.mjs
          node --test tests/passage-package.test.mjs
          node --test tests/passage-device-kit.test.mjs
          node --test tests/passage-device-qa.test.mjs
          node --check public/passage/device-qa.mjs
          node --check scripts/build-passage-device-kit.mjs
          node --check scripts/passage-signed-package.mjs
          node --check public/passage/package-verifier.mjs
          node --check public/passage/package-ui.mjs
          node --check public/passage/article-text.mjs
          node --check public/passage/app.mjs
          node --check public/passage/catalog.mjs
          node --check public/passage/sw.js
      - name: Build offline demonstration download
        env:
          PASSAGE_EXPORT_DIR: /tmp/passage-export
        run: node scripts/export-passage-demo.mjs
      - name: Preserve portable offline demonstration
        uses: actions/upload-artifact@v4
        with:
          name: passage-offline-demonstration
          path: /tmp/passage-export/
          if-no-files-found: error
          retention-days: 14
      - name: Build self-contained device lab kit
        env:
          PASSAGE_KIT_DIR: /tmp/passage-device-kit
        run: node scripts/build-passage-device-kit.mjs
      - name: Preserve offline device lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passage-offline-device-lab
          path: /tmp/passage-device-kit/
          if-no-files-found: error
          retention-days: 7
      - name: Install ephemeral browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Exercise Chrome online and offline
        env:
          PASSAGE_ARTIFACT_DIR: /tmp/passage-qa
        run: node --test tests/passage-browser.test.mjs
      - name: Preserve simulated mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passage-browser-qa
          path: /tmp/passage-qa/
          if-no-files-found: ignore
          retention-days: 14
  webkit:
    name: WebKit compatibility and fail-closed gate
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install WebKit browser engine
        run: npx playwright install webkit
      - name: Test standalone verifier with offline WebKit engine
        run: node --test tests/passage-webkit.test.mjs

  saban_qa:
    name: Saban registered Passage QA mission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Saban Passage allowlist and execute catalog worker locally
        run: |
          node --check systemia/passage/saban-qa-adapter.mjs
          node --check systemia/passage/saban-qa-mission.mjs
          node --test tests/passage-saban-qa.test.mjs
      - name: Install browser acceptance harness
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Dispatch five registered Saban QA assignments on ephemeral NodeSeed
        env:
          PASSAGE_ARTIFACT_DIR: /tmp/passage-saban-qa/browser
        run: node systemia/passage/saban-qa-mission.mjs --out=/tmp/passage-saban-qa
      - name: Preserve independently hashed worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passage-saban-qa-mission
          path: /tmp/passage-saban-qa/
          if-no-files-found: ignore
          retention-days: 14
