name: ForensiScope ASR contract

on:
  pull_request:
    paths:
      - "systemia/forensiscope/asr-runner.mjs"
      - "systemia/forensiscope/asr-runner.test.mjs"
      - "systemia/forensiscope/transcription-engine.mjs"
      - "systemia/forensiscope/transcription-engine.test.mjs"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/forensiscope/batch-transcribe.mjs"
      - "systemia/forensiscope/batch-transcribe.test.mjs"
      - "systemia/forensiscope/doctor.mjs"
      - "systemia/forensiscope/runtime-packaging.test.mjs"
      - "server.ts"
      - "Dockerfile"
      - "systemia/forensiscope/ASR.md"
      - "package.json"
      - ".github/workflows/forensiscope-asr.yml"
  push:
    branches: [main]
    paths:
      - "systemia/forensiscope/asr-runner.mjs"
      - "systemia/forensiscope/asr-runner.test.mjs"
      - "systemia/forensiscope/transcription-engine.mjs"
      - "systemia/forensiscope/transcription-engine.test.mjs"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/forensiscope/batch-transcribe.mjs"
      - "systemia/forensiscope/batch-transcribe.test.mjs"
      - "systemia/forensiscope/doctor.mjs"
      - "systemia/forensiscope/runtime-packaging.test.mjs"
      - "server.ts"
      - "Dockerfile"
      - "systemia/forensiscope/ASR.md"
      - "package.json"
      - ".github/workflows/forensiscope-asr.yml"

permissions:
  contents: read

jobs:
  asr-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check systemia/forensiscope/asr-runner.mjs
          node --check systemia/forensiscope/transcription-engine.mjs
          node --check systemia/compute/runtime-node.mjs
          node --check systemia/forensiscope/batch-transcribe.mjs
          node --check systemia/forensiscope/doctor.mjs
      - name: ForensiScope runtime tests
        run: npm run test:forensiscope-runtime
