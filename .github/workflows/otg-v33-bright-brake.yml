name: OTG V33 Bright Natural BRAKE Focus (private)
on:
  workflow_dispatch:
  push:
    branches: [feature/onthego-bella-native-voice-20261026]
    paths:
      - systemia/media-studio/on-the-go-v33-bright-brake.py
      - .github/workflows/otg-v33-bright-brake.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare native Bella and ASR environment
        run: |
          timeout 75s sudo apt-get update -qq || echo 'apt refresh failed; use existing lists'
          DEBIAN_FRONTEND=noninteractive timeout 120s sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install 'kokoro==0.9.4' 'soundfile>=0.12,<1' 'faster-whisper==1.2.1'
      - name: Record native full-line auditions and word boundaries
        run: python systemia/media-studio/on-the-go-v33-bright-brake.py
      - uses: actions/upload-artifact@v4
        with:
          name: otg-v33-bright-natural-brake-takes
          path: v33-bella-final-touch/
          retention-days: 7
          if-no-files-found: error
