name: Systemia University + Evercraft Financial Boundary

on:
  pull_request:
    paths:
      - 'systemia/university/**'
      - 'systemia/payments/financial-boundary*'
      - 'systemia/payments/charter-readiness*'
      - 'systemia/payments/charter-evidence.json'
      - 'systemia/payments/financial-capabilit*'
      - 'systemia/payments/financial-authority*'
      - 'systemia/payments/financial-product*'
      - 'systemia/payments/financial-products.json'
      - 'systemia/payments/economic-workspace*'
      - 'public/benchmarks/systemia-university/**'
      - 'public/chum/products/systemia-university/**'
      - 'registry/systemia-university/**'
      - 'tests/systemia-university-benchmark-discovery.test.mjs'
      - 'docs/EVERCRAFT_FINANCIAL_INSTITUTION_PATH_2026-10-07.md'
      - '.github/workflows/systemia-university-financial-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/university/**'
      - 'systemia/payments/financial-boundary*'
      - 'systemia/payments/charter-readiness*'
      - 'systemia/payments/charter-evidence.json'
      - 'systemia/payments/financial-capabilit*'
      - 'systemia/payments/financial-authority*'
      - 'systemia/payments/financial-product*'
      - 'systemia/payments/financial-products.json'
      - 'systemia/payments/economic-workspace*'
      - 'public/benchmarks/systemia-university/**'
      - 'tests/systemia-university-benchmark-discovery.test.mjs'

permissions:
  contents: read

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Systemia University proving lane
        run: node --test systemia/university/proving-lane.test.mjs
      - name: Systemia University discovery contract
        run: node --test tests/systemia-university-benchmark-discovery.test.mjs
      - name: Systemia University benchmark engine
        run: node --test systemia/university/benchmark-engine.test.mjs
      - name: Systemia University benchmark proof receipt
        run: node systemia/university/benchmark-proof.mjs
      - name: Systemia University submissions and authority benchmark
        run: node --test systemia/university/submission-pipeline.test.mjs
      - name: Systemia University current-session model canary proof
        run: node systemia/university/model-canary.proof.mjs
      - name: Systemia University local submission CLI proof
        run: node systemia/university/benchmark-submit.proof.mjs
      - name: Systemia University owned HTTP evaluator
        run: node --test systemia/university/http.test.mjs
      - name: Systemia University owned HTTP ingress proof
        run: node systemia/university/http.proof.mjs
      - name: Systemia University server/OpenAPI HTTP contract
        run: node --test tests/systemia-university-http-contract.test.mjs
      - name: Evercraft Financial regulatory boundary
        run: node --test systemia/payments/financial-boundary.test.mjs
      - name: Evercraft Financial charter readiness
        run: node --test systemia/payments/charter-readiness.test.mjs
      - name: Evercraft Financial charter readiness proof receipt
        run: node systemia/payments/charter-readiness.proof.mjs
      - name: Evercraft Financial capability authority routing
        run: node --test systemia/payments/financial-capability-router.test.mjs
      - name: Evercraft Financial product authority routing
        run: node --test systemia/payments/financial-product-router.test.mjs
      - name: Evercraft Financial product routing proof receipt
        run: node systemia/payments/financial-product-routing.proof.mjs
      - name: Evercraft Financial economic workspace
        run: node --test systemia/payments/economic-workspace.test.mjs
      - name: Evercraft Financial economic workspace proof receipt
        run: node systemia/payments/economic-workspace.proof.mjs
