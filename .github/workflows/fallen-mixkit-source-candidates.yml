name: Fallen Mixkit Licensed Guitar Source Candidates
on:
  push:
    branches: [production/fallen-exotic-bella-audition-20261123]
    paths: ['.github/workflows/fallen-mixkit-source-candidates.yml']
permissions: {contents: read}
jobs:
  music:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify source-stated commercial audio license
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from pathlib import Path
          import hashlib,json
          songs=[('salty-and-sweet','Salty and Sweet','Michael Ramir C.','856'),
                 ('yo-chucky','Yo Chucky','Michael Ramir C.','861')]
          root=Path('mixkit-approved-source-candidates');root.mkdir()
          metadata=[]
          for slug,title,artist,n in songs:
              url=f'https://assets.mixkit.co/music/{n}/{n}.mp3'
              req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
              b=urlopen(req,timeout=60).read()
              if not b.startswith((b'ID3',b'\xff\xfb',b'\xff\xf3')):raise RuntimeError('mp3 signature not verified')
              dest=root/(slug+'.mp3');dest.write_bytes(b)
              if len(b)<100000:raise RuntimeError('source media suspiciously short')
              duration=None
              metadata.append(dict(title=title,artist=artist,url=url,licenseUrl='https://mixkit.co/license/modal/musicFree/',
                                   musicListUrl='https://mixkit.co/free-stock-music/rock-and-roll/',
                                   license='Mixkit Stock Music Free License (online advertising / social permitted)',
                                   sha256=hashlib.sha256(b).hexdigest(),filename=dest.name,
                                   durationSec=duration,bytes=len(b),humanListenApproved=False))
          (root/'source-and-license.json').write_text(json.dumps(metadata,indent=2))
          print('VERIFIED',json.dumps([{k:item[k] for k in ['title','artist','sha256','durationSec']} for item in metadata]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fallen-two-mixkit-source-music-candidates
          path: mixkit-approved-source-candidates/
          retention-days: 3
          if-no-files-found: error
