name: KAIDANCE frontier field cycle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'systemia/organism/frontier-watch.mjs'
      - 'systemia/organism/science-hazard-watch.mjs'
      - 'systemia/organism/medical-evidence-brief*.mjs'
      - 'systemia/organism/medical-evidence-triage*.mjs'
      - 'systemia/organism/medical-review-packet*.mjs'
      - 'systemia/organism/medical-registry-crosscheck*.mjs'
      - 'systemia/organism/medical-registered-trial-lane*.mjs'
      - 'systemia/organism/medical-outcome-audit*.mjs'
      - 'systemia/organism/medical-registry-observation-ledger*.mjs'
      - 'systemia/organism/medical-registry-source-probe.mjs'
      - 'systemia/organism/medical-workflow-continuity.test.mjs'
      - 'systemia/organism/medical-abstract-evidence*.mjs'
      - 'systemia/organism/kaidance-frontier-proof.mjs'
      - 'systemia/organism/kaidance-frontier-cycle.mjs'
      - 'systemia/organism/kaidance-company-heartbeat*.mjs'
      - 'systemia/organism/kaidance-goal-advance.mjs'
      - 'tests/kaidance-goal-advance.test.mjs'
      - 'systemia/organism/kaidance-company-heartbeat.workflow.json'
      - 'systemia/payments/kaidance-offer-*.mjs'
      - 'systemia/payments/kaidance-stripe-readonly.mjs'
      - 'systemia/payments/kaidance-stripe-inventory.mjs'
      - 'systemia/clip/kaidance-checkout-intake.mjs'
      - 'tests/kaidance-stripe-inventory-clip-intake.test.mjs'
      - 'systemia/payments/kaidance-checkout-cycle.mjs'
      - 'systemia/payments/kaidance-offer-checkout.workflow.json'
      - 'registry/kaidance-payment-offer-bindings.v1.json'
      - 'tests/kaidance-offer-checkout.test.mjs'
      - 'registry/kaidance-company-lanes.v1.json'
      - 'tests/kaidance-company-heartbeat.test.mjs'
      - 'systemia/collider/**'
      - 'registry/**'
      - 'public/.well-known/evercraft-products.json'
      - 'public/chum/products/**'
      - '.github/workflows/kaidance-frontier-field.yml'
  pull_request:
    paths:
      - 'systemia/organism/frontier-watch.mjs'
      - 'systemia/organism/science-hazard-watch.mjs'
      - 'systemia/organism/medical-abstract-evidence*.mjs'
      - 'systemia/organism/medical-evidence-brief*.mjs'
      - 'systemia/organism/medical-evidence-triage*.mjs'
      - 'systemia/organism/medical-review-packet*.mjs'
      - 'systemia/organism/medical-registry-crosscheck*.mjs'
      - 'systemia/organism/medical-registered-trial-lane*.mjs'
      - 'systemia/organism/medical-outcome-audit*.mjs'
      - 'systemia/organism/medical-registry-observation-ledger*.mjs'
      - 'systemia/organism/medical-registry-source-probe.mjs'
      - 'systemia/organism/medical-workflow-continuity.test.mjs'
      - 'systemia/organism/kaidance-frontier-proof.mjs'
      - 'systemia/organism/kaidance-frontier-cycle.mjs'
      - 'systemia/organism/kaidance-company-heartbeat*.mjs'
      - 'systemia/organism/kaidance-goal-advance.mjs'
      - 'tests/kaidance-goal-advance.test.mjs'
      - 'systemia/organism/kaidance-company-heartbeat.workflow.json'
      - 'systemia/payments/kaidance-offer-*.mjs'
      - 'systemia/payments/kaidance-stripe-readonly.mjs'
      - 'systemia/payments/kaidance-stripe-inventory.mjs'
      - 'systemia/clip/kaidance-checkout-intake.mjs'
      - 'tests/kaidance-stripe-inventory-clip-intake.test.mjs'
      - 'systemia/payments/kaidance-checkout-cycle.mjs'
      - 'systemia/payments/kaidance-offer-checkout.workflow.json'
      - 'registry/kaidance-payment-offer-bindings.v1.json'
      - 'tests/kaidance-offer-checkout.test.mjs'
      - 'registry/kaidance-company-lanes.v1.json'
      - 'tests/kaidance-company-heartbeat.test.mjs'
      - 'systemia/collider/**'
      - 'registry/**'
      - 'public/.well-known/evercraft-products.json'
      - 'public/chum/products/**'
      - '.github/workflows/kaidance-frontier-field.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: kaidance-frontier-field-${{ github.ref }}
  cancel-in-progress: false

jobs:
  field-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore KAIDANCE frontier state
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/kaidance-frontier/runtime/state.json
            artifacts/kaidance-company-heartbeat/state.json
            artifacts/medical-evidence-triage/state.json
            artifacts/medical-registered-trials/history/state.json
          key: kaidance-frontier-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kaidance-frontier-state-${{ runner.os }}-

      - name: Prove frontier + science/hazard contracts
        run: node systemia/organism/kaidance-frontier-proof.mjs

      - name: Prove medical source-bound reports and visuals
        run: node systemia/organism/medical-evidence-brief.test.mjs

      - name: Prove source-linked PubMed abstract evidence
        run: node systemia/organism/medical-abstract-evidence.test.mjs

      - name: Prove longitudinal biomedical evidence triage
        run: node systemia/organism/medical-evidence-triage.test.mjs

      - name: Prove biomedical source-quoted review packet
        run: node systemia/organism/medical-review-packet.test.mjs

      - name: Prove research memory cache continuity
        run: node systemia/organism/medical-workflow-continuity.test.mjs

      - name: Prove ClinicalTrials.gov independent metadata crosscheck
        run: node systemia/organism/medical-registry-crosscheck.test.mjs

      - name: Probe official ClinicalTrials.gov endpoint (no publication claim)
        run: node systemia/organism/medical-registry-source-probe.mjs

      - name: Prove registered-trial PubMed cohort and official crosscheck
        run: node systemia/organism/medical-registered-trial-lane.test.mjs

      - name: Prove registered protocol to abstract reviewer comparisons
        run: node systemia/organism/medical-outcome-audit.test.mjs

      - name: Prove longitudinal ClinicalTrials.gov observation ledger
        run: node systemia/organism/medical-registry-observation-ledger.test.mjs

      - name: Validate KAIDANCE company heartbeat safety and truthful progress
        run: node --test tests/kaidance-company-heartbeat.test.mjs tests/kaidance-goal-advance.test.mjs

      - name: Reconcile Evercraft company portfolio on KAIDANCE heartbeat
        run: node systemia/organism/kaidance-company-heartbeat-runner.mjs --out artifacts/kaidance-company-heartbeat --prove-worlds

      - name: Validate KAIDANCE exact-price Stripe link routing and account isolation
        run: node --test tests/kaidance-offer-checkout.test.mjs

      - name: Verify five-merchant Stripe inventory, no-auto-tax routing, and Clip source intake
        run: node --test tests/kaidance-stripe-inventory-clip-intake.test.mjs

      - name: Reconcile this heartbeat's promoted offers with provider-backed checkout candidates
        run: node systemia/payments/kaidance-checkout-cycle.mjs --out artifacts/kaidance-offer-checkout

      - name: Run live KAIDANCE frontier field cycle
        run: node systemia/organism/kaidance-frontier-cycle.mjs

      - name: Save KAIDANCE frontier and medical memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/kaidance-frontier/runtime/state.json
            artifacts/kaidance-company-heartbeat/state.json
            artifacts/medical-evidence-triage/state.json
            artifacts/medical-registered-trials/history/state.json
          key: kaidance-frontier-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload KAIDANCE frontier receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaidance-frontier-receipts
          path: |
            artifacts/kaidance-offer-checkout/inventory.json
            artifacts/kaidance-offer-checkout/latest.json
            artifacts/kaidance-offer-checkout/actions.json
            artifacts/kaidance-offer-checkout/mission-snapshot.json
            artifacts/kaidance-company-heartbeat/latest.json
            artifacts/kaidance-company-heartbeat/mission-snapshot.json
            artifacts/kaidance-company-heartbeat/queue.json
            artifacts/kaidance-company-heartbeat/goal-dispatch.json
            artifacts/kaidance-company-heartbeat/goal-mission-snapshot.json
            artifacts/kaidance-frontier/latest.json
            artifacts/kaidance-frontier/receipts.jsonl
            artifacts/kaidance-frontier/runtime/receipts.jsonl
            artifacts/portfolio-frontier/latest.json
            artifacts/portfolio-frontier/mission-snapshot.json
            artifacts/science-hazard-watch/latest.json
            artifacts/science-hazard-watch/mission-snapshot.json
            artifacts/medical-evidence-radar/latest.json
            artifacts/medical-evidence-radar/report.md
            artifacts/medical-evidence-radar/research-radar.svg
            artifacts/medical-evidence-radar/index.html
            artifacts/medical-abstract-evidence/latest.json
            artifacts/medical-abstract-evidence/abstract-review.md
            artifacts/medical-abstract-evidence/index.html
            artifacts/medical-evidence-triage/latest.json
            artifacts/medical-evidence-triage/state.json
            artifacts/medical-registered-trials/history/state.json
            artifacts/medical-evidence-triage/review-queue.md
            artifacts/medical-evidence-triage/index.html
            artifacts/medical-review-packets/latest.json
            artifacts/medical-review-packets/review.md
            artifacts/medical-review-packets/index.html
            artifacts/medical-registry-crosscheck/latest.json
            artifacts/medical-registry-crosscheck/review.md
            artifacts/medical-registry-crosscheck/index.html
            artifacts/medical-registry-crosscheck/source-health.json
            artifacts/medical-registered-trials/latest.json
            artifacts/medical-registered-trials/review.json
            artifacts/medical-registered-trials/registry.json
            artifacts/medical-registered-trials/review.md
            artifacts/medical-registered-trials/registry.md
            artifacts/medical-registered-trials/index.html
            artifacts/medical-registered-trials/outcome-audit/latest.json
            artifacts/medical-registered-trials/outcome-audit/review.md
            artifacts/medical-registered-trials/outcome-audit/index.html
            artifacts/medical-registered-trials/history/latest.json
            artifacts/medical-registered-trials/history/review.md
            artifacts/medical-registered-trials/history/index.html
          if-no-files-found: warn
          retention-days: 14

      - name: Write KAIDANCE frontier summary
        if: always()
        shell: bash
        run: |
          echo '## KAIDANCE frontier field cycle' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/kaidance-frontier/latest.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/kaidance-frontier/latest.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
