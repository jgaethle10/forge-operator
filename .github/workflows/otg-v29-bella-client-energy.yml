name: OTG V29 Bella Client Energy (Private)
on:
  workflow_dispatch:
  push:
    branches: [feature/onthego-bella-native-voice-20261026]
    paths:
      - systemia/media-studio/on-the-go-v29-bright-bella-auditions.py
      - .github/workflows/otg-v29-bella-client-energy.yml
permissions:
  contents: read
jobs:
  native-bella:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro audio dependencies
        run: |
          timeout 75s sudo apt-get update -qq || echo 'apt metadata refresh timed out; using cached apt'
          DEBIAN_FRONTEND=noninteractive timeout 120s sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install 'kokoro==0.9.4' 'soundfile>=0.12,<1'
      - name: Native Bella complete-line takes with receipt
        run: python systemia/media-studio/on-the-go-v29-bright-bella-auditions.py
      - uses: actions/upload-artifact@v4
        with:
          name: otg-v29-native-bella-brighter-natural-auditions
          path: v29-bella-bright/
          retention-days: 7
          if-no-files-found: error
