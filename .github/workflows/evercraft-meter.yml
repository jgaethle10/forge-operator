name: Evercraft Meter

on:
  push:
    branches: [main]
    paths:
      - 'systemia/meter/**'
      - '.github/workflows/evercraft-meter.yml'
  pull_request:
    paths:
      - 'systemia/meter/**'
      - '.github/workflows/evercraft-meter.yml'

permissions:
  contents: read

jobs:
  meter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Evercraft Meter contract tests
        run: node --test systemia/meter/meter.test.mjs
