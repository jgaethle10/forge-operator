name: Photon Forge V4 WorldFrame Bridge
on:
  pull_request:
    paths:
      - 'scripts/photon-forge-v4/**'
      - '.github/workflows/photon-forge-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install V4 software canary dependencies
        run: python -m pip install -r scripts/photon-forge-v4/requirements.txt
      - name: Verify canonical digest parity, geometry checks and actual PNG render
        run: python -m unittest discover -s scripts/photon-forge-v4 -p 'test_*.py' -v
      - name: Verify default frame preview writes real pixel data
        run: |
          python scripts/photon-forge-v4/render.py --preview 4.9
          test -s scripts/photon-forge-v4/v4_preview_04.9.jpg
          rm scripts/photon-forge-v4/v4_preview_04.9.jpg
