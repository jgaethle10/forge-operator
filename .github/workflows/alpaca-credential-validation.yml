name: Alpaca credential validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpaca-credential-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - name: Validate live Alpaca credential pair
        id: validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const key = process.env.ALPACA_API_KEY_ID || "";
          const secret = process.env.ALPACA_API_SECRET_KEY || "";
          let accepted = false;
          let http = "unavailable";
          let state = "unknown";

          const out = (name, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, name + "=" + String(value).replace(/[\r\n]/g, " ") + "\n");
          };

          if (!key || !secret) {
            state = "missing_repository_secret";
            out("accepted", false);
            out("http", "missing");
            out("state", state);
            console.log("ALPACA_CREDENTIAL_ACCEPTED=false");
            console.log("ALPACA_VALIDATION_STATE=" + state);
            console.log("ALPACA_SECRET_MATERIAL_PRINTED=false");
            process.exit(0);
          }

          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);

          try {
            const response = await fetch("https://api.alpaca.markets/v2/account", {
              method: "GET",
              headers: {
                "APCA-API-KEY-ID": key,
                "APCA-API-SECRET-KEY": secret,
                "accept": "application/json"
              },
              signal: controller.signal
            });

            http = String(response.status);
            accepted = response.ok;
            state = response.ok ? "accepted" : "rejected";

            console.log("ALPACA_CREDENTIAL_ACCEPTED=" + String(accepted));
            console.log("ALPACA_HTTP_STATUS=" + http);
            console.log("ALPACA_VALIDATION_STATE=" + state);
            console.log("ALPACA_SECRET_MATERIAL_PRINTED=false");
          } catch {
            accepted = false;
            http = "unavailable";
            state = "request_failed";
            console.log("ALPACA_CREDENTIAL_ACCEPTED=false");
            console.log("ALPACA_HTTP_STATUS=unavailable");
            console.log("ALPACA_VALIDATION_STATE=request_failed");
            console.log("ALPACA_SECRET_MATERIAL_PRINTED=false");
          } finally {
            clearTimeout(timer);
            out("accepted", accepted);
            out("http", http);
            out("state", state);
          }
          NODE

      - name: Publish sanitized validation status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED: ${{ steps.validate.outputs.accepted }}
          HTTP_STATUS: ${{ steps.validate.outputs.http }}
          VALIDATION_STATE: ${{ steps.validate.outputs.state }}
        run: |
          node <<'NODE'
          const accepted = process.env.ACCEPTED === "true";
          const http = String(process.env.HTTP_STATUS || "unknown").slice(0, 20);
          const state = String(process.env.VALIDATION_STATE || "unknown").replace(/[^a-zA-Z0-9._-]/g, "_").slice(0, 60);
          const owner = process.env.GITHUB_REPOSITORY.split("/")[0];
          const repo = process.env.GITHUB_REPOSITORY.split("/")[1];
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GH_TOKEN;

          const body = {
            state: accepted ? "success" : "failure",
            context: "evercraft/alpaca-credential",
            description: accepted
              ? "accepted (HTTP " + http + ")"
              : state + " (HTTP " + http + ")"
          };

          const response = await fetch(
            "https://api.github.com/repos/" + owner + "/" + repo + "/statuses/" + sha,
            {
              method: "POST",
              headers: {
                "authorization": "Bearer " + token,
                "accept": "application/vnd.github+json",
                "x-github-api-version": "2022-11-28",
                "content-type": "application/json"
              },
              body: JSON.stringify(body)
            }
          );
          if (!response.ok) {
            console.error("Could not publish sanitized credential status.");
            process.exit(1);
          }
          console.log("Sanitized Alpaca validation status published.");
          NODE

      - name: Fail job if credentials were not accepted
        if: steps.validate.outputs.accepted != 'true'
        run: |
          echo "Alpaca did not accept the configured credential pair."
          exit 1
