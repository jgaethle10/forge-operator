name: Alpaca credential validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpaca-credential-validation.yml"
  pull_request:
    paths:
      - ".github/workflows/alpaca-credential-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - name: Validate required secrets exist
        shell: bash
        run: |
          if [[ -z "${ALPACA_API_KEY_ID}" || -z "${ALPACA_API_SECRET_KEY}" ]]; then
            echo "ALPACA_CREDENTIAL_ACCEPTED=false"
            echo "ALPACA_VALIDATION_STATE=missing_repository_secret"
            exit 1
          fi

      - name: Validate live Alpaca credential pair
        shell: bash
        run: |
          node <<'NODE'
          const key = process.env.ALPACA_API_KEY_ID || "";
          const secret = process.env.ALPACA_API_SECRET_KEY || "";

          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);

          try {
            const response = await fetch("https://api.alpaca.markets/v2/account", {
              method: "GET",
              headers: {
                "APCA-API-KEY-ID": key,
                "APCA-API-SECRET-KEY": secret,
                "accept": "application/json"
              },
              signal: controller.signal
            });

            let state = "unknown";
            try {
              const body = await response.json();
              if (response.ok) {
                state = typeof body?.status === "string" ? body.status : "accepted";
              } else if (typeof body?.message === "string") {
                state = body.message.replace(/[\r\n]/g, " ").slice(0, 120);
              }
            } catch {}

            console.log("ALPACA_CREDENTIAL_ACCEPTED=" + String(response.ok));
            console.log("ALPACA_HTTP_STATUS=" + response.status);
            console.log("ALPACA_ACCOUNT_STATE=" + state);
            console.log("ALPACA_SECRET_MATERIAL_PRINTED=false");

            if (!response.ok) process.exit(1);
          } catch (error) {
            console.log("ALPACA_CREDENTIAL_ACCEPTED=false");
            console.log("ALPACA_HTTP_STATUS=unavailable");
            console.log("ALPACA_ACCOUNT_STATE=request_failed");
            console.log("ALPACA_SECRET_MATERIAL_PRINTED=false");
            console.error("Validation request failed without exposing credential material.");
            process.exit(1);
          } finally {
            clearTimeout(timer);
          }
          NODE
