name: Alpaca credential validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpaca-credential-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S_KEY_ID_1: ${{ secrets.ALPACA_API_KEY_ID }}
      S_KEY_ID_2: ${{ secrets.APCA_API_KEY_ID }}
      S_KEY_ID_3: ${{ secrets.ALPACA_KEY_ID }}
      S_KEY_ID_4: ${{ secrets.ALPACA_API_KEY }}
      S_KEY_ID_5: ${{ secrets.ALPACA_TRADING }}
      S_SECRET_1: ${{ secrets.ALPACA_API_SECRET_KEY }}
      S_SECRET_2: ${{ secrets.APCA_API_SECRET_KEY }}
      S_SECRET_3: ${{ secrets.ALPACA_SECRET_KEY }}
      S_SECRET_4: ${{ secrets.ALPACA_API_SECRET }}
      S_SECRET_5: ${{ secrets.ALPACA_SECRET }}
      S_SECRET_6: ${{ secrets.ALPACA_TRADING_SECRET }}
    steps:
      - name: Resolve and validate live Alpaca credential pair
        id: validate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const keyCandidates = [
            ["ALPACA_API_KEY_ID", process.env.S_KEY_ID_1 || ""],
            ["APCA_API_KEY_ID", process.env.S_KEY_ID_2 || ""],
            ["ALPACA_KEY_ID", process.env.S_KEY_ID_3 || ""],
            ["ALPACA_API_KEY", process.env.S_KEY_ID_4 || ""],
            ["ALPACA_TRADING", process.env.S_KEY_ID_5 || ""],
          ];
          const secretCandidates = [
            ["ALPACA_API_SECRET_KEY", process.env.S_SECRET_1 || ""],
            ["APCA_API_SECRET_KEY", process.env.S_SECRET_2 || ""],
            ["ALPACA_SECRET_KEY", process.env.S_SECRET_3 || ""],
            ["ALPACA_API_SECRET", process.env.S_SECRET_4 || ""],
            ["ALPACA_SECRET", process.env.S_SECRET_5 || ""],
            ["ALPACA_TRADING_SECRET", process.env.S_SECRET_6 || ""],
          ];

          const keyEntry = keyCandidates.find(([,value]) => value.length > 0) || ["none", ""];
          const secretEntry = secretCandidates.find(([,value]) => value.length > 0) || ["none", ""];
          const key = keyEntry[1];
          const secret = secretEntry[1];

          const out = (name, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, name + "=" + String(value).replace(/[\r\n]/g, " ") + "\n");
          };

          console.log("ALPACA_KEY_SLOT=" + keyEntry[0]);
          console.log("ALPACA_SECRET_SLOT=" + secretEntry[0]);
          console.log("ALPACA_SECRET_MATERIAL_PRINTED=false");

          if (!key || !secret) {
            out("accepted", false);
            out("http", "missing");
            out("state", "missing_repository_secret");
            console.log("ALPACA_CREDENTIAL_ACCEPTED=false");
            console.log("ALPACA_VALIDATION_STATE=missing_repository_secret");
            process.exit(0);
          }

          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          let accepted = false;
          let http = "unavailable";
          let state = "request_failed";

          try {
            const response = await fetch("https://api.alpaca.markets/v2/account", {
              method: "GET",
              headers: {
                "APCA-API-KEY-ID": key,
                "APCA-API-SECRET-KEY": secret,
                "accept": "application/json"
              },
              signal: controller.signal
            });
            accepted = response.ok;
            http = String(response.status);
            state = response.ok ? "accepted" : "rejected";
          } catch {
            accepted = false;
            http = "unavailable";
            state = "request_failed";
          } finally {
            clearTimeout(timer);
          }

          out("accepted", accepted);
          out("http", http);
          out("state", state);
          console.log("ALPACA_CREDENTIAL_ACCEPTED=" + String(accepted));
          console.log("ALPACA_HTTP_STATUS=" + http);
          console.log("ALPACA_VALIDATION_STATE=" + state);
          NODE

      - name: Publish sanitized validation status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED: ${{ steps.validate.outputs.accepted }}
          HTTP_STATUS: ${{ steps.validate.outputs.http }}
          VALIDATION_STATE: ${{ steps.validate.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          const accepted = process.env.ACCEPTED === "true";
          const http = String(process.env.HTTP_STATUS || "unknown").slice(0,20);
          const state = String(process.env.VALIDATION_STATE || "unknown").replace(/[^a-zA-Z0-9._-]/g,"_").slice(0,60);
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const body = {
            state: accepted ? "success" : "failure",
            context: "evercraft/alpaca-credential",
            description: accepted ? "accepted (HTTP " + http + ")" : state + " (HTTP " + http + ")"
          };
          const response = await fetch(
            "https://api.github.com/repos/" + owner + "/" + repo + "/statuses/" + process.env.GITHUB_SHA,
            {
              method:"POST",
              headers:{
                authorization:"Bearer " + process.env.GH_TOKEN,
                accept:"application/vnd.github+json",
                "x-github-api-version":"2022-11-28",
                "content-type":"application/json"
              },
              body:JSON.stringify(body)
            }
          );
          if (!response.ok) process.exit(1);
          NODE

      - name: Fail job if credentials were not accepted
        if: steps.validate.outputs.accepted != 'true'
        run: exit 1
