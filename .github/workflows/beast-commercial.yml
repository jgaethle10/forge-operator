name: BEAST commercial gateway proof

on:
  pull_request:
    paths:
      - 'systemia/beast-mode/**'
      - 'package.json'
      - '.github/workflows/beast-commercial.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/beast-mode/**'
      - 'package.json'
      - '.github/workflows/beast-commercial.yml'
  workflow_dispatch:

jobs:
  commercial-gateway-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run proof:beast-commercial
