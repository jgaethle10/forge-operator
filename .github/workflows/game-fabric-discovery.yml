name: Game Fabric public discovery contract

on:
  pull_request:
    paths:
      - 'registry/game-fabric/**'
      - 'registry/catalog.json'
      - 'registry/public-products.json'
      - 'conformance/products.json'
      - 'public/.well-known/evercraft-products.json'
      - 'tests/game-fabric-public-discovery.test.mjs'
      - '.github/workflows/game-fabric-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'registry/game-fabric/**'
      - 'registry/catalog.json'
      - 'registry/public-products.json'
      - 'conformance/products.json'
      - 'public/.well-known/evercraft-products.json'
      - 'tests/game-fabric-public-discovery.test.mjs'
      - '.github/workflows/game-fabric-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Game Fabric claims match all registries
        run: node tests/game-fabric-public-discovery.test.mjs
      - name: Validate cross-provider discovery boundary
        run: node scripts/validate-ai-conformance.mjs
      - name: Prove new product carries complete Systemia capability contract
        run: |
          node systemia/capability-mesh/mesh.mjs --check
          node --test systemia/capability-mesh/mesh.test.mjs
