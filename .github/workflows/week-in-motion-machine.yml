name: Week in Motion Machine

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Evercraft Journal after all gates pass
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '30 15 * * 1'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: week-in-motion-machine
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Los_Angeles
      GITHUB_TOKEN: ${{ github.token }}
      EVERCRAFT_EDITORIAL_ENDPOINT: ${{ secrets.EVERCRAFT_EDITORIAL_ENDPOINT }}
      EVERCRAFT_EDITORIAL_TOKEN: ${{ secrets.EVERCRAFT_EDITORIAL_TOKEN }}
      EVERCRAFT_EDITORIAL_MODEL: ${{ vars.EVERCRAFT_EDITORIAL_MODEL }}
      SYSTEMIA_JOURNAL_INGRESS_URL: ${{ secrets.SYSTEMIA_JOURNAL_INGRESS_URL }}
      SYSTEMIA_JOURNAL_SHARED_SECRET: ${{ secrets.SYSTEMIA_JOURNAL_SHARED_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove weekly window and publishing standards
        run: node --test systemia/week-in-motion/engine.test.mjs

      - name: Build and publish Week in Motion
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: node systemia/week-in-motion/runner.mjs --publish

      - name: Build Week in Motion without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true }}
        run: node systemia/week-in-motion/runner.mjs

      - name: Preserve weekly evidence and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-in-motion-${{ github.run_id }}
          path: artifacts/week-in-motion/
          if-no-files-found: warn
          retention-days: 90
