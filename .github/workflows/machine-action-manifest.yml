name: Machine Action Manifest

on:
  push:
    branches: [main]
    paths:
      - 'systemia/chum/mcp-canary.mjs'
      - 'systemia/chum/machine-action-manifest.mjs'
      - 'systemia/chum/machine-action-manifest.test.mjs'
      - '.github/workflows/machine-action-manifest.yml'
  pull_request:
    paths:
      - 'systemia/chum/mcp-canary.mjs'
      - 'systemia/chum/machine-action-manifest.mjs'
      - 'systemia/chum/machine-action-manifest.test.mjs'
      - '.github/workflows/machine-action-manifest.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove receipt-to-action-manifest boundaries
        run: node --test systemia/chum/machine-action-manifest.test.mjs
