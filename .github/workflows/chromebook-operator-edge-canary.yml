name: Chromebook Operator Public Edge Canary

on:
  push:
    branches: [main]
    paths:
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/fabric-faie-runtime.mjs'
      - 'systemia/faie/**'
      - 'public/faie/**'
      - 'systemia/compute/device-identity.mjs'
      - 'systemia/compute/operator-public-edge-admit.mjs'
      - 'scripts/fabric-edge-external-canary.mjs'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-fabric-network-observer.sh'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'systemia/compute/network-observer.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

concurrency:
  group: chromebook-operator-edge-canary
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EVERCRAFT_OPERATOR_EDGE_ORIGIN: https://fabric.systemiacommandcenters.com
    steps:
      - name: Checkout exact verifier revision
        uses: actions/checkout@v4

      - name: Verify Chromebook-owned production edge
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          max_attempts=16
          attempt=1
          status=1
          deployment_wait_started=false
          while [ "$attempt" -le "$max_attempts" ]; do
            rm -f artifacts/fabric-operator-edge-canary.stdout.json artifacts/fabric-operator-edge-canary.stderr.json
            set +e
            node scripts/fabric-edge-external-canary.mjs               --origin "$EVERCRAFT_OPERATOR_EDGE_ORIGIN"               > artifacts/fabric-operator-edge-canary.stdout.json               2> artifacts/fabric-operator-edge-canary.stderr.json
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi

            candidate="artifacts/fabric-operator-edge-canary.stdout.json"
            if [ -s artifacts/fabric-operator-edge-canary.stderr.json ]; then
              candidate="artifacts/fabric-operator-edge-canary.stderr.json"
            fi
            stage="$(jq -r '.failure_stage // ""' "$candidate" 2>/dev/null || true)"
            error="$(jq -r '.error // ""' "$candidate" 2>/dev/null || true)"

            # The Chromebook updater intentionally polls every five minutes.
            # Retry only the known deployment-lag signature for a newly added
            # Visual Desk route. All other production failures remain immediate.
            if [ "$stage" = "visual_desk" ] && [ "$attempt" -lt "$max_attempts" ]; then
              if [ "$error" = "http_404:/visuals/" ] || \
                 [ "$error" = "http_404:/visuals/washington-active-volcanoes/poster-feed.svg" ] || \
                 [ "$error" = "http_404:/visuals/washington-active-volcanoes/poster-story.svg" ] || \
                 [ "$error" = "json_http_404:/visuals/washington-active-volcanoes/graphics-plan.json" ] || \
                 [ "$error" = "json_http_404:/visuals/washington-active-volcanoes/scroll-stop-report.json" ] || \
                 [ "$error" = "json_http_404:/visuals/washington-active-volcanoes/fallen-stage-input.json" ] || \
                 [ "$error" = "json_http_404:/visuals/washington-active-volcanoes/poster-quality-report.json" ] || \
                 [ "$error" = "http_404:/visuals/washington-active-volcanoes/poster-story.html" ] || \
                 [ "$error" = "graphics_command_state_geometry_missing" ] || \
                 [ "$error" = "graphics_command_cinematic_geography_missing" ] || \
                 [ "$error" = "graphics_command_terrain_relief_missing" ] || \
                 [ "$error" = "graphics_command_terrain_lineage_missing" ] || \
                 [ "$error" = "graphics_command_boundary_lineage_missing" ] || \
                 [ "$error" = "graphics_command_fallen_polygon_missing" ] || \
                 [ "$error" = "graphics_command_responsive_preview_missing" ] || \
                 [ "$error" = "graphics_command_directed_motion_missing" ] || \
                 [ "$error" = "visual_desk_ingest_route_not_deployed" ] || \
                 [ "$error" = "visual_desk_ingest_credential_not_ready" ]; then
                deployment_wait_started=true
                echo "Visual Desk deployment has not fully reached the owned edge yet ($error); retrying after updater window slice ($attempt/$max_attempts)."
                sleep 20
                attempt=$((attempt + 1))
                continue
              fi
            fi

            # AliEV deploys through the same Chromebook updater.
            # Retry only the known 404 deployment-lag signature. Identity,
            # policy and unexpected HTTP failures remain immediate.
            if [ "$stage" = "aliev_surface" ] && [ "$attempt" -lt "$max_attempts" ]; then
              if [[ "$error" == http_404:* ]]; then
                deployment_wait_started=true
                echo "AliEV deployment has not reached the owned edge yet ($error); retrying after updater window slice ($attempt/$max_attempts)."
                sleep 20
                attempt=$((attempt + 1))
                continue
              fi
            fi

            # Once this exact run has proven the old Visual Desk route is still
            # deployed, allow a root 502 during the subsequent Fabric restart.
            # A 502 without that prior deployment-lag evidence remains immediate.
            if [ "$deployment_wait_started" = "true" ] && [ "$stage" = "customer_surface" ] && [ "$error" = "http_502:/" ] && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Owned Fabric is restarting after Visual Desk deployment; retrying ($attempt/$max_attempts)."
              sleep 20
              attempt=$((attempt + 1))
              continue
            fi
            break
          done

          if [ "$status" -eq 0 ]; then
            mv artifacts/fabric-operator-edge-canary.stdout.json               artifacts/fabric-operator-edge-canary.json
            rm -f artifacts/fabric-operator-edge-canary.stderr.json
          else
            if [ -s artifacts/fabric-operator-edge-canary.stderr.json ]; then
              mv artifacts/fabric-operator-edge-canary.stderr.json                 artifacts/fabric-operator-edge-canary.json
            else
              mv artifacts/fabric-operator-edge-canary.stdout.json                 artifacts/fabric-operator-edge-canary.json
            fi
            echo "Operator edge canary failed with status $status after $attempt attempt(s)." >&2
            cat artifacts/fabric-operator-edge-canary.json >&2 || true
            exit "$status"
          fi
          echo "Operator edge verified after $attempt attempt(s)."
          cat artifacts/fabric-operator-edge-canary.json

      - name: Publish operator edge commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state="success"
            description="Chromebook production edge externally verified"
          else
            state="failure"
            stage="$(jq -r '.failure_stage // "unknown"' artifacts/fabric-operator-edge-canary.json 2>/dev/null || echo unknown)"
            error="$(jq -r '.error // "verification_failed"' artifacts/fabric-operator-edge-canary.json 2>/dev/null || echo verification_failed)"
            description="Edge failure: ${stage} (${error})"
            description="${description:0:140}"
          fi
          payload="$(jq -cn             --arg state "$state"             --arg context "evercraft/chromebook-operator-edge"             --arg description "$description"             '{state:$state,context:$context,description:$description}')"
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Upload operator edge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromebook-operator-edge-canary
          path: artifacts/fabric-operator-edge-canary.json
          if-no-files-found: error
          retention-days: 90
