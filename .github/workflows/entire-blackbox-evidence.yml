name: Entire Black Box evidence gate

on:
  pull_request:
    paths:
      - "integrations/entire-blackbox/**"
      - "systemia/agent-continuity/**"
      - ".github/workflows/entire-blackbox-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/entire-blackbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/entire-blackbox/go.mod
      - name: Deterministic unit tests and vet
        run: |
          go test -count=1 -v ./...
          go vet ./...
      - name: Build and verify unknown-state smoke
        run: |
          go build -o /tmp/entire-blackbox .
          /tmp/entire-blackbox inspect examples/unknown.json > /tmp/evidence.json
          grep -q '"assessment":"UNKNOWN"' /tmp/evidence.json
          grep -q '"externally_verified":false' /tmp/evidence.json
      - name: Four-state adversarial showcase
        run: bash demo.sh
      - name: Synthetic shared-incident reconciliation
        run: |
          node --test ../../systemia/agent-continuity/reconcile.test.mjs
          node ../../systemia/agent-continuity/reconcile.mjs \
            ../../systemia/agent-continuity/scenario.synthetic.json \
            /tmp/evidence.json > /tmp/synthetic-incident.json
          grep -q '"live_integrated": false' /tmp/synthetic-incident.json
          grep -q '"verified_collateral": \[\]' /tmp/synthetic-incident.json
          grep -q '"canonical_admission": "NOT_ADMITTED"' /tmp/synthetic-incident.json
      - name: Synthetic anticipatory defense policy
        run: node --test ../../systemia/agent-continuity/response-policy.test.mjs
      - name: Signed read-only incident event contract and denial tests
        run: node --test ../../systemia/agent-continuity/incident-event.test.mjs
      - name: Local custody and replay-safe incident projections
        run: node --test ../../systemia/agent-continuity/incident-journal.test.mjs
      - name: Authenticated Github Actions read-only source adapter tests
        run: node --test ../../systemia/agent-continuity/github-actions-source.test.mjs
      - name: Live Github Actions read-only source lab
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node ../../systemia/agent-continuity/github-actions-lab.mjs | tee /tmp/blackbox-source-lab.json
          grep -q '"live_agent_telemetry_verified": false' /tmp/blackbox-source-lab.json
          grep -q '"cross_product_runtime_integrated": false' /tmp/blackbox-source-lab.json
          grep -q '"same_root_local_readback": true' /tmp/blackbox-source-lab.json
      - name: Save sanitized provider-readback laboratory receipt
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-owned-github-readback-lab
          path: /tmp/blackbox-source-lab.json
          if-no-files-found: error
          retention-days: 14
      - name: Scheduled revenue heartbeat source boundaries
        run: node --test ../../systemia/agent-continuity/github-heartbeat-source.test.mjs
      - name: Live scheduled revenue heartbeat readonly intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node ../../systemia/agent-continuity/github-heartbeat-lab.mjs | tee /tmp/blackbox-scheduled-heartbeat.json
          grep -q '"live_agent_telemetry_verified": false' /tmp/blackbox-scheduled-heartbeat.json
          grep -q '"external_effect_provider_verified": false' /tmp/blackbox-scheduled-heartbeat.json
          grep -q '"execution_authority": "NONE_READ_ONLY"' /tmp/blackbox-scheduled-heartbeat.json
      - name: Archive sanitized scheduled heartbeat observation
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-scheduled-heartbeat-readonly-lab
          path: /tmp/blackbox-scheduled-heartbeat.json
          if-no-files-found: error
          retention-days: 14
      - name: Scheduled workflow cohort adversarial boundary tests
        run: node --test ../../systemia/agent-continuity/github-schedule-cohort.test.mjs
      - name: Read-only scheduled workflow cohort
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node ../../systemia/agent-continuity/github-schedule-cohort-lab.mjs | tee /tmp/blackbox-scheduled-cohort.json
          grep -q '"common_cause_verified": false' /tmp/blackbox-scheduled-cohort.json
          grep -q '"source_execution_authority": "NONE_READ_ONLY"' /tmp/blackbox-scheduled-cohort.json
          grep -q '"service_recovery_verified": false' /tmp/blackbox-scheduled-cohort.json
      - name: Archive five-lane source schedule cohort
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-owned-schedule-cohort-readonly
          path: /tmp/blackbox-scheduled-cohort.json
          if-no-files-found: error
          retention-days: 14
      - name: Four role receipt-chain cryptographic denial tests
        run: node --test ../../systemia/agent-continuity/detached-receipt-chain.test.mjs
      - name: Detached four-role laboratory receipt chain
        run: |
          set -euo pipefail
          node ../../systemia/agent-continuity/detached-receipt-lab.mjs /tmp/blackbox-scheduled-cohort.json | tee /tmp/blackbox-detached-chain.json
          grep -q '"production_authorized": false' /tmp/blackbox-detached-chain.json
          grep -q '"source_artifact_sha256"' /tmp/blackbox-detached-chain.json
          grep -q '"producer_delivery_consumer_independence": "NOT_PROVEN"' /tmp/blackbox-detached-chain.json
          grep -q '"execution_authority": "NONE_READ_ONLY"' /tmp/blackbox-detached-chain.json
      - name: Archive detached public-key-only reproducible lab evidence
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-four-role-detached-verifier-lab
          path: /tmp/blackbox-detached-chain.json
          if-no-files-found: error
          retention-days: 14
      - name: Cross-build candidate binaries
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /tmp/entire-blackbox_darwin_arm64 .
          GOOS=windows GOARCH=amd64 go build -o /tmp/entire-blackbox_windows_amd64.exe .


  # This is an ACTUAL separate GitHub runner/job that downloads the first
  # job's provider-stored lab receipt. Trust keys are still CI generated
  # and self-contained, not independently provisioned Passport identities.
  detached-cross-job-consumer:
    name: Cross-job detached receipt acceptance
    runs-on: ubuntu-latest
    needs: evidence-gate
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove separate-job artifact consumer rejects forged or overclaimed receipt
        run: node --test systemia/agent-continuity/detached-artifact-consumer.test.mjs
      - name: Download first-job provider-stored lab receipt
        uses: actions/download-artifact@v4
        with:
          name: blackbox-four-role-detached-verifier-lab
          path: /tmp/blackbox-cross-job-in
      - name: Verify cross-job same source and chain without private signer keys
        run: |
          set -euo pipefail
          node systemia/agent-continuity/detached-artifact-consumer.mjs /tmp/blackbox-cross-job-in/blackbox-detached-chain.json | tee /tmp/blackbox-cross-job-acceptance.json
          grep -q '"github_job_artifact_transfer_consumed": true' /tmp/blackbox-cross-job-acceptance.json
          grep -q '"independent_provisioned_identity_verified": false' /tmp/blackbox-cross-job-acceptance.json
          grep -q '"live_chum_spider_consumer_verified": false' /tmp/blackbox-cross-job-acceptance.json
      - name: Owner-pinned trust separation denial tests
        run: node --test systemia/agent-continuity/owner-trust-preflight.test.mjs
      - name: Prove lab signer keys are not owner-approved
        run: |
          set -euo pipefail
          env -u BLACKBOX_OWNER_TRUST_SHA256 -u BLACKBOX_OWNER_PUBLIC_TRUST_JSON \
            node systemia/agent-continuity/owner-trust-preflight-cli.mjs \
            /tmp/blackbox-cross-job-in/blackbox-detached-chain.json | tee /tmp/blackbox-owner-trust-held.json
          grep -q '"state": "HELD_OWNER_TRUST_FINGERPRINT_NOT_CONFIGURED"' /tmp/blackbox-owner-trust-held.json
          grep -q '"release_authorized": false' /tmp/blackbox-owner-trust-held.json
          grep -q '"independently_pinned_trust_verified": false' /tmp/blackbox-owner-trust-held.json
      - name: Archive held owner-trust gate
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-owner-trust-not-enrolled
          path: /tmp/blackbox-owner-trust-held.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve separate-runner acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-cross-job-readonly-acceptance
          path: /tmp/blackbox-cross-job-acceptance.json
          if-no-files-found: error
          retention-days: 14
