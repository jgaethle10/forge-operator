name: Personal Evercraft Home Owned Edge Canary

on:
  push:
    branches: [main]
    paths:
      - "systemia/evercraft-home/**"
      - "scripts/install-evercraft-home-edge.sh"
      - "scripts/update-fabric-owned-edge.sh"
      - ".github/workflows/evercraft-home-owned-edge-canary.yml"
  workflow_dispatch:
  schedule:
    - cron: "13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: evercraft-home-owned-edge-canary
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOME_ORIGIN: https://fabric.systemiacommandcenters.com/home
    steps:
      - uses: actions/checkout@v4

      - name: Verify Personal Home on the owned edge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          attempts=16
          n=1
          ok=false
          while [ "$n" -le "$attempts" ]; do
            health_code="$(curl -sS --max-time 20 -o /tmp/home-health.json -w '%{http_code}' "$HOME_ORIGIN/api/health" || true)"
            if [ "$health_code" = "200" ] && jq -e '
              .ok == true and
              .service == "evercraft-home" and
              .runtime == "Evercraft Compute" and
              .authority == "evercraft" and
              .auth_mode == "passport" and
              .base44_required == false and
              .external_ai_required == false and
              .identity_login_configured == true and
              (.source_release_ref | type == "string" and test("^[a-f0-9]{40}$")) and
              ((.owner_claim_available == true) or (.owner_bootstrapped == true))
            ' /tmp/home-health.json >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 20
            n=$((n + 1))
          done

          if [ "$ok" != "true" ]; then
            safe_health='{}'
            if jq -e 'type=="object"' /tmp/home-health.json >/dev/null 2>&1; then
              safe_health="$(jq -c '{
                service:(.service//null),
                runtime:(.runtime//null),
                authority:(.authority//null),
                auth_mode:(.auth_mode//null),
                instance_id:(.instance_id//null),
                source_release_ref:(.source_release_ref//null),
                owner_claim_available:(.owner_claim_available//null),
                owner_bootstrapped:(.owner_bootstrapped//null),
                base44_required:(.base44_required//null),
                external_ai_required:(.external_ai_required//null)
              }' /tmp/home-health.json)"
            fi
            jq -n \
              --arg origin "$HOME_ORIGIN" \
              --argjson attempts "$attempts" \
              --argjson sampled_health "$safe_health" \
              --arg observed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schema:"evercraft.home.owned-edge-canary.v1",verified:false,state:"deployment_not_observed",origin:$origin,attempts:$attempts,sampled_health:$sampled_health,secret_material_included:false,observed_at:$observed}' \
              > artifacts/evercraft-home-owned-edge-canary.json
            cat artifacts/evercraft-home-owned-edge-canary.json
            exit 1
          fi

          bootstrap="$(curl --fail --silent --show-error --max-time 20 "$HOME_ORIGIN/api/bootstrap-status")"
          printf '%s' "$bootstrap" | jq -e '
            .ok == true and
            (.state == "claim_required" or .state == "claimed") and
            .external_identity_provider_required == false and
            .secret_material_exposed == false
          ' >/dev/null

          session_code="$(curl --silent --show-error --max-time 20 -o /tmp/home-session.json -w '%{http_code}' "$HOME_ORIGIN/api/session")"
          test "$session_code" = "401"
          jq -e '.ok == false and .state == "session_required"' /tmp/home-session.json >/dev/null

          html="$(curl --fail --silent --show-error --max-time 20 "$HOME_ORIGIN/")"
          printf '%s' "$html" | grep -F 'Evercraft Private Access' >/dev/null
          printf '%s' "$html" | grep -F 'Personal command' >/dev/null
          printf '%s' "$html" | grep -F 'Use intelligence' >/dev/null

          owner_state="$(printf '%s' "$bootstrap" | jq -r '.state')"
          instance_id="$(jq -r '.instance_id' /tmp/home-health.json)"
          source_release_ref="$(jq -r '.source_release_ref' /tmp/home-health.json)"
          jq -n             --arg origin "$HOME_ORIGIN"             --arg instance "$instance_id"             --arg owner_state "$owner_state"             --arg source_release "$source_release_ref"             --arg observed "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '{
              schema:"evercraft.home.owned-edge-canary.v1",
              verified:true,
              state:"public_https_verified",
              origin:$origin,
              runtime:"Evercraft Compute",
              service:"evercraft-home",
              authority:"evercraft",
              auth_mode:"passport",
              instance_id:$instance,
              source_release_ref:$source_release,
              owner_state:$owner_state,
              anonymous_session_denied:true,
              owner_claim_or_login_ready:true,
              direct_mode_present:true,
              intelligence_selector_present:true,
              external_identity_provider_required:false,
              external_ai_required:false,
              base44_required:false,
              observed_at:$observed
            }' > artifacts/evercraft-home-owned-edge-canary.json

          cat artifacts/evercraft-home-owned-edge-canary.json

      - name: Promote verified Home observation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main advanced during verification; holding durable receipt for the next canary."
            exit 0
          fi

          mkdir -p conformance/runtime-observations
          cp artifacts/evercraft-home-owned-edge-canary.json             conformance/runtime-observations/evercraft-home-owned-edge-latest.json

          git add conformance/runtime-observations/evercraft-home-owned-edge-latest.json
          if git diff --cached --quiet; then
            echo "Durable Home observation already matches this verified state."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record verified Personal Evercraft Home edge"
          git push origin HEAD:main

      - name: Upload Personal Home edge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-home-owned-edge-canary
          path: artifacts/evercraft-home-owned-edge-canary.json
          if-no-files-found: warn
          retention-days: 90
