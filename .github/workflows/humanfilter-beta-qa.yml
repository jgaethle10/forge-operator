name: HumanFilter beta QA

on:
  push:
    branches: ["humanfilter/**", "humanfilter-beta-*"]
    paths:
      - "products/humanfilter/**"
      - ".github/workflows/humanfilter-beta-qa.yml"
  pull_request:
    paths:
      - "products/humanfilter/**"
      - ".github/workflows/humanfilter-beta-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Run deterministic rules
        working-directory: products/humanfilter
        run: |
          node --test tests/rules.test.cjs
          node tests/disclosure_benchmark.cjs
      - name: Cross-browser package manifest and integrity checks
        working-directory: products/humanfilter
        run: |
          python scripts/build_browser_packages.py --output-dir dist
          python -c "import zipfile,json,pathlib; r=pathlib.Path('dist'); z=zipfile.ZipFile(next(r.glob('*Firefox*.zip'))); m=json.loads(z.read('manifest.json')); assert m['browser_specific_settings']['gecko']['data_collection_permissions']['required']==['none']; assert m['manifest_version']==3; print('Firefox Gecko manifest and packaging valid')"
      - name: Browser isolation and regression suite
        working-directory: products/humanfilter
        run: |
          python tests/browser_smoke.py
          python tests/reveal_recycle.py
          python tests/feed_stress.py
          python tests/popup_smoke.py
      - name: Actual unpacked-extension injection on intercepted fixtures
        working-directory: products/humanfilter
        run: python tests/extension_e2e.py

      - name: Public social-site diagnostics (non-gating; no login)
        id: public_live
        continue-on-error: true
        working-directory: products/humanfilter
        run: python tests/public_site_diagnostic.py
      - name: Upload public-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanfilter-public-site-evidence
          path: products/humanfilter/public-site-evidence/
          if-no-files-found: warn
