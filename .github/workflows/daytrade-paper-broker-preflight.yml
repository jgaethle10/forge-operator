name: DayTrade PAPER Broker Preflight

on:
  pull_request:
    paths:
      - "systemia/daytrade-lens/paper-broker-preflight*"
      - ".github/workflows/daytrade-paper-broker-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test PAPER-only host and read-only safety boundaries
        run: node --test systemia/daytrade-lens/paper-broker-preflight.test.mjs
      - name: Verify existing credentials at PAPER broker host (read-only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
        run: node systemia/daytrade-lens/paper-broker-preflight.mjs
