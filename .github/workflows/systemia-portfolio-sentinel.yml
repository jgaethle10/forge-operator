name: Systemia Portfolio Sentinel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "systemia/organism/portfolio-sentinel**"
      - "systemia/sentinel/**"
      - "systemia/core/resident-services.json"
      - "systemia/collider/mission-sources.json"
      - "public/.well-known/evercraft-products.json"
      - "public/.well-known/evercraft-capabilities.json"
      - "package.json"
      - "Dockerfile"
      - "server.ts"
      - "systemia/chum/build-commercial-discovery-mesh.mjs"
      - "public/.well-known/evercraft-machine-catalog.json"
      - "tests/chum-live-intent-hunter.test.mjs"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "systemia/organism/portfolio-sentinel**"
      - "systemia/sentinel/**"
      - "systemia/core/resident-services.json"
      - "systemia/collider/mission-sources.json"
      - "package.json"
      - "Dockerfile"
      - "server.ts"
      - "systemia/chum/build-commercial-discovery-mesh.mjs"
      - "public/.well-known/evercraft-machine-catalog.json"
      - "tests/chum-live-intent-hunter.test.mjs"
      - ".github/workflows/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: systemia-portfolio-sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Sentinel state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/portfolio-sentinel/state.json
          key: portfolio-sentinel-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portfolio-sentinel-state-${{ runner.os }}-

      - name: Prove Sentinel contract
        run: node systemia/organism/portfolio-sentinel.proof.mjs

      - name: Prove architectural invariants and trigger modes
        run: npm run test:sentinel-invariants

      - name: Run live portfolio integrity cycle
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_SENTINEL_GITHUB_OWNER: jgaethle10
          PORTFOLIO_SENTINEL_AUTO_HEAL: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          PORTFOLIO_SENTINEL_ENFORCE_HEALTH: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: node systemia/organism/portfolio-sentinel-runner.mjs --max-urls 200

      - name: Save Sentinel state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/portfolio-sentinel/state.json
          key: portfolio-sentinel-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Sentinel receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-sentinel-receipts
          path: |
            artifacts/portfolio-sentinel/latest.json
            artifacts/portfolio-sentinel/mission-snapshot.json
            artifacts/portfolio-sentinel/repair-queue.json
            artifacts/portfolio-sentinel/inventory.json
            artifacts/portfolio-sentinel/admission.json
            artifacts/portfolio-sentinel/repair-memory.json
          if-no-files-found: error
          retention-days: 14

      - name: Write Sentinel summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Systemia Portfolio Sentinel"
            echo
            echo "Cadence: 5 minutes"
            echo "Coverage: products + all known canonical URLs (up to 200/cycle) + GitHub + workflows + Systemia resident services + machine discovery"
            echo "Bounded failed-workflow retry: autonomous for newly observed failures"
            echo "Architectural invariants: enforced before green"
            echo "Trigger modes: push + schedule + manual simulated from one shared policy"
            echo "Repair memory: learned failure fingerprints mapped to bounded recipes"
            echo "Health gate: critical/high findings fail closed until cleared"
            echo "Production mutation: human-gated"
            echo
            for FILE in artifacts/portfolio-sentinel/latest.json artifacts/portfolio-sentinel/repair-queue.json artifacts/portfolio-sentinel/repair-memory.json; do
              if [ -f "$FILE" ]; then
                echo "### $FILE"
                echo '~~~json'
                cat "$FILE"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
