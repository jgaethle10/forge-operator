name: Systemia Portfolio Sentinel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "systemia/organism/portfolio-sentinel**"
      - "systemia/organism/estate-convergence.mjs"
      - "systemia/saban/estate-inventory.snapshot.json"
      - "systemia/saban/estate-dispositions.json"
      - "systemia/sentinel/**"
      - "systemia/experience/**"
      - "systemia/saban/multiplication-registry.json"
      - "systemia/saban/capability-promotion.mjs"
      - "systemia/saban/capability-promotion-links.json"
      - "tests/capability-promotion.test.mjs"
      - "systemia/core/resident-services.json"
      - "systemia/core/**"
      - "systemia/collider/mission-sources.json"
      - "public/.well-known/evercraft-products.json"
      - "public/.well-known/evercraft-capabilities.json"
      - "package.json"
      - "Dockerfile"
      - "server.ts"
      - "systemia/chum/build-commercial-discovery-mesh.mjs"
      - "public/.well-known/evercraft-machine-catalog.json"
      - "registry/public-products.json"
      - "registry/**/server.json"
      - "mcp-registry/**"
      - "scripts/reconcile-public-mcp-registry.mjs"
      - "tests/chum-live-intent-hunter.test.mjs"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "systemia/organism/portfolio-sentinel**"
      - "systemia/organism/estate-convergence.mjs"
      - "systemia/saban/estate-inventory.snapshot.json"
      - "systemia/saban/estate-dispositions.json"
      - "systemia/sentinel/**"
      - "systemia/experience/**"
      - "systemia/saban/multiplication-registry.json"
      - "systemia/saban/capability-promotion.mjs"
      - "systemia/saban/capability-promotion-links.json"
      - "tests/capability-promotion.test.mjs"
      - "systemia/core/resident-services.json"
      - "systemia/core/**"
      - "systemia/collider/mission-sources.json"
      - "package.json"
      - "Dockerfile"
      - "server.ts"
      - "systemia/chum/build-commercial-discovery-mesh.mjs"
      - "public/.well-known/evercraft-machine-catalog.json"
      - "registry/public-products.json"
      - "registry/**/server.json"
      - "mcp-registry/**"
      - "scripts/reconcile-public-mcp-registry.mjs"
      - "tests/chum-live-intent-hunter.test.mjs"
      - ".github/workflows/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  # Keep the five-minute main/scheduled lane singleton, but never let it cancel
  # a pull-request proof that is validating a candidate quality-gate change.
  group: systemia-portfolio-sentinel-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Sentinel state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/portfolio-sentinel/state.json
          key: portfolio-sentinel-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portfolio-sentinel-state-${{ runner.os }}-

      - name: Prove Sentinel contract
        run: node systemia/organism/portfolio-sentinel.proof.mjs

      - name: Prove Journal freshness forcing function
        run: node --test systemia/organism/journal-freshness.test.mjs

      - name: Prove architectural invariants and trigger modes
        run: npm run test:sentinel-invariants

      - name: Prove human experience contracts
        run: node --test systemia/experience/human-experience-adapter.test.mjs

      - name: Prove autonomous Repair Unit
        run: node --test systemia/sentinel/repair-unit.test.mjs systemia/sentinel/repair-strategy.test.mjs

      - name: Restore latest owned Customer Gauntlet receipt
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TMP_DIR="$(mktemp -d)"
          RUN_ID="$(gh run list --workflow customer-gauntlet.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$RUN_ID" ]; then
            if gh run download "$RUN_ID" --name customer-gauntlet-receipts --dir "$TMP_DIR"; then
              RECEIPT="$(find "$TMP_DIR" -type f -name latest.json | head -n 1)"
              if [ -n "$RECEIPT" ]; then
                mkdir -p artifacts/customer-gauntlet
                cp "$RECEIPT" artifacts/customer-gauntlet/latest.json
              fi
            fi
          fi

      - name: Run Saban human experience swarm
        if: always()
        run: node systemia/saban/multiplier.mjs --software human-experience --auto --execute --reconcile --state artifacts/saban-multiplier/human-experience-state.json

      - name: Reconcile estate inventory layers
        if: always()
        run: node systemia/organism/estate-convergence.mjs

      - name: Prove capability-promotion policy
        if: always()
        run: node --test tests/capability-promotion.test.mjs

      - name: Build capability-promotion queue
        if: always()
        run: node systemia/saban/capability-promotion.mjs --out artifacts/capability-promotion/latest.json

      - name: Run live portfolio integrity cycle
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_SENTINEL_GITHUB_OWNER: jgaethle10
          PORTFOLIO_SENTINEL_AUTO_HEAL: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          PORTFOLIO_SENTINEL_ENFORCE_HEALTH: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          EVERCRAFT_JOURNAL_URL: https://evercraftjournal.base44.app/
        run: node systemia/organism/portfolio-sentinel-runner.mjs --max-urls 200

      - name: Save Sentinel state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/portfolio-sentinel/state.json
          key: portfolio-sentinel-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Sentinel receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-sentinel-receipts
          path: |
            artifacts/portfolio-sentinel/latest.json
            artifacts/portfolio-sentinel/mission-snapshot.json
            artifacts/portfolio-sentinel/repair-queue.json
            artifacts/portfolio-sentinel/inventory.json
            artifacts/portfolio-sentinel/estate-convergence.json
            artifacts/portfolio-sentinel/admission.json
            artifacts/portfolio-sentinel/repair-memory.json
            artifacts/portfolio-sentinel/repair-unit-state.json
            artifacts/portfolio-sentinel/repair-treatment-memory.json
            artifacts/human-experience/latest.json
            artifacts/saban-multiplier/human-experience-latest.json
            artifacts/customer-gauntlet/latest.json
            artifacts/capability-promotion/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Write Sentinel summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Systemia Portfolio Sentinel"
            echo
            echo "Cadence: 5 minutes"
            echo "Coverage: raw estate reconciliation + public products + conformance + MCP publication + all known canonical URLs (up to 200/cycle) + GitHub + workflows + Systemia resident services + machine discovery + capability-promotion queue"
            echo "Repair Unit: persistent bounded repair pressure until verified green or quarantined"
            echo "Failed-workflow retry: autonomous while incident remains active"
            echo "Architectural invariants: enforced before green"
            echo "Human experience gate: Saban fan-out + owned browser visual receipts; BLOCKED never equals PASS"
            echo "Trigger modes: push + schedule + manual simulated from one shared policy"
            echo "Repair memory: learned failure fingerprints mapped to bounded recipes"
            echo "Health gate: critical/high findings fail closed until cleared"
            echo "Journal freshness floor: checked every cycle; >24h warns and >36h becomes a blocking portfolio finding"
            echo "Production mutation: bounded recipes autonomous; high-blast-radius/identity/legal/payment mutations human-gated"
            echo
            for FILE in artifacts/portfolio-sentinel/latest.json artifacts/portfolio-sentinel/estate-convergence.json artifacts/portfolio-sentinel/repair-queue.json artifacts/portfolio-sentinel/repair-memory.json artifacts/human-experience/latest.json artifacts/capability-promotion/latest.json; do
              if [ -f "$FILE" ]; then
                echo "### $FILE"
                echo '~~~json'
                cat "$FILE"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
