name: Client 001 | On The Go Spanish Narration V36
on:
  push:
    branches: [feature/onthego-bella-native-voice-20261026]
    paths:
      - systemia/media-studio/on-the-go-v36-espanol.py
      - .github/workflows/otg-v36-espanol-voice.yml
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Spanish speech dependencies
        run: |
          timeout 75s sudo apt-get update -qq || echo 'Using cached metadata'
          DEBIAN_FRONTEND=noninteractive timeout 120s sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install 'kokoro==0.9.4' 'soundfile>=0.12,<1' 'misaki[es]'
      - name: Generate native Spanish takes with timing gates
        run: python systemia/media-studio/on-the-go-v36-espanol.py
      - name: Upload private voice assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client001-onthego-v36-spanish-native-voices
          path: onthego-v36-espanol-native/
          retention-days: 7
          if-no-files-found: warn
