name: Evercraft Remote Operator

on:
  pull_request:
    paths:
      - "systemia/compute/remote-operator.mjs"
      - "systemia/compute/chromeos-host-boundary-bridge.mjs"
      - "systemia/compute/chromeos-host-boundary-bridge.test.mjs"
      - "systemia/compute/chromeos-host-boundary-field-certify.mjs"
      - "systemia/compute/chromeos-host-boundary-field-certify.test.mjs"
      - "systemia/compute/host-boundary-capabilities.json"
      - "systemia/compute/host-boundary-registry.mjs"
      - "systemia/compute/host-boundary-registry.test.mjs"
      - "systemia/compute/host-boundary-admission.mjs"
      - "systemia/compute/host-boundary-admission.test.mjs"
      - "systemia/compute/chromeos-host-bridge/**"
      - "systemia/compute/install-chromeos-host-boundary-bridge-user.sh"
      - "systemia/compute/network-observer.mjs"
      - "systemia/compute/remote-operator.test.mjs"
      - "tests/network-observer-ingress-diagnosis.test.mjs"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/compute/node-seed.mjs"
      - "systemia/compute/local-organism.mjs"
      - "systemia/compute/install-local-organism-user.sh"
      - "systemia/compute/enable-remote-operator-user.sh"
      - "systemia/network/outbound-node-agent.mjs"
      - "systemia/network/outbound-capacity-broker.mjs"
      - "systemia/network/remote-operator.proof.mjs"
      - "systemia/network/REMOTE_OPERATOR.md"
      - "systemia/remote-operator/**"
      - "plugins/evercraft-remote-operator/**"
      - "server.ts"
      - ".github/workflows/evercraft-remote-operator.yml"
  push:
    branches: [main]
    paths:
      - "systemia/compute/remote-operator.mjs"
      - "systemia/compute/chromeos-host-boundary-bridge.mjs"
      - "systemia/compute/chromeos-host-boundary-bridge.test.mjs"
      - "systemia/compute/chromeos-host-boundary-field-certify.mjs"
      - "systemia/compute/chromeos-host-boundary-field-certify.test.mjs"
      - "systemia/compute/host-boundary-capabilities.json"
      - "systemia/compute/host-boundary-registry.mjs"
      - "systemia/compute/host-boundary-registry.test.mjs"
      - "systemia/compute/host-boundary-admission.mjs"
      - "systemia/compute/host-boundary-admission.test.mjs"
      - "systemia/compute/chromeos-host-bridge/**"
      - "systemia/compute/install-chromeos-host-boundary-bridge-user.sh"
      - "systemia/compute/network-observer.mjs"
      - "systemia/compute/remote-operator.test.mjs"
      - "tests/network-observer-ingress-diagnosis.test.mjs"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/compute/node-seed.mjs"
      - "systemia/compute/local-organism.mjs"
      - "systemia/compute/install-local-organism-user.sh"
      - "systemia/compute/enable-remote-operator-user.sh"
      - "systemia/network/outbound-node-agent.mjs"
      - "systemia/network/outbound-capacity-broker.mjs"
      - "systemia/network/remote-operator.proof.mjs"
      - "systemia/network/REMOTE_OPERATOR.md"
      - "systemia/remote-operator/**"
      - "plugins/evercraft-remote-operator/**"
      - "server.ts"
      - ".github/workflows/evercraft-remote-operator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove ChromeOS host boundary bridge
        run: node --test systemia/compute/host-boundary-registry.test.mjs systemia/compute/host-boundary-admission.test.mjs systemia/compute/chromeos-host-boundary-bridge.test.mjs systemia/compute/chromeos-host-boundary-field-certify.test.mjs systemia/compute/chromeos-host-bridge/tree-parser.test.mjs systemia/compute/chromeos-host-bridge/security-contract.test.mjs tests/network-observer-ingress-diagnosis.test.mjs
      - name: Prove operator core
        run: node systemia/compute/remote-operator.test.mjs
      - name: Prove outbound remote operator
        run: node systemia/network/remote-operator.proof.mjs
      - name: Prove MCP gateway boundary
        run: node systemia/remote-operator/mcp-gateway.test.mjs
      - name: Prove Chromebook edge resident wiring
        run: node --test tests/fabric-owned-edge-installer.test.mjs
      - name: Typecheck Forge integration
        run: npm install --no-audit --no-fund && npm run lint
