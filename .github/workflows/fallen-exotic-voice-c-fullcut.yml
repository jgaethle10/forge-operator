name: Fallen Exotic Chiles Voice C Original Accent-Locked Full-Cut
on:
  push:
    branches: [production/fallen-original-mature-narrator-audition-20261124]
    paths:
      - '.github/workflows/fallen-exotic-voice-c-fullcut.yml'
      - 'systemia/media-studio/voice-foundry/exotic-voice-c-fullcut.py'
permissions: {contents: read, actions: read}
jobs:
  original-c-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source script and pinned synthetic reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('systemia/media-studio/voice-foundry/exotic-voice-c-fullcut.py')
          t=p.read_text()
          assert '2cf3c6039bd4cd5dc7b1ed492820469c58df4d804f84d09b99664081abb26b97' in t
          assert 'customerSendApproved=False' in t
          print('PASS: synthetic C-only voice lock and no customer send policy')
          PY
      - name: Install Qwen Base voice-reference runtime
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub soundfile numpy
          curl -fLsS --retry 3 'https://github.com/CrispStrobe/CrispASR/releases/latest/download/crispasr-linux-x86_64.tar.gz' -o /tmp/crispasr.tar.gz
          mkdir -p /tmp/crispasr-dist /tmp/voice-model
          tar -xzf /tmp/crispasr.tar.gz -C /tmp/crispasr-dist
          BIN="$(find /tmp/crispasr-dist -type f -name crispasr | head -n 1)"
          test -n "$BIN"
          install -m 755 "$BIN" /tmp/crispasr_voice
          LIB_DIRS="$(find /tmp/crispasr-dist -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd ':' -)"
          printf 'LD_LIBRARY_PATH=%s\n' "$LIB_DIRS" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$LIB_DIRS" ldd /tmp/crispasr_voice | tee /tmp/crispasr-deps.txt
          ! grep -q 'not found' /tmp/crispasr-deps.txt
          hf download cstr/qwen3-tts-1.7b-base-GGUF qwen3-tts-12hz-1.7b-base-q8_0.gguf --local-dir /tmp/voice-model
          hf download cstr/qwen3-tts-tokenizer-12hz-GGUF qwen3-tts-tokenizer-12hz.gguf --local-dir /tmp/voice-model
      - name: Retrieve exact original synthetic C reference privately from prior run
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -euo pipefail
          mkdir -p /tmp/synthetic-original-C
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14963005488/zip" \
            -o /tmp/original-C.zip
          unzip -q /tmp/original-C.zip '03_english_cloned_from_spanish_anchor.wav' -d /tmp/synthetic-original-C
          echo "SYNTHETIC_ORIGINAL_VOICE_REFERENCE=/tmp/synthetic-original-C/03_english_cloned_from_spanish_anchor.wav" >> "$GITHUB_ENV"
      - name: Generate all four original voice C commercial cues
        env: { OMP_NUM_THREADS: '4' }
        run: python systemia/media-studio/voice-foundry/exotic-voice-c-fullcut.py
      - name: Verify 4 WAVs and no public/customer release authorization
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,wave
          root=Path('original-C-accent-locked-fullcut')
          d=json.loads((root/'receipt.json').read_text())
          assert len(d['cues'])==4
          assert d['voiceOrigin']=='original synthetic bilingual C voice'
          assert not d['humanListeningApproved'] and not d['customerSendApproved']
          for row in d['cues']:
            f=root/row['file']
            with wave.open(str(f),'rb') as w:assert w.getnframes()>0 and w.getframerate()>=16000
            assert hashlib.sha256(f.read_bytes()).hexdigest()==row['sha256']
          print('PASS: 4 source-verified natural-language C voice WAVs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exotic-chiles-original-C-fullcut-narration-private
          path: original-C-accent-locked-fullcut/
          retention-days: 3
          if-no-files-found: error
