name: Fallen evidence-chapter film
on:
  pull_request:
    paths:
      - 'systemia/media-studio/evidence-chapters.mjs'
      - 'systemia/media-studio/evidence-chapters.test.mjs'
      - 'systemia/media-studio/director-storyboard.mjs'
      - '.github/workflows/fallen-evidence-chapters.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verified-gpu-scene-to-educational-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Node source and native video/font dependencies
        run: |
          node --check systemia/media-studio/evidence-chapters.mjs
          node --check systemia/media-studio/director-storyboard.mjs
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core)
      - uses: actions/download-artifact@v4
        with:
          run-id: 39449612562
          name: world-director-hero_full-wide
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/world-originals/hero
      - uses: actions/download-artifact@v4
        with:
          run-id: 39449612562
          name: world-director-detail_closeup-square
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/world-originals/detail
      - uses: actions/download-artifact@v4
        with:
          run-id: 39449612562
          name: world-director-title_safe-vertical
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/world-originals/title
      - name: Write evidence-state typed and exact-frame 15-second editing plan
        env:
          ROOT: ${{ runner.temp }}/world-originals
          REQUEST: ${{ runner.temp }}/five-chapter-story.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root=process.env.ROOT;
          const digest=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const sources=[
            ['hero','hero_full'],['detail','detail_closeup'],['title','title_safe']
          ];
          const shots=sources.map(([dir,intent])=>{
            const file=path.join(root,dir,'battleship-world-engine-trial.mp4');
            const receiptPath=path.join(root,dir,'receipt.json');
            if(!fs.existsSync(file)||!fs.existsSync(receiptPath))throw Error('missing_original_gpu_file_'+dir);
            const receipt=JSON.parse(fs.readFileSync(receiptPath,'utf8'));
            if(receipt.output.sha256!==digest(file))throw Error('signed_gpu_receipt_mismatch_'+dir);
            return {intent,path:file,receiptPath,sha256:digest(file),title:'OWNED '+intent.toUpperCase()+' SHOT'};
          });
          const chapters=[
            {id:'establish_hull',intent:'hero_full',inFrame:0,frames:78,
              title:'THE MODEL BEGINS WITH FORM',
              note:'A polygon hull staged in a real 3D world'},
            {id:'turret_detail',intent:'detail_closeup',inFrame:0,frames:78,
              title:'PARTS FORM THE SILHOUETTE',
              note:'Armored turret and paired modeled barrels'},
            {id:'moving_camera',intent:'hero_full',inFrame:18,frames:78,
              title:'CAMERA CREATES PERSPECTIVE',
              note:'Original 3D projection matrices in motion'},
            {id:'lighting_detail',intent:'detail_closeup',inFrame:18,frames:78,
              title:'LIGHT SHAPES THE SURFACE',
              note:'Modeled depth shadows and synthetic materials'},
            {id:'space_to_teach',intent:'title_safe',inFrame:8,frames:84,
              title:'FRAME SPACE TO EXPLAIN',
              note:'A camera composition reserves caption space'}
          ].map(x=>({...x,evidenceState:'synthetic_visualization'}));
          const req={
            schema:'evercraft.fallen.evidence-chapters-request.v1',
            id:'world-engine-chapter-film-001',
            productionIntent:'educational_internal',audioPolicy:'silent',
            shots,chapters,transitionFrames:9
          };
          fs.writeFileSync(process.env.REQUEST,JSON.stringify(req,null,2));
          console.log('SIGNED_ORIGINAL_SHOTS',shots.map(x=>({intent:x.intent,sha256:x.sha256})));
          NODE
      - name: Test historical-fidelity refusal and generate actual GPU sourced 15s film
        env:
          FALLEN_CHAPTERS_REAL_SOURCE_REQUEST: ${{ runner.temp }}/five-chapter-story.json
        run: node --test systemia/media-studio/evidence-chapters.test.mjs
      - name: Produce canonical verified 15s film from original three World Engine source MP4s
        env:
          REQUEST: ${{ runner.temp }}/five-chapter-story.json
          OUTPUT: ${{ runner.temp }}/world-engine-15s-study
        run: |
          node systemia/media-studio/evidence-chapters.mjs "$REQUEST" "$OUTPUT"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,nb_frames -show_entries format=duration -of json "$OUTPUT/evercraft-evidence-chapters.mp4"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const d=JSON.parse(fs.readFileSync(process.env.OUTPUT+'/receipt.json'));
          const movie=fs.readFileSync(process.env.OUTPUT+'/'+d.output.file);
          if(d.output.frames!==360||d.output.durationSec!==15||d.output.audioPresent!==false||
             d.sourceProofs.length!==3||d.chapters.length!==5||
             d.protections.releaseApproval!==false||
             d.status!=='INTERNAL_REVIEW_ONLY'||
             crypto.createHash('sha256').update(movie).digest('hex')!==d.output.sha256)
             throw Error('chapter_film_contract_failed');
          console.log('ORIGINAL_WORLD_ENGINE_FIVE_CHAPTER_FILM_ACCEPTED',{
            frames:d.output.frames,sha256:d.output.sha256,chapters:d.chapters.map(x=>x.id)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fallen-original-gpu-fifteen-second-chapters
          path: |
            ${{ runner.temp }}/world-engine-15s-study/evercraft-evidence-chapters.mp4
            ${{ runner.temp }}/world-engine-15s-study/receipt.json
            ${{ runner.temp }}/world-engine-15s-study/chapter-*.png
          retention-days: 7
          if-no-files-found: error
