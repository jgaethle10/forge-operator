name: The Last Light V9 Orchestral Conductor Score Gates
on:
  pull_request:
    paths:
      - 'systemia/media-studio/last-light-v9-conductor.py'
      - 'systemia/media-studio/last-light-v9-conductor-score.json'
      - 'systemia/media-studio/test_last_light_v9_conductor.py'
      - 'systemia/media-studio/LAST-LIGHT-V9-CONDUCTOR.md'
      - '.github/workflows/last-light-v9-conductor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score-only-conductor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small independent MIDI parser for the roundtrip gate
        run: python -m pip install --disable-pip-version-check 'mido==1.3.3'
      - name: Eleven score, source-boundary and MIDI roundtrip tests
        run: python -m unittest discover -v -s systemia/media-studio -p 'test_last_light_v9_conductor.py'
      - name: Build orchestral rehearsal MIDI with source holds
        run: |
          python systemia/media-studio/last-light-v9-conductor.py \
            --score systemia/media-studio/last-light-v9-conductor-score.json \
            --out /tmp/last-light-v9
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('/tmp/last-light-v9')
          r=json.loads((p/'conductor-provenance.json').read_text())
          assert r['sections']==14 and r['note_events']==47
          assert r['audio_orchestra_rendered'] is False
          assert r['piano_audio_present'] is False
          midi=p/'The_Last_Light_V9_UNAPPROVED_Orchestral_Conductor.mid'
          assert hashlib.sha256(midi.read_bytes()).hexdigest()==r['rehearsal_midi_sha256']
          print('V9 PASS: 14 editable section scores, no synthesized or approved audio claimed')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unapproved-last-light-v9-ensemble-rehearsal-score
          path: /tmp/last-light-v9/
          retention-days: 14
