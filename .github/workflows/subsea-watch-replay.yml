name: Subsea Watch replay prototype
on:
  push:
    branches: [main]
    paths:
      - 'public/subsea-watch/**'
      - 'tests/subsea-watch-replay.test.mjs'
      - 'tests/subsea-watch-immersive.test.mjs'
      - 'tests/subsea-watch-video-sync.test.mjs'
      - 'tests/subsea-watch-field-archive.test.mjs'
      - 'scripts/probe-subsea-watch-public.mjs'
      - '.github/workflows/subsea-watch-replay.yml'
  pull_request:
    paths:
      - 'public/subsea-watch/**'
      - 'tests/subsea-watch-replay.test.mjs'
      - 'tests/subsea-watch-immersive.test.mjs'
      - 'tests/subsea-watch-video-sync.test.mjs'
      - 'tests/subsea-watch-field-archive.test.mjs'
      - 'scripts/probe-subsea-watch-public.mjs'
      - '.github/workflows/subsea-watch-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dive log evidence and no fabricated tracking
        run: node --test tests/subsea-watch-replay.test.mjs tests/subsea-watch-immersive.test.mjs tests/subsea-watch-video-sync.test.mjs tests/subsea-watch-field-archive.test.mjs
      - name: Validate browser modules
        run: |
          node --check public/subsea-watch/core.mjs
          node --check public/subsea-watch/viewer.mjs
          node --check public/subsea-watch/immersive/scene.mjs
          node --check public/subsea-watch/immersive/video-sync.mjs
          node --check public/subsea-watch/field-archive/catalog.mjs
      - name: Inspect owned static page
        run: |
          test -s public/subsea-watch/index.html
          test -s public/subsea-watch/immersive/index.html
          test -s public/subsea-watch/sample.json
          test -s public/subsea-watch/field-archive/index.html
          test -s public/subsea-watch/field-archive/sources.json
          grep -q "Prototype, not a safety device" public/subsea-watch/index.html

      - name: Capture immersive WebGL browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "CHROME_NOT_INSTALLED: source and syntax checks only" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p artifacts/subsea
          (cd public && python3 -m http.server 18765 --bind 127.0.0.1 >/tmp/subsea-http.log 2>&1) &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --virtual-time-budget=6000 --window-size=1280,850 --screenshot=artifacts/subsea/immersive-desktop.png 'http://127.0.0.1:18765/subsea-watch/immersive/' >/tmp/subsea-chrome-screenshot.log 2>&1
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:18765/subsea-watch/immersive/' >/tmp/subsea-dom.html 2>/tmp/subsea-chrome-dom.log
          grep -q 'data-subsea-sample="synthetic-loaded"' /tmp/subsea-dom.html
          grep -q 'data-subsea-renderer="webgl-drawn"' /tmp/subsea-dom.html
          test -s artifacts/subsea/immersive-desktop.png
          echo "IMMERSIVE_WEBGL_BROWSER_SMOKE_PASS: actual synthetic sample + WebGL draw" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve immersive screenshot when present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsea-immersive-browser-smoke
          path: artifacts/subsea/immersive-desktop.png
          if-no-files-found: ignore
          retention-days: 10
