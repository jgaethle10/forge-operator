name: Community Radio Offline Safety
on:
  pull_request:
    paths:
      - 'systemia/network/community-broadcast-continuity.mjs'
      - 'systemia/network/community-radio-offline-portal.mjs'
      - 'tests/community-broadcast-continuity.test.mjs'
      - 'tests/community-radio-offline-portal.test.mjs'
      - 'tests/community-radio-lan-lab.test.mjs'
      - 'systemia/network/community-radio-lan-lab.mjs'
      - 'systemia/network/community-radio-clock-guard.mjs'
      - 'systemia/network/community-radio-field-evidence.mjs'
      - 'systemia/network/community-radio-second-device-probe.mjs'
      - 'systemia/saban/community-radio-preflight-adapter.mjs'
      - 'systemia/saban/multiplication-registry.json'
      - 'systemia/saban/fixtures/community-radio-preflight.json'
      - 'tests/saban-community-radio-preflight.test.mjs'
      - 'scripts/community-radio-second-device-probe.mjs'
      - 'tests/community-radio-second-device-probe.test.mjs'
      - 'tests/community-radio-clock-guard.test.mjs'
      - 'tests/community-radio-field-evidence.test.mjs'
      - 'scripts/community-radio-review-field-receipt.mjs'
      - 'systemia/network/fixtures/community-radio-field-attestation-template.json'
      - 'scripts/community-radio-offline-demo.mjs'
      - 'systemia/network/COMMUNITY-RADIO-LOCAL-PORTAL.md'
      - '.github/workflows/community-radio-offline-safety.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/network/community-broadcast-continuity.mjs'
      - 'systemia/network/community-radio-offline-portal.mjs'
      - 'tests/community-broadcast-continuity.test.mjs'
      - 'tests/community-radio-offline-portal.test.mjs'
      - 'tests/community-radio-lan-lab.test.mjs'
      - 'systemia/network/community-radio-lan-lab.mjs'
      - 'systemia/network/community-radio-clock-guard.mjs'
      - 'systemia/network/community-radio-field-evidence.mjs'
      - 'systemia/network/community-radio-second-device-probe.mjs'
      - 'systemia/saban/community-radio-preflight-adapter.mjs'
      - 'systemia/saban/multiplication-registry.json'
      - 'systemia/saban/fixtures/community-radio-preflight.json'
      - 'tests/saban-community-radio-preflight.test.mjs'
      - 'scripts/community-radio-second-device-probe.mjs'
      - 'tests/community-radio-second-device-probe.test.mjs'
      - 'tests/community-radio-clock-guard.test.mjs'
      - 'tests/community-radio-field-evidence.test.mjs'
      - 'scripts/community-radio-review-field-receipt.mjs'
      - 'systemia/network/fixtures/community-radio-field-attestation-template.json'
      - 'scripts/community-radio-offline-demo.mjs'
      - '.github/workflows/community-radio-offline-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-only-security:
    name: Local offline radio proof
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify only non-actuating local radio control code
        run: |
          node --check systemia/network/community-broadcast-continuity.mjs
          node --check systemia/network/community-radio-offline-portal.mjs
          node --check scripts/community-radio-offline-demo.mjs
          node --check systemia/network/community-radio-lan-lab.mjs
          node --check systemia/network/community-radio-clock-guard.mjs
          node --check systemia/network/community-radio-field-evidence.mjs
          node --check scripts/community-radio-review-field-receipt.mjs
          node --check systemia/network/community-radio-second-device-probe.mjs
          node --check scripts/community-radio-second-device-probe.mjs
          node --check systemia/saban/community-radio-preflight-adapter.mjs
          node --test tests/community-broadcast-continuity.test.mjs tests/community-radio-offline-portal.test.mjs tests/community-radio-lan-lab.test.mjs tests/community-radio-clock-guard.test.mjs tests/community-radio-field-evidence.test.mjs tests/community-radio-second-device-probe.test.mjs tests/saban-community-radio-preflight.test.mjs
      - name: Execute the registered four-role Saban preflight (no device access)
        run: |
          node systemia/saban/multiplier.mjs --software community-radio-preflight --agents 4 --workers 2 --fixed --execute --reconcile
          node --input-type=module -e "
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/saban-multiplier/community-radio-preflight-latest.json','utf8'));
          assert.equal(r.software_id,'community-radio-preflight');
          assert.equal(r.logical_agents,4);
          assert.equal(r.physical_workers,2);
          assert.equal(r.quality.status,'pass');
          assert.equal(r.reconciliation.status,'reconciled');
          assert.equal(r.reconciliation.mission_state,'held_pending_authorized_physical_test');
          assert.equal(r.reconciliation.physical_two_device_test_completed,false);
          assert.equal(r.reconciliation.actual_node_access_confirmed,false);
          assert.equal(r.reconciliation.side_effects_executed,0);
          console.log(JSON.stringify({schema:'evercraft.saban.community-radio-ci-check.v1', software_id:r.software_id,quality:r.quality.status, review:r.reconciliation.mission_state, physical_test:false,hardware_control:false,receipt_path:'artifacts/saban-multiplier/community-radio-preflight-latest.json'}));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: saban-radio-synthetic-preflight-receipt
          path: artifacts/saban-multiplier/community-radio-preflight-latest.json
          retention-days: 7
          if-no-files-found: error
