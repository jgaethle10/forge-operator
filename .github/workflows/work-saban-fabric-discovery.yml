name: Work Saban Fabric discovery canary
on:
  pull_request:
    paths:
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/fabric-catalog-supplements.json'
      - 'tests/work-saban-fabric-discovery.test.mjs'
      - '.github/workflows/work-saban-fabric-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/fabric-catalog-supplements.json'
      - 'tests/work-saban-fabric-discovery.test.mjs'
      - '.github/workflows/work-saban-fabric-discovery.yml'
permissions:
  contents: read
jobs:
  truthful-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Work Saban actual matching and no paid routing
        run: node --test tests/work-saban-fabric-discovery.test.mjs
