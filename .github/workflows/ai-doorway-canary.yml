name: AI doorway canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "conformance/**"
      - "registry/**"
      - "public/.well-known/**"
      - "public/robots.txt"
      - "public/llms.txt"
      - "systemia/chum/**"
      - "scripts/check-ai-doorways.mjs"
      - "package.json"
      - ".github/workflows/ai-doorway-canary.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ai-doorway-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate conformance registry
        run: node scripts/validate-ai-conformance.mjs

      - name: Probe public AI doorways
        run: node scripts/check-ai-doorways.mjs

      - name: Run CHUM signal mesh
        run: node systemia/chum/chum.mjs

      - name: Audit crawler and AI-search reachability
        run: node systemia/chum/crawler-audit.mjs

      - name: Probe MCP and Official Registry
        run: node systemia/chum/mcp-canary.mjs

      - name: Announce changed public discovery surfaces
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node systemia/chum/indexnow.mjs

      - name: Upload AI distribution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-distribution-receipts
          path: |
            artifacts/ai-doorway-canary.*
            artifacts/chum/chum-latest.*
            artifacts/chum/crawler-audit-latest.*
            artifacts/chum/mcp-canary-latest.*
          if-no-files-found: warn
