name: AI doorway canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-doorway-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate conformance registry
        run: node scripts/validate-ai-conformance.mjs

      - name: Probe public AI doorways
        run: node scripts/check-ai-doorways.mjs

      - name: Run CHUM signal mesh
        run: node systemia/chum/chum.mjs

      - name: Upload AI distribution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-distribution-receipts
          path: |
            artifacts/ai-doorway-canary.*
            artifacts/chum/chum-latest.*
          if-no-files-found: warn
