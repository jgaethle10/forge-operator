name: Saban Counteroffer Fabric

on:
  pull_request:
    paths:
      - 'systemia/saban/negotiation-protocol.mjs'
      - 'systemia/saban/markets/golem.mjs'
      - 'systemia/saban/counteroffer-fabric.proof.mjs'
      - '.github/workflows/saban-counteroffer-fabric.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/saban/negotiation-protocol.mjs'
      - 'systemia/saban/markets/golem.mjs'
      - 'systemia/saban/counteroffer-fabric.proof.mjs'
      - '.github/workflows/saban-counteroffer-fabric.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove proposal counterproposal agreement flow
        run: node systemia/saban/counteroffer-fabric.proof.mjs
