name: Public repo secret guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove secret guard behavior
        run: node systemia/security/public-repo-secret-guard.test.mjs
      - name: Scan every tracked text file
        run: node systemia/security/public-repo-secret-guard.mjs
