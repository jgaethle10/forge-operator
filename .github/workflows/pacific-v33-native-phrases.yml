name: Pacific V33 Founder Natural Phrasing Private
on:
  push:
    branches: [studio/pacific-v33-founder-natural-phrasing-20261123]
    paths:
      - systemia/media-studio/pacific-v33-native-phrases.py
      - .github/workflows/pacific-v33-native-phrases.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install original native Bella
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Generate real native Bella phrase auditions
        env: {HF_HUB_DISABLE_TELEMETRY: "1"}
        run: python systemia/media-studio/pacific-v33-native-phrases.py
      - name: Check phrase integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import wave,hashlib,json
          out=Path('pacific-v33-native-phrases')
          r=json.loads((out/'receipt.json').read_text())
          assert len(r['takes'])==4 and r['voice']=='af_bella'
          for t in r['takes']:
            f=out/t['file']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==t['sha256']
            with wave.open(str(f),'rb') as w:
              assert w.getframerate()==24000 and w.getnchannels()==1
              assert .5 < w.getnframes()/24000 < 5
          print('All four native Bella phrases verified, review only.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-v33-native-bella-phrases-private
          path: pacific-v33-native-phrases/
          retention-days: 7
          if-no-files-found: error
