name: Pacific ES Independent Spanish Speech QA
on:
  push:
    branches: [studio/pacific-es-v1-native-voice-20261124]
    paths:
      - systemia/media-studio/pacific-es-v1-asr.py
      - .github/workflows/pacific-es-v1-asr.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Fetch only owned generated Spanish voice files, no customer footage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45423746771 --repo jgaethle10/forge-operator -n pacific-es-v1-native-private -D pacific-es-native-voice-private
      - name: Install Spanish speech verifier
        run: python -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'numpy<3' 'soundfile>=0.12,<1.0'
      - name: Recognize full Spanish voice track with offline ASR
        env: {HF_HUB_DISABLE_TELEMETRY: "1"}
        run: python systemia/media-studio/pacific-es-v1-asr.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-es-v1-asr-audit-private
          path: pacific-es-asr-audit/transcript_report.json
          retention-days: 7
          if-no-files-found: error
