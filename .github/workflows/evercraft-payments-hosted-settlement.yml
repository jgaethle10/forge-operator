name: Evercraft Payments Hosted Settlement Bridge

on:
  pull_request:
    paths:
      - 'systemia/payments/hosted-link-settlement-bridge.mjs'
      - 'systemia/raven/stripe-hosted-receipt-reader.mjs'
      - 'scripts/evercraft-payments-hosted-import.mjs'
      - 'tests/hosted-link-settlement-bridge.test.mjs'
      - 'tests/stripe-hosted-receipt-reader.test.mjs'
      - '.github/workflows/evercraft-payments-hosted-settlement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof-no-provider-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact hosted Stripe settlement import and fail closed
        run: node --test tests/hosted-link-settlement-bridge.test.mjs tests/stripe-hosted-receipt-reader.test.mjs
      - name: Verify CLI is inert with no flags or Stripe credentials
        run: node scripts/evercraft-payments-hosted-import.mjs
