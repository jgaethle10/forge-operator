name: Mossmere Heartbeat From Proven Schedule

on:
  push:
    branches:
      - feature/window-upstream-heartbeat-20261019
    paths:
      - '.github/workflows/window-upstream-heartbeat.yml'
  workflow_run:
    workflows:
      - CHUM crawl pressure
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: window-independent-heartbeat
  cancel-in-progress: false

jobs:
  isolated-preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/window-heartbeat.test.mjs
  scheduled-mossmere:
    permissions:
      contents: write
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout verified default-branch source, never upstream workflow artifact
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded society behavior
        run: |
          node --check systemia/society/window-heartbeat.mjs
          node --check systemia/society/window-social.mjs
          node --test tests/window-heartbeat.test.mjs
      - name: Advance only isolated canonical world-state branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node systemia/society/window-heartbeat.mjs
