name: Lineage Public Fabric Canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/.well-known/evercraft-products.json'
      - 'public/.well-known/evercraft-machine-catalog.json'
      - 'public/chum/capabilities.json'
      - 'public/chum/capabilities/lineage-founding-pilot-v1/**'
      - 'public/lineage/**'
      - 'commercial/LINEAGE.md'
      - 'commercial/lineage-offer-2026-10-07.json'
      - 'systemia/lineage/commercial-contract.test.mjs'
      - '.github/workflows/lineage-public-fabric-canary.yml'
      - 'scripts/lineage-public-contract.jq'
      - 'tests/lineage-canary-jq-contract.test.mjs'
  push:
    branches: [main]
    paths:
      - 'public/.well-known/evercraft-products.json'
      - 'public/.well-known/evercraft-machine-catalog.json'
      - 'public/chum/capabilities.json'
      - 'public/chum/capabilities/lineage-founding-pilot-v1/**'
      - 'public/lineage/**'
      - 'commercial/LINEAGE.md'
      - 'commercial/lineage-offer-2026-10-07.json'
      - 'systemia/lineage/commercial-contract.test.mjs'
      - '.github/workflows/lineage-public-fabric-canary.yml'
      - 'scripts/lineage-public-contract.jq'
      - 'tests/lineage-canary-jq-contract.test.mjs'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: lineage-public-fabric-canary
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FABRIC_ORIGIN: https://fabric.systemiacommandcenters.com
      PUBLIC_ID: lineage-founding-pilot-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Lineage commercial source contract
        run: node --test systemia/lineage/commercial-contract.test.mjs

      - name: Prove jq authority predicate on positive and adversarial fixtures
        run: node --test tests/lineage-canary-jq-contract.test.mjs

      - name: Verify Lineage public Fabric door
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          health="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$FABRIC_ORIGIN/health")"
          printf 'LINEAGE_FABRIC_HEALTH=%s\n' "$(printf '%s' "$health" | jq -c '{ok,service,runtime,read_only,transactional,external_action_authority,payment_authority,payment_router,capability_count}')"
          printf '%s' "$health" | jq -e '
            .ok == true and
            .service == "evercraft-fabric-local" and
            .read_only == true and
            .transactional == false and
            .external_action_authority == false and
            .payment_authority == "Evercraft Payments" and
            .payment_router == "Raven Nexus" and
            .capability_count >= 52
          ' >/dev/null
          printf '%s\n' "$health" > /tmp/lineage-fabric-health.json
          echo "LINEAGE_CANARY_HEALTH_OK"

          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"lineage-public-canary","version":"1"}}}'
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 \
            -H 'content-type: application/json' --data "$init" "$FABRIC_ORIGIN/mcp" \
            | jq -e '.result.serverInfo.name == "evercraft-fabric"' >/dev/null
          echo "LINEAGE_CANARY_MCP_INIT_OK"

          match='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"match_evercraft_capability","arguments":{"intent":"Our coding agents keep overwriting each other. We need collision-safe history, agent provenance, rationale, rollback and GitHub to remain a mirror.","limit":5}}}'
          result="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 25 \
            -H 'content-type: application/json' --data "$match" "$FABRIC_ORIGIN/mcp")"
          printf '%s\n' "$result" > /tmp/lineage-fabric-match.json
          printf 'LINEAGE_MATCH_IDS=%s\n' "$(printf '%s' "$result" | jq -c '[.result.structuredContent.matches[].public_id]')"
          printf '%s' "$result" | jq -e --arg id "$PUBLIC_ID" '
            .result.isError == false and
            .result.structuredContent.transactional == false and
            .result.structuredContent.external_action_taken == false and
            ([.result.structuredContent.matches[].public_id] | index($id)) != null
          ' >/dev/null
          echo "LINEAGE_CANARY_MATCH_OK"

          options='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_evercraft_connection_options","arguments":{"public_id":"lineage-founding-pilot-v1"}}}'
          connection="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 25 \
            -H 'content-type: application/json' --data "$options" "$FABRIC_ORIGIN/mcp")"
          printf '%s' "$connection" | jq -e --arg id "$PUBLIC_ID" '
            .result.isError == false and
            .result.structuredContent.public_id == $id and
            .result.structuredContent.external_action_taken == false
          ' >/dev/null
          printf '%s\n' "$connection" > /tmp/lineage-fabric-connections.json
          echo "LINEAGE_CANARY_CONNECTIONS_OK"

          page_url="$FABRIC_ORIGIN/capabilities/$PUBLIC_ID"
          page=""
          ready=false
          for attempt in $(seq 1 12); do
            page="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 25 "$page_url" 2>/dev/null || true)"
            if printf '%s' "$page" | grep -Fq 'Evercraft Lineage Founding Pilot' \
              && printf '%s' "$page" | grep -Fq '$500' \
              && ! printf '%s' "$page" | grep -Fiq 'base44.app' \
              && ! printf '%s' "$page" | grep -Fiq 'buy.stripe.com' \
              && ! printf '%s' "$page" | grep -Fq 'Continue to checkout'; then
              ready=true
              break
            fi
            [ "$attempt" -lt 12 ] && sleep 20
          done
          if [ "$ready" != "true" ]; then
            echo "Lineage public Fabric page did not converge to the bounded founding-pilot contract." >&2
            exit 1
          fi
          printf '%s\n' "$page" > /tmp/lineage-public-page.html

          raw_base="https://raw.githubusercontent.com/jgaethle10/forge-operator/main/public/chum/capabilities/$PUBLIC_ID"
          capability="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 25 "$raw_base/capability.json")"
          printf '%s' "$capability" | jq -e --arg url "$page_url" -f scripts/lineage-public-contract.jq >/dev/null
          printf '%s\n' "$capability" > /tmp/lineage-capability.json

          llms="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 25 "$raw_base/llms.txt")"
          printf '%s' "$llms" | grep -Fq 'Lineage Founding Pilot'
          printf '%s' "$llms" | grep -Fq '$500'
          printf '%s' "$llms" | grep -Fq 'GitHub'
          printf '%s\n' "$llms" > /tmp/lineage-llms.txt

      - name: Write external receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/lineage-fabric-health.json','utf8'));
          const match=JSON.parse(fs.readFileSync('/tmp/lineage-fabric-match.json','utf8'));
          const connections=JSON.parse(fs.readFileSync('/tmp/lineage-fabric-connections.json','utf8'));
          const capability=JSON.parse(fs.readFileSync('/tmp/lineage-capability.json','utf8'));
          const row=(match.result?.structuredContent?.matches||[]).find(x=>x.public_id==='lineage-founding-pilot-v1');
          const receipt={
            schema:'evercraft.lineage.public-fabric-canary.v1',
            verified:true,
            origin:process.env.FABRIC_ORIGIN,
            public_id:'lineage-founding-pilot-v1',
            public_page_url:process.env.FABRIC_ORIGIN+'/capabilities/lineage-founding-pilot-v1',
            health_service:health.service,
            capability_count:health.capability_count ?? null,
            match_verified:Boolean(row),
            match_score:row?.match_score ?? null,
            connection_options_verified:connections.result?.structuredContent?.public_id==='lineage-founding-pilot-v1',
            public_page_verified:fs.existsSync('/tmp/lineage-public-page.html'),
            llms_verified:fs.existsSync('/tmp/lineage-llms.txt'),
            price_usd:capability.entry_paid_offer?.price_usd ?? null,
            commercial_state:capability.commercial_state,
            machine_state:capability.machine_state,
            automatic_repository_access:false,
            automatic_payment:false,
            checkout_is_payment_proof:false,
            payment_authority:'Evercraft Payments',
            provider_boundary:'Raven Nexus',
            observed_at:new Date().toISOString()
          };
          fs.writeFileSync('artifacts/lineage-public-fabric-canary.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineage-public-fabric-canary
          path: artifacts/lineage-public-fabric-canary.json
          if-no-files-found: warn
          retention-days: 90
