name: Evercraft Research customer release
on:
  pull_request:
    paths:
      - "public/research/**"
      - "systemia/research-service/**"
      - "tests/evercraft-research-evidence-dossier.test.mjs"
      - "tests/evercraft-research-compile.test.mjs tests/evercraft-research-share-kit.test.mjs"
      - "tests/evercraft-research-public.test.mjs"
      - "tests/evercraft-research-share-kit.test.mjs"
      - "tests/evercraft-research-public-canary.test.mjs"
      - "scripts/probe-evercraft-research-public.mjs"
      - ".github/workflows/evercraft-research-customer.yml"
  push:
    branches: [main]
    paths:
      - "public/research/**"
      - "systemia/research-service/**"
      - "tests/evercraft-research-evidence-dossier.test.mjs"
      - "tests/evercraft-research-compile.test.mjs"
      - "tests/evercraft-research-public.test.mjs"
      - "tests/evercraft-research-share-kit.test.mjs"
      - "tests/evercraft-research-public-canary.test.mjs"
      - "scripts/probe-evercraft-research-public.mjs"
      - ".github/workflows/evercraft-research-customer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-source-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify scoped customer experience and evidence boundaries
        run: |
          node --check public/research/scope.mjs
          node --check scripts/probe-evercraft-research-public.mjs
          node --check systemia/research-service/evidence-dossier.mjs
          node --check systemia/research-service/compile.mjs
          node --test tests/evercraft-research-public.test.mjs tests/evercraft-research-public-canary.test.mjs tests/evercraft-research-evidence-dossier.test.mjs tests/evercraft-research-compile.test.mjs
