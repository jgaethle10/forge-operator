name: Systemia Passport Visual Read proof
on:
  push:
    paths:
      - 'systemia/control-plane/visualization/passport-goal-read*.mjs'
      - 'systemia/control-plane/visualization/goal-visual-bridge*.mjs'
      - '.github/workflows/systemia-passport-visual-read.yml'
  pull_request:
    paths:
      - 'systemia/control-plane/visualization/passport-goal-read*.mjs'
      - 'systemia/control-plane/visualization/goal-visual-bridge*.mjs'
      - '.github/workflows/systemia-passport-visual-read.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check systemia/control-plane/visualization/passport-goal-read.mjs
      - run: node --test systemia/control-plane/visualization/passport-goal-read.test.mjs systemia/control-plane/visualization/goal-visual-bridge.test.mjs
