# Candidate CI trigger: owned browser public-edge lane
name: Evercraft Browser Worker

on:
  pull_request:
    paths:
      - "systemia/evercraft-web/browser-worker/**"
      - "systemia/world-engine/**"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/compute/node-seed.mjs"
      - "systemia/compute/local-organism.mjs"
      - "systemia/compute/install-local-organism-user.sh"
      - "systemia/yard/browser-worker-proof.mjs"
      - "systemia/yard/browser-public-route-proof.mjs"
      - "systemia/yard/browser-edge-attachment.mjs"
      - "systemia/yard/browser-edge-attachment.proof.mjs"
      - "systemia/yard/operator.mjs"
      - "package.json"
      - ".github/workflows/evercraft-browser-worker.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "systemia/evercraft-web/browser-worker/**"
      - "systemia/world-engine/**"
      - "systemia/compute/runtime-node.mjs"
      - "systemia/compute/node-seed.mjs"
      - "systemia/compute/local-organism.mjs"
      - "systemia/compute/install-local-organism-user.sh"
      - "systemia/yard/browser-worker-proof.mjs"
      - "systemia/yard/browser-public-route-proof.mjs"
      - "systemia/yard/operator.mjs"
      - "package.json"
      - ".github/workflows/evercraft-browser-worker.yml"

permissions:
  contents: read

concurrency:
  group: evercraft-browser-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: systemia/evercraft-web/browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Policy tests
        run: npm test
      - name: Prove native user-space Browser Worker
        run: EVERCRAFT_NATIVE_BROWSER_STATE_DIR="$RUNNER_TEMP/evercraft-native-browser" node native-runtime.proof.mjs
      - name: Upload native browser execution and crash-recovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-browser-native-crash-recovery
          path: ${{ runner.temp }}/evercraft-native-browser/durable-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Prove browser WebGPU device execution
        run: |
          EVERCRAFT_NATIVE_BROWSER_STATE_DIR="$RUNNER_TEMP/evercraft-native-browser" node webgpu-device-conformance.proof.mjs | tee /tmp/evercraft-webgpu-device-conformance.json
      - name: Prove World Engine owned-WGSL reference frame
        run: |
          EVERCRAFT_NATIVE_BROWSER_STATE_DIR="$RUNNER_TEMP/evercraft-native-browser" npm run proof:webgpu-reference-frame | tee /tmp/evercraft-world-reference-frame.json
      - name: Upload World Engine reference-frame receipt
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-world-engine-reference-frame
          path: /tmp/evercraft-world-reference-frame.json
          if-no-files-found: error
      - name: Summarize WebGPU device receipt
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const receipt=JSON.parse(fs.readFileSync('/tmp/evercraft-webgpu-device-conformance.json','utf8'));
          const info=receipt.adapter_info||{};
          const summary=[
            '## Evercraft WebGPU device conformance',
            '- Status: **'+receipt.status+'**',
            '- Execution class: **'+receipt.execution_class+'**',
            '- Hardware execution claim: **'+String(receipt.hardware_execution_claim)+'**',
            '- Launch profile: `'+receipt.launch_profile+'`',
            '- Adapter vendor: `'+String(info.vendor||'unreported')+'`',
            '- Adapter architecture: `'+String(info.architecture||'unreported')+'`',
            '- Adapter description: `'+String(info.description||'unreported')+'`',
            '- Compute readback verified: **'+String(receipt.compute?.verified===true)+'**',
            '- Raster readback verified: **'+String(receipt.render?.verified===true)+'**',
            '- Receipt: `'+receipt.receipt_hash+'`',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n');
          NODE
      - name: Upload WebGPU device receipt
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-webgpu-device-conformance
          path: /tmp/evercraft-webgpu-device-conformance.json
          if-no-files-found: error
      - name: Build worker image
        run: docker build -t evercraft/browser-worker:ci .
      - name: Smoke worker image
        run: |
          docker run -d --name evercraft-browser-smoke             -e EVERCRAFT_BROWSER_WORKER_TOKEN=ci-public-read-only-token             -e EVERCRAFT_AUTH_BROWSER_OPERATOR_TOKEN=ci-auth-handoff-operator-token             -e EVERCRAFT_BROWSER_SYSTEMIA_JOB_KEY=ci-systemia-browser-job-signing-key-123456789             -e EVERCRAFT_BROWSER_JOB_STATE_DIR=/var/lib/evercraft-browser-jobs             --mount type=volume,source=evercraft-browser-ci-durable-jobs,target=/var/lib/evercraft-browser-jobs             -p 127.0.0.1:18787:8787             evercraft/browser-worker:ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18787/healthz > /tmp/evercraft-browser-health.json; then break; fi
            sleep 1
          done
          if ! test -s /tmp/evercraft-browser-health.json; then
            echo "Browser worker failed to produce a health receipt"
            docker logs evercraft-browser-smoke || true
            exit 1
          fi
          node -e "const h=require('/tmp/evercraft-browser-health.json'); if(!h.ok||h.service!=='evercraft-owned-browser-worker'||h.authenticated_handoff_available!==true) process.exit(1)"
          curl -fsS http://127.0.0.1:18787/auth-browser/health | tee /tmp/evercraft-auth-browser-health.json
          node -e "const h=require('/tmp/evercraft-auth-browser-health.json'); if(!h.ok||h.mode!=='human_authorized_ephemeral'||h.secret_text_returned!==false||h.delegated_draft_automation!==true||h.delegated_final_submission_authority!==false||h.delegated_payment_authority!==false||h.delegated_new_terms_authority!==false) process.exit(1)"
          curl -fsS -X POST http://127.0.0.1:18787/v1/auth-browser/sessions             -H 'authorization: Bearer ci-auth-handoff-operator-token'             -H 'content-type: application/json'             --data '{"url":"https://example.com/","viewport":{"width":1024,"height":768}}'             > /tmp/evercraft-auth-session.json
          node <<'NODE'
          const fs = require('node:fs');
          const session = JSON.parse(fs.readFileSync('/tmp/evercraft-auth-session.json','utf8'));
          if (!session.ok || session.mode !== 'human_authorized_ephemeral') process.exit(1);
          if (session.persisted_profile !== false || session.secret_text_returned !== false) process.exit(1);
          if (!session.session_id || !String(session.handoff_path || '').startsWith('/handoff/')) process.exit(1);
          const handoff = new URL(session.handoff_path, 'https://evercraft.invalid');
          const claim = new URLSearchParams(handoff.hash.slice(1)).get('claim');
          if (!claim || claim.length < 32) process.exit(1);
          fs.writeFileSync('/tmp/evercraft-session-id', session.session_id);
          fs.writeFileSync('/tmp/evercraft-session-claim', claim);
          NODE
          SESSION_ID="$(cat /tmp/evercraft-session-id)"
          CLAIM="$(cat /tmp/evercraft-session-claim)"
          curl -fsS "http://127.0.0.1:18787/v1/auth-browser/sessions/$SESSION_ID/snapshot"             -H "x-evercraft-browser-claim: $CLAIM"             > /tmp/evercraft-auth-snapshot.json
          node <<'NODE'
          const fs = require('node:fs');
          const shot = JSON.parse(fs.readFileSync('/tmp/evercraft-auth-snapshot.json','utf8'));
          if (!shot.ok || shot.secure_transport !== true) process.exit(1);
          if (!shot.screenshot_base64 || !/^[a-f0-9]{64}$/.test(shot.screenshot_sha256 || '')) process.exit(1);
          if (!String(shot.url || '').startsWith('https://example.com')) process.exit(1);
          NODE
          curl -fsS -X POST "http://127.0.0.1:18787/v1/auth-browser/sessions/$SESSION_ID/action"             -H "x-evercraft-browser-claim: $CLAIM"             -H 'content-type: application/json'             --data '{"type":"reload"}'             > /tmp/evercraft-auth-action.json
          node -e "const a=require('/tmp/evercraft-auth-action.json'); if(!a.ok||a.type!=='reload'||a.action_count!==1) process.exit(1)"
          curl -fsS -X POST "http://127.0.0.1:18787/v1/auth-browser/sessions/$SESSION_ID/delegate"             -H "x-evercraft-browser-claim: $CLAIM"             -H 'content-type: application/json'             --data '{"scopes":["read","same_origin_navigation","draft_form_fill","draft_save"]}'             > /tmp/evercraft-browser-delegation.json
          node <<'NODE'
          const d=require('/tmp/evercraft-browser-delegation.json');
          if(!d.ok||d.delegated!==true||d.mode!=='competition_draft_automation') process.exit(1);
          if(d.final_submission_authority!==false||d.payment_authority!==false||d.accepts_new_terms!==false||d.secret_entry_authority!==false) process.exit(1);
          NODE
          curl -fsS "http://127.0.0.1:18787/v1/auth-browser/delegated/$SESSION_ID/snapshot"             -H 'authorization: Bearer ci-auth-handoff-operator-token'             > /tmp/evercraft-delegated-snapshot.json
          node -e "const s=require('/tmp/evercraft-delegated-snapshot.json'); if(!s.ok||s.mode!=='competition_draft_automation'||!s.screenshot_sha256||s.delegation.final_submission_authority!==false) process.exit(1)"
          curl -fsS -X POST "http://127.0.0.1:18787/v1/auth-browser/delegated/$SESSION_ID/action"             -H 'authorization: Bearer ci-auth-handoff-operator-token'             -H 'content-type: application/json'             --data '{"type":"wait","ms":10}'             > /tmp/evercraft-delegated-action.json
          node -e "const a=require('/tmp/evercraft-delegated-action.json'); if(!a.ok||a.type!=='wait'||a.final_submission_authority!==false||a.payment_authority!==false||a.accepts_new_terms!==false) process.exit(1)"
          HTTP_CODE="$(curl -sS -o /tmp/evercraft-delegated-cross-origin.json -w '%{http_code}' -X POST "http://127.0.0.1:18787/v1/auth-browser/delegated/$SESSION_ID/action"             -H 'authorization: Bearer ci-auth-handoff-operator-token'             -H 'content-type: application/json'             --data '{"type":"navigate","url":"https://example.org/"}')"
          test "$HTTP_CODE" = "400"
          node -e "const a=require('/tmp/evercraft-delegated-cross-origin.json'); if(a.error!=='delegated_cross_origin_navigation_blocked') process.exit(1)"
          curl -fsS -X DELETE "http://127.0.0.1:18787/v1/auth-browser/sessions/$SESSION_ID/delegate"             -H "x-evercraft-browser-claim: $CLAIM"             > /tmp/evercraft-browser-delegation-revoke.json
          node -e "const r=require('/tmp/evercraft-browser-delegation-revoke.json'); if(!r.ok||r.delegated!==false) process.exit(1)"
          HTTP_CODE="$(curl -sS -o /tmp/evercraft-delegated-after-revoke.json -w '%{http_code}' "http://127.0.0.1:18787/v1/auth-browser/delegated/$SESSION_ID/snapshot"             -H 'authorization: Bearer ci-auth-handoff-operator-token')"
          test "$HTTP_CODE" = "400"
          node -e "const a=require('/tmp/evercraft-delegated-after-revoke.json'); if(a.error!=='authenticated_browser_delegation_required') process.exit(1)"
          curl -fsS -X DELETE "http://127.0.0.1:18787/v1/auth-browser/sessions/$SESSION_ID"             -H "x-evercraft-browser-claim: $CLAIM"             > /tmp/evercraft-auth-close.json
          node -e "const c=require('/tmp/evercraft-auth-close.json'); if(!c.ok||c.closed!==true) process.exit(1)"
      - name: Prove signed Career Command preflight and no-submit boundary
        run: |
          EVERCRAFT_BROWSER_PROOF_SIGNING_KEY=ci-systemia-browser-job-signing-key-123456789 node job-application-preflight.proof.mjs
      - name: Prove Systemia signed durable jobs through Docker Chromium
        run: |
          EVERCRAFT_BROWSER_PROOF_SIGNING_KEY=ci-systemia-browser-job-signing-key-123456789 node durable-jobs.proof.mjs
      - name: Upload signed Docker browser job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-browser-signed-docker-canary
          path: /tmp/evercraft-browser-durable-canary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop smoke worker
        if: always()
        run: docker rm -f evercraft-browser-smoke || true

  yard-browser-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove private Yard browser lifecycle
        run: node systemia/yard/browser-worker-proof.mjs
      - name: Prove Browser through Evercraft public edge
        run: node systemia/yard/browser-public-route-proof.mjs
      - name: Prove Browser attaches to shared Evercraft edge
        run: node systemia/yard/browser-edge-attachment.proof.mjs

  publish-browser-image:
    name: publish-owned-browser-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser-worker, yard-browser-route]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Evercraft GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish receipt-bound browser image
        uses: docker/build-push-action@v6
        with:
          context: systemia/evercraft-web/browser-worker
          push: true
          tags: |
            ghcr.io/jgaethle10/evercraft-browser-worker:sha-${{ github.sha }}
            ghcr.io/jgaethle10/evercraft-browser-worker:main
          labels: |
            org.opencontainers.image.source=https://github.com/jgaethle10/forge-operator
            org.opencontainers.image.revision=${{ github.sha }}
            io.evercraft.capability=systemia.evercraft-web-browser.v1
      - name: Record image publication receipt
        shell: bash
        run: |
          {
            echo "## Evercraft Browser image receipt"
            echo "- Engine: **Evercraft-owned Playwright/Chromium worker**"
            echo "- Revision: \`${{ github.sha }}\`"
            echo "- Image: \`ghcr.io/jgaethle10/evercraft-browser-worker:sha-${{ github.sha }}\`"
            echo "- Public Browser capability remains HELD until persistent runtime + external canary gates pass."
            echo "- No external browser-agent fallback is authorized by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
