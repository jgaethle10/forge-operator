name: Yakima Watershed Intelligence live-source canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"
  pull_request:
    paths:
      - "systemia/research-service/watershed-*.mjs"
      - "systemia/research-service/watershed-yakima-profile.json"
      - "systemia/research-service/watershed-intelligence.mjs"
      - "tests/evercraft-watershed-intelligence.test.mjs"
      - "tests/evercraft-usbr-rise-reservoirs.test.mjs"
      - "systemia/research-service/usbr-*.mjs"
      - ".github/workflows/watershed-intelligence-canary.yml"

permissions:
  contents: read

concurrency:
  group: watershed-intelligence-canary-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove parsing, failure and source authority boundaries
        run: node --test tests/evercraft-watershed-intelligence.test.mjs tests/evercraft-usbr-rise-reservoirs.test.mjs
      - name: Collect official observations, fail when minimum live source coverage is absent
        shell: bash
        run: |
          mkdir -p artifacts/watershed-canary
          node systemia/research-service/watershed-snapshot-cli.mjs --canary > artifacts/watershed-canary/latest.json
      - name: Compile a non-publishing, source-traceable review brief
        if: always()
        shell: bash
        run: |
          if [ -s artifacts/watershed-canary/latest.json ]; then
            node systemia/research-service/watershed-review-brief.mjs \
              --input artifacts/watershed-canary/latest.json \
              --out artifacts/watershed-canary/review-draft.md
          fi
      - name: Probe USBR RISE five-reservoir storage sources
        if: always()
        id: reservoir
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/watershed-canary
          node systemia/research-service/usbr-reservoir-probe.mjs --probe > artifacts/watershed-canary/reservoir-source-probe.json
      - name: Preserve source observations and coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakima-watershed-official-source-readback
          path: |
            artifacts/watershed-canary/latest.json
            artifacts/watershed-canary/review-draft.md
            artifacts/watershed-canary/reservoir-source-probe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Yakima Watershed Intelligence source check"
            echo
            echo "Public NRCS/USGS sensor reachability and minimum freshness only."
            echo "No basin-wide SWE percentage, reservoir verification, forecast, hazard declaration, flight authority, payment, or customer delivery."
            echo "USBR RISE diagnostic outcome: ${{ steps.reservoir.outcome }} (source-only, held until verified)"
            echo
            if [ -s artifacts/watershed-canary/latest.json ]; then
              node --input-type=module -e '
                import fs from "node:fs";
                const s=JSON.parse(fs.readFileSync("artifacts/watershed-canary/latest.json","utf8"));
                console.log("Status:", s.source_coverage?.status || "not_assessed");
                console.log("Current snow stations:", s.source_coverage?.snow_station_count ?? 0);
                console.log("Current river locations:", s.source_coverage?.usgs_discharge_location_count ?? 0);
                console.log("Failed upstreams:", JSON.stringify(s.failures || []));
                console.log("Publication authorized:", false);
              '
            else
              echo "No usable source receipt. Collection failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
