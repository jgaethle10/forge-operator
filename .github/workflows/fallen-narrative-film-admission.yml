name: Fallen Narrative Film Admission

on:
  pull_request:
    paths:
      - 'systemia/media-studio/narrative-film-admission.ts'
      - 'systemia/media-studio/narrative-film-admission.test.ts'
      - 'systemia/media-studio/studio-delivery.ts'
      - 'systemia/media-studio/studio-delivery.test.ts'
      - '.github/workflows/fallen-narrative-film-admission.yml'
  workflow_dispatch:

jobs:
  narrative-film-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --import tsx --test systemia/media-studio/narrative-film-admission.test.ts systemia/media-studio/studio-delivery.test.ts
      - run: npm run lint
