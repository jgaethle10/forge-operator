name: Saban Base44 evacuation emergency batch (no cutover)

on:
  pull_request:
    paths:
      - 'systemia/migrations/base44-exit/factory/**'
      - 'systemia/saban/multiplication-registry.json'
      - '.github/workflows/saban-base44-evac-urgent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-and-fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify carried evacuation factory proof
        run: node systemia/migrations/base44-exit/factory/proof.mjs
      - name: Validate real urgent source snapshot and execution boundary
        run: node --test systemia/migrations/base44-exit/factory/urgent-batch.test.mjs
      - name: Execute all ten Saban roles for four observed urgent apps
        run: |
          node systemia/saban/multiplier.mjs \
            --software base44-evac --fixed --agents 40 --workers 4 \
            --execute --reconcile \
            --state artifacts/saban-multiplier/base44-evac-state.json
      - name: Save no-secret read-only plan and replay receipts
        uses: actions/upload-artifact@v4
        with:
          name: saban-base44-urgent-admission-only
          path: |
            artifacts/saban-multiplier/base44-evac-latest.json
            artifacts/saban-multiplier/base44-evac-state.json
          if-no-files-found: error
          retention-days: 3
