name: EverMaps Canal Solar Evidence Pipeline

on:
  pull_request:
    paths:
      - 'systemia/evermaps/canal-solar/**'
      - '.github/workflows/evermaps-canal-solar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests shapely pyproj
      - name: Run offline correctness and fail-closed tests
        run: python -m unittest discover -s systemia/evermaps/canal-solar/tests -v

  extract:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests shapely pyproj
      - name: Probe complementary California canal GIS services
        run: |
          python - <<'PY'
          import requests
          urlset = {
            "DWR local mirror FeatureServer": "https://services.arcgis.com/7CRlmWNEbeCqEJ6a/arcgis/rest/services/i12_Canals_and_Aqueducts_local/FeatureServer/0",
            "DWR local official utility MapServer": "https://utility.arcgis.com/usrsvcs/servers/b43dc55d1e1448f2b384ebb8efac9042/rest/services/InlandWaters/i12_Canals_and_Aqueducts_local/MapServer/0",
          }
          for label,url in urlset.items():
              try:
                  r=requests.get(url,params={"f":"json"},timeout=18)
                  j=r.json() if "json" in r.headers.get("Content-Type","") or r.text.lstrip().startswith("{") else {}
                  print("CALIFORNIA_SOURCE_PROBE",label,"http",r.status_code,
                        "layer",j.get("name"),"geometry",j.get("geometryType"),
                        "error",j.get("error"),flush=True)
                  if r.ok and j.get("geometryType") == "esriGeometryPolyline":
                      q=requests.get(url+"/query",params={"where":"1=1","geometry":"-121.17,37.25,-120.39,38.18",
                          "geometryType":"esriGeometryEnvelope","inSR":"4326",
                          "spatialRel":"esriSpatialRelIntersects","returnCountOnly":"true","f":"json"},timeout=24)
                      print("CALIFORNIA_SOURCE_COUNT",label,q.status_code,
                            q.json().get("count") if q.ok else q.text[:120],flush=True)
              except Exception as e: print("CALIFORNIA_SOURCE_PROBE_FAIL",label,type(e).__name__,str(e)[:160],flush=True)
          PY
      - name: Retrieve live GIS geometry into RESEARCH ONLY packages
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python systemia/evermaps/canal-solar/atlas.py --regions all
          else
            python systemia/evermaps/canal-solar/atlas.py --regions sunnyside_wa turlock_modesto_ca
          fi
      - name: Save only QA-oriented manifests and internal archive bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermaps-canal-solar-research-only
          path: |
            systemia/evermaps/canal-solar/out/**/manifest.json
            systemia/evermaps/canal-solar/out/*_RESEARCH_ONLY.zip
          if-no-files-found: warn
          retention-days: 5
