name: Systemia Agent Continuity Guard

on:
  pull_request:
    paths:
      - "systemia/agent-continuity/**"
      - "systemia/control-plane/**"
      - "systemia/raven/**"
      - "systemia/evercraft-home/raven-execution-adapter*"
      - "nexus-work/team-review-contract.json"
      - "tests/agent-continuity-*.test.mjs"
      - ".github/workflows/systemia-agent-continuity.yml"
  push:
    branches: [main]
    paths:
      - "systemia/agent-continuity/**"
      - "systemia/control-plane/**"
      - "systemia/raven/**"
      - "systemia/evercraft-home/raven-execution-adapter*"
      - "nexus-work/team-review-contract.json"
      - "tests/agent-continuity-*.test.mjs"

permissions:
  contents: read

jobs:
  verify-roster-and-dna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check systemia/agent-continuity/continuity-gate.mjs
      - run: node --check systemia/control-plane/control-plane.mjs
      - run: node --check systemia/agent-continuity/signed-evidence.mjs
      - run: node --check systemia/agent-continuity/signed-roster.mjs
      - run: node --check systemia/agent-continuity/owned-proof-source.mjs
      - run: node --check systemia/raven/resident-runner.mjs
      - run: node --check systemia/raven/team-review-runtime.mjs
      - run: node --test tests/agent-continuity-roster.test.mjs tests/agent-continuity-routing.test.mjs tests/agent-continuity-signed-gate.test.mjs tests/agent-continuity-owned-source.test.mjs tests/agent-continuity-signed-roster.test.mjs
      - run: node --test systemia/raven/team-review-runtime.test.mjs systemia/raven/private-runtime.team-review.test.mjs systemia/raven/owned-inference-e2e.test.mjs systemia/evercraft-home/raven-execution-adapter.test.mjs
      - run: node --test systemia/raven/run-tieton-recovery-review.test.mjs
