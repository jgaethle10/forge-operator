name: OpenAI Plugin Readiness

on:
  pull_request:
    paths:
      - 'plugins/evercraft-fabric/**'
      - 'distribution/openai-plugin/**'
      - 'scripts/validate-openai-plugin-submission.mjs'
      - 'scripts/build-evercraft-openai-plugin.sh'
      - 'scripts/promote-openai-owned-fabric.mjs'
      - 'systemia/mcp/fabric-directory.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/newsroom/**'
      - 'public/journal/**'
      - 'systemia/mcp/FABRIC_SECURE_TUNNEL.md'
      - 'systemia/mcp/specialist-handoff-runtime.mjs'
      - 'tests/evercraft-fabric-runtime.test.mjs'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'systemia/mcp/FABRIC_OWNED_PUBLIC_EDGE.md'
      - 'tests/evercraft-openai-plugin-package.test.mjs'
      - 'tests/openai-owned-fabric-promotion.test.mjs'
      - '.github/workflows/openai-plugin-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-evercraft-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build owned Journal fixture
        run: npm run journal:build

      - name: Prove OpenAI package and Fabric contract
        run: |
          node --test tests/evercraft-openai-plugin-package.test.mjs tests/evercraft-fabric-runtime.test.mjs tests/openai-owned-fabric-promotion.test.mjs tests/fabric-local-runtime.test.mjs
          node scripts/validate-openai-plugin-submission.mjs

      - name: Build OpenAI upload ZIP
        run: |
          set -euo pipefail
          bash scripts/build-evercraft-openai-plugin.sh
          test -s artifacts/evercraft-openai-plugin.zip

      - name: Upload OpenAI submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-openai-plugin
          path: artifacts/evercraft-openai-plugin.zip
          if-no-files-found: error
          retention-days: 30
