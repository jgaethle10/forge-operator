name: Systemia Chat Mission Bridge

on:
  pull_request:
    paths:
      - 'systemia/mission-bridge/**'
      - '.github/workflows/systemia-chat-mission-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/mission-bridge/**'
      - '.github/workflows/systemia-chat-mission-bridge.yml'
  workflow_dispatch:
    inputs:
      mission_id:
        description: 'Exact allowlisted request filename stem in systemia/mission-bridge/requests'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: systemia-chat-mission-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  admission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mission contract and injection-regression tests
        run: |
          node --check systemia/mission-bridge/bridge.mjs
          node --check systemia/mission-bridge/cli.mjs
          node --test systemia/mission-bridge/bridge.test.mjs
          node --check systemia/mission-bridge/gems/private-research-preflight.mjs
          node --test systemia/mission-bridge/gems/private-research-preflight.test.mjs
          node --check systemia/mission-bridge/gems/research-job-ledger.mjs
          node --test systemia/mission-bridge/gems/research-job-ledger.test.mjs
          node --check systemia/mission-bridge/gems/research-lease-binding.mjs
          node --test systemia/mission-bridge/gems/research-lease-binding.test.mjs
          node --check systemia/mission-bridge/gems/research-work-claim.mjs
          node --test systemia/mission-bridge/gems/research-work-claim.test.mjs
          node --check systemia/mission-bridge/gems/synthetic-research-worker.mjs
          node --test systemia/mission-bridge/gems/synthetic-research-worker.test.mjs
          node --test systemia/mission-bridge/gems/verify-synthetic-receipt.test.mjs
          node --check systemia/mission-bridge/gems/private-dataset-integrity.mjs
          node --test systemia/mission-bridge/gems/private-dataset-integrity.test.mjs
          node --check systemia/mission-bridge/gems/kss-spatial-contract.mjs
          node --test systemia/mission-bridge/gems/kss-spatial-contract.test.mjs
          python3 -m py_compile systemia/mission-bridge/gems/gems_002_negative_ablation.py
          python3 -m py_compile systemia/mission-bridge/gems/test_gems_002_negative_ablation.py
          bash -n systemia/mission-bridge/gems/execute_segment_replay.sh
          bash -n systemia/mission-bridge/gems/execute_candidate_qc.sh
          python3 -m unittest discover -s systemia/mission-bridge/gems -p test_verify_official_input_hashes.py -v
      - name: Run bounded synthetic GEMS computation (not official competition data)
        run: node systemia/mission-bridge/gems/run-synthetic-smoke.mjs
      - name: Independently verify the emitted synthetic receipt artifact
        run: node systemia/mission-bridge/gems/verify-synthetic-receipt.mjs
      - name: Preserve synthetic computation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gems-synthetic-research-smoke
          path: artifacts/systemia-mission-bridge/gems-synthetic-research-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate the first committed mission without running it
        run: node systemia/mission-bridge/cli.mjs --plan signal-public-ingress-20261116-001


  gems-scientific-unit-tests:
    # Isolated test runner only: no original data, no upload, no network to competition.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'systemia/mission-bridge/gems/requirements-test.txt'
      - name: Install bounded scientific test dependencies
        run: python -m pip install --disable-pip-version-check -r systemia/mission-bridge/gems/requirements-test.txt
      - name: Run real Python ablation and raster-guard tests against synthetic arrays
        working-directory: systemia/mission-bridge/gems
        run: |
          python -m unittest -v test_gems_002_negative_ablation.py
          python -m unittest -v test_gems_002_segment_holdouts.py
          python -m unittest -v test_gems_002_prepare_candidate.py
          python -m unittest -v test_audit_candidate_comparison.py
          python -m unittest -v test_verify_official_input_hashes.py
      - name: Assert no scored submission or production tasks were invoked
        run: |
          test ! -e gems_candidate.tif
          test ! -e systemia/mission-bridge/gems/gems_candidate.tif


  bounded-observation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: admission-contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admit new source requests and execute only declared read-only specialists
        env:
          EVENT_NAME: ${{ github.event_name }}
          MISSION_ID: ${{ inputs.mission_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node systemia/mission-bridge/cli.mjs --request "$MISSION_ID"
          else
            node systemia/mission-bridge/cli.mjs --changed
          fi
      - name: Preserve evidence receipt even when the public route is unreachable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemia-chat-mission-observations
          path: artifacts/systemia-mission-bridge/*.json
          if-no-files-found: warn
          retention-days: 21
