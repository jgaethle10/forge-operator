name: Mossmere Independent Heartbeat

on:
  push:
    branches:
      - main
      - feature/window-independent-heartbeat-20261018
      - feature/window-civic-longrun-20261018
      - feature/window-scheduler-recovery-20261019
      - feature/window-relationship-arcs-20261019
    paths:
      - 'systemia/society/window-*.mjs'
      - 'tests/window-heartbeat.test.mjs'
      - '.github/workflows/window-heartbeat.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: window-independent-heartbeat
  cancel-in-progress: false

jobs:
  world-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate world policy and branch safety
        run: |
          node --check systemia/society/window-civic.mjs
          node --check systemia/society/window-social.mjs
          node --check systemia/society/window-heartbeat.mjs
          node --test tests/window-heartbeat.test.mjs
      - name: Read-only world-state heartbeat preview
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WINDOW_DRY_RUN: 'true'
        run: node systemia/society/window-heartbeat.mjs
