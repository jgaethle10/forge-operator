name: Opportunity Radar offline tests

on:
  pull_request:
    paths:
      - 'scripts/opportunity-radar/**'
      - 'tests/opportunity-radar/**'
      - '.github/workflows/opportunity-radar-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline triage tests
        run: node --test tests/opportunity-radar/*.test.mjs
