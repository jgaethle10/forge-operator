name: Remote device enrollment

on:
  pull_request:
    paths:
      - 'systemia/network/outbound-capacity-broker.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/yard/remote-device-enrollment.proof.mjs'
      - 'systemia/network/remote-broker.evercraft.compute.json'
      - 'systemia/network/REMOTE_BROKER_WORKLOAD.md'
      - '.github/workflows/remote-device-enrollment.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/network/outbound-capacity-broker.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/yard/remote-device-enrollment.proof.mjs'
      - 'systemia/network/remote-broker.evercraft.compute.json'
      - 'systemia/network/REMOTE_BROKER_WORKLOAD.md'
      - '.github/workflows/remote-device-enrollment.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove explicit remote device authorize and revoke lifecycle
        run: node systemia/yard/remote-device-enrollment.proof.mjs
