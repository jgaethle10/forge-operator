name: DayTrade $20 Paper Probe Once

on:
  push:
    branches:
      - "systemia/daytrade-paper-probe-2026-10-06"

permissions:
  contents: read

jobs:
  paper-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose Alpaca credential scope
        id: diagnose
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
        run: |
          node systemia/daytrade-lens/edge-alpaca-credential-diagnosis.mjs | tee /tmp/alpaca-diagnosis.json
          if grep -q '"paper_account_http_status":200' /tmp/alpaca-diagnosis.json; then
            echo "paper_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "paper_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run $20 SOXX paper execution probe
        if: steps.diagnose.outputs.paper_ok == 'true'
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_PAPER_PROBE_OUTPUT: artifacts/daytrade-edge/paper-probe-2026-10-06.json
        run: node systemia/daytrade-lens/edge-paper-run-once.mjs
      - name: Run $20 SOXX market-data paper roundtrip fallback
        if: steps.diagnose.outputs.paper_ok != 'true'
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_MARKETDATA_PAPER_OUTPUT: artifacts/daytrade-edge/marketdata-paper-roundtrip-2026-10-06.json
        run: node systemia/daytrade-lens/edge-marketdata-paper-roundtrip.mjs
      - name: Upload paper execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-paper-probe-${{ github.run_id }}
          path: |
            artifacts/daytrade-edge/paper-probe-2026-10-06.json
            artifacts/daytrade-edge/marketdata-paper-roundtrip-2026-10-06.json
          if-no-files-found: warn
          retention-days: 30
