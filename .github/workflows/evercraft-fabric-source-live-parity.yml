name: Evercraft Fabric Source-to-Live Parity

on:
  pull_request:
    paths:
      - 'scripts/audit-public-fabric-parity.mjs'
      - 'tests/audit-public-fabric-parity.test.mjs'
      - 'audits/fabric-parity-known-exceptions-2026-10-15.json'
      - 'public/chum/capabilities.json'
      - '.github/workflows/evercraft-fabric-source-live-parity.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-public-fabric-parity.mjs'
      - 'tests/audit-public-fabric-parity.test.mjs'
      - 'audits/fabric-parity-known-exceptions-2026-10-15.json'
      - 'public/chum/capabilities.json'
      - '.github/workflows/evercraft-fabric-source-live-parity.yml'
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-source-live-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-read-only-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test evidence classification and time-bounded hold
        run: node --test tests/audit-public-fabric-parity.test.mjs
      - name: Read-only audit of every advertised public capability and live MCP catalog
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-public-fabric-parity.mjs > "$RUNNER_TEMP/evercraft-fabric-parity.json"
      - name: Summarize truth states
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/evercraft-fabric-parity.json"; then
            node - "$RUNNER_TEMP/evercraft-fabric-parity.json" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          try {
            const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            console.log("Fabric parity:",r.ok===true?"PASS":"HOLD/FAIL");
            console.log("Source:",r.source_capabilities??"unverified","Live:",r.live_mcp_capabilities??"unverified",
              "HTTP 200:",r.route_ok_count??"unverified",
              "Missing source IDs:",(r.source_only_ids||[]).join(",")||"none recorded",
              "Release lineage:",r.release_lineage_state||"unverified",
              "Findings:",(r.findings||[]).join(",")||"none recorded");
            if(r.error)console.log("External probe error:",r.error,"Cause code:",r.cause_code||"unspecified");
          }catch{
            console.log("Fabric parity: HOLD. Receipt missing or unreadable. External verification NOT established.");
          }
          NODE
          else
            printf '%s\n' "Fabric parity: HOLD. No nonempty receipt. External verification NOT established." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-fabric-public-parity-receipt
          path: ${{ runner.temp }}/evercraft-fabric-parity.json
          if-no-files-found: warn
          retention-days: 60
