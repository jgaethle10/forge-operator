name: Yakima watershed immutable source history
on:
  workflow_run:
    workflows: ["Yakima Watershed Intelligence live-source canary"]
    types: [completed]
    branches: [main]

# Source collection and history preservation are distinct from publication.
# Never elevate PR artifacts. Only completed official canary runs from this repo/main qualify.
permissions:
  contents: read

concurrency:
  group: yakima-watershed-immutable-ledger
  cancel-in-progress: false

jobs:
  archive-source-receipts:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      LEDGER_BRANCH: research/watershed-evidence-ledger
    steps:
      - name: Checkout trusted source collector implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify archive contract before handling evidence
        run: |
          node --check systemia/research-service/watershed-history.mjs
          node --check systemia/research-service/watershed-history-archive.mjs
          node --check systemia/research-service/watershed-history-read.mjs
          node --test tests/evercraft-watershed-history.test.mjs
      - name: Download ONLY source-run canary receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/watershed-source"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name yakima-watershed-official-source-readback \
            --dir "$RUNNER_TEMP/watershed-source"
          test -s "$RUNNER_TEMP/watershed-source/latest.json"
      - name: Checkout dedicated source-only evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$LEDGER_BRANCH:refs/remotes/origin/$LEDGER_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/watershed-ledger-worktree" "refs/remotes/origin/$LEDGER_BRANCH"
      - name: Append run receipt without rewriting prior runs
        shell: bash
        run: |
          set -euo pipefail
          node systemia/research-service/watershed-history-archive.mjs \
            --source-dir "$RUNNER_TEMP/watershed-source" \
            --ledger-dir "$RUNNER_TEMP/watershed-ledger-worktree/evidence/watershed" \
            --run-id "$SOURCE_RUN_ID" \
            --head-sha "$SOURCE_HEAD_SHA" \
            --event "$SOURCE_EVENT" | tee "$RUNNER_TEMP/watershed-history-operation.json"
      - name: Verify stored raw hashes and 7-day history readback before push
        shell: bash
        run: |
          set -euo pipefail
          run_day="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).as_of.slice(0,10))' "$RUNNER_TEMP/watershed-source/latest.json")"
          node systemia/research-service/watershed-history-read.mjs \
            --ledger-dir "$RUNNER_TEMP/watershed-ledger-worktree/evidence/watershed" \
            --as-of "$run_day" \
            --window-days 7 \
            > "$RUNNER_TEMP/watershed-history-readback.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(v.raw_digests_verified!==true||v.verified_run_count<1||
               v.public_release_authorized!==false||v.interpolation_performed!==false)
              process.exit(1);
          ' "$RUNNER_TEMP/watershed-history-readback.json"
      - name: Push only source-receipt records to evidence branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/watershed-ledger-worktree"
          git config user.name "evercraft-watershed-source-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/watershed/runs/
          if git diff --cached --quiet; then
            echo "Same run and exact source fingerprints already archived."
            exit 0
          fi
          git commit -m "Record source-only Yakima watershed run $SOURCE_RUN_ID"
          git push origin "HEAD:refs/heads/$LEDGER_BRANCH"
      - name: Preserve archival operation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakima-immutable-ledger-operation
          path: |
            ${{ runner.temp }}/watershed-history-operation.json
            ${{ runner.temp }}/watershed-history-readback.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record narrow evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Yakima source-only immutable evidence archive"
            echo
            echo "Source run: $SOURCE_RUN_ID"
            echo "Source event: $SOURCE_EVENT"
            echo "Destination: $LEDGER_BRANCH, evidence/watershed/runs/"
            echo "Archive success is NOT public report approval, customer billing, a water forecast or flood alert."
            echo "Raw source files and hashes are preserved, including partial readings when valid."
          } >> "$GITHUB_STEP_SUMMARY"
