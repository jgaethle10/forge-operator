name: Evercraft Clip Social Continuity Watch
on:
  pull_request:
    paths:
      - 'systemia/clip/social-continuity-watch.mjs'
      - 'systemia/clip/social-continuity-watch.workflow.json'
      - 'tests/clip-social-continuity-watch.test.mjs'
      - 'systemia/core/resident-services.json'
      - 'distribution/marketing/**'
      - '.github/workflows/clip-social-continuity-watch.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/clip/social-continuity-watch.mjs'
      - 'systemia/clip/social-continuity-watch.workflow.json'
      - 'tests/clip-social-continuity-watch.test.mjs'
      - 'systemia/core/resident-services.json'
      - 'distribution/marketing/**'
      - '.github/workflows/clip-social-continuity-watch.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publication reconciliation
        run: node --test tests/clip-social-continuity-watch.test.mjs
      - name: Write review queue coverage snapshot (read-only)
        run: |
          node systemia/clip/social-continuity-watch.mjs \
            --queue distribution/marketing/evercraft-problem-first-20261022.review.json \
            --receipts-dir artifacts/clip/social-publish-receipts \
            --out artifacts/clip/social-continuity-watch/latest.json
      - name: Surface blockers in workflow summary
        if: always()
        run: |
          if [ -f artifacts/clip/social-continuity-watch/latest.json ]; then
            node --input-type=module -e "
              import fs from 'node:fs';
              const d=JSON.parse(fs.readFileSync('artifacts/clip/social-continuity-watch/latest.json'));
              const counts=Object.entries(d.counts).map(([k,v])=>'- '+k+': '+v).join('\n');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '## Evercraft Clip coverage (repo-side only)\nStatus: '+d.status+
                '\nReceipt source present: '+d.receipt_source_available+
                '\nThis does not verify live social platform visibility.\n'+counts+'\n');
            "
          else
            echo "No Clip coverage report produced. Investigate test/runner failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain publication-gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-clip-social-continuity
          path: artifacts/clip/social-continuity-watch/latest.json
          if-no-files-found: warn
          retention-days: 30
