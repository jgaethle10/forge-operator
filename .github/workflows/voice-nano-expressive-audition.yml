name: Voice Foundry Nano Expressive Model CPU Private Audition
on:
  pull_request:
    paths:
      - 'systemia/media-studio/voice-nano-expressive-audition.py'
      - '.github/workflows/voice-nano-expressive-audition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensed-model-private-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove text invariance and no voice cloning reference
        run: python systemia/media-studio/voice-nano-expressive-audition.py --verify-only
      - name: Fail safely on inadequate CPU and disk resources
        run: |
          set -euo pipefail
          df -h .
          free -h
          DISK_KB=$(df -Pk . | awk 'NR==2{print $4}')
          RAM_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          test "$DISK_KB" -ge 9000000 || { echo "Not enough disk for upstream pretrained model" >&2; exit 1; }
          test "$RAM_KB" -ge 5000000 || { echo "Not enough available RAM for safe private evaluation" >&2; exit 1; }
      - name: Install pinned CPU-compatible official speech dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            torch==2.6.0 torchaudio==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            chatterbox-tts==0.1.7
          python -c 'import torch,torchaudio;print(torch.__version__,torchaudio.__version__)'
      - name: Produce actual private baseline versus emotional tag takes
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          HF_HUB_ETAG_TIMEOUT: '30'
          HF_HUB_DOWNLOAD_TIMEOUT: '300'
        run: |
          python systemia/media-studio/voice-nano-expressive-audition.py --out private-nano-audition
      - name: Independent media, rights and source integrity check
        run: |
          python - <<'PY'
          import json,hashlib,subprocess,pathlib
          root=pathlib.Path('private-nano-audition')
          receipt=json.loads((root/'performance-receipt.json').read_text())
          assert len(receipt['outputs'])==3
          for key in ['voiceCloningReferenceUsed','humanQualityApproved',
                      'commercialPublicationAuthorized','directPreviousAudioConditioning',
                      'originalEvercraftModel','modelWeightRevisionPinned']:
              assert receipt[key] is False, key
          for take in receipt['outputs']:
              p=root/take['file']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==take['sha256']
              streams=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(p)]))
              assert streams['streams'][0]['channels']==1
              assert take['seconds']>.5
          print('Real audio files probed; expressive capacity remains human unverified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evercraft-voice-foundry-nano-expression-private-auditions
          path: private-nano-audition/
          retention-days: 7
          if-no-files-found: error
