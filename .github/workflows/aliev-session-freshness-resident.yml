name: AliEV owned session freshness proof

on:
  pull_request:
    paths:
      - 'systemia/aliev/session-freshness-resident.mjs'
      - 'systemia/aliev/session-freshness-slot.mjs'
      - 'systemia/aliev/session-freshness-health.mjs'
      - 'systemia/aliev/session-freshness-health.proof.mjs'
      - 'systemia/aliev/session-freshness-resident.proof.mjs'
      - 'systemia/aliev/session-freshness-dispatch.proof.mjs'
      - '.github/workflows/aliev-shadow-session-freshness.yml'
      - '.github/workflows/aliev-session-freshness-resident.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/aliev/session-freshness-resident.mjs'
      - 'systemia/aliev/session-freshness-slot.mjs'
      - 'systemia/aliev/session-freshness-health.mjs'
      - 'systemia/aliev/session-freshness-health.proof.mjs'
      - 'systemia/aliev/session-freshness-resident.proof.mjs'
      - 'systemia/aliev/session-freshness-dispatch.proof.mjs'
      - '.github/workflows/aliev-shadow-session-freshness.yml'
      - '.github/workflows/aliev-session-freshness-resident.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove owned scheduler boundaries without live credentials
        run: node --test systemia/aliev/session-freshness-resident.proof.mjs systemia/aliev/session-freshness-health.proof.mjs systemia/aliev/session-freshness-dispatch.proof.mjs
