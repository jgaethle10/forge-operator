name: Evercraft Web real piano audition (NO publication)
on:
  pull_request:
    paths:
      - 'systemia/clip/evercraft-real-piano-audition.py'
      - 'tests/evercraft-real-piano-audition.test.py'
      - '.github/workflows/evercraft-web-real-piano-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-recorded-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio decoding and array libraries
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
      - name: Validate instrument source and performance contract
        run: python tests/evercraft-real-piano-audition.test.py
      - name: Download only actual recorded CC0 notes and render expressive piano
        run: python systemia/clip/evercraft-real-piano-audition.py
      - name: Upload independent listening takes and sample provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-web-new-real-piano-audition-unapproved
          path: |
            artifacts/evercraft-web-piano-audition/*.wav
            artifacts/evercraft-web-piano-audition/proof.json
          retention-days: 7
          if-no-files-found: error
