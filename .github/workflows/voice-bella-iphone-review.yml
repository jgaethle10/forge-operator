name: Voice Foundry | Bella iPhone Review Video QA
on:
  push:
    branches: [feature/bella-actor-lab-20261026]
    paths:
      - 'systemia/media-studio/voice-bella-iphone-video-review.py'
      - 'systemia/media-studio/test_voice_bella_iphone_video_review.py'
      - '.github/workflows/voice-bella-iphone-review.yml'
  pull_request:
    paths:
      - 'systemia/media-studio/voice-bella-iphone-video-review.py'
      - 'systemia/media-studio/test_voice_bella_iphone_video_review.py'
      - '.github/workflows/voice-bella-iphone-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-review-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source offline image/video libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Verify voice review controls and actually encode a playable synthetic fixture
        run: |
          python -m unittest discover -s systemia/media-studio -p test_voice_bella_iphone_video_review.py -v
      - name: Confirm no private Bella samples or production releases were published
        run: |
          test ! -d bella-real-audio
          echo 'PASS: real Bella sources are never used in public CI fixture tests'
