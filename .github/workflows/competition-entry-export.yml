name: Competition Public Entry Export

on:
  pull_request:
    paths:
      - "systemia/competition/entries/**"
      - "systemia/competition/export-entry.mjs"
      - "systemia/competition/export-entry.test.mjs"
      - "systemia/competition/public-entry-catalog.json"
      - ".github/workflows/competition-entry-export.yml"
  push:
    branches: [main]
    paths:
      - "systemia/competition/entries/**"
      - "systemia/competition/export-entry.mjs"
      - "systemia/competition/export-entry.test.mjs"
      - "systemia/competition/public-entry-catalog.json"
      - ".github/workflows/competition-entry-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove public export boundary
        run: node --test systemia/competition/export-entry.test.mjs

  export:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        entry: [qloo-commonground, nebius-runbook-zero, paypal-checkout-black-box]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test standalone entry
        working-directory: systemia/competition/entries/${{ matrix.entry }}
        run: npm test
      - name: Export standalone public repository payload
        run: node systemia/competition/export-entry.mjs --entry "${{ matrix.entry }}" --out "dist/competition/${{ matrix.entry }}"
      - name: Upload public repository payload
        uses: actions/upload-artifact@v4
        with:
          name: competition-public-${{ matrix.entry }}
          path: dist/competition/${{ matrix.entry }}
          if-no-files-found: error
          retention-days: 14
