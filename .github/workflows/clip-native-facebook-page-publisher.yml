name: Clip Native Facebook Page Publisher

on:
  pull_request:
    paths:
      - "systemia/clip/social-publisher-runtime.mjs"
      - "systemia/clip/social-publisher-runtime.test.mjs"
      - "systemia/clip/facebook-page-publisher.mjs"
      - "systemia/clip/facebook-page-publisher.test.mjs"
      - "systemia/clip/facebook-page-credential-resolver.mjs"
      - "systemia/clip/facebook-page-credential-resolver.test.mjs"
      - "systemia/evercraft-home/provider-credentials.mjs"
      - "systemia/evercraft-home/provider-credentials.test.mjs"
      - "systemia/evercraft-home/server.mjs"
      - "systemia/evercraft-home/facebook-page-credential-http.test.mjs"
      - "systemia/clip/cfb-journal-resident.mjs"
      - "systemia/clip/cfb-journal-resident.test.mjs"
      - "systemia/clip/cfb-journal-resident-runner.mjs"
      - "systemia/newsroom/cfb-clip-facebook-publish.mjs"
      - "systemia/newsroom/cfb-clip-facebook-publish.test.mjs"
      - "systemia/newsroom/journal-clip-bridge.mjs"
      - "systemia/evercraft-home/clip-journal-publish-adapter.mjs"
      - "systemia/evercraft-home/clip-journal-publish-adapter.test.mjs"
      - "systemia/evercraft-home/clip-journal-publish-http.test.mjs"
      - "systemia/evercraft-home/identity.mjs"
      - "systemia/evercraft-home/session-auth.test.mjs"
      - "systemia/organism/cfb-clip-publisher.workflow.json"
      - "systemia/core/resident-services.json"
      - ".github/workflows/clip-native-facebook-page-publisher.yml"
  push:
    branches: [main]
    paths:
      - "systemia/clip/social-publisher-runtime.mjs"
      - "systemia/clip/social-publisher-runtime.test.mjs"
      - "systemia/clip/facebook-page-publisher.mjs"
      - "systemia/clip/facebook-page-publisher.test.mjs"
      - "systemia/clip/facebook-page-credential-resolver.mjs"
      - "systemia/clip/facebook-page-credential-resolver.test.mjs"
      - "systemia/evercraft-home/provider-credentials.mjs"
      - "systemia/evercraft-home/provider-credentials.test.mjs"
      - "systemia/evercraft-home/server.mjs"
      - "systemia/evercraft-home/facebook-page-credential-http.test.mjs"
      - "systemia/clip/cfb-journal-resident.mjs"
      - "systemia/clip/cfb-journal-resident.test.mjs"
      - "systemia/clip/cfb-journal-resident-runner.mjs"
      - "systemia/newsroom/cfb-clip-facebook-publish.mjs"
      - "systemia/newsroom/cfb-clip-facebook-publish.test.mjs"
      - "systemia/newsroom/journal-clip-bridge.mjs"
      - "systemia/evercraft-home/clip-journal-publish-adapter.mjs"
      - "systemia/evercraft-home/clip-journal-publish-adapter.test.mjs"
      - "systemia/evercraft-home/clip-journal-publish-http.test.mjs"
      - "systemia/evercraft-home/identity.mjs"
      - "systemia/evercraft-home/session-auth.test.mjs"
      - "systemia/organism/cfb-clip-publisher.workflow.json"
      - "systemia/core/resident-services.json"
      - ".github/workflows/clip-native-facebook-page-publisher.yml"

permissions:
  contents: read

jobs:
  native-facebook-page-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Facebook publishing contracts
        run: |
          node --test \
            systemia/clip/social-publisher-runtime.test.mjs \
            systemia/clip/facebook-page-publisher.test.mjs \
            systemia/clip/facebook-page-credential-resolver.test.mjs \
            systemia/evercraft-home/provider-credentials.test.mjs \
            systemia/evercraft-home/facebook-page-credential-http.test.mjs \
            systemia/newsroom/cfb-clip-facebook-publish.test.mjs \
            systemia/clip/cfb-journal-resident.test.mjs \
            systemia/evercraft-home/clip-journal-publish-adapter.test.mjs \
            systemia/evercraft-home/clip-journal-publish-http.test.mjs \
            systemia/evercraft-home/session-auth.test.mjs
      - name: Estate typecheck
        run: |
          npm install --no-audit --no-fund
          npm run lint
