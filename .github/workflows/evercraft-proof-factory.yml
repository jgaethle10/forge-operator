name: Evercraft Proof Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "systemia/proof-factory/**"
      - "systemia/forensiscope/distributed-proof.mjs"
      - "systemia/forensiscope/artifact-return-proof.mjs"
      - "systemia/rivet/report-runtime.proof.mjs"
      - "systemia/rivet/national-session-sprawl.proof.mjs"
      - "tests/proof-factory.test.mjs"
      - "package.json"
      - ".github/workflows/evercraft-proof-factory.yml"

permissions:
  contents: write

concurrency:
  group: evercraft-proof-factory
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Ensure media proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Prove Proof Factory contract
        run: npm run test:proof-factory

      - name: Execute product proof set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            artifacts/forensiscope-proof \
            artifacts/forensiscope-intake/proof \
            artifacts/forensiscope-intake/artifact-return \
            artifacts/rivet-proof \
            artifacts/proof-factory

          # ForensiScope is fail-closed at the product receipt level, but a missing
          # ASR/runtime dependency must not suppress independently valid RIVET proof.
          set +e
          npm run proof:forensiscope-distributed
          FORENSISCOPE_DISTRIBUTED_EXIT=$?
          npm run proof:forensiscope-artifact-return
          FORENSISCOPE_ARTIFACT_EXIT=$?
          set -e

          mkdir -p artifacts/rivet-proof
          node systemia/rivet/report-runtime.proof.mjs > artifacts/rivet-proof/report-runtime-latest.json
          node systemia/rivet/national-session-sprawl.proof.mjs > artifacts/rivet-proof/session-sprawl-latest.json
          npm run proof:factory

          echo "ForensiScope distributed proof exit: ${FORENSISCOPE_DISTRIBUTED_EXIT}"
          echo "ForensiScope artifact-return proof exit: ${FORENSISCOPE_ARTIFACT_EXIT}"

      - name: Validate promoted proof state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/proof-factory/latest.json','utf8'));
          if (receipt.schema !== 'evercraft.proof-factory.run.v1') throw new Error('Unexpected Proof Factory schema.');
          if (receipt.product_count !== 2) throw new Error('Expected two focused proof products.');
          if (receipt.media_briefs < 4) throw new Error('Proof Factory must emit the focused visual proof briefs.');

          const rivet = receipt.products?.find((row) => row.product_key === 'rivet');
          const forensiscope = receipt.products?.find((row) => row.product_key === 'forensiscope');
          if (!rivet || rivet.evidence_state !== 'execution_proofs_passed') {
            throw new Error('RIVET must retain current passing execution proofs before publication.');
          }
          if (!forensiscope) throw new Error('ForensiScope proof state is missing.');
          if (forensiscope.evidence_state !== 'execution_proofs_passed') {
            console.warn('ForensiScope remains fail-closed at its current evidence state:', forensiscope.evidence_state);
          }
          NODE

      - name: Publish public proof library
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Evercraft Proof Factory"
          git config user.email "proof-factory@users.noreply.github.com"

          rebuild_proof() {
            rm -rf \
              artifacts/forensiscope-proof \
              artifacts/forensiscope-intake/proof \
              artifacts/forensiscope-intake/artifact-return \
              artifacts/rivet-proof \
              artifacts/proof-factory
            set +e
            npm run proof:forensiscope-distributed
            FORENSISCOPE_DISTRIBUTED_EXIT=$?
            npm run proof:forensiscope-artifact-return
            FORENSISCOPE_ARTIFACT_EXIT=$?
            set -e
            echo "ForensiScope distributed proof exit: ${FORENSISCOPE_DISTRIBUTED_EXIT}"
            echo "ForensiScope artifact-return proof exit: ${FORENSISCOPE_ARTIFACT_EXIT}"
            mkdir -p artifacts/rivet-proof
            node systemia/rivet/report-runtime.proof.mjs > artifacts/rivet-proof/report-runtime-latest.json
            node systemia/rivet/national-session-sprawl.proof.mjs > artifacts/rivet-proof/session-sprawl-latest.json
            npm run proof:factory
          }

          for ATTEMPT in 1 2 3; do
            echo "Proof publication attempt ${ATTEMPT}/3"
            git fetch origin main --quiet
            git reset --hard origin/main
            rebuild_proof
            git add public/chum/proof

            if git diff --cached --quiet; then
              echo "Public proof library is already current."
              exit 0
            fi

            git commit -m "Proof Factory refresh truthful product evidence [skip ci]"
            if git push origin HEAD:main; then
              echo "Verified public proof library published."
              exit 0
            fi

            echo "Main advanced during proof publication; rebuilding from the new tip."
          done

          echo "Proof Factory publication lost three consecutive main-branch races." >&2
          exit 1

      - name: Write proof summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/proof-factory/latest.md ]; then
            cat artifacts/proof-factory/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload proof receipts and media briefs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-proof-factory
          path: |
            artifacts/forensiscope-proof/**
            artifacts/rivet-proof/**
            artifacts/proof-factory/**
            public/chum/proof/**
          if-no-files-found: warn
