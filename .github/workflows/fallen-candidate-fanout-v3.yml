name: Fallen Candidate Fanout V3

on:
  pull_request:
    paths:
      - 'systemia/media-studio/model-fabric.ts'
      - 'systemia/media-studio/model-fabric.test.ts'
      - 'systemia/media-studio/shot-tournament.ts'
      - 'systemia/media-studio/shot-tournament.test.ts'
      - '.github/workflows/fallen-candidate-fanout-v3.yml'
  workflow_dispatch:

jobs:
  candidate-fanout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          node --import tsx --test             systemia/media-studio/model-fabric.test.ts             systemia/media-studio/shot-tournament.test.ts
