name: Evercraft owned GPU battleship film
on:
  pull_request:
    paths:
      - 'systemia/world-engine/battleship-scene.ts'
      - 'systemia/world-engine/battleship-scene.test.ts'
      - 'systemia/world-engine/cinematic-render-proof.ts'
      - '.github/workflows/evercraft-battleship-film.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-procedural-3d-ship-to-h264:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install owned scene and graphics runtime
        run: npm install --no-audit --no-fund
      - name: Install WebGPU browser worker
        working-directory: systemia/evercraft-web/browser-worker
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Verify original battleship geometry and canonical GPU contracts
        run: npm run test:world-engine
      - name: Ensure FFmpeg exists
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Actually rasterize 96 frames of original battleship geometry through World Engine WebGPU
        env:
          CINEMATIC_SCENE: battleship
          CINEMATIC_PROOF_OUTPUT: /tmp/evercraft-battleship-gpu-trial
          EVERCRAFT_NATIVE_BROWSER_STATE_DIR: /tmp/evercraft-battleship-browser
        run: npm run world:cinematic-render-proof
      - name: Fail if output is rotor, lacks true ship pixels, fabricates audio or loses shadow tests
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const root='/tmp/evercraft-battleship-gpu-trial';
          const r=JSON.parse(fs.readFileSync(path.join(root,'receipt.json'),'utf8'));
          const movie=path.join(root,'battleship-world-engine-trial.mp4');
          if(r.sceneType!=='procedural_battleship'
            ||r.sourceState!=='synthetic_visualization'
            ||r.soundState!=='silent_at_founder_direction_no_sound_invented'
            ||r.soundReceipt!==null
            ||r.exactGpuReadbackFrames!==96
            ||r.uniqueRawFrameDigests<20
            ||r.shadowCounterfactualChangedPixels<300
            ||r.shadowFilterChangedPixels<10
            ||r.output.width!==640||r.output.height!==360
            ||r.output.durationSec!==4||r.output.codec!=='h264'
            ||r.publicationAuthority!==false
            ||r.hardwareExecutionClaim!==false
            ||!fs.existsSync(movie)||fs.statSync(movie).size<12000){
            console.error('battleship_gpu_evidence_invalid',JSON.stringify(r,null,2));process.exit(3);
          }
          console.log('BATTLESHIP_NATIVE_RENDER_ACCEPTED',JSON.stringify({
            frames:r.exactGpuReadbackFrames,unique:r.uniqueRawFrameDigests,
            shadowPixels:r.shadowCounterfactualChangedPixels,
            pcfPixels:r.shadowFilterChangedPixels,
            mp4Sha256:r.output.sha256,bytes:fs.statSync(movie).size
          }));
          NODE
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,nb_frames -of json /tmp/evercraft-battleship-gpu-trial/battleship-world-engine-trial.mp4
      - name: Preserve founder-review MP4, true frames and verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-world-engine-battleship-cinema-proof
          path: |
            /tmp/evercraft-battleship-gpu-trial/battleship-world-engine-trial.mp4
            /tmp/evercraft-battleship-gpu-trial/receipt.json
            /tmp/evercraft-battleship-gpu-trial/opening.png
            /tmp/evercraft-battleship-gpu-trial/middle.png
            /tmp/evercraft-battleship-gpu-trial/closing.png
            /tmp/evercraft-battleship-gpu-trial/shadow-enabled-first-frame.png
            /tmp/evercraft-battleship-gpu-trial/shadow-disabled-first-frame.png
          if-no-files-found: error
          retention-days: 7
