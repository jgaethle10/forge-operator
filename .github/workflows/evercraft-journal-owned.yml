name: Evercraft Journal owned newsroom

on:
  pull_request:
    paths:
      - 'systemia/newsroom/**'
      - 'systemia/worldstate/subscriptions.json'
      - 'public/journal/**'
      - 'package.json'
      - '.github/workflows/evercraft-journal-owned.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/newsroom/**'
      - 'systemia/worldstate/subscriptions.json'
      - 'public/journal/**'
      - 'package.json'
      - '.github/workflows/evercraft-journal-owned.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove owned newsroom contracts
        run: npm run journal:test
      - name: Build owned Journal
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
        run: npm run journal:build
      - name: Verify owned Journal build outputs
        run: |
          test -f public/journal/index.html
          test -f public/journal/index.json
          test -f public/journal/feed.xml
          test -f public/journal/llms.txt
          test -f public/journal/boeing-fa-xx-industrial-base/index.html
          test -f public/journal/receipts/boeing-fa-xx-industrial-base.json
          test -f public/journal/production/boeing-fa-xx-industrial-base/fallen-brief.json
          test -f public/journal/production/boeing-fa-xx-industrial-base/clip-handoff.json
          test -f public/journal/college-football-power-rankings-2026-10-06/index.html
          test -f public/journal/receipts/college-football-power-rankings-2026-10-06.json
          test -f public/journal/production/college-football-power-rankings-2026-10-06/clip-handoff.json
          test -f public/journal/data/college-football-power-rankings-2026-10-06.json
          grep -q 'Evercraft College Football Power Rankings: Alabama Is No. 1' public/journal/college-football-power-rankings-2026-10-06/index.html
          grep -q 'https://fabric.systemiacommandcenters.com/journal/college-football-power-rankings-2026-10-06/' public/journal/college-football-power-rankings-2026-10-06/index.html
          grep -q '"ranking_run_id": "cfbpi:5d90b842afecc9f43c50ea34"' public/journal/data/college-football-power-rankings-2026-10-06.json
      - name: Verify no legacy shopping identity leaked
        run: |
          if grep -RniE 'Black Friday|shopping assistant|optimize your cart' public/journal; then
            echo "Legacy shopping identity detected in owned Journal output."
            exit 1
          fi

      - name: Persist verified Journal artifact
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
        run: |
          set -euo pipefail
          git config user.name "Evercraft Journal"
          git config user.email "evercraft-journal@users.noreply.github.com"

          regenerate() {
            rm -rf public/journal
            npm run journal:build
          }

          for ATTEMPT in 1 2 3; do
            git add public/journal
            if git diff --cached --quiet; then
              echo "Verified Journal artifact is already current."
              exit 0
            fi

            git commit -m "Refresh verified Journal artifact [skip ci]"
            if git push origin HEAD:main; then
              echo "Verified Journal artifact persisted to main."
              exit 0
            fi

            echo "Main advanced during Journal artifact publish attempt ${ATTEMPT}/3; regenerating from current main."
            git fetch origin main --quiet
            git reset --hard origin/main
            regenerate
          done

          echo "Journal artifact publication lost three consecutive main-branch races." >&2
          exit 1
