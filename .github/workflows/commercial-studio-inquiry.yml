name: Commercial Studio owned inquiry acceptance
on:
  pull_request:
    paths:
      - 'systemia/mcp/commercial-studio-inquiry.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'public/commercial-studio/index.html'
      - 'tests/fabric-commercial-studio-inquiry.test.mjs'
      - '.github/workflows/commercial-studio-inquiry.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/mcp/commercial-studio-inquiry.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'public/commercial-studio/index.html'
      - 'tests/fabric-commercial-studio-inquiry.test.mjs'
      - '.github/workflows/commercial-studio-inquiry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-party-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime module syntax and end-to-end customer inquiry
        run: |
          node --check systemia/mcp/commercial-studio-inquiry.mjs
          node --check systemia/mcp/fabric-local-runtime.mjs
          node --test tests/fabric-commercial-studio-inquiry.test.mjs
