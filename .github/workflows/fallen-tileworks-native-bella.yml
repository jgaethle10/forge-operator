name: Fallen Tile Works Native Bella Production
on:
  push:
    branches: [production/tileworks-bella-20261119]
    paths: [.github/workflows/fallen-tileworks-native-bella.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bella:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Kokoro ONNX runtime
        run: python -m pip install --disable-pip-version-check "kokoro-onnx" "soundfile" "numpy"
      - name: Fetch reviewed Apache-2.0 Kokoro checkpoint and voice embeddings
        run: |
          set -euo pipefail
          mkdir -p /tmp/tileworks-bella
          curl -fL --retry 2 --connect-timeout 20 --max-time 420 -o /tmp/tileworks-bella/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 -o /tmp/tileworks-bella/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s /tmp/tileworks-bella/kokoro-v1.0.onnx)" -gt 100000000
          test "$(stat -c%s /tmp/tileworks-bella/voices-v1.0.bin)" -gt 10000
          sha256sum /tmp/tileworks-bella/kokoro-v1.0.onnx /tmp/tileworks-bella/voices-v1.0.bin > /tmp/tileworks-bella/checkpoint-hashes.txt
      - name: Record native af_bella voice performance and provenance
        run: |
          python - <<'PY'
          import os, numpy as np, soundfile as sf, json, hashlib
          from pathlib import Path
          from kokoro_onnx import Kokoro
          root=Path('/tmp/tileworks-bella')
          voice=Kokoro(str(root/'kokoro-v1.0.onnx'),str(root/'voices-v1.0.bin'))
          lines=[
            'A beautiful finish starts long before the reveal.',
            'It starts with precision.',
            'Every cut. Every line.',
            'Details that change how a room feels.',
            'From the first step, to the finished space.',
            'Tile Works. Look closer.'
          ]
          audio=[]
          durations=[]
          for i,line in enumerate(lines):
            samples,sr=voice.create(line,voice='af_bella',speed=1.02,lang='en-us')
            samples=np.asarray(samples,dtype='float32')
            if sr!=24000 or len(samples)<12000 or not np.isfinite(samples).all():
              raise RuntimeError('INVALID_NATIVE_BELLA_TAKE')
            audio.append(samples)
            durations.append(round(len(samples)/sr,3))
            sf.write(str(root/f'bella_scene_{i+1:02d}.wav'),samples,sr,subtype='PCM_24')
          silence=np.zeros(int(0.16*24000),dtype='float32')
          joined=np.concatenate([a for chunk in audio for a in (chunk,silence)])
          if np.abs(joined).max()>=1: raise RuntimeError('AUDIO_CLIP')
          sf.write(str(root/'tileworks_bella_continuous.wav'),joined,24000,subtype='PCM_24')
          manifest={'voice':'af_bella','engine':'kokoro-onnx','sample_rate':24000,
                    'speed':1.02,'source':'Kokoro-82M official v1 voice embedding',
                    'script':lines,'scene_durations':durations,
                    'duration':round(len(joined)/24000,3),
                    'status':'AUTHENTIC_MODEL_OUTPUT_UNREVIEWED',
                    'customer_release_approved':False,
                    'model_sha256':hashlib.sha256((root/'kokoro-v1.0.onnx').read_bytes()).hexdigest(),
                    'voices_sha256':hashlib.sha256((root/'voices-v1.0.bin').read_bytes()).hexdigest(),
                    'audio_sha256':hashlib.sha256((root/'tileworks_bella_continuous.wav').read_bytes()).hexdigest()}
          (root/'receipt.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps({k:v for k,v in manifest.items() if k!='script'}))
          PY
          mkdir -p artifacts/tileworks-bella
          cp /tmp/tileworks-bella/{tileworks_bella_continuous.wav,bella_scene_*.wav,receipt.json,checkpoint-hashes.txt} artifacts/tileworks-bella/
      - name: Upload private-review Bella audio takes
        uses: actions/upload-artifact@v4
        with:
          name: tileworks-authentic-af-bella-unreviewed
          path: artifacts/tileworks-bella/
          retention-days: 2
          if-no-files-found: error
