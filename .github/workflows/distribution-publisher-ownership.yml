name: Evercraft publisher ownership evidence
on:
  pull_request:
    paths:
      - 'systemia/distribution/publisher-ownership.json'
      - 'systemia/distribution/audit-search-result-freshness.mjs'
      - 'systemia/distribution/audit-search-result-freshness.test.mjs'
      - 'systemia/distribution/probe-owned-search-candidates.mjs'
      - 'systemia/distribution/probe-owned-search-candidates.test.mjs'
      - 'systemia/distribution/audit-publisher-ownership.mjs'
      - 'systemia/distribution/audit-publisher-ownership.test.mjs'
      - 'systemia/distribution/inspect-official-mcp-registry.mjs'
      - 'systemia/distribution/inspect-official-mcp-registry.test.mjs'
      - 'systemia/distribution/build-registry-repoint-queue.mjs'
      - 'systemia/distribution/build-registry-repoint-queue.test.mjs'
      - 'systemia/distribution/inspect-owned-mcp-cold-client.mjs'
      - 'systemia/distribution/inspect-owned-mcp-cold-client.test.mjs'
      - 'registry/README.md'
      - '.github/workflows/distribution-publisher-ownership.yml'
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check systemia/distribution/audit-publisher-ownership.mjs
      - run: node --check systemia/distribution/audit-search-result-freshness.mjs
      - run: node --check systemia/distribution/probe-owned-search-candidates.mjs
      - run: node --check systemia/distribution/inspect-official-mcp-registry.mjs
      - run: node --check systemia/distribution/build-registry-repoint-queue.mjs
      - run: node --check systemia/distribution/inspect-owned-mcp-cold-client.mjs
      - name: Regression tests for publisher evidence states
        run: node --test systemia/distribution/audit-publisher-ownership.test.mjs systemia/distribution/inspect-official-mcp-registry.test.mjs systemia/distribution/build-registry-repoint-queue.test.mjs systemia/distribution/inspect-owned-mcp-cold-client.test.mjs
      - name: Test historical search observation evidence contract
        run: node --test systemia/distribution/audit-search-result-freshness.test.mjs
      - name: Audit observed indexed legacy results (no live SERP claim)
        run: node systemia/distribution/audit-search-result-freshness.mjs systemia/distribution/publisher-ownership.json "${{ runner.temp }}/search-result-freshness.json"
      - name: Test external owned-search candidate evidence contract
        run: node --test systemia/distribution/probe-owned-search-candidates.test.mjs
      - name: Probe owned public candidate pages (GET only, launch holds preserved)
        run: node systemia/distribution/probe-owned-search-candidates.mjs
        env:
          EVERCRAFT_OWNED_SEARCH_CANDIDATES_RECEIPT: ${{ runner.temp }}/owned-search-candidates.json
      - name: Validate evidence states
        env:
          OUTPUT: ${{ runner.temp }}/publisher-audit.json
        run: node systemia/distribution/audit-publisher-ownership.mjs systemia/distribution/publisher-ownership.json "$OUTPUT"
      - name: Inspect live official MCP registry
        id: registry
        continue-on-error: true
        env:
          EVERCRAFT_REGISTRY_RECEIPT_PATH: ${{ runner.temp }}/official-mcp-registry.json
        run: node systemia/distribution/inspect-official-mcp-registry.mjs
      - name: Build conservative repoint queue from external evidence
        if: steps.registry.outcome == 'success'
        run: node systemia/distribution/build-registry-repoint-queue.mjs "${{ runner.temp }}/official-mcp-registry.json" "${{ runner.temp }}/registry-repoint-queue.json"
      - name: Cold-client verify only owned MCP endpoints listed by official registry
        id: cold
        if: steps.registry.outcome == 'success'
        continue-on-error: true
        run: node systemia/distribution/inspect-owned-mcp-cold-client.mjs "${{ runner.temp }}/official-mcp-registry.json" "${{ runner.temp }}/owned-mcp-cold-client.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-ownership-audit
          path: |
            ${{ runner.temp }}/publisher-audit.json
            ${{ runner.temp }}/search-result-freshness.json
            ${{ runner.temp }}/owned-search-candidates.json
            ${{ runner.temp }}/official-mcp-registry.json
            ${{ runner.temp }}/registry-repoint-queue.json
            ${{ runner.temp }}/owned-mcp-cold-client.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve external registry observation failures
        if: steps.registry.outcome == 'failure'
        run: |
          echo 'Official MCP registry could not be verified. Do not claim publication or ownership.'
          exit 1
