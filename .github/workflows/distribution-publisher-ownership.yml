name: Evercraft publisher ownership evidence
on:
  pull_request:
    paths:
      - 'systemia/distribution/publisher-ownership.json'
      - 'systemia/distribution/audit-publisher-ownership.mjs'
      - 'systemia/distribution/audit-publisher-ownership.test.mjs'
      - 'systemia/distribution/inspect-official-mcp-registry.mjs'
      - 'systemia/distribution/inspect-official-mcp-registry.test.mjs'
      - 'systemia/distribution/build-registry-repoint-queue.mjs'
      - 'systemia/distribution/build-registry-repoint-queue.test.mjs'
      - 'registry/README.md'
      - '.github/workflows/distribution-publisher-ownership.yml'
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check systemia/distribution/audit-publisher-ownership.mjs
      - run: node --check systemia/distribution/inspect-official-mcp-registry.mjs
      - run: node --check systemia/distribution/build-registry-repoint-queue.mjs
      - name: Regression tests for publisher evidence states
        run: node --test systemia/distribution/audit-publisher-ownership.test.mjs systemia/distribution/inspect-official-mcp-registry.test.mjs systemia/distribution/build-registry-repoint-queue.test.mjs
      - name: Validate evidence states
        env:
          OUTPUT: ${{ runner.temp }}/publisher-audit.json
        run: node systemia/distribution/audit-publisher-ownership.mjs systemia/distribution/publisher-ownership.json "$OUTPUT"
      - name: Inspect live official MCP registry
        id: registry
        continue-on-error: true
        env:
          EVERCRAFT_REGISTRY_RECEIPT_PATH: ${{ runner.temp }}/official-mcp-registry.json
        run: node systemia/distribution/inspect-official-mcp-registry.mjs
      - name: Build conservative repoint queue from external evidence
        if: steps.registry.outcome == 'success'
        run: node systemia/distribution/build-registry-repoint-queue.mjs "${{ runner.temp }}/official-mcp-registry.json" "${{ runner.temp }}/registry-repoint-queue.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-ownership-audit
          path: |
            ${{ runner.temp }}/publisher-audit.json
            ${{ runner.temp }}/official-mcp-registry.json
            ${{ runner.temp }}/registry-repoint-queue.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve external registry observation failures
        if: steps.registry.outcome == 'failure'
        run: |
          echo 'Official MCP registry could not be verified. Do not claim publication or ownership.'
          exit 1
