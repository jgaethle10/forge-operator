name: Pacific ES V2 Native Brand Pronunciation Private
on:
  push:
    branches: [studio/pacific-es-v1-native-voice-20261124]
    paths:
      - systemia/media-studio/pacific-es-v2-native.py
      - .github/workflows/pacific-es-v2-native.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install Spanish Kokoro and independent speech QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0' 'faster-whisper==1.2.1'
      - name: Record brand pronunciation alternatives
        env: {HF_HUB_DISABLE_TELEMETRY: "1"}
        run: python systemia/media-studio/pacific-es-v2-native.py
      - name: Transcribe seven actual generated phrases
        env: {HF_HUB_DISABLE_TELEMETRY: "1"}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          root=Path('pacific-es-native-pronunciation-private')
          report=json.loads((root/'native_receipt.json').read_text())
          model=WhisperModel('base',device='cpu',compute_type='int8')
          for r in report['takes']:
            chunks,_=model.transcribe(str(root/r['file']),language='es',beam_size=5,
                                      vad_filter=False,condition_on_previous_text=False)
            r['asr']=' '.join(c.text.strip() for c in chunks)
            print(json.dumps(r,ensure_ascii=False),flush=True)
          (root/'native_receipt.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pacific-es-v2-pronunciation-private
          path: pacific-es-native-pronunciation-private/
          retention-days: 7
          if-no-files-found: error
