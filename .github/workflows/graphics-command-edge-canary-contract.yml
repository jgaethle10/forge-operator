name: Graphics Command Production Edge Contract

on:
  pull_request:
    paths:
      - 'scripts/fabric-edge-external-canary.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
      - 'tests/fabric-edge-external-canary-contract.test.mjs'
      - 'tests/chromebook-operator-edge-canary-workflow.test.mjs'
      - '.github/workflows/graphics-command-edge-canary-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fabric-edge-external-canary.mjs'
      - '.github/workflows/chromebook-operator-edge-canary.yml'
      - 'tests/fabric-edge-external-canary-contract.test.mjs'
      - 'tests/chromebook-operator-edge-canary-workflow.test.mjs'
      - '.github/workflows/graphics-command-edge-canary-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-graphics-edge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove Graphics Command public-edge verification contract
        run: node --test tests/fabric-edge-external-canary-contract.test.mjs tests/chromebook-operator-edge-canary-workflow.test.mjs
