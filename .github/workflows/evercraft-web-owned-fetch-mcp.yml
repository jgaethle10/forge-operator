name: Evercraft Web owned Fetch MCP proof

on:
  pull_request:
    paths:
      - 'systemia/evercraft-web/owned-fetch-mcp/**'
      - 'systemia/evercraft-web/browser-worker/policy.mjs'
      - '.github/workflows/evercraft-web-owned-fetch-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evercraft-web-owned-fetch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owned-fetch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse owned MCP implementation
        run: node --check systemia/evercraft-web/owned-fetch-mcp/server.mjs
      - name: Read-only MCP security and cold-client tests
        run: node --test systemia/evercraft-web/owned-fetch-mcp/server.test.mjs
