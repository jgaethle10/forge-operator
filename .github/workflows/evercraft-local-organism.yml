name: Evercraft local organism

on:
  pull_request:
    paths:
      - 'systemia/compute/local-organism.mjs'
      - 'systemia/compute/install-local-organism-user.sh'
      - 'systemia/compute/LOCAL_ORGANISM.md'
      - 'systemia/compute/local-organism.proof.mjs'
      - '.github/workflows/evercraft-local-organism.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/compute/local-organism.mjs'
      - 'systemia/compute/install-local-organism-user.sh'
      - 'systemia/compute/LOCAL_ORGANISM.md'
      - 'systemia/compute/local-organism.proof.mjs'
      - '.github/workflows/evercraft-local-organism.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check user-mode installer
        run: bash -n systemia/compute/install-local-organism-user.sh
      - name: Prove current-stack local organism and restart continuity
        run: node systemia/compute/local-organism.proof.mjs
      - name: Prove optional RIVET resident report capacity
        run: node systemia/compute/local-organism-rivet.proof.mjs
