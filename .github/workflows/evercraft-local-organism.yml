name: Evercraft local organism

on:
  pull_request:
    paths:
      - 'systemia/compute/local-organism.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/compute/node-seed.mjs'
      - 'systemia/evercraft-web/browser-worker/native-runtime.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/compute/node-seed.mjs'
      - 'systemia/evercraft-web/browser-worker/native-runtime.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/yard/operator.mjs'
      - 'systemia/compute/local-organism-health-watch.mjs'
      - 'systemia/compute/install-local-organism-user.sh'
      - 'systemia/raven/bootstrap-local-inference.sh'
      - 'systemia/raven/seal-inference-key.mjs'
      - 'systemia/raven/seal-inference-key.test.mjs'
      - 'systemia/compute/LOCAL_ORGANISM.md'
      - 'systemia/compute/local-organism.proof.mjs'
      - 'tests/local-organism-health-watch.test.mjs'
      - '.github/workflows/evercraft-local-organism.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/compute/local-organism.mjs'
      - 'systemia/compute/node-seed.mjs'
      - 'systemia/evercraft-web/browser-worker/native-runtime.mjs'
      - 'systemia/compute/local-organism-health-watch.mjs'
      - 'systemia/compute/install-local-organism-user.sh'
      - 'systemia/raven/bootstrap-local-inference.sh'
      - 'systemia/raven/seal-inference-key.mjs'
      - 'systemia/raven/seal-inference-key.test.mjs'
      - 'systemia/compute/LOCAL_ORGANISM.md'
      - 'systemia/compute/local-organism.proof.mjs'
      - 'tests/local-organism-health-watch.test.mjs'
      - '.github/workflows/evercraft-local-organism.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check user-mode installers
        run: |
          bash -n systemia/compute/install-local-organism-user.sh
          bash -n systemia/raven/bootstrap-local-inference.sh
          node --check systemia/raven/seal-inference-key.mjs
      - name: Prove local Raven credential sealer
        run: node --test systemia/raven/seal-inference-key.test.mjs
      - name: Prove current-stack local organism and restart continuity
        run: node systemia/compute/local-organism.proof.mjs
      - name: Prove local-organism self-healing health watch
        run: node --test tests/local-organism-health-watch.test.mjs
