name: Evercraft Headquarters acceptance
on:
  pull_request:
    paths:
      - 'public/headquarters/**'
      - 'systemia/evercraft-home/public/index.html'
      - 'tests/evercraft-headquarters-home.test.mjs'
      - '.github/workflows/evercraft-headquarters-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-and-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public and private identity boundaries
        run: node --test tests/evercraft-headquarters-home.test.mjs
