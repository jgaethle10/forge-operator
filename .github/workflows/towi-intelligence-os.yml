name: TOWI Intelligence OS

on:
  pull_request:
    paths:
      - 'systemia/towi/**'
      - 'server.ts'
      - 'package.json'
      - '.github/workflows/towi-intelligence-os.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/towi/**'
      - 'server.ts'
      - 'package.json'
      - '.github/workflows/towi-intelligence-os.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test systemia/towi/core.test.mjs
      - run: npm run lint
