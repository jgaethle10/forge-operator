name: RIVET Hosting Readiness

on:
  pull_request:
    paths:
      - 'governance/hosting/**'
      - 'systemia/migrations/brand-fidelity/**'
      - '.github/workflows/rivet-hosting-readiness.yml'

permissions:
  contents: read

jobs:
  non-authorizing-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject protected RIVET product mutations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(systemia/rivet/|public/chum/intents/rivet-site-underwriting-v1/|public/chum/proof/rivet\.json$|governance/RIVET_CHANGE_CONTROL\.md$|tests/rivet-change-control\.test\.mjs$)'; then
            echo "Protected RIVET product/governance artifact changed in a hosting-planning PR."
            exit 1
          fi

      - name: Prove locked RIVET baseline remains intact
        run: node tests/rivet-change-control.test.mjs

      - name: Prove generic brand-fidelity gate
        run: node systemia/migrations/brand-fidelity/fidelity-gate.proof.mjs
