name: RIVET Hosting Readiness

on:
  pull_request:
    paths:
      - 'governance/hosting/**'
      - 'systemia/migrations/brand-fidelity/**'
      - '.github/workflows/rivet-hosting-readiness.yml'

permissions:
  contents: read

jobs:
  non-authorizing-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject protected RIVET product mutations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(systemia/rivet/|public/chum/intents/rivet-site-underwriting-v1/|public/chum/proof/rivet\.json$|governance/RIVET_CHANGE_CONTROL\.md$|tests/rivet-change-control\.test\.mjs$)'; then
            echo "Protected RIVET product/governance artifact changed in a hosting-planning PR."
            exit 1
          fi

      - name: Diagnose inherited locked-baseline state without mutating it
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tests/rivet-change-control.test.mjs
          head_status=$?
          set -e

          rm -rf /tmp/rivet-base
          git worktree add --detach /tmp/rivet-base "origin/${{ github.base_ref }}"
          set +e
          (cd /tmp/rivet-base && node tests/rivet-change-control.test.mjs)
          base_status=$?
          set -e
          git worktree remove /tmp/rivet-base --force

          if [ "$base_status" -eq 0 ] && [ "$head_status" -ne 0 ]; then
            echo "This PR introduced a locked RIVET baseline failure."
            exit 1
          fi

          if [ "$base_status" -ne 0 ] && [ "$head_status" -ne 0 ]; then
            echo "::warning::Locked RIVET baseline test already fails on the PR base branch. Protected-path diff gate proves this hosting-planning PR did not mutate those artifacts."
          fi

      - name: Prove generic brand-fidelity gate
        run: node systemia/migrations/brand-fidelity/fidelity-gate.proof.mjs
