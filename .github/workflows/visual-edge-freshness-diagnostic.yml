name: Visual Edge Freshness Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/fabric-edge-visual-freshness.mjs'
      - 'scripts/diagnose-fabric-owned-edge-release.sh'
      - '.github/workflows/visual-edge-freshness-diagnostic.yml'
      - 'systemia/graphics-command/**'
      - 'systemia/visual-desk/**'
  push:
    branches: [main]
    paths:
      - 'scripts/fabric-edge-visual-freshness.mjs'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - '.github/workflows/visual-edge-freshness-diagnostic.yml'
      - 'systemia/graphics-command/**'
      - 'systemia/visual-desk/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production-visual-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate safe on-host release doctor
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/diagnose-fabric-owned-edge-release.sh
          bash scripts/diagnose-fabric-owned-edge-release.sh --help | grep -q 'performs no fetch'

      - name: Fingerprint expected and live Visual Desk specimen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            node scripts/fabric-edge-visual-freshness.mjs \
              --origin https://fabric.systemiacommandcenters.com \
              > artifacts/visual-edge-freshness.json
            cat artifacts/visual-edge-freshness.json
            exit 0
          fi

          max_attempts=16
          attempt=1
          status=1
          while [ "$attempt" -le "$max_attempts" ]; do
            set +e
            node scripts/fabric-edge-visual-freshness.mjs \
              --origin https://fabric.systemiacommandcenters.com \
              --require-fresh \
              > artifacts/visual-edge-freshness.json
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            state="$(jq -r '.state // "unknown"' artifacts/visual-edge-freshness.json 2>/dev/null || echo unknown)"
            if [ "$state" != "stale" ] || [ "$attempt" -ge "$max_attempts" ]; then
              break
            fi

            echo "Visual Desk is still stale; waiting for the owned updater ($attempt/$max_attempts)."
            sleep 20
            attempt=$((attempt + 1))
          done

          cat artifacts/visual-edge-freshness.json
          if [ "$status" -ne 0 ]; then
            echo "Visual Desk failed to converge after $attempt attempt(s)." >&2
            exit "$status"
          fi

      - name: Upload freshness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-edge-freshness
          path: artifacts/visual-edge-freshness.json
          if-no-files-found: error
          retention-days: 90
