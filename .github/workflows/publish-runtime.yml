name: Publish Forge runtime image

on:
  workflow_run:
    workflows:
      - Forge checks
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main-branch commit SHA to release
        required: true
        type: string
      approval:
        description: Type RELEASE for a human-approved trust/destructive release
        required: true
        type: string
      approval_ref:
        description: Human approval reference or reason
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: systemia-runtime-release-${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      base: ${{ steps.gate.outputs.base }}
      risk_class: ${{ steps.gate.outputs.risk_class }}
      release_allowed: ${{ steps.gate.outputs.release_allowed }}
      approval_mode: ${{ steps.gate.outputs.approval_mode }}
      reasons: ${{ steps.gate.outputs.reasons }}
    steps:
      - name: Resolve release revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ inputs.sha }}"
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Release requires an exact 40-character commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0

      - name: Classify verified diff
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.revision.outputs.sha }}"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "Refusing release: requested SHA is not contained in main."
            exit 1
          }

          BASE="$(git rev-parse "$SHA^")"
          node systemia/release/release-policy.mjs --base "$BASE" --head "$SHA" > release-classification.json

          RISK="$(node -p "require('./release-classification.json').riskClass")"
          AUTO="$(node -p "require('./release-classification.json').autoReleaseAllowed")"
          REASONS="$(node -p "require('./release-classification.json').reasons.join(';')")"

          MODE="auto_policy"
          ALLOWED="false"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "$RISK" = "routine_public" ] && [ "$AUTO" = "true" ]; then
              ALLOWED="true"
            fi
          else
            MODE="human"
            if [ "${{ inputs.approval }}" = "RELEASE" ] && [ -n "${{ inputs.approval_ref }}" ]; then
              ALLOWED="true"
            else
              echo "Manual release requires approval=RELEASE and a non-empty approval_ref."
              exit 1
            fi
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "risk_class=$RISK" >> "$GITHUB_OUTPUT"
          echo "release_allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "approval_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "reasons=$REASONS" >> "$GITHUB_OUTPUT"

          {
            echo "## Systemia ReleaseAuthorization"
            echo
            echo "- Revision: \`$SHA\`"
            echo "- Risk class: **$RISK**"
            echo "- Approval mode: **$MODE**"
            echo "- Release allowed: **$ALLOWED**"
            echo "- Reasons: $REASONS"
            if [ "$MODE" = "human" ]; then
              echo "- Approval ref: ${{ inputs.approval_ref }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve authorization receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-authorization-${{ steps.gate.outputs.sha }}
          path: release-classification.json
          retention-days: 90

  verify:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify exact release candidate
        run: npm run check

      - name: Build production container
        run: docker build -t forge-operator:${{ needs.authorize.outputs.sha }} .

  held:
    needs:
      - authorize
      - verify
    if: needs.authorize.outputs.release_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record held release
        run: |
          {
            echo "## Release held by Systemia"
            echo
            echo "Revision \`${{ needs.authorize.outputs.sha }}\` passed verification but was **not** published."
            echo
            echo "Risk class: **${{ needs.authorize.outputs.risk_class }}**"
            echo
            echo "Reasons: ${{ needs.authorize.outputs.reasons }}"
            echo
            echo "Use the manual workflow dispatch against this exact main-branch SHA for an explicitly approved release."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs:
      - authorize
      - verify
    if: needs.authorize.outputs.release_allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish authorized runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forge-operator:latest
            ghcr.io/${{ github.repository_owner }}/forge-operator:${{ needs.authorize.outputs.sha }}

      - name: Write ReleaseExecutionReceipt
        shell: bash
        run: |
          cat > release-execution-receipt.json <<'JSON'
          {
            "schema": "systemia.release.execution-receipt.v1",
            "repository": "${{ github.repository }}",
            "revision": "${{ needs.authorize.outputs.sha }}",
            "risk_class": "${{ needs.authorize.outputs.risk_class }}",
            "approval_mode": "${{ needs.authorize.outputs.approval_mode }}",
            "artifact": "ghcr.io/${{ github.repository_owner }}/forge-operator:${{ needs.authorize.outputs.sha }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "credential_material_stored": false,
            "workflow_run_id": "${{ github.run_id }}"
          }
          JSON
          cat release-execution-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve ReleaseExecutionReceipt
        uses: actions/upload-artifact@v4
        with:
          name: release-execution-${{ needs.authorize.outputs.sha }}
          path: release-execution-receipt.json
          retention-days: 90
