name: Evercraft Plumbing - GitHub writer authority

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/audit-workflow-writers.mjs'
      - 'tests/workflow-writer-audit.test.mjs'
      - 'audits/workflow-writer-baseline-2026-10-15.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/audit-workflow-writers.mjs'
      - 'tests/workflow-writer-audit.test.mjs'
      - 'audits/workflow-writer-baseline-2026-10-15.json'
  schedule:
    - cron: '31 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evercraft-plumbing-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-authority-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed regression tests
        run: node --test tests/workflow-writer-audit.test.mjs
      - name: Inspect all workflow-file write and main-push authority
        run: node scripts/audit-workflow-writers.mjs > "$RUNNER_TEMP/evercraft-workflow-writers.json"
      - name: Post workflow audit summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/evercraft-workflow-writers.json" ]; then
            echo "## Read-only writer audit" >> "$GITHUB_STEP_SUMMARY"
            node -e 'const x=require(process.argv[1]); console.log("Workflows:",x.workflow_count,"Direct writers:",x.active_writer_count,"Pushes to main:",x.direct_main_push_count,"New high-risk findings:",x.findings.length);' "$RUNNER_TEMP/evercraft-workflow-writers.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-workflow-writer-audit
          path: ${{ runner.temp }}/evercraft-workflow-writers.json
          if-no-files-found: warn
          retention-days: 60
