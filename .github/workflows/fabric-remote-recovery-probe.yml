name: Fabric Remote Recovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fabric-remote-recovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CAPACITY_ENDPOINT: ${{ secrets.EVERCRAFT_REMOTE_OPERATOR_CAPACITY_ENDPOINT }}
      CONTROL_TOKEN: ${{ secrets.EVERCRAFT_REMOTE_OPERATOR_CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify bounded Remote Operator status validator (offline)
        run: node --test tests/validate-fabric-remote-operator-status.test.mjs

      - name: Probe configured outbound Remote Operator without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${CAPACITY_ENDPOINT:-}" ] || [ -z "${CONTROL_TOKEN:-}" ]; then
            cat > artifacts/fabric-remote-recovery-probe.json <<'JSON'
          {
            "schema":"evercraft.fabric.remote-recovery-probe.v1",
            "configured":false,
            "reachable":false,
            "mutation_performed":false,
            "state":"repository_remote_operator_secrets_unavailable"
          }
          JSON
            cat artifacts/fabric-remote-recovery-probe.json
            # Missing credentials must not produce a green CI result.
            # The explicit not-configured receipt remains uploaded by if: always().
            echo "::error title=Remote Operator not configured::Scoped endpoint or control token unavailable; no authenticated remote health check occurred."
            exit 1
          fi

          node --input-type=module <<'NODE' > artifacts/fabric-remote-recovery-probe.json
          import {validateRemoteOperatorStatus} from './scripts/validate-fabric-remote-operator-status.mjs';
          const endpoint=String(process.env.CAPACITY_ENDPOINT||'').replace(/\/$/,'');
          const token=String(process.env.CONTROL_TOKEN||'');
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),15000);
          try{
            if(new URL(endpoint).protocol!=='https:') throw new TypeError('insecure_remote_operator_endpoint');
            const response=await fetch(endpoint+'/v1/operator/status',{
              headers:{authorization:'Bearer '+token,accept:'application/json'},
              signal:controller.signal,
              redirect:'error',
            });
            const body=await response.json().catch(()=>null);
            const validation=validateRemoteOperatorStatus(body);
            if(response.status!==200||!validation.valid){
              process.stdout.write(JSON.stringify({
                schema:'evercraft.fabric.remote-recovery-probe.v1',
                configured:true,
                reachable:false,
                mutation_performed:false,
                state:response.status!==200?'remote_operator_http_error':'remote_operator_status_invalid',
                http_status:response.status,
                validation_reason:validation.reason,
              },null,2)+'\n');
              process.exitCode=1;
            }else{
              process.stdout.write(JSON.stringify({
                schema:'evercraft.fabric.remote-recovery-probe.v1',
                configured:true,
                reachable:true,
                mutation_performed:false,
                state:'remote_operator_ready',
                operator_schema:body.schema||null,
                instance_id:body.instance_id||null,
                roots:Array.isArray(body.roots)?body.roots:[],
                execution_mode:body.execution?.mode||null,
                programs:Array.isArray(body.execution?.programs)?body.execution.programs:[],
                root_privilege:body.execution?.root_privilege===true,
              },null,2)+'\n');
            }
          }catch(error){
            process.stdout.write(JSON.stringify({
              schema:'evercraft.fabric.remote-recovery-probe.v1',
              configured:true,
              reachable:false,
              mutation_performed:false,
              state:'remote_operator_probe_error',
              error_name:String(error?.name||'Error'),
            },null,2)+'\n');
            process.exitCode=1;
          }finally{
            clearTimeout(timer);
          }
          NODE
          cat artifacts/fabric-remote-recovery-probe.json

      - name: Preserve remote recovery probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-remote-recovery-probe
          path: artifacts/fabric-remote-recovery-probe.json
          if-no-files-found: error
          retention-days: 30
