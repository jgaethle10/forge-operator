name: Fabric Remote Recovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fabric-remote-recovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CAPACITY_ENDPOINT: ${{ secrets.EVERCRAFT_REMOTE_OPERATOR_CAPACITY_ENDPOINT }}
      CONTROL_TOKEN: ${{ secrets.EVERCRAFT_REMOTE_OPERATOR_CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe configured outbound Remote Operator without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${CAPACITY_ENDPOINT:-}" ] || [ -z "${CONTROL_TOKEN:-}" ]; then
            cat > artifacts/fabric-remote-recovery-probe.json <<'JSON'
          {
            "schema":"evercraft.fabric.remote-recovery-probe.v1",
            "configured":false,
            "reachable":false,
            "mutation_performed":false,
            "state":"repository_remote_operator_secrets_unavailable"
          }
          JSON
            cat artifacts/fabric-remote-recovery-probe.json
            # Missing credentials must not produce a green CI result.
            # The explicit not-configured receipt remains uploaded by if: always().
            echo "::error title=Remote Operator not configured::Scoped endpoint or control token unavailable; no authenticated remote health check occurred."
            exit 1
          fi

          node <<'NODE' > artifacts/fabric-remote-recovery-probe.json
          const endpoint=String(process.env.CAPACITY_ENDPOINT||'').replace(/\/$/,'');
          const token=String(process.env.CONTROL_TOKEN||'');
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),15000);
          try{
            const response=await fetch(endpoint+'/v1/operator/status',{
              headers:{authorization:'Bearer '+token,accept:'application/json'},
              signal:controller.signal,
            });
            const body=await response.json().catch(()=>null);
            const {assessRemoteOperatorStatus}=await import('./scripts/remote-recovery-status-contract.mjs');
            const assessment=assessRemoteOperatorStatus(body);
            const accepted=response.ok && assessment.accepted === true;
            process.stdout.write(JSON.stringify({
              schema:'evercraft.fabric.remote-recovery-probe.v1',
              configured:true,
              reachable:accepted,
              mutation_performed:false,
              state:accepted?'remote_operator_status_contract_verified':'remote_operator_status_not_accepted',
              http_status:response.status,
              ...assessment,
              // A remote status response never alone proves which physical
              // node answered, and cannot enroll/authorize any device.
              node002_identity_verified:false,
              production_remote_dispatch_verified:false,
            },null,2)+'\\n');
            if(!accepted)process.exitCode=1;
          }catch(error){
            process.stdout.write(JSON.stringify({
              schema:'evercraft.fabric.remote-recovery-probe.v1',
              configured:true,
              reachable:false,
              mutation_performed:false,
              state:'remote_operator_probe_error',
              error_name:String(error?.name||'Error'),
            },null,2)+'\n');
            process.exitCode=1;
          }finally{
            clearTimeout(timer);
          }
          NODE
          cat artifacts/fabric-remote-recovery-probe.json

      - name: Preserve remote recovery probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-remote-recovery-probe
          path: artifacts/fabric-remote-recovery-probe.json
          if-no-files-found: error
          retention-days: 30
