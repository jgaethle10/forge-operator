name: Publish MCP Registry manifests

on:
  push:
    branches:
      - main
    paths:
      - "mcp-registry/*.json"
      - ".github/workflows/publish-mcp-registry.yml"
      - "systemia/release/**"
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main-branch commit SHA to publish
        required: true
        type: string
      manifest:
        description: Manifest path, for example mcp-registry/systemia-website-audit.json
        required: true
        type: string
      approval:
        description: Type RELEASE for a human-approved trust/destructive publication
        required: true
        type: string
      approval_ref:
        description: Human approval reference or reason
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      base: ${{ steps.gate.outputs.base }}
      release_allowed: ${{ steps.gate.outputs.release_allowed }}
      risk_class: ${{ steps.gate.outputs.risk_class }}
    steps:
      - name: Resolve revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SHA="${{ inputs.sha }}"; else SHA="${{ github.sha }}"; fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and authorize
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.revision.outputs.sha }}"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SHA" origin/main || { echo "Requested SHA is not on main."; exit 1; }
          BASE="$(git rev-parse "$SHA^")"
          npm install --no-audit --no-fund
          npm run check
          node systemia/release/release-policy.mjs --base "$BASE" --head "$SHA" > release-classification.json
          RISK="$(node -p "require('./release-classification.json').riskClass")"
          AUTO="$(node -p "require('./release-classification.json').autoReleaseAllowed")"
          ALLOWED="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.approval }}" = "RELEASE" ] && [ -n "${{ inputs.approval_ref }}" ] && ALLOWED="true"
          elif [ "$RISK" = "routine_public" ] && [ "$AUTO" = "true" ]; then
            ALLOWED="true"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "release_allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "risk_class=$RISK" >> "$GITHUB_OUTPUT"
          {
            echo "## Systemia ReleaseAuthorization"
            echo "- Revision: \`$SHA\`"
            echo "- Risk class: **$RISK**"
            echo "- Release allowed: **$ALLOWED**"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: authorize
    if: needs.authorize.outputs.release_allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0

      - name: Determine manifests to publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.manifest }}" > /tmp/mcp-manifests.txt
          else
            git diff --name-only "${{ needs.authorize.outputs.base }}" "${{ needs.authorize.outputs.sha }}" -- 'mcp-registry/*.json' > /tmp/mcp-manifests.txt
          fi
          if [ ! -s /tmp/mcp-manifests.txt ]; then
            echo "No MCP manifests changed."
            exit 0
          fi
          while IFS= read -r manifest; do
            case "$manifest" in
              mcp-registry/*.json) ;;
              *) echo "Refusing unexpected manifest path: $manifest"; exit 1 ;;
            esac
            test -f "$manifest" || { echo "Missing manifest: $manifest"; exit 1; }
          done < /tmp/mcp-manifests.txt

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            ./mcp-publisher validate "$manifest"
          done < /tmp/mcp-manifests.txt

      - name: Verify remote MCP handshakes
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"evercraft-registry-publisher","version":"1.0"}}}'
          while IFS= read -r manifest; do
            NAME="$(jq -r '.name' "$manifest")"
            URL="$(jq -r '.remotes[0].url // empty' "$manifest")"
            if [ -z "$URL" ]; then continue; fi
            BODY="$(curl -fsS --max-time 25 -X POST "$URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data "$PAYLOAD")"
            printf '%s' "$BODY" | grep -q '"serverInfo"' || { echo "MCP initialize failed for $NAME" >&2; exit 1; }
          done < /tmp/mcp-manifests.txt

      - name: Authenticate with Official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish authorized manifests
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r manifest; do
            echo "::group::Publish $manifest"
            set +e
            OUTPUT="$(./mcp-publisher publish "$manifest" 2>&1)"
            CODE=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$CODE" -ne 0 ]; then
              if printf '%s' "$OUTPUT" | grep -q 'cannot publish duplicate version'; then
                echo "Already published at this version; continuing idempotently."
              else
                echo "Publish failed for $manifest" >&2
                FAILED=1
              fi
            fi
            echo "::endgroup::"
          done < /tmp/mcp-manifests.txt
          [ "$FAILED" -eq 0 ]

      - name: Record ReleaseExecutionReceipt
        run: |
          {
            echo "## ReleaseExecutionReceipt"
            echo "- Revision: \`${{ needs.authorize.outputs.sha }}\`"
            echo "- Risk class: **${{ needs.authorize.outputs.risk_class }}**"
            echo "- Target: Official MCP Registry"
            echo "- credential_material_stored: false"
          } >> "$GITHUB_STEP_SUMMARY"

  held:
    needs: authorize
    if: needs.authorize.outputs.release_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Systemia held this publication for explicit approval." >> "$GITHUB_STEP_SUMMARY"
