name: Publish MCP Registry manifests

on:
  push:
    branches:
      - main
    paths:
      - "mcp-registry/*.json"
      - ".github/workflows/publish-mcp-registry.yml"
      - "systemia/release/**"
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main-branch commit SHA to publish
        required: true
        type: string
      manifest:
        description: Manifest path, for example mcp-registry/systemia-website-audit.json
        required: true
        type: string
      approval:
        description: Type RELEASE for a human-approved trust/destructive publication
        required: true
        type: string
      approval_ref:
        description: Human approval reference or reason
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      base: ${{ steps.gate.outputs.base }}
      release_allowed: ${{ steps.gate.outputs.release_allowed }}
      risk_class: ${{ steps.gate.outputs.risk_class }}
      approval_mode: ${{ steps.gate.outputs.approval_mode }}
      approval_ref: ${{ steps.gate.outputs.approval_ref }}
    steps:
      - name: Resolve revision
        id: revision
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SHA="$INPUT_SHA"; else SHA="${{ github.sha }}"; fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and authorize
        id: gate
        shell: bash
        env:
          INPUT_APPROVAL: ${{ inputs.approval }}
          INPUT_APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          SHA="${{ steps.revision.outputs.sha }}"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SHA" origin/main || { echo "Requested SHA is not on main."; exit 1; }
          BASE="$(git rev-parse "$SHA^")"
          npm install --no-audit --no-fund
          npm run check
          node systemia/release/release-policy.mjs --base "$BASE" --head "$SHA" > release-classification.json
          RISK="$(node -p "require('./release-classification.json').riskClass")"
          AUTO="$(node -p "require('./release-classification.json').autoReleaseAllowed")"
          ALLOWED="false"
          APPROVAL_MODE="none"
          APPROVAL_REF=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_APPROVAL" = "RELEASE" ] && [ -n "$INPUT_APPROVAL_REF" ]; then
              ALLOWED="true"
              APPROVAL_MODE="human_dispatch"
              APPROVAL_REF="$INPUT_APPROVAL_REF"
            fi
          elif [ "$RISK" = "routine_public" ] && [ "$AUTO" = "true" ]; then
            ALLOWED="true"
            APPROVAL_MODE="auto_policy"
            APPROVAL_REF="routine_public"
          else
            mapfile -t MANIFESTS < <(git diff --name-only "$BASE" "$SHA" -- 'mcp-registry/*.json')
            if [ "${#MANIFESTS[@]}" -eq 1 ]; then
              MANIFEST="${MANIFESTS[0]}"
              if node systemia/release/scoped-approval.mjs --base "$BASE" --head "$SHA" --manifest "$MANIFEST" > scoped-approval.json; then
                ALLOWED="true"
                APPROVAL_MODE="scoped_operator_receipt"
                APPROVAL_REF="$(node -p "require('./scoped-approval.json').approval_ref")"
              fi
            fi
          fi
          APPROVAL_REF="$(printf '%s' "$APPROVAL_REF" | tr '\r\n' ' ' | cut -c1-200)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "release_allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "risk_class=$RISK" >> "$GITHUB_OUTPUT"
          echo "approval_mode=$APPROVAL_MODE" >> "$GITHUB_OUTPUT"
          echo "approval_ref=$APPROVAL_REF" >> "$GITHUB_OUTPUT"
          {
            echo "## Systemia ReleaseAuthorization"
            printf -- '- Revision: `%s`\n' "$SHA"
            printf -- '- Risk class: **%s**\n' "$RISK"
            printf -- '- Approval mode: **%s**\n' "$APPROVAL_MODE"
            printf -- '- Approval ref: `%s`\n' "${APPROVAL_REF:-none}"
            printf -- '- Release allowed: **%s**\n' "$ALLOWED"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: authorize
    if: needs.authorize.outputs.release_allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine manifests to publish
        shell: bash
        env:
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "$INPUT_MANIFEST" > /tmp/mcp-manifests.txt
          else
            git diff --name-only "${{ needs.authorize.outputs.base }}" "${{ needs.authorize.outputs.sha }}" -- 'mcp-registry/*.json' > /tmp/mcp-manifests.txt
          fi
          if [ ! -s /tmp/mcp-manifests.txt ]; then
            echo "No MCP manifests changed."
            exit 0
          fi
          while IFS= read -r manifest; do
            case "$manifest" in
              mcp-registry/*.json) ;;
              *) echo "Refusing unexpected manifest path: $manifest"; exit 1 ;;
            esac
            test -f "$manifest" || { echo "Missing manifest: $manifest"; exit 1; }
          done < /tmp/mcp-manifests.txt

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            ./mcp-publisher validate "$manifest"
          done < /tmp/mcp-manifests.txt

      - name: Verify remote MCP handshakes
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"evercraft-registry-publisher","version":"1.0"}}}'
          while IFS= read -r manifest; do
            NAME="$(jq -r '.name' "$manifest")"
            URL="$(jq -r '.remotes[0].url // empty' "$manifest")"
            if [ -z "$URL" ]; then continue; fi
            BODY="$(curl -fsS --max-time 25 -X POST "$URL" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data "$PAYLOAD")"
            printf '%s' "$BODY" | grep -q '"serverInfo"' || { echo "MCP initialize failed for $NAME" >&2; exit 1; }
          done < /tmp/mcp-manifests.txt

      - name: Authenticate with Official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish authorized manifests
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          : > /tmp/published-manifests.txt
          while IFS= read -r manifest; do
            echo "::group::Publish $manifest"
            set +e
            OUTPUT="$(./mcp-publisher publish "$manifest" 2>&1)"
            CODE=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$CODE" -eq 0 ]; then
              printf '%s\n' "$manifest" >> /tmp/published-manifests.txt
            elif printf '%s' "$OUTPUT" | grep -q 'cannot publish duplicate version'; then
              echo "Already published at this version; continuing idempotently."
              printf '%s\n' "$manifest" >> /tmp/published-manifests.txt
            else
              echo "Publish failed for $manifest" >&2
              FAILED=1
            fi
            echo "::endgroup::"
          done < /tmp/mcp-manifests.txt
          [ "$FAILED" -eq 0 ]

      - name: Record ReleaseExecutionReceipt
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_RISK: ${{ needs.authorize.outputs.risk_class }}
          RELEASE_APPROVAL_MODE: ${{ needs.authorize.outputs.approval_mode }}
          RELEASE_APPROVAL_REF: ${{ needs.authorize.outputs.approval_ref }}
        run: |
          {
            echo "## ReleaseExecutionReceipt"
            printf -- '- Revision: `%s`\n' "$RELEASE_SHA"
            printf -- '- Risk class: **%s**\n' "$RELEASE_RISK"
            echo "- Target: Official MCP Registry"
            printf -- '- Approval mode: **%s**\n' "$RELEASE_APPROVAL_MODE"
            printf -- '- Approval ref: `%s`\n' "$RELEASE_APPROVAL_REF"
            echo "- credential_material_stored: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile successful Yard specialist publications into source truth
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_APPROVAL_MODE: ${{ needs.authorize.outputs.approval_mode }}
          RELEASE_APPROVAL_REF: ${{ needs.authorize.outputs.approval_ref }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/published-manifests.txt ]; then
            echo "No successfully published manifests to reconcile."
            exit 0
          fi

          git fetch origin main --quiet

          while IFS= read -r manifest; do
            case "$manifest" in
              mcp-registry/ibmi-rescue.json|mcp-registry/foundry-app-escape.json|mcp-registry/site-survive.json)
                old="$(mktemp)"
                new="$(mktemp)"
                git show "$RELEASE_SHA:$manifest" > "$old"
                git show "origin/main:$manifest" > "$new"
                cmp -s "$old" "$new" || {
                  echo "Current main changed $manifest after publication. Holding source-state reconciliation."
                  exit 1
                }
                ;;
              *) ;;
            esac
          done < /tmp/published-manifests.txt

          git switch -C registry-publication-record origin/main

          node scripts/record-mcp-registry-publication.mjs             --manifests-file /tmp/published-manifests.txt             --workflow-run-id "$GITHUB_RUN_ID"             --release-sha "$RELEASE_SHA"             --approval-mode "$RELEASE_APPROVAL_MODE"             --approval-ref "$RELEASE_APPROVAL_REF"

          node scripts/generate-direct-plugin-packages.mjs
          node scripts/generate-mcp-registry-candidates.mjs
          node systemia/chum/build-capability-mirror.mjs
          npm run direct:check

          git add             distribution/direct-plugin-specs.json             distribution/direct-product-doors.json             public/.well-known/evercraft-direct-doors.json             distribution/mcp-registry-candidates             distribution/mcp-registry-publication-receipts             plugins/ibmi-rescue             plugins/foundry-app-escape             plugins/site-survive             public/chum

          if git diff --cached --quiet; then
            echo "No Yard specialist registry state required reconciliation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record verified MCP Registry publication"
          git push origin HEAD:main

  held:
    needs: authorize
    if: needs.authorize.outputs.release_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Systemia held this publication for explicit approval." >> "$GITHUB_STEP_SUMMARY"
