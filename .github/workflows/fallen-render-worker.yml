name: Fallen Render Worker

on:
  pull_request:
    paths:
      - "systemia/media-studio/render-worker/**"
      - "systemia/media-studio/visual-stage*.ts"
      - "systemia/media-studio/world-*.ts"
      - ".github/workflows/fallen-render-worker.yml"
  push:
    branches: [main]
    paths:
      - "systemia/media-studio/render-worker/**"
      - "systemia/media-studio/visual-stage*.ts"
      - "systemia/media-studio/world-*.ts"
      - ".github/workflows/fallen-render-worker.yml"

permissions:
  contents: read

jobs:
  render-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: systemia/media-studio/render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Policy tests
        run: npm test
      - name: Build renderer image
        run: docker build -t evercraft/fallen-render-worker:ci .
      - name: Start renderer
        run: |
          docker run -d --name fallen-render-ci \
            -p 8791:8787 \
            -e FALLEN_RENDER_WORKER_TOKEN=ci-token \
            evercraft/fallen-render-worker:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8791/healthz >/tmp/fallen-health.json; then exit 0; fi
            sleep 1
          done
          docker logs fallen-render-ci
          exit 1
      - name: Render deterministic frame canary
        run: |
          cat >/tmp/fallen-render-job.json <<'JSON'
          {
            "schema":"evercraft.fallen.render-job.v1",
            "job_id":"ci-proof",
            "stage":{
              "schema":"evercraft.fallen.visual-stage.v1",
              "id":"ci-stage",
              "width":640,
              "height":360,
              "fps":30,
              "durationSec":2,
              "background":"#080b0b",
              "camera":{"keyframes":[{"t":0,"x":0,"y":0,"zoom":1}]},
              "layers":[
                {"id":"headline","kind":"text","z":1,"x":30,"y":30,"width":580,"height":120,"text":"EVERCRAFT VISUAL STAGE","fontSize":42,"fontWeight":700},
                {"id":"metric","kind":"metric","z":2,"x":30,"y":190,"width":300,"height":120,"label":"FRAME PROOF","from":0,"to":100,"progress":[{"t":0,"value":0},{"t":2,"value":1}]}
              ],
              "createdAt":"2026-09-27T00:00:00.000Z"
            },
            "assets":[],
            "frame_start":30,
            "frame_count":1
          }
          JSON
          curl -fsS \
            -H 'authorization: Bearer ci-token' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/fallen-render-job.json \
            http://127.0.0.1:8791/v1/render >/tmp/fallen-render-result.json
          node - <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync('/tmp/fallen-render-result.json','utf8'));
          if(!row.ok) throw new Error(JSON.stringify(row));
          if(row.frames?.length!==1) throw new Error('frame_count_mismatch');
          if(!/^[a-f0-9]{64}$/.test(row.frames[0].sha256||'')) throw new Error('frame_sha_missing');
          if(row.frames[0].frame!==30) throw new Error('wrong_frame_rendered');
          if(row.boundaries?.external_network_allowed!==false) throw new Error('network_boundary_missing');
          console.log(JSON.stringify({frame:row.frames[0],receipt:row.receipt_sha256}));
          NODE
      - name: Render a native source-camera raster canary
        run: |
          node camera-png.mjs create /tmp/fallen-native-camera-source.png
          docker exec fallen-render-ci mkdir -p /work/assets/native-camera-ci
          docker cp /tmp/fallen-native-camera-source.png fallen-render-ci:/work/assets/native-camera-ci/source.png
          node - <<'NODE'
          const crypto=require('node:crypto'),fs=require('node:fs');
          const digest=crypto.createHash('sha256').update(fs.readFileSync('/tmp/fallen-native-camera-source.png')).digest('hex');
          const stage={
            schema:'evercraft.fallen.visual-stage.v1',id:'native-camera-ci',
            width:540,height:960,fps:30,durationSec:3,background:'#080b0b',
            camera:{keyframes:[{t:0,x:0,y:0,zoom:1}]},
            layers:[{
              id:'synthetic-source',kind:'media',mediaKind:'image',
              x:25,y:150,width:490,height:630,z:1,fit:'cover',
              sourcePath:'asset://synthetic-camera',
              sourceRefs:['ci:synthetic-spatial-color-fixture'],evidenceState:'synthetic_visualization',
              sourceWindow:{x:300,y:400,width:840,height:1080,sourceWidth:1440,sourceHeight:2408},
              sourceWindowKeyframes:[
                {t:0,x:300,y:400,width:840,height:1080},
                {t:1.5,x:300,y:850,width:840,height:1080,ease:'ease_in_out'},
                {t:3,x:300,y:1250,width:840,height:1080,ease:'ease_in_out'}
              ]
            }],
            createdAt:'2026-10-19T00:00:00.000Z'
          };
          for(const frame of [0,45,89]){
            fs.writeFileSync('/tmp/fallen-camera-job-'+frame+'.json',JSON.stringify({
              schema:'evercraft.fallen.render-job.v1',job_id:'camera-frame-'+frame,
              asset_scope_id:'native-camera-ci',stage,
              assets:[{id:'synthetic-camera',filename:'source.png',sha256:digest,media_type:'image/png'}],
              frame_start:frame,frame_count:1
            }));
          }
          NODE
          for frame in 0 45 89; do
            curl -fsS --retry 2 -H 'authorization: Bearer ci-token' \
              -H 'content-type: application/json' \
              --data-binary @/tmp/fallen-camera-job-$frame.json \
              http://127.0.0.1:8791/v1/render > /tmp/fallen-camera-$frame.json
            curl -fsS -H 'authorization: Bearer ci-token' \
              http://127.0.0.1:8791/v1/artifact/camera-frame-$frame/frame-$(printf '%08d' "$frame").png \
              > /tmp/fallen-camera-$frame.png
          done
          node camera-canary-assert.mjs /tmp/fallen-camera

      - name: Preserve synthetic native camera proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallen-native-camera-ci
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/fallen-camera-*.png
            /tmp/fallen-camera-proof.json

      - name: Preserve exact runtime used by native rendering proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallen-runtime-verified-source
          retention-days: 7
          if-no-files-found: error
          path: |
            systemia/media-studio/render-worker/runtime.mjs
            systemia/media-studio/render-worker/policy.mjs
            systemia/media-studio/render-worker/camera-png.mjs
            systemia/media-studio/render-worker/camera-canary-assert.mjs

      - name: Show renderer logs on failure
        if: failure()
        run: docker logs fallen-render-ci || true
      - name: Stop renderer
        if: always()
        run: docker rm -f fallen-render-ci || true
