name: Worlds Quest Master V1
on:
  pull_request:
    paths:
      - 'public/worlds/**'
      - 'systemia/worlds/quest-model-planner.mjs'
      - 'scripts/worlds-nextgen-quest.mjs'
      - 'tests/worlds-quest-*.test.mjs'
      - 'systemia/worlds/QUEST_MASTER_V0.md'
      - '.github/workflows/worlds-quest-master.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quest-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Module syntax
        run: |
          node --check public/worlds/quest-master.mjs
          node --check public/worlds/app.mjs
          node --check systemia/worlds/quest-model-planner.mjs
          node --check scripts/worlds-nextgen-quest.mjs
      - name: Authorization, local adapter and model reply proofs
        run: node --test tests/worlds-quest-master.test.mjs tests/worlds-quest-model-planner.test.mjs
