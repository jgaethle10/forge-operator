name: Worlds Quest Master V0
on:
  pull_request:
    paths:
      - 'public/worlds/**'
      - 'tests/worlds-quest-master.test.mjs'
      - 'systemia/worlds/QUEST_MASTER_V0.md'
      - '.github/workflows/worlds-quest-master.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quest-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node module syntax
        run: |
          node --check public/worlds/quest-master.mjs
          node --check public/worlds/app.mjs
      - name: Quest authorization and scene proofs
        run: node --test tests/worlds-quest-master.test.mjs
