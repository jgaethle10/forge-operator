name: Fallen Reference Materialization Mesh

on:
  pull_request:
    paths:
      - 'systemia/media-studio/model-fabric.ts'
      - 'systemia/media-studio/model-fabric.test.ts'
      - 'systemia/media-studio/visual-provider-elevenlabs.ts'
      - 'systemia/media-studio/visual-provider-sync.ts'
      - '.github/workflows/fallen-reference-materialization.yml'
  workflow_dispatch:

jobs:
  materialization-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          node --import tsx --test             systemia/media-studio/model-fabric.test.ts             systemia/media-studio/visual-provider-elevenlabs.test.ts             systemia/media-studio/visual-provider-runway.test.ts             systemia/media-studio/visual-provider-sync.test.ts
