name: Evercraft Clip Audience Campaign Gate
on:
  pull_request:
    paths:
      - 'public/clip/audience-sites/**'
      - 'tests/clip-audience-sites.test.mjs'
      - '.github/workflows/clip-audience-sites.yml'
  push:
    branches: [main]
    paths:
      - 'public/clip/audience-sites/**'
      - 'tests/clip-audience-sites.test.mjs'
      - '.github/workflows/clip-audience-sites.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify seven Evercraft Clip handoffs and creative assets
        run: node --test tests/clip-audience-sites.test.mjs
