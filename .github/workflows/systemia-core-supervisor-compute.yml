name: Systemia Core supervisor on Evercraft Compute

on:
  pull_request:
    paths:
      - 'systemia/core/resident-supervisor.mjs'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'systemia/core/core-on-compute.proof.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - '.github/workflows/systemia-core-supervisor-compute.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/core/resident-supervisor.mjs'
      - 'systemia/core/resident-services.json'
      - 'systemia/core/supervisor.evercraft.compute.json'
      - 'systemia/core/core-on-compute.proof.mjs'
      - 'systemia/compute/runtime-node.mjs'
      - 'systemia/yard/operator.mjs'
      - '.github/workflows/systemia-core-supervisor-compute.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Systemia Core resident placement on Evercraft Compute
        run: node systemia/core/core-on-compute.proof.mjs
