name: DayTrade Practice Camp Once

on:
  push:
    branches:
      - "systemia/daytrade-practice-camp-2026-10-06-a"

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run multi-symbol timing practice camp
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_PRACTICE_OUTPUT: artifacts/daytrade-edge/practice-camp-2026-10-06-a.json
        run: node systemia/daytrade-lens/edge-marketdata-practice-camp.mjs
      - name: Upload practice receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-practice-camp-${{ github.run_id }}
          path: artifacts/daytrade-edge/practice-camp-2026-10-06-a.json
          if-no-files-found: warn
          retention-days: 30
