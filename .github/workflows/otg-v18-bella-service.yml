name: On The Go V18 Bella Service Diction Auditions
on:
  workflow_dispatch:
  push:
    branches:
      - feature/onthego-bella-native-voice-20261026
    paths:
      - .github/workflows/otg-v18-bella-service.yml
      - systemia/media-studio/on-the-go-v18-service-audition.py
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          python -m pip install 'kokoro==0.9.4' 'soundfile>=0.12,<1'
      - run: python systemia/media-studio/on-the-go-v18-service-audition.py
      - uses: actions/upload-artifact@v4
        with:
          name: otg-v18-private-bella-service-phrase-auditions
          path: v18-service-phrases/
          retention-days: 7
          if-no-files-found: error
