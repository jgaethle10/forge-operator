name: Clip Native LinkedIn Organization Publisher

on:
  pull_request:
    paths:
      - 'systemia/clip/linkedin-organization-publisher.mjs'
      - 'systemia/clip/linkedin-organization-publisher.test.mjs'
      - 'systemia/evercraft-home/clip-journal-linkedin-publish-adapter.mjs'
      - 'systemia/evercraft-home/clip-journal-linkedin-publish.test.mjs'
      - 'systemia/evercraft-home/provider-credentials.mjs'
      - 'systemia/evercraft-home/provider-credentials.test.mjs'
      - 'systemia/evercraft-home/server.mjs'
      - 'systemia/evercraft-home/public/credentials.html'
      - 'systemia/clip/social-publisher-runtime.mjs'
      - 'systemia/clip/public-link-preflight.mjs'
      - 'systemia/clip/family-social-safety.mjs'
      - '.github/workflows/clip-native-linkedin-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/clip/linkedin-organization-publisher.mjs'
      - 'systemia/clip/linkedin-organization-publisher.test.mjs'
      - 'systemia/clip/social-publisher-runtime.mjs'
      - '.github/workflows/clip-native-linkedin-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-in-posts-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native LinkedIn publisher unit tests (mocked provider, no social writes)
        run: |
          node --check systemia/clip/linkedin-organization-publisher.mjs
          node --check systemia/evercraft-home/server.mjs
          node --test systemia/clip/linkedin-organization-publisher.test.mjs systemia/clip/social-publisher-runtime.test.mjs systemia/evercraft-home/provider-credentials.test.mjs systemia/evercraft-home/clip-journal-linkedin-publish.test.mjs
