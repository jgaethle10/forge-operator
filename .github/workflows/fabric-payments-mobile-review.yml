name: Fabric Payments Mobile Creative Review
on:
  pull_request:
    paths:
      - 'scripts/build-fabric-payments-design-review.mjs'
      - 'systemia/mcp/fabric-public-site.mjs'
      - 'systemia/mcp/portfolio-offer-copy.mjs'
      - '.github/workflows/fabric-payments-mobile-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-backed preview and checkout safety
        run: |
          node --check scripts/build-fabric-payments-design-review.mjs
          node scripts/build-fabric-payments-design-review.mjs payments-creative-review
          node --test tests/portfolio-offer-copy.test.mjs tests/fabric-offer-pages.test.mjs
      - name: Capture real browser viewport screenshots without charge
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo "Chrome unavailable, no screenshot can be verified"; exit 1; }
          FILE="file://$PWD/payments-creative-review/payments-pilot.html"
          timeout 50s "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --hide-scrollbars --window-size=390,844 --screenshot="$PWD/payments-creative-review/phone-firstfold.png" "$FILE"
          timeout 50s "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --hide-scrollbars --window-size=390,1650 --screenshot="$PWD/payments-creative-review/phone-long.png" "$FILE"
          timeout 50s "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --hide-scrollbars --window-size=1280,900 --screenshot="$PWD/payments-creative-review/desktop-firstfold.png" "$FILE"
          python3 - <<'PY'
          import pathlib,struct
          folder=pathlib.Path('payments-creative-review')
          for filename in ['phone-firstfold.png','phone-long.png','desktop-firstfold.png']:
              data=(folder/filename).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n',filename
              width,height=struct.unpack('>II',data[16:24])
              assert width >= 390 and height >= 800 and len(data)>10000,(filename,width,height,len(data))
              print(filename,width,height,len(data),'PNG integrity PASS')
          PY
      - name: Preserve review screenshots, not publish them
        uses: actions/upload-artifact@v4
        with:
          name: fabric-payments-mobile-visual-review
          path: payments-creative-review/
          retention-days: 7
          if-no-files-found: error
