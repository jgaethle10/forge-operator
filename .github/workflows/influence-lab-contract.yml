name: Influence Lab contract checks

on:
  pull_request:
    paths:
      - 'systemia/influence-lab/**'
      - '.github/workflows/influence-lab-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate influence policy and evidence boundaries
        run: node --test systemia/influence-lab/*.test.mjs systemia/graphics-command/commercial-renderer.test.mjs

  review-preview:
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render private, unpublished review gallery
        run: |
          node systemia/influence-lab/render-concepts.mjs \
            --brief systemia/influence-lab/specimens/website-audit-review-brief.json \
            --reference systemia/graphics-command/campaigns/website-audit-attention.json \
            --out "$RUNNER_TEMP/influence-review-gallery"
      - name: Verify gallery completeness and absence of release authority
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const dir=path.join(process.env.RUNNER_TEMP,"influence-review-gallery");
            const manifest=JSON.parse(fs.readFileSync(path.join(dir,"manifest.json"),"utf8"));
            if(manifest.assets.length!==12||manifest.publicationAuthority!==false||manifest.paymentVerified!==false||manifest.sourceMediaVerified!==false)throw Error("unsafe_or_incomplete_gallery");
            if(!fs.existsSync(path.join(dir,"index.html")))throw Error("gallery_missing");
            for(const asset of manifest.assets){
              const svg=fs.readFileSync(path.join(dir,asset.filename),"utf8");
              if(!svg.includes("EDITORIAL REVIEW ONLY"))throw Error("concept_watermark_missing");
            }
          '
      - name: Attach concept-only review gallery (not published)
        uses: actions/upload-artifact@v4
        with:
          name: influence-lab-concept-review
          path: ${{ runner.temp }}/influence-review-gallery
          if-no-files-found: error
          retention-days: 7
