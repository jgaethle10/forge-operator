name: Deep Agents research contract
on:
  pull_request:
    paths:
      - 'research/deepagents-saban-compat/**'
      - '.github/workflows/deepagents-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check research/deepagents-saban-compat/contract-proof.mjs
          node --check research/deepagents-saban-compat/contract-proof.test.mjs
          python3 -m py_compile research/deepagents-saban-compat/experimental_worker.py
          python3 -m py_compile research/deepagents-saban-compat/trace_gate.py
          python3 -m py_compile research/deepagents-saban-compat/test_trace_gate.py
      - name: Synthetic capability regression
        run: node research/deepagents-saban-compat/contract-proof.test.mjs
      - name: Synthetic trace evidence regression
        run: python3 -m unittest discover -s research/deepagents-saban-compat -p 'test_trace_gate.py' -v
