name: Evercraft Watershed immutable history QA
on:
  pull_request:
    paths:
      - 'systemia/research-service/watershed-history*.mjs'
      - 'tests/evercraft-watershed-history.test.mjs'
      - '.github/workflows/watershed-ledger-persist.yml'
      - '.github/workflows/watershed-history-qa.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/research-service/watershed-history*.mjs'
      - 'tests/evercraft-watershed-history.test.mjs'
      - '.github/workflows/watershed-ledger-persist.yml'
      - '.github/workflows/watershed-history-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archival-evidence-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate append-only receipt compilation and no-fabricated-history contract
        run: |
          node --check systemia/research-service/watershed-history.mjs
          node --check systemia/research-service/watershed-history-archive.mjs
          node --test tests/evercraft-watershed-history.test.mjs
