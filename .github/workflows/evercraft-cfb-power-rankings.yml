name: Evercraft CFB Power Rankings

on:
  pull_request:
    paths:
      - 'systemia/newsroom/cfb-*.mjs'
      - '.github/workflows/evercraft-cfb-power-rankings.yml'
  push:
    branches:
      - main
    paths:
      - 'systemia/newsroom/cfb-*.mjs'
      - '.github/workflows/evercraft-cfb-power-rankings.yml'
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      season:
        description: Season year
        required: false
        type: string
      start_date:
        description: Evidence start date YYYY-MM-DD
        required: false
        type: string
      through_date:
        description: Evidence through date YYYY-MM-DD
        required: false
        type: string
      week_label:
        description: Human ranking edition label
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: evercraft-cfb-power-rankings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove ranking contracts
        run: |
          node --test systemia/newsroom/cfb-power-index.test.mjs
          node --test systemia/newsroom/cfb-ranking-history.test.mjs
          node --test systemia/newsroom/cfb-results-ingest.test.mjs
          node --test systemia/newsroom/cfb-results-model.test.mjs
          node --test systemia/newsroom/cfb-power-runner.test.mjs
          node --test systemia/newsroom/cfb-power-story-draft.test.mjs
          node --test systemia/newsroom/cfb-published-edition.test.mjs
          node --test systemia/newsroom/cfb-power-release.test.mjs
          node --test systemia/newsroom/cfb-clip-facebook-publish.test.mjs
          node --test systemia/graphics-command/ranking-poster-renderer.test.mjs

      - name: Resolve evidence window
        id: window
        shell: bash
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_START: ${{ inputs.start_date }}
          INPUT_THROUGH: ${{ inputs.through_date }}
          INPUT_WEEK_LABEL: ${{ inputs.week_label }}
        run: |
          set -euo pipefail
          season="${INPUT_SEASON:-$(date -u +%Y)}"
          start="${INPUT_START:-${season}-08-15}"
          through="${INPUT_THROUGH:-$(date -u -d 'yesterday' +%F)}"
          label="${INPUT_WEEK_LABEL:-Through ${through}}"
          echo "season=${season}" >> "$GITHUB_OUTPUT"
          echo "start=${start}" >> "$GITHUB_OUTPUT"
          echo "through=${through}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Resolve previous persisted CFB edition
        shell: bash
        run: |
          set -euo pipefail
          node systemia/newsroom/cfb-ranking-history.mjs \
            previous \
            "${{ steps.window.outputs.season }}" \
            "${{ steps.window.outputs.through }}" \
            public/journal/data \
            > _cfb_previous-ranks.json
          cat _cfb_previous-ranks.json

      - name: Build live FBS evidence snapshot and rankings
        run: |
          rm -rf _cfb_power_run
          node systemia/newsroom/cfb-power-runner.mjs \
            --season "${{ steps.window.outputs.season }}" \
            --start "${{ steps.window.outputs.start }}" \
            --through "${{ steps.window.outputs.through }}" \
            --week-label "${{ steps.window.outputs.label }}" \
            --previous-ranks _cfb_previous-ranks.json \
            --out _cfb_power_run | tee _cfb_power_run-receipt.json
          test -s _cfb_power_run/completed-games.json
          test -s _cfb_power_run/cfb-power-rankings.json
          test -s _cfb_power_run/top-25.json

      - name: Build owned ranking visual assets
        run: |
          node systemia/graphics-command/ranking-poster-renderer.mjs \
            _cfb_power_run/cfb-power-rankings.json \
            _cfb_power_run/visuals | tee _cfb_power_visual-receipt.json
          test -s _cfb_power_run/visuals/top-10-feed.svg
          test -s _cfb_power_run/visuals/top-8-square.svg
          test -s _cfb_power_run/visuals/top-15-story.svg

      - name: Build Journal + Fallen draft from ranking receipt
        run: |
          node systemia/newsroom/cfb-power-story-draft.mjs \
            _cfb_power_run/cfb-power-rankings.json \
            _cfb_power_run/completed-games.json \
            _cfb_power_run/journal-story-draft.json | tee _cfb_power_story-draft-receipt.json
          test -s _cfb_power_run/journal-story-draft.json
          grep -q '"status": "draft"' _cfb_power_run/journal-story-draft.json
          grep -q '"contract": "evercraft.fallen.journal.production.v1"' _cfb_power_run/journal-story-draft.json

      - name: Build receipt-bound approved Journal release
        run: |
          node systemia/newsroom/cfb-power-release.mjs \
            _cfb_power_run/cfb-power-rankings.json \
            _cfb_power_run/completed-games.json \
            _cfb_power_run/journal-story-approved.json | tee _cfb_power_release-receipt.json
          test -s _cfb_power_run/journal-story-approved.json
          grep -q '"status": "approved"' _cfb_power_run/journal-story-approved.json
          grep -q '"score": 10' _cfb_power_run/journal-story-approved.json

      - name: Persist verified Sunday edition through the owned Journal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVERCRAFT_JOURNAL_ORIGIN: https://fabric.systemiacommandcenters.com/journal
        run: |
          set -euo pipefail
          cp _cfb_power_run/journal-story-approved.json /tmp/cfb-journal-story.json
          story_file="$(node -e "const s=require('/tmp/cfb-journal-story.json'); const day=s.slug.match(/(\\d{4}-\\d{2}-\\d{2})$/)?.[1]; if(!day) process.exit(2); process.stdout.write(day+'-cfb-power-rankings.json')")"

          git config user.name "Evercraft CFB Rankings"
          git config user.email "evercraft-cfb@users.noreply.github.com"

          published=0
          for ATTEMPT in 1 2 3; do
            git fetch origin main --quiet
            git reset --hard origin/main
            cp /tmp/cfb-journal-story.json "systemia/newsroom/stories/$story_file"
            rm -rf public/journal
            npm run journal:build
            node systemia/newsroom/cfb-ranking-history.mjs \
              build \
              public/journal/data \
              public/journal/data/cfb-power-rankings-history.json \
              "${{ steps.window.outputs.season }}" \
              | tee /tmp/cfb-history-build-receipt.json

            git add "systemia/newsroom/stories/$story_file"
            git add -f public/journal
            if git diff --cached --quiet; then
              echo "Verified CFB edition is already current on main."
              published=1
              break
            fi

            git commit -m "Publish verified Evercraft CFB Power Rankings [skip ci]"
            if git push origin HEAD:main; then
              echo "Verified CFB edition and owned Journal artifact persisted to main."
              published=1
              break
            fi

            echo "Main advanced during CFB publish attempt ${ATTEMPT}/3; rebuilding against current main."
          done

          if [ "$published" -ne 1 ]; then
            echo "CFB Journal publication lost three consecutive main-branch races." >&2
            exit 1
          fi

      - name: Dispatch owned Journal verification and public fallback
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run evercraft-journal-owned.yml --ref main
          gh workflow run evercraft-journal-pages.yml --ref main
          {
            echo "## CFB Journal handoff dispatched"
            echo
            echo "The verified source story and owned Journal artifact were persisted first."
            echo "Journal verification and the public fallback deployment were then explicitly dispatched from main."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Top 25
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const top=JSON.parse(fs.readFileSync('_cfb_power_run/top-25.json','utf8'));
          console.log('## Evercraft CFB Power Rankings');
          console.log('');
          console.log('Evidence through: '+top.evidence_through_at);
          console.log('');
          console.log('| Rank | Team | Score | Confidence |');
          console.log('|---:|---|---:|---:|');
          for(const row of top.rankings){
            console.log(`| ${row.rank} | ${row.team_name} | ${row.power_score.toFixed(2)} | ${(row.confidence*100).toFixed(1)}% |`);
          }
          NODE

      - name: Preserve ranking evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-cfb-power-rankings-${{ steps.window.outputs.through }}
          path: |
            _cfb_power_run
            _cfb_power_run-receipt.json
            _cfb_power_story-draft-receipt.json
            _cfb_power_visual-receipt.json
            _cfb_power_release-receipt.json
            _cfb_previous-ranks.json
          if-no-files-found: error
          retention-days: 120
