name: Evercraft Operator CLI preview tests
on:
  pull_request:
    paths:
      - 'packages/evercraft-cli/**'
      - '.github/workflows/evercraft-operator-cli.yml'
  push:
    branches:
      - 'feature/evercraft-operator-cli-economy-20261014'
    paths:
      - 'packages/evercraft-cli/**'
      - '.github/workflows/evercraft-operator-cli.yml'
permissions:
  contents: read
jobs:
  local-mcp-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CLI syntax
        run: node --check cli.mjs
        working-directory: packages/evercraft-cli
      - name: Test opt-in local MCP contracts
        run: node --test tests/*.test.mjs
        working-directory: packages/evercraft-cli
