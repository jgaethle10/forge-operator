name: Evercraft OS proofs

on:
  push:
    branches:
      - "feat/evercraft-os-*"
    paths:
      - "systemia/evercraft-os/**"
      - "systemia/evercraft-home/os-adapter.mjs"
      - "systemia/evercraft-home/os-status.test.mjs"
      - "systemia/evercraft-home/server.mjs"
      - "systemia/evercraft-home/public/apps.html"
      - "systemia/evercraft-home/public/index.html"
      - ".github/workflows/evercraft-os-proof.yml"
  pull_request:
    paths:
      - "systemia/evercraft-os/**"
      - "systemia/evercraft-home/os-adapter.mjs"
      - "systemia/evercraft-home/os-status.test.mjs"
      - "systemia/evercraft-home/server.mjs"
      - "systemia/evercraft-home/public/apps.html"
      - "systemia/evercraft-home/public/index.html"
      - ".github/workflows/evercraft-os-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prove Evercraft OS composition
        run: node systemia/evercraft-os/runtime.proof.mjs
      - name: Prove device profile contract
        run: node systemia/evercraft-os/device-profile.proof.mjs
      - name: Prove Evercraft OS app package contract
        run: node systemia/evercraft-os/app-package.proof.mjs
      - name: Prove Evercraft OS app install planning
        run: node systemia/evercraft-os/app-install-plan.proof.mjs
      - name: Prove Passport-gated app install ledger
        run: node --test systemia/evercraft-os/install-ledger.test.mjs
      - name: Prove mediated capability capsules
        run: node --test systemia/evercraft-os/runtime-capsule.test.mjs
      - name: Prove Systemia-gated owned runtime launch
        run: node --test systemia/evercraft-os/systemia-launcher.test.mjs
      - name: Prove persistent Evercraft OS user host
        run: node --test systemia/evercraft-os/host-supervisor.test.mjs
      - name: Validate user-host installer syntax
        run: bash -n systemia/evercraft-os/install-user-host.sh
      - name: Prove Home OS status surface
        run: node --test systemia/evercraft-home/os-status.test.mjs
      - name: Emit boot envelope
        run: node systemia/evercraft-os/runtime.mjs
      - name: Emit sanitized device profile
        run: EVERCRAFT_OS_DEVICE_CLASS=server node systemia/evercraft-os/device-profile.mjs
