name: Evercraft OS proofs

on:
  push:
    branches:
      - "feat/evercraft-os-*"
    paths:
      - "systemia/evercraft-os/**"
      - ".github/workflows/evercraft-os-proof.yml"
  pull_request:
    paths:
      - "systemia/evercraft-os/**"
      - ".github/workflows/evercraft-os-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prove Evercraft OS composition
        run: node systemia/evercraft-os/runtime.proof.mjs
      - name: Prove device profile contract
        run: node systemia/evercraft-os/device-profile.proof.mjs
      - name: Prove Home OS status surface
        run: node --test systemia/evercraft-home/os-status.test.mjs
      - name: Emit boot envelope
        run: node systemia/evercraft-os/runtime.mjs
      - name: Emit sanitized device profile
        run: EVERCRAFT_OS_DEVICE_CLASS=server node systemia/evercraft-os/device-profile.mjs
