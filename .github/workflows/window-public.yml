name: The Window Public Spectator
on:
  pull_request:
    paths:
      - 'public/the-window/**'
      - 'tests/the-window-public.test.mjs'
      - '.github/workflows/window-public.yml'
  push:
    branches:
      - feature/window-public-spectator-20261018
      - main
    paths:
      - 'public/the-window/**'
      - 'tests/the-window-public.test.mjs'
      - '.github/workflows/window-public.yml'

permissions:
  contents: read

jobs:
  public-preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public browser modules
        run: |
          node --check public/the-window/world.mjs
          node --check public/the-window/client.mjs
      - name: Prove identical world reconstruction and disclosure
        run: node --test tests/the-window-public.test.mjs
