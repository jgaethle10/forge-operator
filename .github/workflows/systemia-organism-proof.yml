name: Systemia organism proof

on:
  pull_request:
    paths:
      - "systemia/organism/**"
      - ".github/workflows/systemia-organism-proof.yml"
  push:
    branches:
      - main
      - "systemia/**"
    paths:
      - "systemia/organism/**"
      - ".github/workflows/systemia-organism-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemia-organism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic organism and goal-runtime proofs
        run: npm run proof:systemia
      - name: Snapshot reads cannot fabricate mission heartbeat freshness
        run: node --test systemia/organism/goal-snapshot-freshness.test.mjs
      - name: Reject competing persistent goal writers and identity swaps
        run: node --test systemia/organism/goal-store-concurrency.test.mjs
      - name: Prove interrupted work is held without replay across restart
        run: node --test systemia/organism/goal-recovery.test.mjs
      - name: Reject forged, expired and self-authorized human gate approvals
        run: node --test systemia/organism/goal-human-approval.test.mjs
      - name: Prevent mission plan re-admission from resetting completed work
        run: node --test systemia/organism/goal-plan-replay.test.mjs
      - name: Reject stale worker outcomes using exact attempt identity
        run: node --test systemia/organism/goal-attempt-fence.test.mjs
      - name: Reject self-reported or stale provider recovery claims
        run: node --test systemia/organism/goal-provider-observation.test.mjs
      - name: Re-fetch provider status read-only before signing an attempt observation
        run: node --test systemia/organism/goal-provider-refetch.test.mjs
      - name: Commit durable execution checkpoint before adapter callback
        run: node --test systemia/organism/goal-durable-dispatch.test.mjs
      - name: Forbid volatile stateful and gated adapter execution
        run: node --test systemia/organism/capability-volatile-dispatch.test.mjs
      - name: Reject skipped dependencies and false goal success
        run: node --test systemia/organism/goal-skipped-dependencies.test.mjs
      - name: Preserve heartbeat monotonicity when durable adapters finish
        run: node --test systemia/organism/goal-durable-clock.test.mjs
