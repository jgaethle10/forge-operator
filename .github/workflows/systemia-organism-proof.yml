name: Systemia organism proof

on:
  pull_request:
    paths:
      - "systemia/organism/**"
      - ".github/workflows/systemia-organism-proof.yml"
  push:
    branches:
      - main
      - "systemia/**"
    paths:
      - "systemia/organism/**"
      - ".github/workflows/systemia-organism-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemia-organism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic organism and goal-runtime proofs
        run: npm run proof:systemia
      - name: Reject competing persistent goal writers and identity swaps
        run: node --test systemia/organism/goal-store-concurrency.test.mjs
      - name: Prove interrupted work is held without replay across restart
        run: node --test systemia/organism/goal-recovery.test.mjs
      - name: Reject forged, expired and self-authorized human gate approvals
        run: node --test systemia/organism/goal-human-approval.test.mjs
      - name: Prevent mission plan re-admission from resetting completed work
        run: node --test systemia/organism/goal-plan-replay.test.mjs
