name: DayTrade Spread Persistence Practice Once

on:
  push:
    branches:
      - "systemia/daytrade-practice-camp-2026-10-06-d"

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run spread-persistence practice camp
        env:
          ALPACA_TRADING: ${{ secrets.ALPACA_TRADING }}
          ALPACA_TRADING_SECRET: ${{ secrets.ALPACA_TRADING_SECRET }}
          DAYTRADE_SPREAD_PERSISTENCE_OUTPUT: artifacts/daytrade-edge/spread-persistence-practice-2026-10-06-d.json
        run: node systemia/daytrade-lens/edge-spread-persistence-practice-camp.mjs
      - name: Upload practice receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytrade-spread-persistence-practice-${{ github.run_id }}
          path: artifacts/daytrade-edge/spread-persistence-practice-2026-10-06-d.json
          if-no-files-found: warn
          retention-days: 30
