name: Fallen commercial audio lab
on:
  pull_request:
    paths:
      - 'systemia/media-studio/commercial-audio-lab.mjs'
      - 'systemia/media-studio/commercial-audio-lab.test.mjs'
      - 'systemia/media-studio/commercial-audio-qc.mjs'
      - 'systemia/media-studio/commercial-audio-qc.test.mjs'
      - 'systemia/media-studio/commercial-release-preflight.mjs'
      - 'systemia/media-studio/commercial-release-preflight.test.mjs'
      - 'systemia/media-studio/commercial-visual-qc.mjs'
      - 'systemia/media-studio/commercial-visual-qc.test.mjs'
      - 'systemia/media-studio/customer-commercial-gate.mjs'
      - 'systemia/media-studio/customer-commercial-gate.test.mjs'
      - 'systemia/media-studio/commercial-creative-roles.test.mjs'
      - 'systemia/media-studio/creative-council-saban-adapter.mjs'
      - 'systemia/saban/multiplication-registry.json'
      - 'systemia/saban/fixtures/commercial-audio-council-job.json'
      - 'package.json'
      - '.github/workflows/fallen-commercial-audio-lab.yml'
  workflow_dispatch:
jobs:
  audio-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install measurement tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Test real FFmpeg finishing and fail-closed QC
        run: |
          node --test systemia/media-studio/commercial-audio-lab.test.mjs systemia/media-studio/commercial-creative-roles.test.mjs
      - name: Test commissioned commercial audio and release preflight
        run: |
          node --test systemia/media-studio/commercial-audio-qc.test.mjs systemia/media-studio/commercial-release-preflight.test.mjs systemia/media-studio/commercial-visual-qc.test.mjs systemia/media-studio/customer-commercial-gate.test.mjs
          node systemia/saban/multiplier.mjs --software fallen-creative-council --inventory systemia/saban/fixtures/commercial-audio-council-job.json --agents 28 --workers 4 --execute --reconcile
