name: Evercraft Payments routing proof

on:
  pull_request:
    paths:
      - 'systemia/payments/**'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-raven-payments-runtime.sh'
      - 'tests/fabric-offer-pages.test.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/evercraft-home/provider-credentials.test.mjs'
      - 'systemia/evercraft-home/provider-credential-http.test.mjs'
      - 'systemia/evercraft-home/provider-credentials.mjs'
      - 'systemia/evercraft-home/server.mjs'
      - 'systemia/earthworks-autonomy/COMMERCIAL.md'
      - 'public/apps/earthworks-autonomy/capability.json'
      - '.github/workflows/evercraft-payments-routing.yml'
  push:
    branches: [main]
    paths:
      - 'systemia/payments/**'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-raven-payments-runtime.sh'
      - 'tests/fabric-offer-pages.test.mjs'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/evercraft-home/provider-credentials.test.mjs'
      - 'systemia/evercraft-home/provider-credential-http.test.mjs'
      - 'systemia/evercraft-home/provider-credentials.mjs'
      - 'systemia/evercraft-home/server.mjs'
      - 'systemia/earthworks-autonomy/COMMERCIAL.md'
      - 'public/apps/earthworks-autonomy/capability.json'
      - '.github/workflows/evercraft-payments-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Evercraft-owned payment routing
        run: |
          node --test systemia/payments/*.test.mjs
          node --test systemia/evercraft-home/provider-credentials.test.mjs systemia/evercraft-home/provider-credential-http.test.mjs
          node --test tests/fabric-offer-pages.test.mjs tests/fabric-owned-edge-installer.test.mjs
      - name: Reject Stripe-first EarthWorks commerce metadata
        run: |
          node -e "const x=require('./public/apps/earthworks-autonomy/capability.json'); if(x.commerce?.layer!=='evercraft_payments'||x.commerce?.provider_boundary!=='raven_nexus'||x.commerce?.direct_provider_checkout!==false) process.exit(1)"
