name: Evercraft Web Port Mapping Safety

on:
  pull_request:
    paths:
      - 'scripts/evercraft-public-edge-map.mjs'
      - 'scripts/edge-mapping-acceptance.mjs'
      - 'tests/edge-mapping-acceptance.test.mjs'
      - '.github/workflows/fabric-web-port-mapping-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/evercraft-public-edge-map.mjs'
      - 'scripts/edge-mapping-acceptance.mjs'
      - 'tests/edge-mapping-acceptance.test.mjs'
      - '.github/workflows/fabric-web-port-mapping-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce public-web mapping false-green regressions
        run: |
          node --check scripts/edge-mapping-acceptance.mjs
          node --check scripts/evercraft-public-edge-map.mjs
          node --test tests/edge-mapping-acceptance.test.mjs
