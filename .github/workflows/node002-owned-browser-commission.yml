name: Node002 Owned Browser Commissioning Safety

on:
  pull_request:
    paths:
      - 'scripts/nextgen-browser-commission.mjs'
      - 'tests/nextgen-browser-commission.test.mjs'
      - 'scripts/nextgen-browser-diagnose.mjs'
      - 'scripts/nextgen-browser-yard-proof.mjs'
      - 'tests/nextgen-browser-yard-proof.test.mjs'
      - 'tests/nextgen-browser-diagnose.test.mjs'
      - 'systemia/evercraft-web/browser-worker/server.mjs'
      - 'systemia/evercraft-web/browser-worker/native-runtime.mjs'
      - '.github/workflows/node002-owned-browser-commission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-local-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate NextGen script and existing Browser Worker
        run: |
          node --check scripts/nextgen-browser-commission.mjs
          node --check scripts/nextgen-browser-diagnose.mjs
          node --check scripts/nextgen-browser-yard-proof.mjs
          node --check systemia/evercraft-web/browser-worker/server.mjs
          node --check systemia/evercraft-web/browser-worker/native-runtime.mjs
      - name: Reject non-NextGen execution, unsafe actions and fabricated evidence
        run: node --test tests/nextgen-browser-commission.test.mjs tests/nextgen-browser-diagnose.test.mjs tests/nextgen-browser-yard-proof.test.mjs
      - name: Enforce no HP remote admission claim from ephemeral CI
        run: |
          node scripts/nextgen-browser-commission.mjs --status
          node scripts/nextgen-browser-yard-proof.mjs --status
          if node scripts/nextgen-browser-commission.mjs --run; then
            echo "UNSAFE: non-NextGen hosted runner started physical canary"
            exit 1
          fi
          echo "PASS: remote runner cannot impersonate physical NextGen"
