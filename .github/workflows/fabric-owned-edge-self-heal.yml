name: Fabric owned-edge self-heal

on:
  pull_request:
    paths:
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-fabric-router-map-resident.sh'
      - 'scripts/evercraft-public-edge-map.mjs'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'tests/public-edge-ingress-watch.test.mjs'
      - '.github/workflows/fabric-owned-edge-self-heal.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-fabric-router-map-resident.sh'
      - 'scripts/evercraft-public-edge-map.mjs'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'tests/public-edge-ingress-watch.test.mjs'
      - '.github/workflows/fabric-owned-edge-self-heal.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove owned edge install/update contract
        run: node --test tests/fabric-owned-edge-installer.test.mjs
      - name: Prove ingress diagnosis and bounded recovery policy
        run: node --test tests/public-edge-ingress-watch.test.mjs
      - name: Verify shell syntax
        run: |
          bash -n scripts/update-fabric-owned-edge.sh
          bash -n scripts/install-fabric-owned-edge.sh
          bash -n scripts/install-fabric-router-map-resident.sh
