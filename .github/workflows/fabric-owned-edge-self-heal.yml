name: Fabric owned-edge self-heal

on:
  pull_request:
    paths:
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/rescue-fabric-journal-edge.sh'
      - 'scripts/classify-fabric-checkout-dirt.mjs'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-fabric-router-map-resident.sh'
      - 'scripts/evercraft-public-edge-map.mjs'
      - 'scripts/fabric-edge-doctor.sh'
      - 'tests/fabric-edge-doctor-safety.test.mjs'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'tests/fabric-checkout-dirt.test.mjs'
      - 'tests/fabric-journal-rescue.test.mjs'
      - 'tests/fabric-journal-preservation.test.mjs'
      - 'systemia/mcp/FABRIC_JOURNAL_SAFE_CUTOVER.md'
      - 'tests/public-edge-ingress-watch.test.mjs'
      - '.github/workflows/fabric-owned-edge-self-heal.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/update-fabric-owned-edge.sh'
      - 'scripts/rescue-fabric-journal-edge.sh'
      - 'scripts/classify-fabric-checkout-dirt.mjs'
      - 'scripts/install-fabric-owned-edge.sh'
      - 'scripts/install-fabric-router-map-resident.sh'
      - 'scripts/evercraft-public-edge-map.mjs'
      - 'scripts/fabric-edge-doctor.sh'
      - 'tests/fabric-edge-doctor-safety.test.mjs'
      - 'tests/fabric-owned-edge-installer.test.mjs'
      - 'tests/fabric-checkout-dirt.test.mjs'
      - 'tests/fabric-journal-rescue.test.mjs'
      - 'tests/fabric-journal-preservation.test.mjs'
      - 'systemia/mcp/FABRIC_JOURNAL_SAFE_CUTOVER.md'
      - 'tests/public-edge-ingress-watch.test.mjs'
      - '.github/workflows/fabric-owned-edge-self-heal.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove owned edge install/update contract
        run: node --test tests/fabric-owned-edge-installer.test.mjs tests/fabric-checkout-dirt.test.mjs tests/fabric-journal-rescue.test.mjs tests/fabric-journal-preservation.test.mjs tests/fabric-self-update-hardening.test.mjs tests/fabric-owned-edge-updater-contract.test.mjs
      - name: Prove ingress diagnosis and bounded recovery policy
        run: node --test tests/public-edge-ingress-watch.test.mjs
      - name: Prove edge doctor cannot mutate router mapping in default diagnostic mode
        run: node --test tests/fabric-edge-doctor-safety.test.mjs
      - name: Verify shell syntax
        run: |
          bash -n scripts/fabric-edge-doctor.sh
          bash -n scripts/update-fabric-owned-edge.sh
          bash -n scripts/rescue-fabric-journal-edge.sh
          bash -n scripts/install-fabric-owned-edge.sh
          bash -n scripts/install-fabric-router-map-resident.sh
