name: People Layer external canary

on:
  push:
    branches: [main]
    paths:
      - 'systemia/people/**'
      - 'systemia/organism/people-layer-edge-*'
      - '.github/workflows/people-layer-canary.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PEOPLE_ORIGIN: ${{ vars.EVERCRAFT_PEOPLE_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canary receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${PEOPLE_ORIGIN:-}" ]; then
            cat > artifacts/people-layer-canary.json <<'JSON'
          {
            "schema": "evercraft.people.external-canary.v1",
            "verified": false,
            "state": "held_no_owned_public_origin",
            "public_https_verified": false,
            "base44_runtime_required": false,
            "founder_login_required": false
          }
          JSON
            cat artifacts/people-layer-canary.json
            exit 0
          fi

          node - <<'NODE'
          const url=new URL(process.env.PEOPLE_ORIGIN);
          if(url.protocol!=='https:') throw new Error('PEOPLE_ORIGIN must use HTTPS');
          if(url.username||url.password||url.search||url.hash) throw new Error('PEOPLE_ORIGIN must be a clean origin');
          if(/(^|\.)base44\.app$/i.test(url.hostname)) throw new Error('People Layer origin must not use Base44');
          if(url.pathname!=='/'&&url.pathname!=='') throw new Error('PEOPLE_ORIGIN must not include a path');
          NODE

      - name: Verify owned public health and surfaces
        if: env.PEOPLE_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          origin="${PEOPLE_ORIGIN%/}"

          health="$(curl --fail --silent --show-error --max-time 20 "$origin/health")"
          printf '%s' "$health" | jq -e '
            .ok == true and
            .service == "evercraft-people-layer" and
            .runtime == "Evercraft Compute" and
            .base44_runtime_dependency == false and
            .public_ui == true and
            .operator_auth == "private_token_file" and
            .public_person_token_flows == true and
            .deployment_receipt_bound == true and
            (.deployment_receipt_ref | test("^[a-f0-9]{64}$")) and
            (.instance_id | test("^people_"))
          ' >/dev/null

          page="$(curl --fail --silent --show-error --max-time 20 "$origin/people")"
          printf '%s' "$page" | grep -Fq "Evercraft People Layer"
          printf '%s' "$page" | grep -Fq "/people-assets/app.js"

          consent="$(curl --fail --silent --show-error --max-time 20 "$origin/people/consent?token=canary-invalid")"
          printf '%s' "$consent" | grep -Fq "Evercraft People Layer"

          email_page="$(curl --fail --silent --show-error --max-time 20 "$origin/people/verify-email?token=canary-invalid")"
          printf '%s' "$email_page" | grep -Fq "Evercraft People Layer"

          admin_status="$(curl --silent --show-error --max-time 20 -o /tmp/people-admin.json -w '%{http_code}' "$origin/api/people/brains")"
          test "$admin_status" = "401"

          email_invalid_status="$(curl --silent --show-error --max-time 20 -o /tmp/people-invalid-email.json -w '%{http_code}' "$origin/api/people/verify-email/inspect?token=canary-invalid")"
          test "$email_invalid_status" = "404"
          jq -e '.ok == false and .error == "challenge_not_found"' /tmp/people-invalid-email.json >/dev/null

          invalid_status="$(curl --silent --show-error --max-time 20 -o /tmp/people-invalid.json -w '%{http_code}' "$origin/api/people/consent/inspect?token=canary-invalid")"
          test "$invalid_status" = "404"
          jq -e '.ok == false and .error == "invite_not_found"' /tmp/people-invalid.json >/dev/null

          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n             --arg origin "$origin"             --arg observed "$observed_at"             '{
              schema:"evercraft.people.external-canary.v1",
              verified:true,
              state:"public_https_verified",
              origin:$origin,
              runtime:"Evercraft Compute",
              service:"evercraft-people-layer",
              public_https_verified:true,
              health_verified:true,
              operator_surface_verified:true,
              consent_surface_verified:true,
              invalid_token_fail_closed:true,
              base44_runtime_required:false,
              founder_login_required:false,
              observed_at:$observed
            }' > artifacts/people-layer-canary.json

          cat artifacts/people-layer-canary.json

      - name: Upload canary receipt
        uses: actions/upload-artifact@v4
        with:
          name: people-layer-external-canary
          path: artifacts/people-layer-canary.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce external HTTPS canary gate
        if: env.PEOPLE_ORIGIN == ''
        shell: bash
        run: |
          echo "::error::People release held: no owned public HTTPS origin is configured. The canary receipt is a HOLD, not a pass."
          exit 1
