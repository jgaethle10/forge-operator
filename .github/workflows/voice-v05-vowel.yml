name: Voice Foundry V05 Brand Vowel (private only)

on:
  pull_request:
    paths:
      - '.github/workflows/voice-v05-vowel.yml'
      - 'systemia/media-studio/voice-v05-craft-vowel-lab.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  craft-vowel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private audition source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate text, voice and V05 vowel conditions before dependency install
        run: |
          python systemia/media-studio/voice-v05-craft-vowel-lab.py --verify-only
      - name: Install CPU inference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1.0'
      - name: Render nine genuine V05 auditions
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python systemia/media-studio/voice-v05-craft-vowel-lab.py V05-craft-vowel-experiments
          test -s V05-craft-vowel-experiments/index.html
          test -s V05-craft-vowel-experiments/vowel-report.json
          test "$(find V05-craft-vowel-experiments -name '*.mp3' | wc -l)" -eq 9
      - name: Upload private V05 listening experiments
        uses: actions/upload-artifact@v4
        with:
          name: evercraft-v05-craft-vowel-auditions
          path: V05-craft-vowel-experiments/
          retention-days: 7
          if-no-files-found: error
