name: Roman Evercraft edge shell proof

on:
  pull_request:
    paths:
      - 'campaign-recovery/roman-2026/edge/**'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/domain-shield/roman-funnel.mjs'
      - 'systemia/domain-shield/roman-funnel.test.mjs'
      - 'systemia/domain-shield/roman-public-link-guard.mjs'
      - 'systemia/domain-shield/roman-public-link-guard.test.mjs'
      - 'public/campaigns/roman/continuity.json'
      - 'tests/fabric-roman-campaign-mirror.test.mjs'
      - 'public/campaigns/roman/index.html'
      - 'public/site-status/roman/**'
      - 'public/sitemap.xml'
      - '.github/workflows/evercraft-journal-pages.yml'
      - '.github/workflows/roman-edge-shell-proof.yml'
  push:
    branches: [main]
    paths:
      - 'campaign-recovery/roman-2026/edge/**'
      - 'systemia/mcp/fabric-local-runtime.mjs'
      - 'systemia/domain-shield/roman-funnel.mjs'
      - 'systemia/domain-shield/roman-funnel.test.mjs'
      - 'systemia/domain-shield/roman-public-link-guard.mjs'
      - 'systemia/domain-shield/roman-public-link-guard.test.mjs'
      - 'public/campaigns/roman/continuity.json'
      - 'tests/fabric-roman-campaign-mirror.test.mjs'
      - 'public/campaigns/roman/index.html'
      - 'public/site-status/roman/**'
      - 'public/sitemap.xml'
      - '.github/workflows/evercraft-journal-pages.yml'
      - '.github/workflows/roman-edge-shell-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shell source is identical to the canonical published fallback
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { EMBEDDED_HTML } from './campaign-recovery/roman-2026/edge/embedded-site.mjs';
          const canonical=fs.readFileSync('public/campaigns/roman/index.html','utf8');
          if (EMBEDDED_HTML !== canonical) throw new Error('Embedded shell content is stale: rebuild before deployment');
          if (!canonical.includes('https://donate.voteroman.com/')) throw new Error('Existing campaign donation link missing');
          console.log('Canonical HTML parity and existing donation URL PASS');
          NODE
      - name: Run edge shell failure-mode suite
        run: node --test campaign-recovery/roman-2026/edge/worker.test.mjs
      - name: Prove independent Fabric public mirror route
        run: node --test tests/fabric-roman-campaign-mirror.test.mjs
      - name: Verify local-first rescue funnel and malicious/unavailable backup rejection
        run: node --test systemia/domain-shield/roman-funnel.test.mjs
      - name: Prove owned public pages do not navigate into original broken apex
        run: node --test systemia/domain-shield/roman-public-link-guard.test.mjs
      - name: Verify independent search-recovery directory has accurate links and indexing boundaries
        run: |
          test -f public/site-status/roman/index.html
          grep -q 'name="robots" content="index,follow"' public/site-status/roman/index.html
          grep -q 'not the voteroman.com website' public/site-status/roman/index.html
          grep -q 'https://fabric.systemiacommandcenters.com/campaigns/roman/' public/site-status/roman/index.html
          grep -q 'https://jgaethle10.github.io/forge-operator/campaigns/roman/' public/site-status/roman/index.html
          grep -q 'https://headless-jhpvqnpgxlh-sociallyguud-140c.wix-site-host.com/' public/site-status/roman/index.html
          grep -q 'https://jgaethle10.github.io/forge-operator/site-status/roman/' public/sitemap.xml
          grep -q 'name="robots" content="noindex,nofollow"' public/campaigns/roman/index.html
          ! grep -Eiq '<a[^>]+href="https?://(www\\.)?voteroman\\.com' public/site-status/roman/index.html
      - name: Verify mobile recovery access is one obvious action, without original-domain pretense
        run: |
          grep -q 'class="primary-link" href="https://fabric.systemiacommandcenters.com/go/roman"' public/site-status/roman/index.html
          grep -q 'Copy working link' public/site-status/roman/index.html
          grep -q 'Typing voteroman.com still follows the original domain' public/site-status/roman/index.html
          grep -q 'not the voteroman.com website' public/site-status/roman/index.html
      - name: Confirm DNS deployment is not attempted
        run: |
          test -f campaign-recovery/roman-2026/edge/wrangler.toml
          ! grep -Eq '^routes?\s*=|^zone_id\s*=|^custom_domains?\s*=' campaign-recovery/roman-2026/edge/wrangler.toml
