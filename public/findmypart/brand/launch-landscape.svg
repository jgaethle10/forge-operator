<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" role="img" aria-labelledby="t d"><title id="t">FindMyPart launch artwork</title><desc id="d">A clean typographic announcement for evidence-first sourcing research without generic target imagery.</desc><rect width="1200" height="628" fill="#151c25"/><path d="M925 0h275v628H925z" fill="#1e2e3e"/><path d="M925 0h18v628h-18z" fill="#f16b27"/><path d="M1018 141h110v15h-110zm0 46h137v15h-137zm0 46h89v15h-89z" fill="#8395a6" opacity=".65"/><path d="M1018 356h135v92h-135z" fill="#f16b27"/><path d="M1040 380h89v16h-89zm0 28h58v12h-58z" fill="#151c25"/><text x="62" y="112" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" letter-spacing="-3"><tspan fill="#ffffff">Find</tspan><tspan fill="#f16b27">My</tspan><tspan fill="#ffffff">Part</tspan></text><text x="64" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#91b4d4">FOR THE PART NOBODY CAN FIND</text><text x="62" y="331" font-family="Arial,Helvetica,sans-serif" font-size="91" font-weight="800" letter-spacing="-5" fill="#ffffff">Missing part.</text><text x="62" y="431" font-family="Arial,Helvetica,sans-serif" font-size="91" font-weight="800" letter-spacing="-5" fill="#f16b27">Not the end.</text><path d="M64 486h735" stroke="#485766" stroke-width="2"/><text x="64" y="539" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#d7e0e8">Hard-to-find components. A practical next step.</text><text x="64" y="582" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#93a4b4">Research from $19 one-time. No guarantee of stock or fitment.</text></svg>