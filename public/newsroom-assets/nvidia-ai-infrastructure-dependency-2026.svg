<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">How NVIDIA fits into the AI infrastructure system</title>
<desc id="description">Original Evercraft Journal explanatory diagram: chip and computing platform suppliers connect to data-center operators and AI builders, which connect to public and enterprise applications. Security, leadership, and financial concentration are oversight considerations, not evidence of wrongdoing.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10211e"/><stop offset="1" stop-color="#101619"/></linearGradient>
<linearGradient id="panel" x1="0" x2="1"><stop stop-color="#234138"/><stop offset="1" stop-color="#17302d"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a2e9cf"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".1" stroke="#c0e4da" stroke-width="1"><path d="M80 0V900M240 0V900M400 0V900M560 0V900M720 0V900M880 0V900M1040 0V900M1200 0V900M1360 0V900M1520 0V900"/><path d="M0 100H1600M0 260H1600M0 420H1600M0 580H1600M0 740H1600"/></g>
<text x="100" y="92" font-family="Arial,Helvetica,sans-serif" font-size="28" letter-spacing="5" fill="#a7dfc8">EVERCRAFT JOURNAL  /  SYSTEMS EXPLAINED</text>
<text x="100" y="165" font-family="Georgia,serif" font-size="59" fill="#f6faf6">The infrastructure beneath AI</text>
<text x="100" y="210" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#bccdc7">A simplified dependency map, not a market-share estimate</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="95" y="304" width="405" height="285" rx="23" fill="url(#panel)" stroke="#9de9c1" stroke-width="3"/>
<text x="297" y="367" fill="#c5ecce" font-size="23" letter-spacing="2">HARDWARE LAYER</text>
<text x="297" y="441" fill="white" font-size="50" font-weight="bold">NVIDIA</text>
<text x="297" y="489" fill="#dee9e3" font-size="26">Accelerators, systems</text>
<text x="297" y="523" fill="#dee9e3" font-size="26">and software platforms</text>
<rect x="597" y="304" width="405" height="285" rx="23" fill="#1a2930" stroke="#6fa59a" stroke-width="2"/>
<text x="800" y="367" fill="#a7dfc8" font-size="23" letter-spacing="2">COMPUTING LAYER</text>
<text x="800" y="441" fill="white" font-size="35" font-weight="bold">Clouds &amp; AI labs</text>
<text x="800" y="489" fill="#dee9e3" font-size="26">Data centers, training</text>
<text x="800" y="523" fill="#dee9e3" font-size="26">and model deployment</text>
<rect x="1099" y="304" width="405" height="285" rx="23" fill="#1a2930" stroke="#6fa59a" stroke-width="2"/>
<text x="1301" y="367" fill="#a7dfc8" font-size="23" letter-spacing="2">APPLICATION LAYER</text>
<text x="1301" y="441" fill="white" font-size="35" font-weight="bold">Businesses &amp; public</text>
<text x="1301" y="489" fill="#dee9e3" font-size="26">Products, services</text>
<text x="1301" y="523" fill="#dee9e3" font-size="26">and daily workflows</text>
</g>
<g stroke="#a2e9cf" stroke-width="5" fill="none" marker-end="url(#arr)"><path d="M509 446H581"/><path d="M1011 446H1083"/></g>
<rect x="95" y="647" width="1409" height="124" rx="16" fill="#29312d" stroke="#6d8d82" stroke-width="2"/>
<text x="130" y="688" font-size="24" letter-spacing="2" font-family="Arial,Helvetica,sans-serif" fill="#c9d7ce">CROSS-CUTTING QUESTIONS</text>
<text x="130" y="733" font-size="29" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Leadership continuity   •   Security   •   Financial dependence   •   Accountability</text>
<text x="100" y="839" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#a9c1b8">Editorial illustration. This diagram represents categories of dependency, not individual contracts or proven misconduct.</text>
<text x="1502" y="846" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#a7dfc8">NOV 2026</text>
