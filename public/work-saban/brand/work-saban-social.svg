<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Work Saban: Give your work a team</title>
<desc id="desc">Simple white campaign card with black typography, a crimson headline, and three friendly specialist figures.</desc>
<rect width="1200" height="630" fill="#FFFFFF"/>
<path d="M0 0H1200V11H0Z" fill="#A4142F"/>
<g transform="translate(73 59) scale(.37)">
