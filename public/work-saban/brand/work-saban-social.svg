</g>
<text x="186" y="118" font-family="Arial,Helvetica,sans-serif" fill="#171717" font-size="40" font-weight="800" letter-spacing="-2">work saban</text>
<text x="186" y="148" font-family="Arial,Helvetica,sans-serif" fill="#777777" font-size="17" font-weight="700" letter-spacing="2">BY EVERCRAFT</text>
