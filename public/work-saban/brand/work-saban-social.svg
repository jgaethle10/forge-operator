<text x="74" y="417" font-family="Arial,Helvetica,sans-serif" fill="#A4142F" font-size="112" font-weight="800" letter-spacing="-7">a team.</text>
<text x="76" y="486" font-family="Arial,Helvetica,sans-serif" fill="#555555" font-size="26">You bring the work. Saban brings the team.</text>
