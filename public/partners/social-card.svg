<text x="847" y="324" fill="#15271a" font-size="24" font-weight="800">Make the connection</text>
<text x="847" y="354" fill="#536653" font-size="16">After partner approval</text>
<text x="937" y="398" fill="#c7ff77" font-size="27" font-weight="800">↓</text>
