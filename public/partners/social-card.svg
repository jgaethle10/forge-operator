<text x="69" y="186" fill="#e0efdc" font-size="20" font-weight="700">FOUNDING PARTNER APPLICATIONS OPEN</text>
<text x="66" y="280" fill="#f6f8ef" font-size="61" font-weight="800" letter-spacing="-3">You bring the</text>
