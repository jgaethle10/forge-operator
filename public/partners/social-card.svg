<radialGradient id="halo"><stop stop-color="#8fea72" stop-opacity=".22"/><stop offset="1" stop-color="#8fea72" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
