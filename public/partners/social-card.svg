<text x="66" y="441" fill="#f6f8ef" font-size="61" font-weight="800" letter-spacing="-3">We bring the</text>
<text x="66" y="515" fill="#c7ff77" font-size="72" font-weight="800" letter-spacing="-4">capability.</text>
<text x="68" y="578" fill="#c8d6c7" font-size="21" font-weight="600">Free to apply  ·  No recruiting requirement</text>
