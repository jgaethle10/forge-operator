<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Evercraft Website Audit</title>
  <desc id="desc">Editorial illustration for Evercraft Website Audit, showing a clearer website path and the five-fix Quick Win Audit. This is a conceptual graphic, not a customer result.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070E1C"/>
      <stop offset=".52" stop-color="#12233B"/>
      <stop offset="1" stop-color="#050B17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#96D8FF" stop-opacity=".40"/>
      <stop offset="1" stop-color="#79EDD3" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6FA1F1"/>
      <stop offset="1" stop-color="#8BFFE0"/>
    </linearGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#back)"/>
  <path d="M0 0h1200v630H0z" fill="none" stroke="#395373" stroke-width="2"/>
  <circle cx="968" cy="257" r="154" fill="#69B7FD" opacity=".11" filter="url(#halo)"/>
  <g fill="none" stroke="#8ECBF5" stroke-opacity=".4">
    <rect x="738" y="103" width="329" height="386" rx="22" fill="url(#glass)" stroke="#6588A8"/>
    <rect x="769" y="137" width="267" height="330" rx="16"/>
    <path d="M802 189h200M802 222h143M802 255h180" stroke-width="3"/>
  </g>
  <path d="M826 410C875 369 860 333 907 309S958 252 986 226" stroke="url(#line)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <g fill="#A3F2DC">
    <circle cx="826" cy="410" r="11"/>
    <circle cx="907" cy="309" r="11"/>
    <circle cx="986" cy="226" r="13"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="74" y="98" fill="#BBD1E7" font-size="20" font-weight="700" letter-spacing="4">EVERCRAFT  /  SYSTEMIA</text>
    <rect x="75" y="130" width="76" height="3" fill="#81D4FB"/>
    <text x="74" y="243" fill="#F6F9FF" font-size="70" font-weight="750" letter-spacing="-3">See your website</text>
    <text x="74" y="322" fill="#A9E0FF" font-size="70" font-weight="750" letter-spacing="-3">through their eyes.</text>
    <text x="77" y="402" fill="#CAD8E9" font-size="27">Public site review. Five prioritized fixes.</text>
    <rect x="76" y="456" width="300" height="78" rx="17" fill="#D3EEFE"/>
    <text x="103" y="506" fill="#102544" font-size="30" font-weight="800">Quick Win · $49</text>
    <text x="77" y="584" fill="#92AFC8" font-size="17">Illustrative design • Not an audit finding</text>
  </g>
</svg>