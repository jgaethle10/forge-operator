<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09131b">
<title>Systemia Atlas | Freight Operations | Evercraft</title>
<meta name="description" content="Synthetic demo of the Systemia Atlas freight operating workspace, including loads, carrier review, documents, exceptions, evidence and RouteTwin.">
<style>
:root{--bg:#07111a;--panel:#0d1c27;--panel2:#122635;--border:#243747;--text:#edf5fa;--muted:#91a6b6;--accent:#f1aa55;--blue:#66bfce;--green:#73d9ab;--red:#ff857e;--white:#f8fbfd;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}aside.sidebar{background:#0a1722;border-right:1px solid var(--border);padding:23px 14px;display:flex;flex-direction:column;gap:25px}
.logo{font-weight:950;letter-spacing:.12em;font-size:17px;padding:0 12px}.logo b{color:var(--accent)}.logo small{display:block;font:800 9px ui-monospace,monospace;color:var(--muted);letter-spacing:.18em;margin-top:4px}
.menu-title{font:800 10px ui-monospace,monospace;letter-spacing:.14em;color:#648092;margin:8px 13px}
nav{display:grid;gap:5px}nav button{background:transparent;border:1px solid transparent;border-radius:10px;color:#abbfcc;text-align:left;padding:11px 14px;font-weight:650;display:flex;gap:12px;align-items:center}nav button:hover,nav button.active{background:#1d3340;color:var(--white);border-color:#2c4352}nav button.active{box-shadow:inset 3px 0 0 var(--accent)}nav .glyph{font-size:16px;min-width:17px;text-align:center}
.sidebarfoot{margin-top:auto;padding:14px 12px;color:var(--muted);font-size:11px;line-height:1.6;border-top:1px solid var(--border)}
.main{min-width:0}.topbar{padding:17px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;justify-content:space-between;background:#0a1721}
.crumb{font-size:12px;color:#acc1cd}.crumb strong{color:var(--white)}.pill{font:850 10px ui-monospace,monospace;letter-spacing:.06em;color:#ffd5a2;border:1px solid #85603b;border-radius:99px;padding:8px 10px}
.content{max-width:1420px;margin:auto;padding:34px 28px 70px}.eyebrow{color:var(--accent);font:800 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(34px,4vw,54px);line-height:1.04;letter-spacing:-.045em;margin:8px 0 12px}h2{font-size:17px;margin:0 0 15px}h3{font-size:14px;margin:0 0 9px}p{line-height:1.55}.lead{font-size:15px;color:#abc0cc;max-width:820px;margin:0 0 26px}
.note{border:1px solid #6d4c2c;background:#251c16;color:#f8cc95;border-radius:10px;padding:12px 15px;font-size:11px;line-height:1.55;margin:0 0 22px}
.section{margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;min-width:0}.card.subtle{background:#0b1924}.card.accent{border-color:#86603d;background:linear-gradient(125deg,#2a221d,#142332 72%)}
.kpi-label{color:var(--muted);font-size:12px;font-weight:650}.kpi-num{font-size:35px;letter-spacing:-.05em;font-weight:900;margin:9px 0 3px}.kpi-caption{font-size:11px;color:#8197a5}
.twocol{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:14px;margin-top:18px}
.table-wrap{overflow-x:auto}.data-table{border-collapse:collapse;width:100%;font-size:12px;min-width:650px}.data-table th{text-align:left;color:#7f99a9;font-size:10px;text-transform:uppercase;letter-spacing:.09em;padding:13px 12px;border-bottom:1px solid var(--border)}.data-table td{padding:14px 12px;border-bottom:1px solid #1e303d}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#172935}.data-table button{background:none;border:0;color:var(--white);font-weight:800;text-align:left;padding:0}.data-table button:hover{text-decoration:underline}
.status{font-size:10px;border:1px solid #436579;border-radius:30px;color:#b0e4eb;padding:4px 7px;white-space:nowrap;font-weight:850;text-transform:uppercase;letter-spacing:.03em}.status.blocked,.status.alert{border-color:#96514a;color:#ffc1b8}.status.ok{border-color:#376a54;color:#9deac6}.status.pending{border-color:#8e693a;color:#ffd392}
.action,.secondary{border:1px solid #4c6575;border-radius:9px;padding:10px 13px;color:var(--white);background:#223b49;font-weight:750}.action{background:var(--accent);color:#18232c;border-color:var(--accent)}.action:hover,.secondary:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}.feature{display:flex;align-items:start;justify-content:space-between;gap:10px;margin:0 0 15px}.feature p{font-size:12px;color:var(--muted);margin:5px 0 0}
input,select{width:100%;background:#112534;color:var(--text);border:1px solid #324b5b;border-radius:9px;padding:10px 11px}label{font-size:11px;color:#adc3cd;font-weight:700;display:block;margin-bottom:5px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}
.muted{color:var(--muted)}.tiny{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.route-feature{padding:26px;border:1px solid #5c554a;border-radius:14px;background:radial-gradient(circle at 75% 10%,#23536a 0,#112732 36%,#0d1926 70%);position:relative;overflow:hidden}.route-feature:after{content:'◈';position:absolute;right:30px;bottom:-60px;font-size:220px;color:#668e9d14;pointer-events:none}.route-feature h2{font-size:30px;letter-spacing:-.035em;position:relative;margin:6px 0}.route-feature p{position:relative;max-width:580px;color:#aec4d0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#112533;border:1px solid #274151;border-radius:11px;padding:14px}.step b{display:block;margin:5px 0}.step p{font-size:11px;color:var(--muted);margin:0}
.load-detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:14px}.strip{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.strip span{padding:9px;border-radius:8px;border:1px solid #304958;color:#9db3bf;font-size:10px;font-weight:850;text-transform:uppercase}.strip span.passed{background:#17382e;color:#9be8ba;border-color:#31694d}.strip span.current{border-color:#bc854c;color:#ffd39e;background:#423021}
.document{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.document:last-child{border:0}.document b{display:block;font-size:12px}.document small{display:block;color:var(--muted);margin-top:5px}.document button{background:#173544;color:#c9dee9;border:1px solid #335466;border-radius:7px;padding:7px 9px}
.issue{border:1px solid #624037;background:#251a1b;border-radius:9px;color:#edb1aa;padding:10px 12px;margin:8px 0;font-size:11px}
.audit{border-left:2px solid #305164;padding:0 0 16px 17px;margin-left:6px;position:relative}.audit:before{content:'';position:absolute;left:-6px;top:3px;background:var(--accent);width:10px;height:10px;border-radius:100%}.audit b{font-size:12px}.audit p{margin:5px 0;color:var(--muted);font-size:11px}.audit time{font:750 10px ui-monospace,monospace;color:#7b9bad}
.training{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.training .number{font:800 11px ui-monospace,monospace;color:var(--accent)}.training h3{font-size:17px;margin:12px 0 8px}.training p{font-size:12px;color:var(--muted)}
.help{color:#839aa8;font-size:11px;line-height:1.5;margin-top:12px}.divider{height:1px;background:var(--border);margin:20px 0}
.toast{position:fixed;right:22px;bottom:20px;max-width:420px;background:#253c4b;color:var(--white);border:1px solid #5c778a;border-radius:11px;padding:14px 18px;box-shadow:0 8px 28px #0009;z-index:10}
@media(max-width:1160px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.load-detail{grid-template-columns:1fr}.training{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{display:block}.sidebar{position:static;padding:12px!important;gap:12px!important}.sidebarfoot{display:none}.menu-title{display:none}.logo{font-size:14px}.menu{display:flex;overflow:auto;gap:4px}.menu button{min-width:max-content;padding:9px;font-size:11px}.topbar{padding:12px 17px}.content{padding:26px 16px 60px}.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.training{grid-template-columns:1fr}.kpi-num{font-size:29px}}
@media(max-width:410px){.grid{grid-template-columns:1fr}.pill{font-size:8px}.route-feature h2{font-size:25px}}
</style></head><body>
<div class="app">
<aside class="sidebar">
<div class="logo">SYSTEMIA <b>ATLAS</b><small>EVERCRAFT FREIGHT SYSTEMS</small></div>
<div><div class="menu-title">OPERATIONS</div><nav class="menu" aria-label="Atlas sections">
<button type="button" class="active" data-tab="overview"><span class="glyph">◈</span>Command center</button>
<button type="button" data-tab="loads"><span class="glyph">▤</span>Load desk</button>
<button type="button" data-tab="carriers"><span class="glyph">♧</span>Carrier desk</button>
<button type="button" data-tab="shippers"><span class="glyph">▦</span>Shipper CRM</button>
<button type="button" data-tab="driver"><span class="glyph">⇢</span>Driver today</button>
<button type="button" data-tab="evidence"><span class="glyph">▧</span>Evidence & audit</button>
<button type="button" data-tab="training"><span class="glyph">✳</span>Training</button>
<button type="button" data-tab="routetwin"><span class="glyph">◇</span>RouteTwin</button>
</nav></div>
<div class="sidebarfoot"><b>Systemia-owned prototype</b><p>No Base44 services. No real freight, insurance, carrier authority, revenue, or dispatch is connected. Session-only synthetic rehearsal.</p></div>
</aside>
<div class="main"><header class="topbar"><div class="crumb">SYSTEMIA ATLAS / <strong id="crumb">Command center</strong></div><div class="pill">DEMO · NO LIVE OPERATIONS</div></header>
<main class="content"><div id="page" aria-live="polite"></div></main></div>
</div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="./app.mjs"></script>
</body></html>
